nd them."], ["Personal image and social role overlap in public display.", "Personal image and social role overlap in public display."]], "layers": 4}, {"id": "L-41", "title": "《请以你的名字呼唤我》", "width": 736, "height": 414, "image": "assets/1dbab8cbf3aa03651c29d5a0.jpg", "pairs": [["树影中的独处让夏日带着尚未发生的期待。", "小阳台与花饰栏杆围出接近外部的位置。"], ["停留可以成为感受自身情绪的时间。", "半户外边缘为等待和观察提供日常场所。"], ["人物保持独处，也向外保留相遇的可能。", "门窗与栏杆使私密和开放处在相邻距离。"], ["目光可能寻找他人，也可能只是感受光线变化。", "局部框景让平凡细节获得更强的情绪意味。"], ["亲密的形成包含等待、试探与自我辨认。", "阳台意象为私人感受逐步向外表达提供空间隐喻。"]], "en": [["Solitude beneath trees gives summer a sense of anticipation.", "Solitude beneath trees gives summer a sense of anticipation."], ["Pausing becomes time to sense one's own emotions.", "Pausing becomes time to sense one's own emotions."], ["Solitude leaves open the possibility of an encounter.", "Solitude leaves open the possibility of an encounter."], ["The gaze may seek another person or simply follow changing light.", "The gaze may seek another person or simply follow changing light."], ["Intimacy forms through waiting, uncertainty and self-recognition.", "Intimacy forms through waiting, uncertainty and self-recognition."]], "layers": 4}, {"id": "A-44", "title": "《望远镜》", "width": 736, "height": 736, "image": "assets/68f4a1c1d20bdc591f07bab1.jpg", "pairs": [["望远镜让静静停留带上探索的好奇。", "光学器具与廊栏共同组织朝向远方的位置。"], ["人不必移动身体，也能尝试看得更远。", "器具扩大视线能力，使平台成为观察装置的一部分。"], ["身体留在近处，视觉范围越过建筑边缘。", "镜筒在开放景观中选择更窄、更远的局部。"], ["观者看见观看行为，却未必看见镜中的内容。", "画面并置裸眼视野与器具限定的第二层视野。"], ["技术改变了个人与外部世界接触的尺度。", "阳台把日常停留与借助工具展开的远距离观看连接起来。"]], "en": [["A telescope gives stillness an exploratory curiosity.", "A telescope gives stillness an exploratory curiosity."], ["A person can see farther without moving the body.", "A person can see farther without moving the body."], ["The body stays nearby while vision crosses the building's edge.", "The body stays nearby while vision crosses the building's edge."], ["We see the act of looking but not necessarily its object.", "We see the act of looking but not necessarily its object."], ["Technology changes the scale of contact with the world.", "Technology changes the scale of contact with the world."]], "layers": 4}, {"id": "L-42", "title": "《三个火枪手》", "width": 500, "height": 607, "image": "assets/4d7fedd4d9060beb6838d7a4.jpg", "pairs": [["跨栏动作让配图充满逃离的紧张。", "雕饰栏板为攀越行为设置明确的障碍。"], ["身体通过行动改变原有进入和离开的路径。", "阳台边缘从停留位置转为通行节点。"], ["通常用于保护的构件成为需要跨越的界线。", "高差和栏板使边界的存在以身体动作显现。"], ["观者跟随动作预想下一步落向何处。", "悬置姿态使静态画面保留尚未完成的时间。"], ["个人冒险往往涉及对既定秩序的穿越。", "阳台类场景将建筑限制转化为叙事推进的条件。"]], "en": [["Crossing a railing fills the scene with the tension of escape.", "Crossing a railing fills the scene with the tension of escape."], ["Bodily action changes established routes in and out.", "Bodily action changes established routes in and out."], ["A protective element becomes a boundary to cross.", "A protective element becomes a boundary to cross."], ["We anticipate where the moving figure will land.", "We anticipate where the moving figure will land."], ["Personal adventure often crosses an established order.", "Personal adventure often crosses an established order."]], "layers": 4}, {"id": "A-45", "title": "《湖畔阳台上的三位女性》", "width": 499, "height": 750, "image": "assets/86c9c5ace2489f0e31663857.jpg", "pairs": [["并置的三位女性让临水停留显得安静。", "木廊、格栏和灯笼构成轻巧的过渡界面。"], ["共同在廊边停留，使陪伴成为场景中心。", "连续平台提供相邻的身体位置。"], ["临水环境向外展开，格栏仍限定近处范围。", "轻巧分隔允许环境进入视线而不取消边界。"], ["观者在不同服饰与姿态之间逐一观看。", "并列关系让个体差异在共同框架中显现。"], ["日常共处通过图像成为可以保存的生活经验。", "廊台将私人相聚与外部景观安排为连续的场景。"]], "en": [["Three women make a waterside pause feel quiet.", "Three women make a waterside pause feel quiet."], ["Staying together at the edge places companionship at the centre.", "Staying together at the edge places companionship at the centre."], ["Water opens outwards while the railing defines the foreground.", "Water opens outwards while the railing defines the foreground."], ["We move between distinct clothes and postures.", "We move between distinct clothes and postures."], ["Images preserve everyday companionship as lived experience.", "Images preserve everyday companionship as lived experience."]], "layers": 4}, {"id": "L-43", "title": "《玻璃动物园》", "width": 1000, "height": 667, "image": "assets/15bdd7aaac0104a117c989a5.jpg", "pairs": [["近在旁边的出口反而使离开显得压抑。", "舞台中的金属梯与栏杆连接住宅内外。"], ["人物能够接近出口，却未必立即采取行动。", "外置楼梯兼具日常停留与离开路径的功能。"], ["家庭内部与外部可能性被一段边缘空间连接。", "通道的存在将留下和离开变成可感的选择。"], ["观者看见出口，也感受人物与出口之间的距离。", "舞台并置室内与楼梯，让不同生活方向同时可见。"], ["个人愿望与家庭责任在阈限处发生牵制。", "阳台式逃生平台把难以离开的心理处境具体化。"]], "en": [["An exit close at hand makes departure feel oppressive.", "An exit close at hand makes departure feel oppressive."], ["A person can approach an exit without taking action.", "A person can approach an exit without taking action."], ["An edge space links family life to outside possibilities.", "An edge space links family life to outside possibilities."], ["We see both the exit and the distance from it.", "We see both the exit and the distance from it."], ["Personal wishes and family duties pull against each other at the threshold.", "Personal wishes and family duties pull against each other at the threshold."]], "layers": 4}, {"id": "A-46", "title": "《巴黎博览会上的女士》", "width": 960, "height": 1683, "image": "assets/057a3a6f0afb7b6302c3180c.jpg", "pairs": [["高处人物与远景铁塔共同呈现公开场合的自信。", "栏杆与金属椅背把休憩位置接到博览会景观前。"], ["短暂停留也成为面向他人的自我呈现。", "平台兼具休息和观看公共展会的功能。"], ["近处身体与远处工程景观处在不同尺度。", "栏杆把可停留范围与开阔背景区分开来。"], ["人物看展会，也成为画外观众观看的对象。", "城市地标与人物姿态共同塑造展示形象。"], ["个人社交与大型公共事件在一处画面中相遇。", "露台使日常身体进入现代城市展示的场景。"]], "en": [["An elevated figure and the distant tower suggest public confidence.", "An elevated figure and the distant tower suggest public confidence."], ["A brief pause becomes a presentation to others.", "A brief pause becomes a presentation to others."], ["The nearby body and distant engineering occupy different scales.", "The nearby body and distant engineering occupy different scales."], ["The figure watches the exhibition while being watched by us.", "The figure watches the exhibition while being watched by us."], ["Personal sociability meets a major public event.", "Personal sociability meets a major public event."]], "layers": 4}, {"id": "A-47", "title": "《那不勒斯湾前的卡罗琳·缪拉》", "width": 960, "height": 1198, "image": "assets/8e47fe1642502e99cb3e83bb.jpg", "pairs": [["盛装人物与辽远海景形成庄严距离。", "局部椅背或栏台为人物提供被安排的前景。"], ["停留姿态把身体表现为稳定而受注目的中心。", "座位与景观布置服务于肖像展示。"], ["近处身份形象与远处环境被有层次地分开。", "暗云和远景强化人物所在位置的突出程度。"], ["观者面对的是被组织过的形象，而非随意的日常片刻。", "服饰、姿态与背景共同引导外部观看。"], ["私人身体承担了超出个体的身份表达。", "景观平台让社会地位通过空间关系获得可见形式。"]], "en": [["Formal dress and a distant sea establish a solemn distance.", "Formal dress and a distant sea establish a solemn distance."], ["A steady posture presents the body as a focus of attention.", "A steady posture presents the body as a focus of attention."], ["Identity in the foreground is layered apart from the landscape.", "Identity in the foreground is layered apart from the landscape."], ["We face a composed image rather than a casual moment.", "We face a composed image rather than a casual moment."], ["The private body conveys a status extending beyond the individual.", "The private body conveys a status extending beyond the individual."]], "layers": 4}, {"id": "A-48", "title": "《阳台上的威尼斯人》", "width": 960, "height": 1282, "image": "assets/a958d877a08d82c3deeae92f.jpg", "pairs": [["阴影中的交谈带着轻声耳语的亲密。", "砖墙、石质压顶与植物围出朴素角落。"], ["两个人在边缘停留，形成近距离交流。", "墙边位置为不必大声说话的相处提供条件。"], ["住宅边缘开放，局部阴影却使交流收拢。", "植物与墙面共同增加对外观看的遮蔽。"], ["观者看见亲近姿态，却无法进入谈话内容。", "身体朝向把交流范围限定在两人之间。"], ["邻近生活中的小型交往由此被记录。", "阳台在公开可见与私人沟通之间保留了适当距离。"]], "en": [["Conversation in shadow suggests the intimacy of whispering.", "Conversation in shadow suggests the intimacy of whispering."], ["Two people pause at the edge for a close exchange.", "Two people pause at the edge for a close exchange."], ["An open residential edge contains a pocket of intimacy in shade.", "An open residential edge contains a pocket of intimacy in shade."], ["We see closeness without entering the conversation.", "We see closeness without entering the conversation."], ["Small encounters in neighbouring lives become recorded images.", "Small encounters in neighbouring lives become recorded images."]], "layers": 4}, {"id": "S-10", "title": "阳台自拍 / 社交媒体", "width": 1284, "height": 1910, "image": "assets/59ce1352b592a0ffc2453331.jpg", "pairs": [["临栏人物把城市远景纳入自己的形象。", "相机取景将栏杆、身体和城市组合为一张照片。"], ["自拍让短暂停留变成可以保存的自我呈现。", "摆姿与取景把生活平台临时转化为拍摄场所。"], ["身体仍在住宅内，影像已经准备向外流通。", "拍摄范围选择了哪些私人信息进入可传播图像。"], ["观众看见被安排的角度，未必看见真实全貌。", "镜头在阳台边界之外又建立了一层观看边界。"], ["一个私人片刻可以进入社交媒体的共同视野。", "分享使建筑开口延伸为数字平台上的展示界面。"]], "en": [["A figure at the railing incorporates the city into a personal image.", "A figure at the railing incorporates the city into a personal image."], ["A selfie turns a brief pause into a lasting self-presentation.", "A selfie turns a brief pause into a lasting self-presentation."], ["The body stays at home while its image prepares to circulate.", "The body stays at home while its image prepares to circulate."], ["Viewers see a chosen angle rather than the entire situation.", "Viewers see a chosen angle rather than the entire situation."], ["A private moment enters the shared field of social media.", "A private moment enters the shared field of social media."]], "layers": 4}, {"id": "A-49", "title": "《在蔚蓝爱奥尼亚天空之下》", "width": 960, "height": 402, "image": "assets/3d8c666147017407ba8b182e.jpg", "pairs": [["蓝色海天与浅石台让闲暇显得没有催促。", "弧形座台把停留身体安排在开阔景观之前。"], ["坐着不做事也成为完整的空间体验。", "座台为长时间休憩提供稳定的身体支撑。"], ["近处围合保护停留，远景保持连续开放。", "石质边缘把有限平台与辽阔海面区分开来。"], ["观者由人物停留转向宽阔背景。", "明亮色面把身体、建筑与海天组织为不同层次。"], ["被表现的闲暇带有可供欣赏的生活理想。", "露台让个人舒适与古典化的公共想象发生联系。"]], "en": [["Blue sea, sky and pale stone give leisure an unhurried quality.", "Blue sea, sky and pale stone give leisure an unhurried quality."], ["Sitting without activity becomes a complete spatial experience.", "Sitting without activity becomes a complete spatial experience."], ["Nearby enclosure protects while the distant view stays open.", "Nearby enclosure protects while the distant view stays open."], ["Our gaze moves from the seated figure to the broad background.", "Our gaze moves from the seated figure to the broad background."], ["Depicted leisure offers an ideal of life to contemplate.", "Depicted leisure offers an ideal of life to contemplate."]], "layers": 4}, {"id": "L-46", "title": "《悲惨世界》", "width": 720, "height": 960, "image": "assets/a4aed0e1fac8716de9ccebc7.jpg", "pairs": [["上下人群的配图让公共事件显得紧张。", "栏杆与街屋立面构成分层的观看位置。"], ["有人在街道行动，有人在高处停留。", "阳台为无需进入人群的观察提供条件。"], ["住宅内部与街头事件保持距离又无法完全分开。", "开口让声音和景象进入原本私人的场所。"], ["高处观看者也成为下方人群可能看见的对象。", "垂直联系使旁观与参与之间的界限变得复杂。"], ["个人生活会被公共冲突重新卷入。", "阳台把家庭位置与城市共同事件放进同一空间关系。"]], "en": [["Crowds above and below give a public event a tense atmosphere.", "Crowds above and below give a public event a tense atmosphere."], ["Some act in the street while others stay above.", "Some act in the street while others stay above."], ["Homes keep a distance from street events without escaping them.", "Homes keep a distance from street events without escaping them."], ["Those watching from above can be seen from below.", "Those watching from above can be seen from below."], ["Public conflict draws individual lives back into its reach.", "Public conflict draws individual lives back into its reach."]], "layers": 4}, {"id": "A-50", "title": "《阳台上的女人》", "width": 900, "height": 700, "image": "assets/0c4e0ef29c623e64418fa40b.jpg", "pairs": [["跳动的色块让独处显得鲜活。", "细栏杆与平台以简略轮廓确定人物位置。"], ["静止身体仍能通过色彩呈现内在活力。", "阳台为人物停留提供场景，色彩承担更多情绪表达。"], ["身体处于边缘，环境却不以写实方式被固定。", "色面之间的分割重新组织了内外关系。"], ["观者先感受色彩，再辨认人物与栏杆。", "非气象性的光色使观看离开单纯天气描述。"], ["私人停留成为表达主观感受的题材。", "阳台的日常形制允许个人经验转化为不同视觉语言。"]], "en": [["Lively colour makes solitude feel vivid.", "Lively colour makes solitude feel vivid."], ["A still body conveys inner energy through colour.", "A still body conveys inner energy through colour."], ["The body occupies an edge without a fixed realistic setting.", "The body occupies an edge without a fixed realistic setting."], ["We feel colour before recognising the figure and railing.", "We feel colour before recognising the figure and railing."], ["A private pause becomes a subject for subjective expression.", "A private pause becomes a subject for subjective expression."]], "layers": 4}, {"id": "L-47", "title": "《基督山伯爵》", "width": 1023, "height": 1260, "image": "assets/935f8decae965130a1b73ae1.jpg", "pairs": [["低光中的相会让靠近带上秘密。", "原表配图以模糊远景衬托近处人物关系。"], ["等待、相见与观察都可能在住宅边缘发生。", "阳台式空间提供靠近他人却未完全进入内部的位置。"], ["隐秘关系需要通道，也需要遮蔽。", "半开放边缘让信息通过，同时保留身体距离。"], ["观看可能是期待，也可能带有监视意味。", "相同站位因人物目的不同而产生不同关系。"], ["私人行动与更广泛的社会网络相互牵连。", "在插图传统中，阳台为秘密联系提供了易于辨认的空间形式。"]], "en": [["A meeting in low light makes closeness secretive.", "A meeting in low light makes closeness secretive."], ["Waiting, meeting and observing occur at the home's edge.", "Waiting, meeting and observing occur at the home's edge."], ["Secret relationships need both passage and concealment.", "Secret relationships need both passage and concealment."], ["Looking can express anticipation or surveillance.", "Looking can express anticipation or surveillance."], ["Private actions connect to wider social networks.", "Private actions connect to wider social networks."]], "layers": 4}, {"id": "L-48", "title": "《海达·高布乐》", "width": 720, "height": 540, "image": "assets/be9da8a802c73b3b844495df.jpg", "pairs": [["高处入口与交错楼梯让空间显得难以脱身。", "舞台装置把居所组织为多层受限路径。"], ["人物面对可以移动的空间，却未必感到自由。", "出入口把行动安排成需要选择的过程。"], ["生活的内部限制不会因存在出口而自动消失。", "围护与路径共同构成留在原处的压力。"], ["观众能同时看见人物与其周围的限制条件。", "舞台的层次把心理距离转为身体距离。"], ["私人愿望与家庭角色之间存在冲突。", "阳台式入口为理解受限行动提供直观的空间线索。"]], "en": [["An elevated entrance and crossing stairs suggest entrapment.", "An elevated entrance and crossing stairs suggest entrapment."], ["A space permitting movement need not feel free.", "A space permitting movement need not feel free."], ["An exit does not automatically dissolve the limits of life inside.", "An exit does not automatically dissolve the limits of life inside."], ["The audience sees the figure together with surrounding constraints.", "The audience sees the figure together with surrounding constraints."], ["Personal wishes conflict with family roles.", "Personal wishes conflict with family roles."]], "layers": 4}, {"id": "A-53", "title": "《观景台》", "width": 960, "height": 1302, "image": "assets/4756462d7ceb3a07c55fb0d6.jpg", "pairs": [["倚栏的人让明亮海景仍带着等待。", "雕饰栏台与织物构成停留的近景。"], ["身体依靠边缘，注意力投向尚未抵达的远方。", "厚实栏台为长时间眺望提供支撑。"], ["开阔视野没有消除身体所在位置的限制。", "实体边界区分可以停留的近处和不可跨越的远处。"], ["观者从人物朝向感知期待，却不知道其对象。", "远景的开放使等待保留未完成的意味。"], ["个人情绪在可共同观看的景观中获得表达。", "观景台展示了看得见与到得了之间的距离。"]], "en": [["A figure leaning on the railing makes the bright sea a place of waiting.", "A figure leaning on the railing makes the bright sea a place of waiting."], ["The body rests at the edge while attention reaches afar.", "The body rests at the edge while attention reaches afar."], ["An open view does not remove bodily limits.", "An open view does not remove bodily limits."], ["The figure's direction suggests anticipation without revealing its object.", "The figure's direction suggests anticipation without revealing its object."], ["Personal feeling finds expression in a shared landscape.", "Personal feeling finds expression in a shared landscape."]], "layers": 4}, {"id": "L-49", "title": "《不可儿戏》", "width": 1080, "height": 1350, "image": "assets/d7651317490af47187c30faf.jpg", "pairs": [["栏边交谈的配图让社交显得轻快而试探。", "玻璃门与花饰栏杆构成相邻的内外界面。"], ["人物在相处中展示、确认或调整身份。", "半开放停留场所适合短暂会面与语言交锋。"], ["内部生活向外显露，但身份未必完全透明。", "住宅边缘容纳正式角色与私人动机的相遇。"], ["人物听对方说话，也判断姿态与外在表现。", "观看和语言共同参与对身份的理解。"], ["私人关系受到体面、姓名和社会期待的影响。", "阳台式社交场景让身份表演与日常交往同时发生。"]], "en": [["Conversation at the railing makes social life light and tentative.", "Conversation at the railing makes social life light and tentative."], ["People present, affirm or adjust identities through interaction.", "People present, affirm or adjust identities through interaction."], ["Private life becomes visible without making identity transparent.", "Private life becomes visible without making identity transparent."], ["Listening includes judging posture and outward appearance.", "Listening includes judging posture and outward appearance."], ["Respectability, names and expectations shape private relationships.", "Respectability, names and expectations shape private relationships."]], "layers": 4}, {"id": "A-54", "title": "《茶桌旁》", "width": 800, "height": 668, "image": "assets/747adeb4ed8e91dbe4e95f18.jpg", "pairs": [["暖光中的茶桌让相处显得亲近。", "桌布、杯具与椅子组织出明确的生活中心。"], ["饮茶和交谈使户外停留具有日常节奏。", "家具把花园边缘转化为可以共处的会面位置。"], ["植物包围着相聚，开放环境仍保持可感。", "近处桌面划出交流范围，而非完全封闭空间。"], ["观者注意人物之间的动作与共同器物。", "茶桌使分散身体拥有共享的视觉中心。"], ["生活中的待客与陪伴被保存为公共图像。", "这处边缘空间的意义更多来自使用，而非可辨认的建筑构造。"]], "en": [["A tea table in warm light makes company intimate.", "A tea table in warm light makes company intimate."], ["Tea and conversation give outdoor pauses an everyday rhythm.", "Tea and conversation give outdoor pauses an everyday rhythm."], ["Plants surround the gathering while the outside remains present.", "Plants surround the gathering while the outside remains present."], ["We notice gestures and the objects shared between people.", "We notice gestures and the objects shared between people."], ["Hospitality and companionship are preserved as public images.", "Hospitality and companionship are preserved as public images."]], "layers": 4}, {"id": "A-55", "title": "《生活的魅力（音乐聚会）》", "width": 960, "height": 695, "image": "assets/6060a8167813a11ab759be42.jpg", "pairs": [["音乐与坐卧人群让聚会显得轻盈。", "柱廊和平台为多人相处提供古典化背景。"], ["共同聆听使不同姿态的身体暂时连接。", "音乐把开放停留空间组织成交流场所。"], ["建筑提供局部围合，活动仍面向园林展开。", "柱体标记范围，却不形成完全隔绝的墙面。"], ["观者从听奏与交谈姿态中感受声音。", "人物关系让不可见的音乐获得视觉线索。"], ["休闲聚会呈现特定的社交生活想象。", "露台把艺术活动、私人交往与可展示的社会形象叠在一起。"]], "en": [["Music and relaxed figures give the gathering a lightness.", "Music and relaxed figures give the gathering a lightness."], ["Shared listening briefly connects different bodily postures.", "Shared listening briefly connects different bodily postures."], ["Architecture partly encloses an activity opening into the garden.", "Architecture partly encloses an activity opening into the garden."], ["Gestures of playing and conversation suggest sound.", "Gestures of playing and conversation suggest sound."], ["A leisure gathering imagines a particular social life.", "A leisure gathering imagines a particular social life."]], "layers": 4}, {"id": "A-56", "title": "《忠诚的女管家》", "width": 960, "height": 1152, "image": "assets/0caca95577acdf361f634052.jpg", "pairs": [["前暗后亮的场景使亲近带上窥视意味。", "栏台与垂落织物在庭园边缘形成遮蔽层次。"], ["倚靠和停留让人物处于若隐若现的位置。", "边缘角落为不完全公开的交往提供空间。"], ["人物接近外部，却仍借暗处保持遮掩。", "帘幕与光差共同调整身体的显露程度。"], ["观者被引向看不完整的场景。", "遮挡使观看带有探查而非直接接触的性质。"], ["私密关系一旦入画便成为他人观看的对象。", "露台让秘密、保护与外部好奇在同一边界相遇。"]], "en": [["A dark foreground gives intimacy a sense of being glimpsed.", "A dark foreground gives intimacy a sense of being glimpsed."], ["Leaning and pausing place figures between visibility and concealment.", "Leaning and pausing place figures between visibility and concealment."], ["The figures approach the outside while remaining partly hidden.", "The figures approach the outside while remaining partly hidden."], ["Our gaze is drawn towards an incomplete view.", "Our gaze is drawn towards an incomplete view."], ["Private relationships become visible to others when painted.", "Private relationships become visible to others when painted."]], "layers": 5}, {"id": "A-57", "title": "《威尼斯节日》", "width": 960, "height": 640, "image": "assets/237d7fea2ea7983ffe8f0a9e.jpg", "pairs": [["盛装人物让临栏停留变成亮相时刻。", "石栏台、帷幕与地毯共同搭起节庆背景。"], ["参与者通过服饰和姿态加入庆祝。", "阳台兼作观众席与人物展示台。"], ["耐久建筑被临时织物重新包裹。", "可撤下的装饰让日常界面转换为仪式界面。"], ["人物观看节日，也准备被节日中的他人观看。", "前景栏台把身体突出为可识别的展示形象。"], ["私人建筑短暂纳入共同庆典。", "阳台使节庆表演发生在住宅与街道之间。"]], "en": [["Formal clothing turns a pause at the railing into an appearance.", "Formal clothing turns a pause at the railing into an appearance."], ["Clothes and gestures bring participants into celebration.", "Clothes and gestures bring participants into celebration."], ["Temporary textiles wrap permanent architecture anew.", "Temporary textiles wrap permanent architecture anew."], ["People watch the festival while preparing to be watched.", "People watch the festival while preparing to be watched."], ["A private building briefly joins a shared celebration.", "A private building briefly joins a shared celebration."]], "layers": 5}, {"id": "A-58", "title": "《曼陀林演奏者》", "width": 960, "height": 721, "image": "assets/95b24d8c0efc0dd0a495f069.jpg", "pairs": [["绿叶中的听奏者让快乐显得近而安静。", "砖石矮墙与栏杆围出小范围相聚的位置。"], ["演奏让停留的人共享一段声音。", "平台为乐器、听众与交谈提供邻近空间。"], ["身体围在近处，音乐可以越过矮墙。", "低围护限定活动范围，却不完全阻断声音。"], ["观者从聆听姿态中推想演奏的进行。", "人物目光围绕演奏者形成共同注意。"], ["日常音乐使私人相聚具有可分享的感受。", "阳台把家庭休闲与可能抵达邻里的声音联系起来。"]], "en": [["Listeners among green leaves make pleasure quiet and close.", "Listeners among green leaves make pleasure quiet and close."], ["A performance lets those lingering share a stretch of sound.", "A performance lets those lingering share a stretch of sound."], ["Bodies gather nearby while music crosses the low wall.", "Bodies gather nearby while music crosses the low wall."], ["Listening postures suggest a performance in progress.", "Listening postures suggest a performance in progress."], ["Everyday music makes a private gathering emotionally shareable.", "Everyday music makes a private gathering emotionally shareable."]], "layers": 5}, {"id": "A-59", "title": "《罗马狂欢节》", "width": 960, "height": 675, "image": "assets/b834614bf52f9bbe8c84bc61.jpg", "pairs": [["花饰与密集人物让阳台充满节庆兴奋。", "墙面和栏台承托悬挂织物与临时装饰。"], ["观看者靠近边缘，把自己投入共同热闹。", "平台在节庆时容纳比日常更集中的停留。"], ["私人建筑的边缘被活动向外打开。", "装饰把固定构件与临时人群联系成整体。"], ["阳台上的人看街道，也进入街道的观看。", "高低位置使节庆具有互相注视的层次。"], ["各家的停留汇入城市共同庆祝。", "阳台在短暂事件中获得超出住宅用途的公共角色。"]], "en": [["Flowers and dense figures fill the balcony with festive excitement.", "Flowers and dense figures fill the balcony with festive excitement."], ["Spectators approach the edge and join the bustle.", "Spectators approach the edge and join the bustle."], ["The festival opens a private building's edge outwards.", "The festival opens a private building's edge outwards."], ["Balcony spectators watch the street and enter its field of vision.", "Balcony spectators watch the street and enter its field of vision."], ["Separate homes join the city's shared celebration.", "Separate homes join the city's shared celebration."]], "layers": 5}, {"id": "A-60", "title": "《等待火车的爱尔兰移民》", "width": 960, "height": 1267, "image": "assets/db2428211bd353397e3992d7.jpg", "pairs": [["行李与坐等的人让门边显得悬而未决。", "屋檐、门框与铺地组织过渡性的等候位置。"], ["身体暂时安顿，旅程却尚未完成。", "檐下空间承接等待而非长期居住。"], ["近处有庇护，外部通向下一段移动。", "门口光差把暂停的位置与出发方向区分开来。"], ["观者从行李与姿态读出迁徙的时间感。", "静止身体和可移动物件共同暗示即将继续的路程。"], ["个人等待涉及更广泛的迁移经验。", "作为阳台类比，门廊展示了处于两处生活之间的停留状态。"]], "en": [["Luggage and seated figures give the doorway a sense of suspension.", "Luggage and seated figures give the doorway a sense of suspension."], ["The body settles temporarily while the journey remains unfinished.", "The body settles temporarily while the journey remains unfinished."], ["Nearby shelter opens towards the next movement outside.", "Nearby shelter opens towards the next movement outside."], ["Luggage and posture convey the time of migration.", "Luggage and posture convey the time of migration."], ["Personal waiting belongs to a wider experience of displacement.", "Personal waiting belongs to a wider experience of displacement."]], "layers": 5}, {"id": "A-61", "title": "《贝伦加丽亚担忧狮心王理查安危》", "width": 960, "height": 740, "image": "assets/31ea9d15c3c61f0bd662f28e.jpg", "pairs": [["开阔景色没有消除人物的担忧。", "拱柱与铺砖把身体放在历史化的观景空间。"], ["远望成为等待消息与牵挂他人的姿态。", "平台让身体停住，却给情感提供向外的方向。"], ["可见远方与无法确认的处境同时存在。", "建筑框景限定立足点，不能消除远距离的不确定。"], ["观者看见关切姿态，却无法与人物共同获得答案。", "朝外目光使没有出现的人也参与画面叙事。"], ["私人牵挂被置入可共享的历史想象。", "阳台式空间把个人情感与远处事件连接起来。"]], "en": [["An open landscape does not remove the figure's worry.", "An open landscape does not remove the figure's worry."], ["Looking far away becomes a gesture of waiting and concern.", "Looking far away becomes a gesture of waiting and concern."], ["A visible distance coexists with an uncertain situation.", "A visible distance coexists with an uncertain situation."], ["We see concern without sharing an answer.", "We see concern without sharing an answer."], ["Private anxiety enters a shared historical imagination.", "Private anxiety enters a shared historical imagination."]], "layers": 5}, {"id": "S-16", "title": "公共住宅阳台装饰比赛", "width": 1200, "height": 1697, "image": "assets/10538153bf63d4152c321067.jpg", "pairs": [["密集花盆显出住户经营小天地的耐心。", "植物、雨棚和栏杆共同叠加出装饰层次。"], ["布置带来把居所变成自己样子的满足。", "装饰比赛把持续的家庭照料组织成参与活动。"], ["个性在统一住宅外缘获得可见的位置。", "可附加的盆栽与装饰改变表面，而不必重建主体。"], ["邻居从对方的布置中辨认兴趣与投入。", "评比使原本日常的阳台进入集中观看。"], ["私家装饰成为社区交换经验和认同的媒介。", "比赛将分散的家居劳动转化为共同参与的社区事件。"]], "en": [["Crowded flowerpots reveal patient care for a small world.", "Crowded flowerpots reveal patient care for a small world."], ["Decorating makes a dwelling feel like one's own.", "Decorating makes a dwelling feel like one's own."], ["Individual character becomes visible on uniform housing.", "Individual character becomes visible on uniform housing."], ["Neighbours recognise interests and effort in each other's arrangements.", "Neighbours recognise interests and effort in each other's arrangements."], ["Private decoration becomes a medium of community exchange.", "Private decoration becomes a medium of community exchange."]], "layers": 5}, {"id": "F-33", "title": "冬季花园扩建｜Grand Parc Bordeaux", "width": 1200, "height": 1200, "image": "assets/6feb5971a69db8c4a329d157.jpg", "pairs": [["透明外皮与长平台让旧住宅显得舒展。", "新增楼板、金属框与围护形成冬季花园。"], ["住户获得房间之外可以继续使用的空间。", "扩建将停留范围从原有外墙向外推开。"], ["旧内外分界转为新空间中的一层界面。", "透明围护与内部门窗形成多重过渡。"], ["向外观看需要经过更有深度的生活边缘。", "光线穿过新增空间，再进入原有房间。"], ["改善生活可以通过保留建筑而发生。", "阳台扩建把住宅更新与既有居住连续性联系起来。"]], "en": [["A transparent skin and long platforms give old housing room to breathe.", "New slabs, metal frames and enclosure form winter gardens."], ["Residents gain usable space beyond their existing rooms.", "The extension pushes the area for living beyond the original outer wall."], ["The old boundary becomes one interface within a new space.", "Tran eec7f238c700949a1.jpg", "pairs": [["深窗洞衬出高处人物，庄严感来自距离。", "石柱、栏台与仪式织物共同组织祝福场面。"], ["祝福使短暂露面成为面向众人的行动。", "高处平台为宗教人物提供集中出现的位置。"], ["仪式连接内外，却不取消进入建筑的限制。", "石质边界把受控内部与外部公众明确分开。"], ["观众将目光投向远处被框住的身影。", "建筑尺度让人物细节退后，使角色身份更突出。"], ["私人尺度的开口承担了集体仪式的焦点。", "宗教权威通过建筑界面向更大范围的公众呈现。"]], "en": [["A deep opening frames a distant figure with solemnity.", "A deep opening frames a distant figure with solemnity."], ["A blessing turns a brief appearance into a public act.", "A blessing turns a brief appearance into a public act."], ["Ritual connects inside and outside without removing restrictions.", "Ritual connects inside and outside without removing restrictions."], ["The audience looks towards a faraway framed figure.", "The audience looks towards a faraway framed figure."], ["A domestic-scale opening becomes the focus of collective ritual.", "A domestic-scale opening becomes the focus of collective ritual."]], "layers": 5}, {"id": "S-17", "title": "齐奥塞斯库最后一次阳台演说", "width": 960, "height": 720, "image": "assets/cdd0fdf4d26e35ee8a897b05.jpg", "pairs": [["高处人物与下方人群之间充满紧张距离。", "石质栏台把演说位置抬到集会人群之上。"], ["讲话试图维持秩序，回应却未必服从安排。", "演说把平台用作集中发声和展示的位置。"], ["高差可以隔开身体，却无法隔绝群众反应。", "声音往返使建筑边界成为权力受到回应的界面。"], ["演说者看向人群，也暴露于人群的判断。", "单向展示在共同注视中可能转变为相互审视。"], ["原本显示权威的阳台也能记录权威的动摇。", "这一事件使政治建筑的意义取决于现场的集体回应。"]], "en": [["A tense distance separates the speaker above from the crowd.", "A tense distance separates the speaker above from the crowd."], ["Speech seeks order, but responses need not obey.", "Speech seeks order, but responses need not obey."], ["Height separates bodies without blocking public reaction.", "Height separates bodies without blocking public reaction."], ["The speaker looks at the crowd while facing its judgement.", "The speaker looks at the crowd while facing its judgement."], ["A balcony displaying authority can also record its instability.", "A balcony displaying authority can also record its instability."]], "layers": 5}, {"id": "S-18", "title": "天鹅绒革命的梅兰特里赫阳台", "width": 960, "height": 763, "image": "assets/1e69fe8c965ae80887801fd7.jpg", "pairs": [["肩并肩的人物让高处平台显得凝聚。", "栏台与麦克风共同构成面向人群的发声位置。"], ["共同讲话把个体声音汇入同一个现场。", "扩声设备让有限平台容纳更大范围的交流。"], ["身体聚在建筑边缘，声音抵达远处人群。", "麦克风扩大了阳台原有的传播半径。"], ["公众看见并立的人物，也听见他们的发言。", "视觉焦点和声音焦点在同一平台上重合。"], ["集体诉求通过一个建筑开口获得可见形象。", "阳台在公共事件中被转化为临时政治交流场所。"]], "en": [["Figures shoulder to shoulder give the platform a collective presence.", "Figures shoulder to shoulder give the platform a collective presence."], ["Speaking together gathers individual voices into one event.", "Speaking together gathers individual voices into one event."], ["Bodies gather at the edge while voices reach the distant crowd.", "Bodies gather at the edge while voices reach the distant crowd."], ["The public sees the figures together and hears their words.", "The public sees the figures together and hears their words."], ["A building opening gives collective demands a visible form.", "A building opening gives collective demands a visible form."]], "layers": 5}, {"id": "S-19", "title": "威尼斯宫阳台上的法西斯集会", "width": 960, "height": 1215, "image": "assets/b85c2618135a22d226a1a86e.jpg", "pairs": [["暗背景中的单一演说者形成压迫性的焦点。", "厚重栏台与麦克风共同突出高处站位。"], ["讲话把身体姿态组织为面向群众的表演。", "扩声与建筑高差配合，强化集中发言的位置。"], ["少数人的发声位置与群众位置被明确分开。", "受控平台限定谁能够占据可见的中心。"], ["大量目光被导向同一个高处身影。", "立面框景与声音设备共同集中公众注意力。"], ["阳台在这里服务于法西斯政治动员的权威展示。", "建筑边缘可以被权力利用，组织不对等的公共观看。"]], "en": [["A solitary speaker against darkness creates an oppressive focus.", "A solitary speaker against darkness creates an oppressive focus."], ["Speech organises bodily gestures into a mass-facing performance.", "Speech organises bodily gestures into a mass-facing performance."], ["The few who speak are spatially separated from the crowd.", "The few who speak are spatially separated from the crowd."], ["Many eyes are directed towards one elevated figure.", "Many eyes are directed towards one elevated figure."], ["The balcony serves the display of authority in fascist mobilisation.", "The balcony serves the display of authority in fascist mobilisation."]], "layers": 5}, {"id": "S-20", "title": "克谢辛斯卡娅宫阳台演说", "width": 800, "height": 753, "image": "assets/e0d8128adbd64f0b1f6c71a7.jpg", "pairs": [["朝向一致的人物使栏台呈现聚合的力量。", "装饰外墙与厚实栏台承托政治发言的位置。"], ["讲话将建筑边缘变成召集与回应的场所。", "临栏站位使人物能够共同面向外部人群。"], ["原有建筑的用途在事件中向外扩展。", "室内外的开口成为政治话语抵达公众的通道。"], ["观众看见一组并立身体，而不只是孤立窗口。", "同一朝向把不同人物组织成集体视觉形象。"], ["既有宫殿空间被重新赋予政治动员的意义。", "阳台的公共性质由使用事件重新建立。"]], "en": [["Figures facing the same direction give the balcony a sense of collective strength.", "The decorated facade and solid balustrade support a position for political speech."], ["Speech turns the edge of the building into a place of assembly and response.", "Standing at the balustrade allows the figures to face the crowd outside together."], ["The building's existing use extends outwards through the event.", "The opening between inside and outside becomes a passage through which political speech reaches the public."], ["The audience sees bodies standing together, rather than an isolated window.", "A common orientation organises different figures into a collective visual image."], ["The existing palace space acquires a new meaning as a place of political mobilisation.", "The balcony's public character is re-established by the event that takes place there."]], "layers": 5}, {"id": "S-60", "title": "开国大典", "width": 1179, "height": 673, "image": "assets/2f218bdd0a5e6d996efded4c.jpg", "pairs": [["朝向一致的人物使城楼成为明确的视觉中心。", "高处栏台把致辞位置与广场人群组织在同一轴向。"], ["面向人群的讲话使城楼承担公开宣告的功能。", "建筑高差为集体致辞提供集中站位。"], ["少数人在高处发言，声音面向更广大的公众。", "城楼与广场构成清晰的发言和接收关系。"], ["共同注视把高处平台转为事件的图像焦点。", "面向外部的身体与宏大建筑共同组织公共观看。"], ["这一开口承载的是国家成立的公共宣告。", "作为策展中的阳台类比，城楼体现空间极度向外的政治用途。"]], "en": [["Figures facing one direction make the gate tower a clear visual centre.", "The elevated platform aligns the speaker's position with the crowd in the square."], ["A speech to the crowd gives the tower the function of public proclamation.", "Architectural height provides a concentrated position for addressing the collective."], ["A few speak from above, directing their voices to a much larger public.", "The tower and square establish a clear relationship between speaking and receiving."], ["Shared attention turns the high platform into the event's visual focus.", "Outward-facing bodies and monumental architecture organise public looking together."], ["This opening carries the public declaration of a nation's founding.", "As a balcony analogy in this exhibition, the tower embodies an intensely outward political use of space."]], "layers": 5}];




let openingPanel=null;
let handoffUntil=0,browseHintsUntil=0;

}
function blockOpeningTail(e){
 if(juxtaposePanel)return;
 const now=performance.now();
 if(openingPanel||now<handoffUntil){
 if(e.cancelable)e.preventDefault();e.stopImmediatePropagation();
 if(!openingPanel)handoffUntil=Math.max(handoffUntil,now+120);
 nativeGesture=false;gestureScale=1;touchDistance=0;
 }
}
for(const event of ['wheel','gesturestart','gesturechange','gestureend','touchstart','touchmove','touchend','touchcancel'])document.addEventListener(event,blockOpeningTail,{capture:true,passive:false});
function showOpening(){

let juxtaposePanel=null;

const cachedPanels=new Map();let queryFrame=null;
function preparePanel(kind){
 if(cachedPanels.has(kind))return cachedPanels.get(kind);
 const [title,label,from]=panelSpecs[kind],panel=document.createElement('div'),frame=document.createElement('iframe');
 panel.style.cssText='position:fixed;inset:0;z-index:1000;background:white;visibility:hidden;pointer-events:none;transform:'+from;
 panel.style.willChange='transform';panel.setAttribute('role','dialog');panel.setAttribute('aria-label',title);
 frame.title=title;frame.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;background:white';
 const back=document.createElement('button');back.textContent='返回';back.hidden=kind==='juxtapose';back.style.cssText='position:absolute;right:12px;top:12px;z-index:2;background:#fff;color:#242422;border:1px solid #ddd;border-radius:0;padding:7px 12px;cursor:pointer;font-family:Chinese,serif';
 const item={kind,panel,frame,back,ready:false,pending:false,closing:false,from,label};cachedPanels.set(kind,item);
 back.onclick=()=>closePanel(item);panel.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel(item)});
 frame.addEventListener('load',()=>{item.ready=true;if(item.pending)revealPanel(item)});panel.append(frame,back);document.body.append(panel);frame.src=kind+'.html';return item;
}
function prepareQuery(){queryFrame=preparePanel('query').frame;return queryFrame}
function revealPanel(item){
 if(juxtaposePanel||!item.ready)return;item.pending=false;item.closing=false;
 const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:650;
 item.panel.style.transition='transform '+duration+'ms cubic-bezier(.22,.75,.18,1)';item.panel.style.visibility='visible';item.panel.style.pointerEvents='auto';
 juxtaposePanel=item.panel;item.frame.contentWindow.postMessage({type:'panel-active',active:true},'*');
 requestAnimationFrame(()=>requestAnimationFrame(()=>item.panel.style.transform='translate3d(0,0,0)'));if(!item.back.hidden)item.back.focus();
}
function closePanel(item){
 if(item.closing||juxtaposePanel!==item.panel)return;item.closing=true;item.panel.style.transform=item.from;
 setTimeout(()=>{item.panel.style.visibility='hidden';item.panel.style.pointerEvents='none';item.frame.contentWindow.postMessage({type:'panel-active',active:false},'*');juxtaposePanel=null;item.closing=false;document.querySelector('[aria-label="'+item.label+'"]')?.focus()},650);
}
function openJuxtapose(kind='juxtapose'){if(juxtaposePanel)return;const item=preparePanel(kind);if(item.ready)revealPanel(item);else item.pending=true}
window.addEventListener('message',e=>{
 for(const item of cachedPanels.values())if(e.source===item.frame.contentWindow){
  if(e.data?.type==='panel-ready'){item.ready=true;if(item.pending)revealPanel(item)}
