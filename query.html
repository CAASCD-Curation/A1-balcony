:root{--ink:#171717;--line:#222;--paper:#ececec;--muted:#777;--text-soft:#444;--menu-title-size:14px;--border-soft:#bbb;--rule-soft:#ccc}*{box-sizing:border-box}body{margin:0;background:#ececec;color:var(--ink);font:16px/1.5 "Source Serif 4","Source Han Serif SC",serif}button,input{font:inherit;color:inherit;background:none;border:0;padding:0}button{cursor:pointer}[hidden]{display:none!important}aside{position:relative;padding:16vh 8vw 8vh}#index-close{position:absolute;right:8vw;top:4vh;font-size:40px;line-height:1}

.index-section{border-top:1px solid var(--ink);padding:16px 0 20px}

.index-section h2{font-size:clamp(22px,2.3vw,34px);line-height:1.2;margin:0 0 18px;font-weight:400}

.index-section p{font-size:clamp(14px,1.1vw,17px);line-height:1.75;margin:0 0 16px}

.index-section .index-note{color:var(--muted);margin-bottom:12px}

.index-section>button{font-size:16px;text-align:left;line-height:1.5}

#archive-list{list-style:none;padding:0;margin:0}

#archive-list button{display:grid;grid-template-columns:3ch minmax(0,1fr);gap:16px;width:100%;text-align:left;padding:7px 0;font-size:clamp(14px,1.1vw,17px);line-height:1.45;color:var(--muted);overflow-wrap:anywhere}

#archive-list button[aria-current],#archive-list button:hover,.index-section>button:hover{color:var(--ink)}

#archive-list button[aria-current] span:last-child{text-decoration:underline;text-underline-offset:4px}


/* INDEX-04: three-level archive browser + global search, original paper/ink palette. */
.archive-search{margin-bottom:28px}
.archive-search label{display:block;margin-bottom:10px;font-size:14px}

.archive-search>div{display:flex;gap:10px;border-bottom:1px solid var(--line);padding-bottom:9px}

#archive-query{min-width:0;width:100%;border:0;border-radius:0;background:var(--paper);color:inherit;font:inherit;font-size:15px;padding:4px 0;outline-offset:3px}

#archive-clear{flex:none;font-size:12px;color:var(--muted)}

.index-section summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:clamp(22px,2.3vw,34px);line-height:1.2}

.index-section summary::-webkit-details-marker{display:none}
.index-section summary::after{content:'+';font-size:20px;font-weight:400}
.index-section[open]>summary{margin-bottom:22px}
.index-section[open]>summary::after{content:'−'}

#archive-categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.archive-category{border:1px solid var(--border-soft);padding:18px 14px;text-align:left;min-height:94px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;font-size:17px}

.archive-category small{font-size:12px;color:var(--muted)}
.archive-category:hover,.archive-category:focus-visible{border-color:var(--ink)}

#archive-back{font-size:13px;color:var(--muted);margin:0 0 20px}
#archive-category-title{font-size:20px;font-weight:400;margin:0 0 14px}

.archive-entries{list-style:none;padding:0;margin:0}

#archive-list button,.archive-entries button{display:grid;grid-template-columns:minmax(0,1fr) 3ch;gap:14px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--rule-soft);font-size:15px;line-height:1.5;color:var(--text-soft);overflow-wrap:anywhere}

.archive-entries small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.archive-number{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

#archive-list button[aria-current] span:last-child{text-decoration:none}

.archive-entries button:hover,.archive-entries button[aria-current]{color:var(--ink)}
.archive-entries button:hover>span:first-child>span,.archive-entries button[aria-current]>span:first-child>span{text-decoration:underline;text-underline-offset:4px}

#archive-result-count{font-size:14px;line-height:1.6;margin:0 0 16px}
#archive-categories{grid-template-columns:1fr}
.archive-category{min-height:72px}

#archive-index #archive-query,#archive-index #index-close{background:transparent}

.archive-search label,.index-section summary{font-size:var(--menu-title-size);line-height:1.6;font-weight:400}

.index-section summary{gap:16px}

.index-section summary::after{flex:none}

.label-en{font-family:"Source Serif 4",serif;font-weight:400;display:inline-block;margin-inline-start:.45em;letter-spacing:normal}

 .edge-label .label-en{display:block;margin-inline-start:0;font-size:.82em}

.edge-label .label-en{display:block;margin:.25em 0 0;font-size:.86em;line-height:1.25;text-align:center}

#index-close{display:none!important}

    </div></aside><script>(()=>{let active=true;const raf=window.requestAnimationFrame.bind(window);window.requestAnimationFrame=fn=>raf(function tick(t){if(active)fn(t);else setTimeout(()=>raf(tick),150)});window.addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='panel-active')active=!!e.data.active});document.addEventListener('keydown',e=>{if(e.key==='Escape')parent.postMessage({type:'panel-escape'},'*')});window.addEventListener('load',()=>{active=false;parent.postMessage({type:'panel-ready'},'*')})})();</script><script>const drawer=document.querySelector("aside");const entries=[{"id": "S-05", "category": "社会素材", "title": "封阳台", "original": "Enclosed Balcony", "author": "住宅改造素材", "year": "当代", "weather": "晴朗蓝天下，封闭的圆形挑窗从白墙中突出。明亮的外部与围合的内部相邻，带来被包裹的安稳，也显出边界的存在。", "material": "当代生活场景。玻璃与彩色窗框落在石质托台上，呈现透明围护与传统砌筑并置的界面。", "self": "", "other": "", "image": "assets/9fae1e8701c91457b6fe1915.jpg", "width": 960, "height": 1280, "sourceRow": 2}, {"id": "X-9", "category": "戏仿", "title": "宿舍床帘", "original": "Dorm Bed Curtain", "author": "宿舍生活", "year": "现代", "weather": "如果宿舍是公共区域的话，那床帘内部就是私人区域，当帘子拉开，上铺就变成了阳台。", "material": "用开合控制“我”和“别人”的距离，把共享空间切出一个私人边界。", "self": "", "other": "", "image": "assets/1b0f56ca4c1b5aab25b509c8.jpg", "width": 1098, "height": 1470, "sourceRow": 3}, {"id": "S-06", "category": "社会素材", "title": "阳台堆物 / 储藏", "original": "Balcony Storage", "author": "日常生活素材", "year": "当代", "weather": "室内漫射光照着被器物占用的狭长地面，外面天气难以判断。物件挤入有限空间，让日常显得拥挤而具体。", "material": "当代生活场景。木纹地面与玻璃门窗围住储物空间，但木纹未必来自实木。", "self": "", "other": "", "image": "assets/8baedc69fcc23bd1ef536bd7.jpg", "width": 1284, "height": 1700, "sourceRow": 4}, {"id": "X-4", "category": "戏仿", "title": "冰箱门", "original": "Refrigerator Door", "author": "家庭生活", "year": "现代", "weather": "将照片与纪念品粘贴在冰箱门上，对外展示。", "material": "把家庭内部的记忆、习惯和杂物贴到最容易被看见的表面。", "self": "", "other": "", "image": "assets/03dfdd468954566fd80b4824.jpg", "width": 1103, "height": 1480, "sourceRow": 5}, {"id": "X-11", "category": "戏仿", "title": "家庭展示柜", "original": "Display Cabinet / Curio Cabinet", "author": "家庭生活", "year": "现代", "weather": "展示柜用于存放家庭成员的私人物品对内部展示。", "material": "把私人收藏从“拥有”变成“展示”，让家内部生成一扇面向他人的阳台。", "self": "", "other": "", "image": "assets/0b73c030ba772e3a9e70abf7.jpg", "width": 1137, "height": 1530, "sourceRow": 6}, {"id": "S-03", "category": "社会素材", "title": "阳台晾衣", "original": "Balcony Laundry", "author": "日常生活素材", "year": "当代", "weather": "柔和日光照着窄小阳台上垂挂的衣物。普通家务从室内延伸出来，让日常生活以不经意的方式被看见。", "material": "当代生活场景。金属支架和晾衣织物把阳台变成日常家务场所。", "self": "", "other": "", "image": "assets/dadf66cb27ed1e943ee64dee.jpg", "width": 1188, "height": 1800, "sourceRow": 7}, {"id": "S-57", "category": "社会素材", "title": "鞋子晾在阳台栏杆", "original": "Shoes Drying on Balcony Rails", "author": "家庭日常", "year": "当代", "weather": "强日光照进窗边，密集鞋子铺满地面。有限空间被家务占据，显得拥挤，也保留着真实生活未经整理的一面。", "material": "当代生活场景。鞋类沿栏杆或窗边排列，最普通的清洁行为形成重复、尺度明确的立面细节。", "self": "", "other": "", "image": "assets/f40c50dbea3a76820669a658.jpg", "width": 1284, "height": 1704, "sourceRow": 8}, {"id": "S-37", "category": "社会素材", "title": "阳台晒被子", "original": "Airing Quilts and Bedding on Balconies", "author": "东亚及多地住宅", "year": "当代", "weather": "晴天日光照着大幅浅色被单，展开的织物暂时挡住视线。家务因此显得柔软，像日常正在接受太阳的照料。", "material": "当代生活场景。织物搭在金属栏杆和晾衣绳上，传统日晒家务继续依附现代住宅构件。", "self": "", "other": "", "image": "assets/b4af7256e3668893e21ba7e0.jpg", "width": 735, "height": 1097, "sourceRow": 9}, {"id": "S-36", "category": "社会素材", "title": "阳台晒辣椒与食材", "original": "Drying Food and Chilies on Balconies", "author": "多地日常生活", "year": "传统至今", "weather": "日间侧光照着成串垂挂的红黄食材，日常储备成为鲜明的景象。充实而具体的物件带来生活有所准备的踏实。", "material": "这一生活场景延续至今。木门窗与绳索承托晾晒食材，延续利用日光和空气脱水保存食物的办法。", "self": "", "other": "", "image": "assets/fe3bb0c36d6f5bd9cbae89ff.jpg", "width": 736, "height": 981, "sourceRow": 10}, {"id": "S-40", "category": "社会素材", "title": "阳台空调外机", "original": "Air-Conditioning Units on Balconies", "author": "高密度城市住宅", "year": "当代", "weather": "柔和日光把旧式雕饰外墙与外挂设备放在一起。新需求进入旧建筑，显出日常生活不断调整自身的状态。", "material": "当代生活场景。空调外机附着在旧墙和金属栏杆旁，把机械制冷带入原有住宅。现代空调技术在20世纪发展并逐步进入家庭，这台设备留下的是一次生活设施更新的线索。", "self": "", "other": "", "image": "assets/f77a6ccd35320c7eb7aa2906.jpg", "width": 960, "height": 720, "sourceRow": 11}, {"id": "S-50", "category": "社会素材", "title": "阳台停自行车", "original": "Bicycles on Balconies", "author": "城市住宅", "year": "当代", "weather": "晴天强光照亮长外廊，透明雨棚与停放物形成日常层次。空间边角被利用起来，显出生活因地制宜的务实。", "material": "当代生活场景。在缺少公共车库的住宅中，自行车常被抬到阳台，形成交通工具与居住立面之间的意外叠加。", "self": "", "other": "", "image": "assets/3bd45319861c89ec030aadff.jpg", "width": 960, "height": 720, "sourceRow": 12}, {"id": "S-38", "category": "社会素材", "title": "阳台挂鸟笼", "original": "Bird Cages on Balconies", "author": "东亚 / 地中海地区", "year": "传统至今", "weather": "晴朗白日里，鸟笼靠近镜头，住宅退到后方。近处生命带来陪伴，笼体又让这份亲近带着受限的意味。", "material": "这一生活场景延续至，。细金属笼条依靠栏杆和遮棚安放，呈现鸟笼制作与住宅附属空间的结合。", "self": "", "other": "", "image": "assets/bc3e6e11c649128e037a0660.jpg", "width": 960, "height": 720, "sourceRow": 13}, {"id": "S-04", "category": "社会素材", "title": "阳台植物园", "original": "Balcony Garden", "author": "日常生活素材", "year": "当代", "weather": "明亮白日里，蓝色窗框、独立小阳台与花盆形成鲜活的立面。植物占据建筑边缘，像生活正一点点向外生长。", "material": "当代生活场景。涂漆金属栏杆与花盆共同围出小型花园，植物借用既有住宅构件生长。", "self": "", "other": "", "image": "assets/6bfceb1dffdc37f384dcee13.jpg", "width": 1173, "height": 779, "sourceRow": 14}, {"id": "S-43", "category": "社会素材", "title": "阳台堆肥", "original": "Balcony Composting", "author": "城市园艺实践", "year": "当代", "weather": "明亮日光中，打开的容器、厨余与盆栽并置。生活的剩余物与植物出现在同一处，让照料带上循环往复的意味。", "material": "当代生活场景。塑料容器与土壤让堆肥进入小尺度住宅空间，古老的有机物腐解办法借用了现代容器。", "self": "", "other": "", "image": "assets/ddca9b7b6114804ed4e4cb27.jpg", "width": 1024, "height": 1536, "sourceRow": 15}, {"id": "S-45", "category": "社会素材", "title": "阳台水培蔬菜", "original": "Balcony Hydroponics", "author": "城市园艺实践", "year": "当代", "weather": "晴间有云的天空下，层叠绿植架与城市天际线相对。近处的生长让居住边缘充满期待，像等待一场小小的丰收。", "material": "当代生活场景。立式水培架利用有限墙面和栏杆种菜，阳台被转化为高密度城市中的微型生产空间。", "self": "", "other": "", "image": "assets/e55f6a5ef6d8b11a58c3210a.jpg", "width": 736, "height": 1104, "sourceRow": 16}, {"id": "S-44", "category": "社会素材", "title": "阳台养蜂", "original": "Urban Beekeeping on Balconies", "author": "城市生态实践", "year": "当代", "weather": "日间树荫下，穿防护服的人在箱体旁操作。身体与器物保持谨慎关系，让生产显得专注而小心。", "material": "当代生活场景。木蜂箱、金属网和防护织物可见。", "self": "", "other": "", "image": "assets/d60dd7b0f1c5549df3020567.jpg", "width": 1200, "height": 1800, "sourceRow": 17}, {"id": "S-08", "category": "社会素材", "title": "阳台上的猫与宠物", "original": "Pets on a Balcony", "author": "日常生活素材", "year": "当代", "weather": "黑白照片里，猫停在弧形阳台中央，天气没有被交代。小小身体占据内外之间的位置，让边界带上探索外部的好奇。", "material": "当代生活场景。花饰栏杆与石饰门框留下住宅铁艺的装饰传统，宠物则把坚硬边界变成日常停留处。", "self": "", "other": "", "image": "assets/22858ad788247ff650c09930.jpg", "width": 1173, "height": 1800, "sourceRow": 18}, {"id": "S-07", "category": "社会素材", "title": "阳台抽烟的人", "original": "Smoking on a Balcony", "author": "日常生活素材", "year": "当代", "weather": "蓝灰色低光中，远处立面上的人物显得很小，具体时段并不明确。独自停留的身影像从室内生活中短暂退出。", "material": "当代生活场景。涂漆金属栏杆与花盆共同围出小型花园，植物借用既有住宅构件生长。", "self": "", "other": "", "image": "assets/a6c7c441390fffe0fbc65c4d.jpg", "width": 1200, "height": 1800, "sourceRow": 19}, {"id": "S-46", "category": "社会素材", "title": "阳台健身", "original": "Balcony Home Gym", "author": "家庭生活", "year": "2020年代", "weather": "日间侧光沿狭长平台落下，整齐器材与绿植共同占据空间。清晰的安排让这里显得专注，带着自律生活的节奏。", "material": "事件或场景年代为2020年代。金属器材与橡胶垫把阳台临时改为健身场所，可见的是工业制品进入家庭休闲生活的场景。", "self": "", "other": "", "image": "assets/c4c7d7d209d7bed735af1ffc.jpg", "width": 674, "height": 1198, "sourceRow": 20}, {"id": "S-47", "category": "社会素材", "title": "阳台办公", "original": "Balcony Home Office", "author": "远程办公生活", "year": "2020年代", "weather": "晴间有云的白日里，笔记本电脑放在户外餐桌上。工作仍在继续，开放天光却让这一刻有了短暂舒展的余地。", "material": "事件或场景年代为2020年代。笔记本电脑和临时桌椅让阳台成为居家办公的延伸，工作空间短暂获得户外光线与城市背景。阳台由休憩空间延伸为工作场所。", "self": "", "other": "", "image": "assets/95cc4f8b2f65eafe41dd3700.jpg", "width": 736, "height": 981, "sourceRow": 21}, {"id": "X-6", "category": "戏仿", "title": "工位", "original": "Personal Workspace", "author": "办公室生活", "year": "现代", "weather": "工位为半公共领域，也起到对外展示作用", "material": "把人的私人习惯和身份带进集体空间，形成办公场所里的私人领地。", "self": "", "other": "", "image": "assets/2028bc40d271096fa9ce367a.jpg", "width": 1116, "height": 1488, "sourceRow": 22}, {"id": "S-48", "category": "社会素材", "title": "儿童阳台游戏区", "original": "Children’s Balcony Play Area", "author": "家庭生活", "year": "当代", "weather": "日间漫射光照着靠近白色防护网的孩子。边界既提供保护，也成为向外观察的位置，带着小心探索的好奇。", "material": "当代生活场景。绳网与金属栏杆围出儿童活动区，显示软性防护被附加到原有硬质边界上。", "self": "", "other": "", "image": "assets/eef58ca305510c58e990c638.jpg", "width": 622, "height": 350, "sourceRow": 23}, {"id": "S-51", "category": "社会素材", "title": "热浪中的阳台睡眠", "original": "Sleeping on Balconies during Heatwaves", "author": "炎热地区住宅", "year": "20世纪至今", "weather": "白日光线中，床垫几乎占满狭窄平台，天空并未入画。有限空间被临时改作休息处，带着先安顿下来的意味。", "material": "事件或场景年代为20世纪至今。在缺少空调的炎热夜晚，人们把床垫移到阳台睡觉，半户外空间成为气候适应的临时卧室。", "self": "", "other": "", "image": "assets/8e98f8b3bc7945ff8338829b.jpg", "width": 736, "height": 981, "sourceRow": 24}, {"id": "L-01", "category": "文学意象", "title": "《罗密欧与朱丽叶》", "original": "Romeo and Juliet", "author": "William Shakespeare", "year": "约1595", "weather": "黑白画面没有交代天气，攀向高处的身体与窗口形成鲜明的上下关系。动作仿佛要缩短彼此距离，带着迫切靠近的渴望。", "material": "原作年代为约1595年。后世著名的“阳台场景”让阳台成为爱情意象的原型：两个人被上下空间分开，却通过语言建立亲密联系。", "self": "", "other": "", "image": "assets/d5dc035e3d8c50f64fcee2be.jpg", "width": 960, "height": 1434, "sourceRow": 25}, {"id": "L-02", "category": "文学意象", "title": "《事物的表面》", "original": "Of the Surface of Things", "author": "Wallace Stevens", "year": "1919", "weather": "浅暖色天空铺在山湖景色之后，帷幕把远景框成一处可以凝视的空间。外面的世界仿佛暂时安静下来。", "material": "原作年代为1919年。诗人从自己的阳台观察空气、春天与城市。阳台像一个固定观察点，将复杂世界暂时变成可以凝视的景象。", "self": "", "other": "", "image": "assets/b68ee26d5b000f1661b01009.jpg", "width": 1800, "height": 1435, "sourceRow": 26}, {"id": "L-03", "category": "文学意象", "title": "《倾城之恋》", "original": "Love in a Fallen City", "author": "张爱玲", "year": "1943", "weather": "天空没有入画，户外暗处的人物在战时场景中靠墙休息。相互靠近的身体让动荡暂时退后，留下可以依靠的片刻。", "material": "原作年代为1943年。张爱玲反复利用阳台连接居室与都市。人物既没有完全进入街道，也没有彻底退回室内，在有限距离中观看城市与自己的命运。", "self": "", "other": "", "image": "assets/8b3fc411b63d305d97a40c61.jpg", "width": 600, "height": 337, "sourceRow": 27}, {"id": "S-52", "category": "社会素材", "title": "阳台吊床", "original": "Balcony Hammocks", "author": "住宅休闲", "year": "当代", "weather": "柔和日光下，吊床伸展在狭长空间里。身体仿佛可以暂时离开日常节奏，悬在一段轻松的空隙中。", "material": "当代生活场景。编织吊床悬在金属栏杆旁，吊床利用栏杆和墙体形成柔软的悬挂结构，使狭小阳台获得明显的休闲和身体摆动体验。", "self": "", "other": "", "image": "assets/29f7a4381bdd97756d54ba83.jpg", "width": 736, "height": 1104, "sourceRow": 28}, {"id": "L-04", "category": "文学意象", "title": "《红玫瑰与白玫瑰》", "original": "Red Rose, White Rose", "author": "张爱玲", "year": "1944", "weather": "室内暖暗光中，亲吻成为近距离的特写，背景逐渐模糊。周围世界仿佛退开，只剩下一段隐秘的亲密。", "material": "原作年代为1944年。公寓阳台承载了振保与娇蕊关系最初的暧昧。这个本来普通的住宅空间，因为人物关系而成为欲望和秘密发生的场所。", "self": "", "other": "", "image": "assets/176b9b6ded0331a01442edfc.jpg", "width": 1800, "height": 1024, "sourceRow": 29}, {"id": "L-05", "category": "文学意象", "title": "《阳台》", "original": "The Balcony", "author": "Jean Genet", "year": "1956", "weather": "黑白拼图将人物与不同身体姿态并置，无法对应具体天气。彼此拼接的形象带出欲望，也让亲密显得像一种表演。", "material": "原作年代为1956年。热内把“阳台”变成一个关于角色、权力和表演的巨大隐喻。这里的空间不只是建筑，而是一座现实与幻象互相转换的舞台。", "self": "", "other": "", "image": "assets/a11248cd6164b604ad8a3c4a.jpg", "width": 1800, "height": 971, "sourceRow": 30}, {"id": "L-06", "category": "文学意象", "title": "《阳台故事》", "original": "Balcony Stories", "author": "Grace Elizabeth King", "year": "1893", "weather": "小幅彩色封面里，两个人隔着栏杆交流，天气细节并不明确。有限画幅保留了相互倾听的姿态，让交谈带着共享记忆的温度。", "material": "这部短篇集以新奥尔良生活为背景，女性在阳台上乘凉、交谈并分享记忆。阳台由私人住宅的边缘转变成女性交流和讲述故事的共同空间。", "self": "", "other": "", "image": "assets/74f362e257a0f49f015444f5.jpg", "width": 960, "height": 1364, "sourceRow": 31}, {"id": "A-01", "category": "经典艺术档案", "title": "《阳台》", "original": "The Balcony", "author": "Édouard Manet", "year": "1868–1869", "weather": "明亮的日光照着衣裙与绿色栏杆，身后的房间却沉在暗处。天空没有入画，这种强烈的内外对比，让并立的人物显出一种身处人群却仍然疏离的感觉。", "material": "作品创作于1868—1869年。涂绿的金属栏杆把明亮衣裙与暗室隔开，也把视线带向19世纪城市住宅中的铁艺。", "self": "", "other": "", "image": "assets/2341ca83ce1bffe8fd79e43a.jpg", "width": 762, "height": 1082, "sourceRow": 32}, {"id": "L-07", "category": "文学意象", "title": "《在阳台上》", "original": "On the Balcony", "author": "John Collings Squire", "year": "1909", "weather": "蓝色夜景意象笼罩木廊上的人物，远方景物沉入暗处。近处因此显得更为私密，像从外界收回的一段夜晚。", "material": "原作年代为1909年。夜色中的两个人站在阳台上，城市、塔楼和灯光位于远处，而室内传来热闹声响。阳台形成一个介于拥挤室内与安静夜晚之间的私密空间。", "self": "", "other": "", "image": "assets/910d8d4be4f295604c9b1c20.jpg", "width": 960, "height": 1379, "sourceRow": 33}, {"id": "A-02", "category": "经典艺术档案", "title": "《阳台上的玛哈》", "original": "Majas on a Balcony", "author": "Francisco Goya / follower", "year": "约1808–1812", "weather": "前景女性从昏暗背景中显现，身后的人物则隐入阴影。画面没有交代天气，明暗之间的视线关系却带来被注视的不安。", "material": "作品创作于约1808—1812年。细金属栏杆托起人物的展示空间，留下传统铁匠制作住宅护栏的线索。", "self": "", "other": "", "image": "assets/7a4a0097a04d8a00df7e853c.jpg", "width": 1169, "height": 1800, "sourceRow": 34}, {"id": "S-54", "category": "社会素材", "title": "阳台日光浴", "original": "Balcony Sunbathing", "author": "住宅休闲", "year": "20世纪至今", "weather": "晴间多云的天空下，沙滩、住宅与日光浴人群共同展开。休息的身体与开阔景色相映，带着度假般的松弛。", "material": "事件或场景年代为20世纪至今。居民利用朝向和高处隐私在阳台晒太阳，城市公寓被短暂转化为私人度假平台。", "self": "", "other": "", "image": "assets/2c33bfbd8750ef6e5fe47ea1.jpg", "width": 960, "height": 640, "sourceRow": 35}, {"id": "A-03", "category": "经典艺术档案", "title": "《阳台上的女人与孩子》", "original": "Woman and Child on a Balcony", "author": "Berthe Morisot", "year": "1872", "weather": "薄云般柔和的日光笼罩着灰蓝色城市，母女的背影停在近处。远望因此有了陪伴，也有一种被照看的安稳。", "material": "作品创作于1872年。深色金属栏杆与浅色平台构成轻巧边界，可以联系19世纪城市住宅中金属护栏的应用。", "self": "", "other": "", "image": "assets/c1467fd1da23e9e7cb939acd.jpg", "width": 1466, "height": 1800, "sourceRow": 36}, {"id": "L-08", "category": "文学意象", "title": "《西哈诺·德·贝热拉克》", "original": "Cyrano de Bergerac", "author": "Edmond Rostand", "year": "1897", "weather": "昏暗光线或树荫包围着高处人物与楼下的交谈者，天气难以判断。明暗之间的对话带着遮掩，让爱意显得隐秘。", "material": "原作年代为1897年。配图中的砌体墙、金属栏与木门窗搭起相会的场景，呈现石作、铁艺与木作共同组成街屋的传统。", "self": "", "other": "", "image": "assets/ecb89ed62fc35797650f10a8.jpg", "width": 694, "height": 1000, "sourceRow": 37}, {"id": "A-04", "category": "经典艺术档案", "title": "《拉法耶特街》", "original": "Rue Lafayette", "author": "Edvard Munch", "year": "1891", "weather": "暖色日光下，倾斜的街道与密集人流从高处向下展开。天气并不明确，俯视的角度却让城市显得急促，带来轻微的眩晕。", "material": "作品创作于1891年。花饰栏杆贴着砌体墙面展开，让人想到19世纪建筑装饰中手工铁艺与工业铸件并存的局面。", "self": "", "other": "", "image": "assets/f6ac3dd323bfce34810f45d5.jpg", "width": 1451, "height": 1800, "sourceRow": 38}, {"id": "L-09", "category": "文学意象", "title": "《塞维利亚的理发师》", "original": "The Barber of Seville", "author": "Pierre Beaumarchais", "year": "1775", "weather": "黑白画面中，帷幕分隔着上下层人物，具体天气不明。追求发生在尚未跨越的边界两侧，距离也成为情感的一部分。", "material": "原作年代为1775年。配图用石质外观的栏台与帷幕营造古典居所，延续以柱栏装饰建筑边缘的形式。", "self": "", "other": "", "image": "assets/05d329cff6a220d31d734b0d.jpg", "width": 640, "height": 960, "sourceRow": 39}, {"id": "A-05", "category": "经典艺术档案", "title": "《街道进入房屋》", "original": "The Street Enters the House", "author": "Umberto Boccioni", "year": "1911", "weather": "暖色调把白日城市推向强烈的动势，碎裂的街景与施工场面交织在一起。这里的光色并非天气实录，而让人感到自己正被城市的运动卷入。", "material": "作品创作于1911年。栏杆与街道建筑被拆成相互穿透的线条，回应着20世纪初对现代城市速度的感受。", "self": "", "other": "", "image": "assets/64d7f5dac11199ac17d5f7fe.jpg", "width": 1800, "height": 1786, "sourceRow": 40}, {"id": "L-10", "category": "文学意象", "title": "《唐璜》", "original": "Don Giovanni", "author": "Lorenzo Da Ponte / W. A. Mozart", "year": "1787", "weather": "舞台暗光照出攀爬者与高处女性，并不对应真实天气。接近的动作跨越高差，让亲密带着冒险的紧张。", "material": "原作年代为1787年。配图中的栏台与柱体带出传统石作的形象。", "self": "", "other": "", "image": "assets/9876f53f6db6ee4ec10647d1.jpg", "width": 1000, "height": 1497, "sourceRow": 41}, {"id": "A-06", "category": "经典艺术档案", "title": "《阳台上奔跑的女孩》", "original": "Girl Running on a Balcony", "author": "Giacomo Balla", "year": "1912", "weather": "明亮色块中，重复的身体与栏杆织成密集节奏，奔跑的兴奋几乎越出画面。具体天气无法判断，运动本身成为最鲜明的感受。", "material": "作品创作于1912年。奔跑的身影与栏杆化成连续节奏，空间更多服务于运动的表现。画面细节不足以确认具体历史线索。", "self": "", "other": "", "image": "assets/e7fb3aafb0af1e04048eed0c.jpg", "width": 594, "height": 600, "sourceRow": 42}, {"id": "L-11", "category": "文学意象", "title": "《游吟诗人》", "original": "Il trovatore", "author": "Salvadore Cammarano / Giuseppe Verdi", "year": "1853", "weather": "黑白画面里，上下两处人物隔着植物对望，天气无法确定。遮蔽让等待多了一层不安，像靠近也可能伴随危险。", "material": "原作年代为1853年。石质外观的栏台、墙体与藤蔓构成配图中的历史场景，让人联想到传统砌筑庭院。", "self": "", "other": "", "image": "assets/ddd855aa3caeb6f50d476414.jpg", "width": 1200, "height": 1764, "sourceRow": 43}, {"id": "A-07", "category": "经典艺术档案", "title": "Casa Batlló 阳台", "original": "Casa Batlló Balcony", "author": "Antoni Gaudí", "year": "1904–1906", "weather": "柔和的日间光线落在骨骼状栏板与碎片拼贴表面，奇异的形态因此显得可以亲近。陌生感与亲切感在同一处边界上并存。", "material": "项目年代为1904—1906年。面具般的铸铁栏板与陶瓷、玻璃拼贴交织在一起。这里可以读到加泰罗尼亚现代主义对材料的重新想象：铸造提供整体轮廓，碎片拼贴让建筑表面保留手作的变化。", "self": "", "other": "", "image": "assets/531abb1e6a2d4a88d6d3c4a6.jpg", "width": 1800, "height": 1200, "sourceRow": 44}, {"id": "A-08", "category": "经典艺术档案", "title": "《透视 II：马奈的阳台》", "original": "Perspective II: Manet’s Balcony", "author": "René Magritte", "year": "1950", "weather": "日光照亮前景，后方仍然幽暗，鲜明的绿色栏杆后却站着替代人物的木棺。熟悉的明暗关系被这一置换凝固成静止的惊悚。", "material": "作品创作于1950年。木质棺体取代人物，绿栏与百叶门仍延续马奈画中的住宅界面。", "self": "", "other": "", "image": "assets/8b52e1361527bbe984250b72.jpg", "width": 1359, "height": 1800, "sourceRow": 45}, {"id": "L-12", "category": "文学意象", "title": "《浮士德》", "original": "Faust", "author": "Johann Wolfgang von Goethe", "year": "1808 / 1832", "weather": "室内黑白图中，人物伏在窗边，内外光差划出清晰界线。天气虽然不明，向外的姿态仍让人感到被封闭的渴望。", "material": "原作年代为1808年／1832年。配图以木窗和砌体墙围出内外相望的界面，留下传统木作嵌入墙体的线索。", "self": "", "other": "", "image": "assets/317231445ff3fad207ad7d4b.jpg", "width": 406, "height": 697, "sourceRow": 46}, {"id": "S-15", "category": "社会素材", "title": "阳台上的一顿饭", "original": "Eating on a Balcony", "author": "Montevideo 日常生活", "year": "2010", "weather": "柔和日光下，一个人端盘停在深窗洞边。最普通的生活动作被留在建筑边缘，显出片刻独处的自在。", "material": "事件或场景年代为2010年。旧抹灰墙与细金属栏杆围住一顿饭，让传统住宅界面继续承接当代生活。", "self": "", "other": "", "image": "assets/235129d76821448197461358.jpg", "width": 1350, "height": 1800, "sourceRow": 47}, {"id": "A-09", "category": "经典艺术档案", "title": "《阳台上的男人》", "original": "Man on a Balcony / L’homme au balcon", "author": "Gustave Caillebotte", "year": "约1880", "weather": "暖色日光沿街道向远处延伸，俯瞰城市的人物只留下背影。开阔的纵深让观看显得自由，也保留着独自观察的距离。", "material": "作品创作于约1880年。装饰金属栏杆贴近厚实墙边，显出19世纪住宅将透空护栏与砌体结合的做法。", "self": "", "other": "", "image": "assets/1dc956efdddee1df58caa899.jpg", "width": 1351, "height": 1800, "sourceRow": 48}, {"id": "L-13", "category": "文学意象", "title": "《萨拉曼卡的学生》", "original": "El estudiante de Salamanca", "author": "José de Espronceda", "year": "1840", "weather": "明亮日光下，两人临栏看向密集屋顶。共同观看缩短了彼此距离，却仍保留着近距离试探的意味。", "material": "原作年代为1840年。阳台与小夜曲构成西班牙城市爱情想象的重要背景。", "self": "", "other": "", "image": "assets/910a3396e751f8c3f0810a52.jpg", "width": 736, "height": 920, "sourceRow": 49}, {"id": "A-10", "category": "经典艺术档案", "title": "《在阳台上》", "original": "On a Balcony", "author": "Mary Cassatt", "year": "1878–1879", "weather": "柔和的日光穿过花木，包围着低头阅读的人。空间安静而收拢，像一段不被外界打扰的独处时光。", "material": "作品创作于1878—1879年。植物与织物遮住了建筑边缘。", "self": "", "other": "", "image": "assets/b97fda35adc12dfc369deee7.jpg", "width": 1382, "height": 1800, "sourceRow": 50}, {"id": "L-14", "category": "文学意象", "title": "《道林·格雷的画像》", "original": "The Picture of Dorian Gray", "author": "Oscar Wilde", "year": "1890", "weather": "室内黑白画面把包厢人物与观众席并置，不涉及外部天气。观看别人时也暴露于他人目光，自我因此带上被展示的意味。", "material": "原作年代为1890年。装饰栏板与帷幕共同营造华丽感，伦敦上流住宅和剧院包厢不断出现，阳台式观看位置强化审美化生活与被观看的社会表演。", "self": "", "other": "", "image": "assets/c5c369ed5386e143729120c6.jpg", "width": 736, "height": 1062, "sourceRow": 51}, {"id": "A-11", "category": "经典艺术档案", "title": "《在阳台上》", "original": "On the Balcony", "author": "Childe Hassam", "year": "1888", "weather": "圆月与朦胧蓝光构成夜景，浅色衣裙在其中轻轻显现。人物仿佛停在月色里，让这一刻保持缓慢而安静。", "material": "作品创作于1888年。浅色栏板与花盆勾勒出停留之处。", "self": "", "other": "", "image": "assets/c958870cc5e6ff09fec99f82.jpg", "width": 1077, "height": 1800, "sourceRow": 52}, {"id": "L-15", "category": "文学意象", "title": "《阳台》（波德莱尔诗）", "original": "Le Balcon", "author": "Charles Baudelaire", "year": "1857", "weather": "灰暗版画中，人影、树木与建筑暗部彼此交融，天气难以辨认。模糊的层次像被时间留下的影像，仍存着记忆里的余温。", "material": "原作年代为1857年。诗人把阳台写成储存爱情记忆的场所，夜色、炉火和亲密回忆在这里与城市外部世界重叠。", "self": "", "other": "", "image": "assets/2bc80d4ccf7e321285de6d3f.jpg", "width": 1320, "height": 981, "sourceRow": 53}, {"id": "A-12", "category": "经典艺术档案", "title": "《特拉法加酒馆，格林尼治》", "original": "Trafalgar Tavern, Greenwich", "author": "James Tissot", "year": "1878", "weather": "黑白画面没有交代天气，室内窗边与城市立面却彼此框取。观看停留在窗后，形成一种参与有限、距离清晰的旁观。", "material": "作品创作于1878年。画面细节不足以确认具体历史线索。", "self": "", "other": "", "image": "assets/960d946ede77d4531b10d581.jpg", "width": 823, "height": 1155, "sourceRow": 54}, {"id": "L-16", "category": "文学意象", "title": "《阳台上的玫瑰》", "original": "The Rose upon My Balcony", "author": "W. M. Thackeray", "year": "1848", "weather": "黑白画面没有交代天气，独自站在栏边的人被花木围绕。静止的姿态中仍能读到期待，仿佛情感正重新苏醒。", "material": "原作年代为1848年。配图以弯曲金属栏杆托住植物，可联系装饰铁艺塑造住宅边界的传统。", "self": "", "other": "", "image": "assets/fbf01672a4202e24c8cd834c.jpg", "width": 422, "height": 610, "sourceRow": 55}, {"id": "A-13", "category": "经典艺术档案", "title": "《在阳台上》", "original": "On the Balcony", "author": "John William Godward", "year": "1911", "weather": "晴朗日光下，蓝海与浅色石面相互映衬，遮阳扇为人物留出片刻舒适。向远处投去的目光显得闲适而从容。", "material": "作品创作于1911年。石质外观的栏台与铺地留下传统砌筑空间的印象。", "self": "", "other": "", "image": "assets/bba17fb2f62cdc40ebe61c3f.jpg", "width": 869, "height": 1800, "sourceRow": 56}, {"id": "A-14", "category": "经典艺术档案", "title": "《阳台房间》", "original": "The Balcony Room", "author": "Adolph Menzel", "year": "1845", "weather": "强烈日光穿过敞开的门，照亮薄帘与空椅。无人占据的房间并不封闭，反而像正等待空气与外面的生活进入。", "material": "作品创作于1845年。木地板、木框玻璃门与薄帘把室内引向室外，呈现木作和玻璃共同组织住宅采光的方式。这条材料线索早于现代大面积玻璃幕墙，画中还保留着分格门窗的尺度。", "self": "", "other": "", "image": "assets/817978e5a80941f96bf66734.jpg", "width": 960, "height": 1206, "sourceRow": 57}, {"id": "X-8", "category": "戏仿", "title": "手机锁屏", "original": "Phone Lock Screen", "author": "数字生活", "year": "现代", "weather": "手机内部是完全的私人领域，而锁屏作为经常出现的半公共展示区域，也是一种阳台。", "material": "把最私人的图像带到公共环境中，成为随身可见的私人界面。", "self": "", "other": "", "image": "assets/41681fc4dad5276f854982e7.jpg", "width": 685, "height": 1392, "sourceRow": 58}, {"id": "L-17", "category": "文学意象", "title": "《告别》", "original": "Despedida / Farewell", "author": "Federico García Lorca", "year": "1920年代", "weather": "人物在黑白画面中向栏外仰身，外部天气并不明确。身体靠近边缘的动作带着不愿离开的意味，让告别仍保留留恋。", "material": "原作年代为1920年代。金属栏杆与百叶窗组成配图中的住宅边缘，保留铁艺和可调遮阳构件并用的做法。", "self": "", "other": "", "image": "assets/82f78d1a65e80112992f841b.jpg", "width": 370, "height": 500, "sourceRow": 59}, {"id": "A-15", "category": "经典艺术档案", "title": "《两姐妹（在露台上）》", "original": "Two Sisters (On the Terrace)", "author": "Pierre-Auguste Renoir", "year": "1881", "weather": "柔和日光中，花饰、人物与绿植层层交叠。相互靠近的形象让空间显得松弛，带着有人陪伴的轻快。", "material": "作品创作于1881年。细金属栏杆与花篮相伴，透空构件让花园成为人物身后的连续背景。", "self": "", "other": "", "image": "assets/e62adfbb852f17d2e274d38b.jpg", "width": 960, "height": 1180, "sourceRow": 60}, {"id": "L-18", "category": "文学意象", "title": "《看得见风景的房间》", "original": "A Room with a View", "author": "E. M. Forster", "year": "1908", "weather": "室外明亮，室内偏暗，人物掀起薄帘向外看。光线随着这一动作进入近处，也让人感到打开生活的愿望。", "material": "原作年代为1908年。配图里的木框玻璃门与薄帘层层展开，呈现木作门窗将采光、通风与遮蔽结合的方式。", "self": "", "other": "", "image": "assets/9079d13b8821741fc9fc9423.jpg", "width": 486, "height": 646, "sourceRow": 61}, {"id": "S-53", "category": "社会素材", "title": "阳台烧烤", "original": "Balcony Barbecue", "author": "住宅社交", "year": "当代", "weather": "蓝灰色暮色中，暖灯照亮工作台与座位。近处的光把空间留给生活，让渐暗的夜晚仍有烟火气。", "material": "当代生活场景。小型烤炉把烹饪活动移到住宅边缘，气味、烟雾和邻里关系也因此跨越私人边界。", "self": "", "other": "", "image": "assets/bea445aea6fb134374a2c96b.jpg", "width": 735, "height": 985, "sourceRow": 62}, {"id": "A-16", "category": "经典艺术档案", "title": "《夜间咖啡馆露台》", "original": "Café Terrace at Night", "author": "Vincent van Gogh", "year": "1888", "weather": "星空意象铺成深蓝夜色，黄色灯光在其中形成温暖的停留处。冷暖相照，让夜间的露台显得可以靠近。", "material": "作品创作于1888年。铺石地面、遮棚与灯光把街边延伸成夜间阳台。", "self": "", "other": "", "image": "assets/a2582c95b2d457ec7547d899.jpg", "width": 960, "height": 1229, "sourceRow": 63}, {"id": "L-19", "category": "文学意象", "title": "《魔山》", "original": "The Magic Mountain", "author": "Thomas Mann", "year": "1924", "weather": "明亮日光下，远山带着朦胧雾感，躺椅与照护者停在开阔山景之前。休养显得缓慢，时间仿佛围绕身体重新展开。", "material": "原作年代为1924年。配图把玻璃窗、休憩椅与台灯放在一起，留下采光空间与电气化生活相遇的线索。", "self": "", "other": "", "image": "assets/74086e12f3eea0087e4e4465.jpg", "width": 1280, "height": 720, "sourceRow": 64}, {"id": "A-17", "category": "经典艺术档案", "title": "《圣阿德雷斯的露台》", "original": "Terrace at Sainte-Adresse", "author": "Claude Monet", "year": "1867", "weather": "晴朗天空中浮着云，展开的旗帜透露出风的存在。人物在花园与水平海面之间坐立，休闲也随视野一起变得开阔。", "material": "作品创作于1867年。栏杆、旗杆和花坛围出海边露台，呈现19世纪休闲空间的布置。构件表面和接头未被清楚描绘，画面细节不足以确认具体历史线索。", "self": "", "other": "", "image": "assets/3b53b51e87df306198d4bc49.jpg", "width": 960, "height": 720, "sourceRow": 65}, {"id": "L-20", "category": "文学意象", "title": "《威尼斯之死》", "original": "Death in Venice", "author": "Thomas Mann", "year": "1912", "weather": "暮色云层映着暖色远景，檐下人物只留下剪影。近处渐暗的形象让繁华像已退去，留下迟缓的衰微感。", "material": "原作年代为1912年。配图中细金属支杆撑起织物遮棚，延续以轻巧支架创造阴凉的办法。", "self": "", "other": "", "image": "assets/eced9aa159bc596d66c4105d.jpg", "width": 1021, "height": 424, "sourceRow": 66}, {"id": "A-18", "category": "经典艺术档案", "title": "《米斯特拉尔旅馆的露台》", "original": "The Terrace at the Hôtel Mistral", "author": "Georges Braque", "year": "1907", "weather": "树干、栏杆与坡地被组织成几何化的彩色风景，具体天气并不明确。视线在这些形体之间游移，凝视也因此带上不稳定的节奏。", "material": "作品创作于1907年。装饰栏杆给平台画出边界，但材质与做法并不清楚。画面细节不足以确认具体历史线索。", "self": "", "other": "", "image": "assets/92346ca3d7b386d6df888c42.jpg", "width": 444, "height": 593, "sourceRow": 67}, {"id": "A-19", "category": "经典艺术档案", "title": "《家庭聚会》", "original": "Family Reunion", "author": "Frédéric Bazille", "year": "1867", "weather": "日间树荫在花园里留下斑驳光影，聚在一起的人物构成整齐的集体肖像。亲近之中仍保留着姿态上的拘谨。", "material": "作品创作于1867年。树影与座椅占据画面。", "self": "", "other": "", "image": "assets/0498ec81361a6a18598de6eb.jpg", "width": 960, "height": 630, "sourceRow": 68}, {"id": "L-21", "category": "文学意象", "title": "《觉醒》", "original": "The Awakening", "author": "Kate Chopin", "year": "1899", "weather": "黑白画面没有显示天气，女性在树旁交谈。相处的姿态让人想到对自身处境的探问，仿佛在试探生活的边界。", "material": "原作年代为1899年。树木和桌椅占据配图，格兰德岛的门廊和阳廊让女性暂时脱离室内家庭秩序，成为思考自我和感受海风的中间空间。", "self": "", "other": "", "image": "assets/9d60af83a400a052c57d8c67.jpg", "width": 830, "height": 619, "sourceRow": 69}, {"id": "A-20", "category": "经典艺术档案", "title": "《圣日耳曼的露台，春天》", "original": "The Terrace at Saint-Germain, Spring", "author": "Alfred Sisley", "year": "1875", "weather": "多云的白日里，宽阔天空覆盖河谷，人物在远景前显得细小。目光得以向远处舒展，带来暂时离开近身事务的轻松。", "material": "作品创作于1875年。平台退入远景，留下开阔地形的印象。", "self": "", "other": "", "image": "assets/fbac8664168e6d9e6c8b86c2.jpg", "width": 960, "height": 667, "sourceRow": 70}, {"id": "S-55", "category": "社会素材", "title": "阳台喂鸟", "original": "Feeding Birds from Balconies", "author": "城市日常", "year": "当代", "weather": "小鸟栖在纤维状的窝中，模糊背景无法提供天气线索。近距离的观看让生命显得细小，也唤起照料与保护的心情。", "material": "当代生活场景。住户在栏杆放置食物或喂食器，吸引鸟类靠近住宅，也引发卫生与邻里管理讨论。", "self": "", "other": "", "image": "assets/f118a37f0052fdab345f2bc0.jpg", "width": 960, "height": 640, "sourceRow": 71}, {"id": "L-22", "category": "文学意象", "title": "《欢乐之家》", "original": "The House of Mirth", "author": "Edith Wharton", "year": "1905", "weather": "装饰性书封用聚会意象构成优雅场面，实际天气无法判断。人物被安置在这一体面秩序之中，也显出受到约束的意味。", "material": "原作年代为1905年。露台与花园聚会是上流社会社交的重要舞台。", "self": "", "other": "", "image": "assets/0c60779ea43ecae70d2de110.jpg", "width": 234, "height": 350, "sourceRow": 72}, {"id": "A-21", "category": "经典艺术档案", "title": "《露台上的下午茶》", "original": "Afternoon Tea on the Terrace", "author": "Frederick Carl Frieseke", "year": "约1911", "weather": "柔和暖光落在浅色衣裙、花束与茶桌上，把相处的时间放慢。画面带着午后般的从容，让交流显得轻柔而自然。", "material": "作品创作于约1911年。桌布与杯具让露台成为生活场景。", "self": "", "other": "", "image": "assets/b101f475b5b68825a0eed179.jpg", "width": 1800, "height": 1772, "sourceRow": 73}, {"id": "L-23", "category": "文学意象", "title": "《纯真年代》", "original": "The Age of Innocence", "author": "Edith Wharton", "year": "1920", "weather": "室内版画中，密集观众与层叠包厢组织着彼此的视线，天气不在画面范围内。身处其中，仿佛也置身阶层划分的目光之中。", "material": "原作年代为1920年。配图以装饰栏板围合剧院座席，呈现包厢作为观看和社交界面的形式。", "self": "", "other": "", "image": "assets/308a9095b1d61499ff05c55f.jpg", "width": 699, "height": 438, "sourceRow": 74}, {"id": "A-22", "category": "经典艺术档案", "title": "《北欧夏夜》", "original": "Nordic Summer Evening", "author": "Richard Bergh", "year": "1899–1900", "weather": "暮色般的低角度光线映着平静湖面，两个人分立栏台两侧。距离并不遥远，却有一种靠近而沉默的气氛。", "material": "作品创作于1899—1900年。浅色瓶形栏杆与木质感地面并置，可以联想到古典栏杆形式在近代住宅中的延续。", "self": "", "other": "", "image": "assets/39d1be98597e4258aa9e49f9.jpg", "width": 960, "height": 636, "sourceRow": 75}, {"id": "L-24", "category": "文学意象", "title": "《乡土风俗》", "original": "The Custom of the Country", "author": "Edith Wharton", "year": "1913", "weather": "暖光围绕花园、露台人群与木栏，具体时段尚不明确。热闹相聚让每个人既观看他人，也像在展示自己的角色。", "material": "原作年代为1913年。酒店、度假地与豪宅露台成为主人公不断转换社会身份的背景，半公共空间适合观察和表演。", "self": "", "other": "", "image": "assets/e7e35b35385b42d185df2337.jpg", "width": 1000, "height": 649, "sourceRow": 76}, {"id": "A-23", "category": "经典艺术档案", "title": "《在阳廊上》", "original": "On the Veranda", "author": "Harald Sohlberg", "year": "约1902", "weather": "蓝绿色暮色笼罩空桌、暗下来的树木与远处水面。空间像刚刚结束一场聚会，留下人散之后尚未消退的寂静。", "material": "作品创作于约1902年。木质廊台、栏杆与屋檐围成阴凉的过渡空间，延续以木作搭建外廊的传统。", "self": "", "other": "", "image": "assets/dde42c56578e45cb0995915a.jpg", "width": 960, "height": 802, "sourceRow": 77}, {"id": "F-01", "category": "形式灵感", "title": "重复网格", "original": "Repetition", "author": "形式采集", "year": "当代", "weather": "柔和日光中，规则网格与家用设备层层叠加。统一框架没有遮住日常差异，反而让生活在秩序之中显现。", "material": "这是一则当代建筑图像。金属防护网、玻璃门窗与空调外机叠在重复开口之间，呈现标准化住宅与家庭设备更新的相遇。", "self": "", "other": "", "image": "assets/7aa0ea4a3a49d48c6155b9cd.jpg", "width": 1800, "height": 1200, "sourceRow": 78}, {"id": "L-25", "category": "文学意象", "title": "《包法利夫人》", "original": "Madame Bovary", "author": "Gustave Flaubert", "year": "1857", "weather": "日间漫射光照着窗外，室内灯光仍然亮着，两个人隔窗分立。相近的位置没有消除隔阂，反而显出近在眼前的疏远。", "material": "原作年代为1857年。配图中的瓶形栏台、木百叶与玻璃窗层层相接，可以联系古典栏杆形式和传统门窗木作的延续。", "self": "", "other": "", "image": "assets/9bcbbff631382fa761b3ce95.jpg", "width": 1200, "height": 600, "sourceRow": 79}, {"id": "A-24", "category": "经典艺术档案", "title": "《阿里阿德涅》", "original": "Ariadne", "author": "John William Waterhouse", "year": "1898", "weather": "海边光线偏低，具体时段难以确定，卧躺的人物与远处船只隔空相对。画面因此像停在尚未结束的等待中。", "material": "作品创作于1898年。石质平台与垂落织物构成古典场景，让19世纪的绘画回望更早的建筑世界。", "self": "", "other": "", "image": "assets/a3a882c9ac490575829ebcbf.jpg", "width": 960, "height": 570, "sourceRow": 80}, {"id": "A-25", "category": "经典艺术档案", "title": "《准备卡瓦的少女们》", "original": "Young Girls Preparing Kava", "author": "John La Farge", "year": "1891", "weather": "热带白日的亮处与檐下阴影相接，劳作的人物、草地和开敞屋檐共同组成日常场景。共同做事的节奏显得从容而稳定。", "material": "作品创作于1891年。木柱、屋檐与编织垫共同组织日常空间，可从中读到木作和植物纤维编织的材料传统。", "self": "", "other": "", "image": "assets/8c50d98a6c8009e1abcdc9b0.jpg", "width": 960, "height": 1302, "sourceRow": 81}, {"id": "F-02", "category": "形式灵感", "title": "错位阳台", "original": "Staggered", "author": "形式采集", "year": "当代", "weather": "晴朗蓝天下，重复折线表皮围绕中心凹洞展开。清晰秩序中出现陌生的空缺，使熟悉的建筑尺度变得难以立即把握。", "material": "这是一则当代建筑图像。阳台在不同楼层发生水平错位，使原本平整的建筑立面产生节奏与运动感。", "self": "", "other": "", "image": "assets/7f4d00e0f984d50d91bb5025.jpg", "width": 1284, "height": 1509, "sourceRow": 82}, {"id": "L-26", "category": "文学意象", "title": "《在海湾》", "original": "At the Bay", "author": "Katherine Mansfield", "year": "1922", "weather": "明亮晴天的意象里，白色空椅面对海景，绿植停在近处。无人占据的座位像日常留出的空隙，可以让生活暂时放慢。", "material": "原作年代为1922年。木廊柱、木栏与木椅构成配图中的生活边界，延续木构外廊承接室内起居的做法。", "self": "", "other": "", "image": "assets/1b3b9c1810cc55364b4c28b3.jpg", "width": 629, "height": 800, "sourceRow": 83}, {"id": "A-26", "category": "经典艺术档案", "title": "《闲暇时光》", "original": "Hours of Idleness", "author": "William Stephen Coleman", "year": "1900", "weather": "晴间多云的海岸上，人物卧坐在草地间。开阔天光让身体逐渐放松，像把片刻闲暇交还给自然。", "material": "作品创作于1900年。配图主要呈现草地与人物，未见可辨认的阳台构件。画面细节不足以确认具体历史线索。", "self": "", "other": "", "image": "assets/624082d2f8bdf3b08c8e560d.jpg", "width": 512, "height": 384, "sourceRow": 84}, {"id": "L-27", "category": "文学意象", "title": "《到灯塔去》", "original": "To the Lighthouse", "author": "Virginia Woolf", "year": "1927", "weather": "晴朗的海滨白日里，一个人临栏而立，水面与城市远景向外展开。目光停在远方，近处的身体也随之安静下来。", "material": "原作年代为1927年。配图中的水城景象尚不能与原作建立明确对应，画面细节不足以确认具体历史线索。", "self": "", "other": "", "image": "assets/26725d26b8a93e206a804561.jpg", "width": 736, "height": 552, "sourceRow": 85}, {"id": "F-03", "category": "形式灵感", "title": "悬挑", "original": "Cantilever", "author": "形式采集", "year": "当代", "weather": "晴间有云的天空下，平台伸出立面，下方人物提供日常尺度。悬出的边缘显得轻快，像暂时脱离建筑主体。", "material": "这是一则当代建筑图像。一块水平板从建筑主体伸出，制造出非常直接的“悬浮”视觉关系。可联系现代钢结构和钢筋混凝土扩大悬挑可能性的历史。", "self": "", "other": "", "image": "assets/927ccff6c2e11ec1a8668dcb.jpg", "width": 1210, "height": 1800, "sourceRow": 86}, {"id": "S-49", "category": "社会素材", "title": "邮轮私人阳台文化", "original": "Cruise Ship Private Balconies", "author": "邮轮旅游", "year": "1990年代至今", "weather": "薄云下，两把躺椅面向白日海面。视野延伸得很远，近处空间却仍然收拢，让远行带着被包裹的安稳。", "material": "事件或场景年代为1990年代至今。大量客舱配置独立阳台，把海上远景商品化为私人消费体验，也形成重复密集的船体立面。", "self": "", "other": "", "image": "assets/e97acae6fc318442939cff8e.jpg", "width": 960, "height": 720, "sourceRow": 87}, {"id": "A-27", "category": "经典艺术档案", "title": "《站在阳台上的希腊女孩》", "original": "A Greek Girl Standing on a Balcony", "author": "John Frederick Lewis", "year": "19世纪", "weather": "柔和日光照着狭窄平台，长裙人物侧身望向远处。有限的空间收住了动作，也让等待显得克制。", "material": "作品创作于19世纪。细金属栏杆嵌在石质门框与铺地之间，让金属加工和传统石作在同一处相遇。", "self": "", "other": "", "image": "assets/09fed869fe2d4c9aa63fdac9.jpg", "width": 960, "height": 1399, "sourceRow": 88}, {"id": "L-28", "category": "文学意象", "title": "《达洛维夫人》", "original": "Mrs Dalloway", "author": "Virginia Woolf", "year": "1925", "weather": "柔和日光中，卧躺人物被百叶门与厚栏板围住。空间像从社交中退回的一处角落，允许人暂时不作回应。", "material": "原作年代为1925年。石质外观的栏板、木百叶与藤椅把几种传统材料并置在配图里，呈现石作、木作和编织共同营造休憩空间的方式。", "self": "", "other": "", "image": "assets/3b90d2aa53625f8c5b8246ed.jpg", "width": 1151, "height": 551, "sourceRow": 89}, {"id": "A-28", "category": "经典艺术档案", "title": "《丢勒站在自宅阳台》", "original": "Albrecht Dürer on the Balcony of His House", "author": "William Bell Scott", "year": "1854", "weather": "多云的白日里，暗色木廊与明亮街景形成对比。人物停在两者之间，像与城市保持着由身份划出的距离。", "material": "作品创作于1854年。木廊板、木檐与砌体墙面形成层次，把视线引向欧洲传统木作和砌筑并用的住宅。", "self": "", "other": "", "image": "assets/f5211bc8f0522c4e834db503.jpg", "width": 960, "height": 777, "sourceRow": 90}, {"id": "F-04", "category": "形式灵感", "title": "凹入式阳台", "original": "Loggia", "author": "形式采集", "year": "当代", "weather": "明亮入口向深暗内部过渡，连续拱券把通道一层层推远。目光随之向内收拢，形成逐渐退入内部的感觉。", "material": "这是一则当代建筑图像。与向外凸出的阳台相反，空间被挖入建筑体量内部，形成强烈的明暗框景。", "self": "", "other": "", "image": "assets/ecc644b1a379a69f2052b483.jpg", "width": 960, "height": 1280, "sourceRow": 91}, {"id": "L-29", "category": "文学意象", "title": "《了不起的盖茨比》", "original": "The Great Gatsby", "author": "F. Scott Fitzgerald", "year": "1925", "weather": "装饰性的蓝色夜光笼罩豪宅、乐队与聚会人群。热闹显得轻盈又不稳，像繁华之中难以落定的漂浮。", "material": "原作年代为1925年。配图用古典柱廊和栏台营造宏大的居所，延续近代建筑借用古典形式的做法。", "self": "", "other": "", "image": "assets/8edeb54daa0bbe3df6f7dd51.jpg", "width": 800, "height": 800, "sourceRow": 92}, {"id": "A-29", "category": "经典艺术档案", "title": "《求婚》", "original": "Courtship: The Proposal", "author": "Lawrence Alma-Tadema", "year": "19世纪末", "weather": "暖色日光中，两人近坐，浅色建筑与花木围出一处安静角落。彼此靠近的姿态带着试探，让亲密尚未完全说破。", "material": "作品创作于19世纪末。石质外观的栏台与座椅营造出古典庭园的背景，延续了以厚实构件围合露台的形式。", "self": "", "other": "", "image": "assets/f6d1dafe0b99001d9cdc8c74.jpg", "width": 960, "height": 1032, "sourceRow": 93}, {"id": "F-05", "category": "形式灵感", "title": "弧形阳台", "original": "Curved Balcony", "author": "形式采集", "year": "当代", "weather": "晴天光影划出弧形平台的边缘，重复曲线连续展开。刚性的建筑因此显得柔和，带着缓慢流动的节奏。", "material": "这是一则当代建筑图像。混凝土楼板沿弧线展开，竖条金属栏杆跟随边缘转折，体现可塑性材料与模板成形的配合。", "self": "", "other": "", "image": "assets/2a7ec41aac3bce5885d214fa.jpg", "width": 1800, "height": 1200, "sourceRow": 94}, {"id": "A-30", "category": "经典艺术档案", "title": "《荷马诗朗读会》", "original": "A Reading from Homer", "author": "Lawrence Alma-Tadema", "year": "1885", "weather": "晴朗海边，日光照亮浅色平台，蓝海在围坐聆听的人群身后展开。共同停留与专注倾听，让开放空间也显得凝聚。", "material": "作品创作于1885年。石质平台和柱体搭起古典世界的舞台，映出19世纪绘画对古代生活的想象。", "self": "", "other": "", "image": "assets/e3ec6df49b4813c4fed4cf4c.jpg", "width": 960, "height": 481, "sourceRow": 95}, {"id": "L-30", "category": "文学意象", "title": "《夜色温柔》", "original": "Tender Is the Night", "author": "F. Scott Fitzgerald", "year": "1934", "weather": "星夜意象把海天染成蓝色，两个人在栏边对话。夜色使相处显得温柔，却仍保留着彼此之间的距离。", "material": "原作年代为1934年。配图中的瓶形栏台带有古典露台的形象。", "self": "", "other": "", "image": "assets/6182210438916b001e20265f.jpg", "width": 735, "height": 411, "sourceRow": 96}, {"id": "F-06", "category": "形式灵感", "title": "栏杆图案", "original": "Railing Pattern", "author": "形式采集", "year": "当代", "weather": "拼图中的弯曲花纹与重复栏杆彼此呼应，无法对应单一天气。边界因装饰而变得可观看，防护构件也显出细腻趣味。", "material": "这是一则当代建筑图像。涂漆金属构件把栏杆编成重复花纹，可联系工业革命以后装饰铁件生产规模的扩大。", "self": "", "other": "", "image": "assets/cb88edbaa3e0f98c822db15e.jpg", "width": 1284, "height": 1700, "sourceRow": 97}, {"id": "A-31", "category": "经典艺术档案", "title": "《告白》", "original": "A Declaration", "author": "Lawrence Alma-Tadema", "year": "19世纪末", "weather": "蓝灰天空下，柔和日光落在白色弧形座台与近坐的人物之间。身体已经靠近，气氛却像仍停在欲言又止的瞬间。", "material": "作品创作于19世纪末。石质栏台与座椅将人物围在厚重的建筑边界内，带出传统石作的尺度感。", "self": "", "other": "", "image": "assets/1e3f0a47025014203fe07b69.jpg", "width": 1784, "height": 814, "sourceRow": 98}, {"id": "L-31", "category": "文学意象", "title": "《太阳照常升起》", "original": "The Sun Also Rises", "author": "Ernest Hemingway", "year": "1926", "weather": "晴朗海滨的意象被黄色门框框住，餐桌面向蓝海。明亮色彩让停留带着度假的轻快，像日常事务暂时退到了门后。", "material": "原作年代为1926年。咖啡馆露台、酒店窗台和节庆街道构成漂泊者的日常，半开放空间连接饮酒社交与城市观看。", "self": "", "other": "", "image": "assets/8ca8b94a6fdb051b3cf8506a.jpg", "width": 736, "height": 977, "sourceRow": 99}, {"id": "A-32", "category": "经典艺术档案", "title": "《从特罗卡德罗眺望巴黎》", "original": "View of Paris from the Trocadéro", "author": "Berthe Morisot", "year": "1872", "weather": "灰蓝色云天覆盖城市，近处的人物共同面对开阔视野。远望没有使人彼此分离，反而成为安静陪伴的一种方式。", "material": "作品创作于1872年。深色栏杆与土石地面构成眺望城市的前景。", "self": "", "other": "", "image": "assets/83dfb71fa7e1b4ec9ddd6297.jpg", "width": 960, "height": 530, "sourceRow": 100}, {"id": "F-07", "category": "形式灵感", "title": "阳台阴影", "original": "Balcony Shadow", "author": "形式采集", "year": "当代", "weather": "强烈侧光把清晰斜影投在深色墙面上。静止的栏杆因此像留下时间的刻度，让人意识到光线正在缓慢移动。", "material": "这是一则当代建筑图像。栏杆与楼板将自身轮廓投射到墙面和地面，形成不断随时间移动的线性构图。", "self": "", "other": "", "image": "assets/51c69a6c7c9fb1007db789c0.jpg", "width": 1350, "height": 1800, "sourceRow": 101}, {"id": "L-32", "category": "文学意象", "title": "《永别了，武器》", "original": "A Farewell to Arms", "author": "Ernest Hemingway", "year": "1929", "weather": "柔和日光照着居住外廊与晾衣的人，普通家务进入外部视野。私人生活因此变得可见，带着未经修饰的日常感。", "material": "原作年代为1929年。酒店与疗养地的阳台、露台提供短暂私人时刻，与战争环境形成强烈对照。", "self": "", "other": "", "image": "assets/1d8e708dad82196369ddef85.jpg", "width": 828, "height": 1006, "sourceRow": 102}, {"id": "A-33", "category": "经典艺术档案", "title": "《帕尔米耶里圆亭》", "original": "Rotonda di Palmieri", "author": "Giovanni Fattori", "year": "1866", "weather": "强光照亮海面，横切画面的遮棚在近处留出阴凉。空间像一处短暂停靠，让身体从烈日中退开。", "material": "作品创作于1866年。织物遮棚由细支柱撑起，让露台获得轻巧的阴影。", "self": "", "other": "", "image": "assets/ccaeadfaa86b0bbcf15d1a91.jpg", "width": 960, "height": 330, "sourceRow": 103}, {"id": "S-58", "category": "社会素材", "title": "医院康复阳台", "original": "Hospital Healing Balconies", "author": "医疗建筑", "year": "当代", "weather": "黄昏暖光中，输液架与城市远景相对。近处的身体处境与远方仍在继续的生活并置，带来康复中的等待。", "material": "当代生活场景。病房外的露台或阳台提供自然光、空气和短暂户外活动，被用于改善长期住院者的环境体验。", "self": "", "other": "", "image": "assets/f70c6094248d246d9cae2816.jpg", "width": 675, "height": 1200, "sourceRow": 104}, {"id": "L-33", "category": "文学意象", "title": "《美丽与毁灭》", "original": "The Beautiful and Damned", "author": "F. Scott Fitzgerald", "year": "1922", "weather": "平面插画把彩色窗框、花箱与各自独立的人物排在一起，天气并不确定。相邻生活既接近又分开，带着城市日常的漂浮感。", "material": "原作年代为1922年。金属栏杆、百叶窗与花箱在配图中围出小小的居住边缘，延续铁艺护栏与木作遮阳并用的传统。", "self": "", "other": "", "image": "assets/a1beda165cabfacb235c9cfc.jpg", "width": 1080, "height": 1349, "sourceRow": 105}, {"id": "F-08", "category": "形式灵感", "title": "植物溢出", "original": "Overgrown Balcony", "author": "形式采集", "year": "当代", "weather": "日间漫射光下，绿叶覆盖墙面，只留下窗洞。建筑像被植物收进其中，让人感到安静的包围。", "material": "这是一则当代建筑图像。植物越过金属栏杆与玻璃窗生长，显示日常栽种逐渐改变建筑边界的过程。", "self": "", "other": "", "image": "assets/21ea72873947ceec2728f83b.jpg", "width": 1200, "height": 1800, "sourceRow": 106}, {"id": "A-34", "category": "经典艺术档案", "title": "《阿尔及尔露台上吸水烟的女人》", "original": "Woman Smoking a Shisha on a Terrace in Algiers", "author": "Léon Cauvy", "year": "约1900", "weather": "海滨日光下，繁复色彩包围着休憩的人物，远景仍保持开阔。停留在近处观看远方，形成一种悠闲的旁观姿态。", "material": "作品创作于约1900年。铺砖、矮墙与织物围出露台生活，留下砌筑、烧制陶材与织造相互配合的线索。", "self": "", "other": "", "image": "assets/18ee7342728854481f8904f8.jpg", "width": 1184, "height": 1800, "sourceRow": 107}, {"id": "L-34", "category": "文学意象", "title": "《有产业的人》", "original": "The Man of Property", "author": "John Galsworthy", "year": "1906", "weather": "暖色日光中，人物倚在栏边，身后的百叶仍然合起。向外停留的姿态因此带着限制，像被熟悉的规矩包围。", "material": "原作年代为1906年。花饰金属栏杆与遮阳构件共同组织边界，体现家庭财产观念；人物在室内外转换中显露阶层和控制关系。", "self": "", "other": "", "image": "assets/7f0bc969aa59569dd256e9ea.jpg", "width": 714, "height": 1024, "sourceRow": 108}, {"id": "A-35", "category": "经典艺术档案", "title": "《午睡》", "original": "The Siesta", "author": "Frederick Arthur Bridgman", "year": "19世纪末", "weather": "外部明亮，檐下却保留着暗处，斑驳投影落在卧躺的人物周围。阴凉像一个可以躲进去的角落，让身体安心休息。", "material": "作品创作于19世纪末。木栏、软垫与装饰门框使露台显得细密而柔软，可联系木作与织物共同营造居住空间的传统。", "self": "", "other": "", "image": "assets/65eeacddb13cdfdfa381a706.jpg", "width": 960, "height": 625, "sourceRow": 109}, {"id": "F-09", "category": "形式灵感", "title": "织物 / 晾晒", "original": "Textile / Laundry", "author": "形式采集", "year": "当代", "weather": "晴朗蓝天下，强光照着窄街上方展开的黑白织物。私人生活被晾到公共视野里，柔软的日常跨过建筑边界。", "material": "这是一则当代建筑图像。晾晒织物与空调外机同处金属栏杆之间，让自然干燥和机械制冷两种生活技术并置。", "self": "", "other": "", "image": "assets/8b90f56219fddcd35f31a5c1.jpg", "width": 735, "height": 980, "sourceRow": 110}, {"id": "A-36", "category": "经典艺术档案", "title": "《阿尔罕布拉宫：铁栅庭院》", "original": "Alhambra, Patio de la Reja", "author": "John Singer Sargent", "year": "1879", "weather": "日光穿过庭院树荫，落在喷泉与斑驳墙体上。明暗交错让空间显得幽静，仿佛连回声也被留在院中。", "material": "作品创作于1879年。抹灰砌体与石质水池呈现宫苑中墙、水和庭院的组合，材料更接近传统砌筑与石作的延续。", "self": "", "other": "", "image": "assets/2f6b47b8dd916f1e042bf85f.jpg", "width": 960, "height": 823, "sourceRow": 111}, {"id": "L-35", "category": "文学意象", "title": "《霍华德庄园》", "original": "Howards End", "author": "E. M. Forster", "year": "1910", "weather": "檐下柔和的日光中，家庭人物各自停留。共处没有消除彼此的距离，空间同时容纳着陪伴与隔阂。", "material": "原作年代为1910年。木地板、木百叶与藤椅让配图中的空间显得轻缓，呈现木作与编织适应日常起居的传统。", "self": "", "other": "", "image": "assets/d635db68536dd80b47b2c350.jpg", "width": 800, "height": 551, "sourceRow": 112}, {"id": "F-10", "category": "形式灵感", "title": "透明玻璃阳台", "original": "Transparent Balcony", "author": "形式采集", "year": "当代", "weather": "柔和日光穿过透明栏板，与连续曲面共同勾出建筑边缘。空间显得通透，也让身处其中的暴露感更加明显。", "material": "这是一则当代建筑图像。玻璃栏板与金属边框削弱了阳台的视觉重量，可以联系1959年公布的浮法玻璃工艺及后来玻璃围护的发展。", "self": "", "other": "", "image": "assets/4090478dcad65f0db6887566.jpg", "width": 1200, "height": 1800, "sourceRow": 113}, {"id": "X-5", "category": "戏仿", "title": "汽车后备箱", "original": "Car Trunk", "author": "汽车生活", "year": "现代", "weather": "后备箱原本算私人空间，但当其被打开，便成为了半私人半公共的空间，可以被人看到。", "material": "一打开就把原本隐藏的私人储藏暴露给公共空间。", "self": "", "other": "", "image": "assets/785b12b39056c6858f2e0b37.jpg", "width": 1226, "height": 1359, "sourceRow": 114}, {"id": "A-37", "category": "经典艺术档案", "title": "《弗拉斯卡蒂托洛尼亚别墅喷泉》", "original": "The Fountain, Villa Torlonia, Frascati", "author": "John Singer Sargent", "year": "1907", "weather": "树荫筛下的日光围绕着坐着作画的人，喷水景观成为近旁的背景。停留在这里带着专注，时间也像随观察慢了下来。", "material": "作品创作于1907年。画面细节不足以确认具体历史线索。", "self": "", "other": "", "image": "assets/20bcb980a489b014065eea33.jpg", "width": 960, "height": 1223, "sourceRow": 115}, {"id": "L-36", "category": "文学意象", "title": "《娜娜》", "original": "Nana", "author": "Émile Zola", "year": "1880", "weather": "室内暖色光影包围豪华包厢，视线朝向表演，也彼此交会。观看带上展示自身的意味，欲望在其中显得公开。", "material": "原作年代为1880年。软包、帷幕与装饰栏板包裹着观看空间，", "self": "", "other": "", "image": "assets/f3abf78a0e469ad0ac1ced6b.jpg", "width": 500, "height": 674, "sourceRow": 116}, {"id": "A-38", "category": "经典艺术档案", "title": "《卡普里》", "original": "Capri", "author": "John Singer Sargent", "year": "1878", "weather": "暖色强光照亮浅墙，与屋顶人物身旁的深影形成对照。高处因此既暴露又自由，像暂时离开日常的一小段空隙。", "material": "作品创作于1878年。厚实女儿墙与抹灰墙面围住海边平台，呈现以砌筑和表面抹灰塑造空间的做法。", "self": "", "other": "", "image": "assets/ef516bc75e18ad2695b6e0af.jpg", "width": 960, "height": 663, "sourceRow": 117}, {"id": "F-11", "category": "形式灵感", "title": "波浪楼板｜Aqua Tower", "original": "Aqua Tower Balconies", "author": "Studio Gang｜Chicago", "year": "2009", "weather": "日间漫射光中，白色楼板像等高线一样逐层叠加。细微起伏让重复不再静止，形成有节奏的流动感。", "material": "项目年代为2009年。每一层阳台楼板以不同幅度向外伸展，轮廓连续变化，使原本水平堆叠的高层住宅产生类似地形、波浪和等高线的视觉效果。", "self": "", "other": "", "image": "assets/c6f849ba08e6be0b52acdd49.jpg", "width": 1196, "height": 1800, "sourceRow": 118}, {"id": "L-37", "category": "文学意象", "title": "《故园风雨后》", "original": "Brideshead Revisited", "author": "Evelyn Waugh", "year": "1945", "weather": "室外逆光勾出举杯人物，庄园成为身后的背景。相聚像被留在光线里，带着旧日生活尚未散去的余韵。", "material": "原作年代为1945年。配图中的石质柱体留下古典建筑的形象。", "self": "", "other": "", "image": "assets/8d5073fb512d26312f25ed39.jpg", "width": 400, "height": 300, "sourceRow": 119}, {"id": "A-39", "category": "经典艺术档案", "title": "《马赛康纳比耶尔街阳台上的女人》", "original": "Woman on a Balcony, Looking over Rue Cannebière, Marseille", "author": "Marius Bauer", "year": "1899", "weather": "黑白线描无法确认天气，却清楚留下一个人在高处俯瞰繁密街道的姿态。目光进入城市，身体仍与它保持距离。", "material": "作品创作于1899年。金属栏杆把人物与城市立面叠在一起，可以联系19世纪末街屋中透空护栏的应用。", "self": "", "other": "", "image": "assets/ab09b432c4f5f118407e7d34.jpg", "width": 960, "height": 1202, "sourceRow": 120}, {"id": "F-12", "category": "形式灵感", "title": "尖角三角阳台｜VM Houses", "original": "VM Houses Balconies", "author": "BIG + JDS｜Copenhagen", "year": "2005", "weather": "柔和日光下，尖角平台朝草地伸出。向外探出的形态带来轻快，也让边缘保留一丝紧张。", "material": "项目年代为2005年。大量尖锐的三角形阳台从玻璃立面斜向伸出，方向不断变化。它不依赖普通矩形平台，而通过角度、尖端与斜线制造非常强的节奏。", "self": "", "other": "", "image": "assets/0976d8db987a0cf88e200715.jpg", "width": 1192, "height": 1800, "sourceRow": 121}, {"id": "L-38", "category": "文学意象", "title": "《豹》", "original": "Il Gattopardo / The Leopard", "author": "Giuseppe Tomasi di Lampedusa", "year": "1958", "weather": "晴朗强光下，遮阳篷、雕饰门窗与平台上的交谈构成体面的场景。繁华仍在，气氛却带着缓慢迟暮的意味。", "material": "原作年代为1958年。石质外观的栏台与布篷把厚重建筑和轻巧遮阳并置，可以联系传统砌筑住宅不断附加生活设施的过程。", "self": "", "other": "", "image": "assets/82efce811b32155248f87fea.jpg", "width": 735, "height": 527, "sourceRow": 122}, {"id": "A-40", "category": "经典艺术档案", "title": "《从阳台眺望马赛街道》", "original": "View of a Street in Marseille from a Balcony", "author": "Marius Bauer", "year": "1902", "weather": "云层下的黄绿色低光映着人物剪影与远处树木。画面带有黄昏般的迟缓，让独处显得安静而绵长。", "material": "作品创作于1902年。栏杆仅留下轮廓，街景成为观看的重点。", "self": "", "other": "", "image": "assets/73627ed62f39b0e93e2f1b5d.jpg", "width": 411, "height": 800, "sourceRow": 123}, {"id": "S-09", "category": "社会素材", "title": "邻居跨阳台聊天", "original": "Neighbours Talking across Balconies", "author": "邻里生活素材", "year": "当代", "weather": "日间漫射光中，上下阳台的人朝外交流。不同高度保留着各自空间，也让亲近可以在适当距离里发生。", "material": "当代生活场景。玻璃栏板嵌入金属扶手之间，让相邻住户在通透边界上相遇。", "self": "", "other": "", "image": "assets/f631100874636466cc56a077.jpg", "width": 1800, "height": 1800, "sourceRow": 124}, {"id": "X-2", "category": "戏仿", "title": "朋友圈", "original": "WeChat Moments", "author": "微信 / 社交媒体", "year": "现代", "weather": "人们将私人图片放入公共平台对外展示，是向外的。", "material": "把私人生活伸到熟人社会的公共界面上，形成数字阳台。", "self": "", "other": "", "image": "assets/c76cef532c7fd025c3579e8d.jpg", "width": 1179, "height": 866, "sourceRow": 125}, {"id": "A-41", "category": "经典艺术档案", "title": "《阳台上眺望尼罗河的人物》", "original": "Figure on a Balcony, Looking over the Nile", "author": "Marius Bauer", "year": "1919", "weather": "平静湖面映着暮色般的低角度光线，两个人分开站立。彼此没有交谈的动作，却仍构成一种沉默的相伴。", "material": "作品创作于1919年。人物背对观者面向河景，阳台成为静止身体与辽阔景观之间的观察平台。", "self": "", "other": "", "image": "assets/9cb89f9ac36ca6c17f476fac.jpg", "width": 1199, "height": 794, "sourceRow": 126}, {"id": "F-13", "category": "形式灵感", "title": "建筑巨型孔洞｜Mirador Building", "original": "Mirador Building", "author": "MVRDV + Blanca Lleó｜Madrid", "year": "2005", "weather": "晴朗深蓝天空衬着巨型开洞与细小窗格。尺度的强烈对照使建筑显得庞大，让人感到个体面对巨构时的距离。", "material": "项目年代为2005年。巨大的矩形空洞直接切开住宅体量，让建筑中央形成一个远距离可见的共同开放空间。可以把它理解成普通阳台被放大到城市尺度后的形式。", "self": "", "other": "", "image": "assets/439014e0d36b078ff96fe5e6.jpg", "width": 1800, "height": 1200, "sourceRow": 127}, {"id": "L-39", "category": "文学意象", "title": "《天才雷普利》", "original": "The Talented Mr. Ripley", "author": "Patricia Highsmith", "year": "1955", "weather": "海边斑驳日光照着围桌的三个人，明亮海面让场景显得轻松。漂亮的表面之下，相处仍带着彼此试探的距离。", "material": "原作年代为1955年。抹灰墙面与户外桌椅营造出意大利酒店海边露台。", "self": "", "other": "", "image": "assets/690c4cbdf900e49774cb63f4.jpg", "width": 1000, "height": 562, "sourceRow": 128}, {"id": "A-42", "category": "经典艺术档案", "title": "《乌得勒支阳台上的蒂娜与两位朋友》", "original": "Tine and Two Friends on the Balcony, Utrecht", "author": "Jacob Olie Jr.", "year": "1910–1914", "weather": "室外漫射光让黑白照片的明暗显得柔和，三个人近距离站在一起。相邻的姿态带来朋友之间无需刻意安排的自在。", "material": "作品创作于1910—1914年。细金属栏杆与门窗构成窄小的住宅边界，可以看见20世纪初生活空间对金属构件的沿用。", "self": "", "other": "", "image": "assets/384caea2a2979dc46ef53155.jpg", "width": 474, "height": 630, "sourceRow": 129}, {"id": "L-40", "category": "文学意象", "title": "《英国病人》", "original": "The English Patient", "author": "Michael Ondaatje", "year": "1992", "weather": "暖色日光照亮剥落墙面与绿色百叶，一个人停在小阳台上。损伤没有被遮去，反而让停留显得安静而真实。", "material": "原作年代为1992年。金属曲栏、木百叶与抹灰砌体共同组成配图中的旧式住宅，留下铁艺、木作与砌筑长期并存的线索。", "self": "", "other": "", "image": "assets/924c228a7b5290546d634afe.jpg", "width": 736, "height": 414, "sourceRow": 130}, {"id": "F-14", "category": "形式灵感", "title": "连续坡道式外缘｜8 House", "original": "8 House", "author": "BIG｜Copenhagen", "year": "2010", "weather": "多云的白日里，斜坡住宅映入水面。起伏的建筑与倒影延续了视线，带来在城市中缓慢漫游的感觉。", "material": "项目年代为2010年。金属栏杆、玻璃与坡面铺装把住宅边缘连成路径，让阳台获得街道般的连续性。", "self": "", "other": "", "image": "assets/1b469a1dde742fd9961d1627.jpg", "width": 1800, "height": 1200, "sourceRow": 131}, {"id": "A-43", "category": "经典艺术档案", "title": "《阳台上的花魁》", "original": "Courtesan on a Balcony", "author": "Chōkōsai Eishō", "year": "1793–1797", "weather": "浅色背景没有交代天气，装饰性服饰、红色灯具与水平廊栏成为视觉重点。人物处于展示之中，气氛带着面向外界的期待。", "material": "作品创作于1793—1797年。木廊、木栏与纸灯笼共同形成街边界面，可联系江户时期木构城市中的木作和纸艺传统。", "self": "", "other": "", "image": "assets/c9c2fc9e35247959d3945eb0.jpg", "width": 1112, "height": 1600, "sourceRow": 132}, {"id": "L-41", "category": "文学意象", "title": "《请以你的名字呼唤我》", "original": "Call Me by Your Name", "author": "André Aciman", "year": "2007", "weather": "日间树影落在小阳台周围，独自停留的人物被斑驳光线包围。画面像保留着尚未发生的事情，带着夏日般的期待。", "material": "原作年代为2007年。配图里的花饰金属栏杆落在石质托台上，抹灰墙面则延续街屋的厚重感。", "self": "", "other": "", "image": "assets/16fea318064c40e07986e9eb.jpg", "width": 736, "height": 414, "sourceRow": 133}, {"id": "F-15", "category": "形式灵感", "title": "悬挂盒体｜WoZoCo", "original": "WoZoCo", "author": "MVRDV｜Amsterdam", "year": "1997", "weather": "日间薄云下，大体块从建筑中悬出，彩色小阳台点缀其间。不同尺度相互牵动，让失衡感也带着轻松趣味。", "material": "项目年代为1997年。突出的住宅盒体与金属、玻璃栏板相互叠加，让阳台成为扩大居住空间的办法。", "self": "", "other": "", "image": "assets/169df26fb487d1039b18899c.jpg", "width": 1800, "height": 1310, "sourceRow": 134}, {"id": "A-44", "category": "经典艺术档案", "title": "《望远镜》", "original": "The Telescope", "author": "Ogata Gekkō", "year": "1887–1896", "weather": "日间浅色天空向远处展开，望远镜把人物的视线继续向外延伸。观看由停留变成探索，带着清晰的好奇。", "material": "作品创作于1887—1896年。格栏旁的望远镜让阳台成为观看远方的装置，建筑木作与光学器具在这里相遇。", "self": "", "other": "", "image": "assets/27f581d29718678f7a7ab40b.jpg", "width": 736, "height": 736, "sourceRow": 135}, {"id": "S-39", "category": "社会素材", "title": "阳台卫星天线", "original": "Satellite Dishes on Balconies", "author": "全球城市住宅", "year": "1990年代至今", "weather": "日间漫射光中，大量圆盘天线附着在住宅外部。私人空间像伸出许多朝向远方的耳朵，带着接收外面世界的意味。", "material": "事件或场景年代为1990年代至今。碟形天线通过金属支架附着在住宅外缘，把阳台接入卫星传播网络。它可追溯到20世纪后半叶通信卫星的发展，记录的是接收设备进入家庭后的生活阶段。", "self": "", "other": "", "image": "assets/3fd52523ea8db719244562d9.jpg", "width": 960, "height": 720, "sourceRow": 136}, {"id": "L-42", "category": "文学意象", "title": "《三个火枪手》", "original": "The Three Musketeers", "author": "Alexandre Dumas", "year": "1844", "weather": "黑白画面没有交代天气，跨越栏板的动作成为视觉中心。身体试图离开既定边界，让画面充满冒险与逃离的意味。", "material": "原作年代为1844年。配图以雕饰栏板再现历史居所，但石质外观也可能来自布景或仿制。画面细节不足以确认具体历史线索。", "self": "", "other": "", "image": "assets/7bbed5463953a68b79921b67.jpg", "width": 500, "height": 607, "sourceRow": 137}, {"id": "A-45", "category": "经典艺术档案", "title": "《湖畔阳台上的三位女性》", "original": "Three Women on a Balcony, Looking over a Lake", "author": "Anonymous, Japan", "year": "约1890–1903", "weather": "浅色背景中，三位女性并置，细密服饰线条让画面显得安静而有秩序。天气没有被交代，共同停留成为这一刻的重心。", "material": "作品创作于约1890—1903年。木廊、格栏与纸灯笼围出临水空间，保留日本传统木作住宅轻巧分隔的形象。", "self": "", "other": "", "image": "assets/1be5e0fb0b72241d0353343f.jpg", "width": 499, "height": 750, "sourceRow": 138}, {"id": "F-16", "category": "形式灵感", "title": "模块堆叠露台｜Habitat 67", "original": "Habitat 67", "author": "Moshe Safdie｜Montreal", "year": "1967", "weather": "晴间有云的天空下，混凝土盒体错落叠起，像一座由居住单元构成的山。家因此获得地形般的层次与探索感。", "material": "项目年代为1967年。预制混凝土盒体错落堆叠，下层屋顶成为上层露台。构件先制作、再由起重设备装配，把战后住宅工业化的设想变成可居住的立体街区，也让花园进入高密度住宅。", "self": "", "other": "", "image": "assets/0e473edd2d8ae189bc277bb0.jpg", "width": 1200, "height": 1800, "sourceRow": 139}, {"id": "L-43", "category": "文学意象", "title": "《玻璃动物园》", "original": "The Glass Menagerie", "author": "Tennessee Williams", "year": "1944", "weather": "舞台暗光把金属楼梯与室内场景并置，这种明暗不代表真实天气。出口近在旁边，却让想要离开的愿望更显压抑。", "material": "原作年代为1944年。配图中的金属梯与栏杆把住宅边缘变成上下通行的路径，可联系城市外置楼梯与逃生设施的历史。", "self": "", "other": "", "image": "assets/1d8957e5b523c8f1bb577226.jpg", "width": 1000, "height": 667, "sourceRow": 140}, {"id": "A-46", "category": "经典艺术档案", "title": "《巴黎博览会上的女士》", "original": "Lady at the Paris Exposition", "author": "Luis Jiménez Aranda", "year": "1889", "weather": "明亮日光把高处人物、城市与远景铁塔放在同一视野里。公开场合中的站姿因此显得清晰，带着面向他人的自信。", "material": "作品创作于1889年。装饰栏杆与金属椅背之后出现铁塔，把日常休憩与1889年巴黎博览会的工程景观连在一起。", "self": "", "other": "", "image": "assets/30f4352493c9b0e0a90d8864.jpg", "width": 960, "height": 1683, "sourceRow": 141}, {"id": "F-17", "category": "形式灵感", "title": "深凹阳台网格｜Unité d’Habitation", "original": "Unité d’Habitation, Marseille", "author": "Le Corbusier｜Marseille", "year": "1952", "weather": "晴间有云的白日里，深凹网格与彩色侧壁交替出现。重复框架容纳细小差别，让集体之中的个人位置显得可辨。", "material": "项目年代为1952年。混凝土网格把深凹阳台和遮阳边界连成整体，彩色侧墙点出单元差异。它属于战后集体住宅的探索，钢筋混凝土从承重技术进一步成为组织共同生活的空间语言。", "self": "", "other": "", "image": "assets/3a562e015a4c6275616fca55.jpg", "width": 736, "height": 920, "sourceRow": 142}, {"id": "A-47", "category": "经典艺术档案", "title": "《那不勒斯湾前的卡罗琳·缪拉》", "original": "Caroline Murat before the Bay of Naples", "author": "François Gérard", "year": "约1810", "weather": "暗云作为背景意象，衬出盛装人物与辽远海景，而非记录实际天气。空间显得庄严，也在人物与观看者之间拉开距离。", "material": "作品创作于约1810年。画面只显露椅背或栏台的局部，画面细节不足以确认具体历史线索。", "self": "", "other": "", "image": "assets/ab3b7872c0de4b1be0a88b24.jpg", "width": 960, "height": 1198, "sourceRow": 143}, {"id": "L-44", "category": "文学意象", "title": "《巴黎圣母院》", "original": "Notre-Dame de Paris", "author": "Victor Hugo", "year": "1831", "weather": "晴间有云的天空下，巨大的石质立面从仰视角度升起。建筑显得崇高，观看者也因此感到自身的渺小。", "material": "原作年代为1831年。配图中的石雕、拱券与柱廊指向中世纪石作建筑的传统，也呼应原作对历史城市的回望。", "self": "", "other": "", "image": "assets/bad7e65ea9af407cd6bf87d0.jpg", "width": 960, "height": 640, "sourceRow": 144}, {"id": "A-48", "category": "经典艺术档案", "title": "《阳台上的威尼斯人》", "original": "Venetians at the Balcony", "author": "Eugen von Blaas", "year": "约1900", "weather": "两个人在阴影里交谈，墙边植物进一步收拢了空间。声音仿佛也随之放轻，留下近距离耳语般的亲密。", "material": "作品创作于约1900年。砖墙、石质压顶与植物构成朴素边界，呈现砌砖和石作各自承担墙身与顶部保护的方式。", "self": "", "other": "", "image": "assets/7081ef6cbb3c41ba520f1b09.jpg", "width": 960, "height": 1282, "sourceRow": 145}, {"id": "F-18", "category": "形式灵感", "title": "垂直森林阳台｜Bosco Verticale", "original": "Bosco Verticale", "author": "Stefano Boeri Architetti｜Milan", "year": "2014", "weather": "明亮日光中，树木从层叠阳台向外生长。建筑与枝叶相互遮映，像把居住安放在树冠之间。", "material": "项目年代为2014年。混凝土阳台承托树木和种植容器，使绿化成为建筑设计的一部分。它将现代承重结构与灌溉、植物维护结合，呈现21世纪住宅从摆放盆栽走向系统种植的尝试。", "self": "", "other": "", "image": "assets/9ac8ce369f20f2175ae24863.jpg", "width": 1079, "height": 1800, "sourceRow": 146}, {"id": "L-45", "category": "文学意象", "title": "《樱桃园》", "original": "The Cherry Orchard", "author": "Anton Chekhov", "year": "1904", "weather": "黑白照片中，灰白天空覆盖着茂密园林，房屋藏在树木之后。安静像被层层遮住，也让人想到即将失去的生活。", "material": "原作年代为1904年。贵族站在屋内外之间谈论即将失去的土地和生活方式。", "self": "", "other": "", "image": "assets/8f3609f873295697d9a3d4df.jpg", "width": 960, "height": 661, "sourceRow": 147}, {"id": "S-10", "category": "社会素材", "title": "阳台自拍 / 社交媒体", "original": "Balcony Selfie / Social Media", "author": "网络生活素材", "year": "当代", "weather": "低角度暖光照着临栏人物，城市在身后延伸。停留的姿态面向外部，让私人片刻带上愿意被看见的意味。", "material": "当代生活场景。金属栏杆与抹灰墙构成自拍的背景。", "self": "", "other": "", "image": "assets/813c86fe6f48a012a50e031c.jpg", "width": 1210, "height": 1800, "sourceRow": 148}, {"id": "A-49", "category": "经典艺术档案", "title": "《在蔚蓝爱奥尼亚天空之下》", "original": "Under the Roof of Blue Ionian Weather", "author": "Lawrence Alma-Tadema", "year": "1901", "weather": "晴朗的蓝色海天映衬浅色弧形石台，人物安静闲坐。开阔与停留相互平衡，形成没有催促的闲暇。", "material": "作品创作于1901年。石质座台与铺地承接古典生活的想象，也让传统石作成为历史气氛的一部分。", "self": "", "other": "", "image": "assets/e8e9b3683a7054876a96cf96.jpg", "width": 960, "height": 402, "sourceRow": 149}, {"id": "L-46", "category": "文学意象", "title": "《悲惨世界》", "original": "Les Misérables", "author": "Victor Hugo", "year": "1862", "weather": "黑白画面没有交代天气，上层围观者与下方人群形成垂直联系。不同位置的目光聚在一起，让公共事件带着紧张感。", "material": "原作年代为1862年。金属花栏贴着砌体立面展开，可联系19世纪街屋里装饰铁件与传统墙体并用的做法。", "self": "", "other": "", "image": "assets/d60206f6a6c582b63b03af49.jpg", "width": 720, "height": 960, "sourceRow": 150}, {"id": "F-19", "category": "形式灵感", "title": "树枝式悬挑阳台｜L’Arbre Blanc", "original": "L’Arbre Blanc", "author": "Sou Fujimoto + Nicolas Laisné + OXO｜Montpellier", "year": "2019", "weather": "晴朗浅蓝天空下，白色深阳台向四周伸展。建筑边缘显得轻盈而开放，带着向外展开的自由。", "material": "项目年代为2019年。白色平台与金属栏杆向四周伸展，把户外起居推到塔体之外。", "self": "", "other": "", "image": "assets/645670e40a85970ab0500496.jpg", "width": 736, "height": 1104, "sourceRow": 151}, {"id": "A-50", "category": "经典艺术档案", "title": "《阳台上的女人》", "original": "Femme au balcon", "author": "Henri Lebasque", "year": "约1920", "weather": "黄紫色天空与鲜艳色块分割着人物和栏杆，这些光色并非气象实录。独处因此不显沉寂，反而带着跳动的活力。", "material": "作品创作于约1920年。细栏杆与平台在人物周围留下简略轮廓。", "self": "", "other": "", "image": "assets/56976cee711cdd6c5ff454ef.jpg", "width": 900, "height": 700, "sourceRow": 152}, {"id": "L-47", "category": "文学意象", "title": "《基督山伯爵》", "original": "The Count of Monte Cristo", "author": "Alexandre Dumas", "year": "1844–1846", "weather": "黄绿色低光与云层笼罩着靠近的两个人，远景模糊不清。外部世界仿佛暂时退开，留下秘密相会的气氛。", "material": "原作年代为1844—1846年。马赛、巴黎与地中海宅邸的阳台和露台频繁出现在插图传统中，常用于等待、监视和秘密会面。", "self": "", "other": "", "image": "assets/193c4c16dbafb6677870ff73.jpg", "width": 1023, "height": 1260, "sourceRow": 153}, {"id": "A-51", "category": "经典艺术档案", "title": "《特拉华水峡谷的阳台》", "original": "Balcony, Delaware Water Gap", "author": "Louis Michel Eilshemius", "year": "约1905", "weather": "柔和日光照着远处河谷，屋檐与木栏把景色框在近旁。向外远望时仍能感到遮蔽，开阔中带着受庇护的安稳。", "material": "作品创作于约1905年。木柱、木栏与屋檐连成完整外廊，可联系北美住宅的木门廊传统。", "self": "", "other": "", "image": "assets/341e74e4af4deee70c554d07.jpg", "width": 960, "height": 1325, "sourceRow": 154}, {"id": "F-20", "category": "形式灵感", "title": "圆筒错位阳台｜Torres Blancas", "original": "Torres Blancas", "author": "Francisco Javier Sáenz de Oiza｜Madrid", "year": "1968", "weather": "日间漫射光照着圆筒墙体与厚重弧形平台。围合感带来庇护，密集体量又形成压迫，两种感受同时存在。", "material": "项目年代为1968年。清水混凝土沿圆形边缘展开，金属栏杆随之转折。它呈现20世纪混凝土成形技术服务有机建筑的可能，模板塑造的曲面让现代住宅摆脱单一的直角网格。", "self": "", "other": "", "image": "assets/678d6ffd4e5547039f23e299.jpg", "width": 735, "height": 490, "sourceRow": 155}, {"id": "A-52", "category": "经典艺术档案", "title": "《眺望那不勒斯湾的阳台与古物》", "original": "Antiquities by a Balcony Overlooking the Gulf of Naples", "author": "Carl Wilhelm Götzloff", "year": "19世纪", "weather": "日间漫射光把室内古物与远处海湾连在一起。近处的陈设和远景共同放慢目光，带来收藏者独有的安静。", "material": "作品创作于19世纪。帘幕与古物把平台布置成回望历史的场景。", "self": "", "other": "", "image": "assets/8b52d8d6f36700d52218742e.jpg", "width": 960, "height": 1293, "sourceRow": 156}, {"id": "L-48", "category": "文学意象", "title": "《海达·高布乐》", "original": "Hedda Gabler", "author": "Henrik Ibsen", "year": "1891", "weather": "低照度舞台灯光中，人物停在高处入口，交错楼梯围绕其间。光线并非天气线索，却把生活难以脱身的感觉显露出来。", "material": "原作年代为1891年。配图的舞台装置用木栏、檐瓦和抹灰外观搭起居所。", "self": "", "other": "", "image": "assets/2d20f6e00a51cebdddc7428f.jpg", "width": 720, "height": 540, "sourceRow": 157}, {"id": "F-21", "category": "形式灵感", "title": "迷宫式露台｜Walden 7", "original": "Walden 7", "author": "Ricardo Bofill Taller de Arquitectura｜Barcelona", "year": "1975", "weather": "强烈日光落在红青色墙体、楼梯与孔洞之间。明暗和色彩不断转换，空间像一座等待探索的迷宫。", "material": "项目年代为1975年。涂色墙面、楼梯与金属栏杆组成层层相通的平台，可联系20世纪集体住宅对立体邻里关系的探索。", "self": "", "other": "", "image": "assets/dca9dc4e5ff9c0847825b887.jpg", "width": 736, "height": 981, "sourceRow": 158}, {"id": "A-53", "category": "经典艺术档案", "title": "《观景台》", "original": "The Belvedere", "author": "John William Godward", "year": "1913", "weather": "晴朗海边的日光照着白色雕饰栏台，一个人依靠其上望向远处。明亮并未消解等待，反而让那份期待更清晰。", "material": "作品创作于1913年。石质栏台与织物构成观景的前景，延续古典露台以实体边界组织视线的形式。", "self": "", "other": "", "image": "assets/13c6e81aabb1d0bafc47b63c.jpg", "width": 960, "height": 1302, "sourceRow": 159}, {"id": "L-49", "category": "文学意象", "title": "《不可儿戏》", "original": "The Importance of Being Earnest", "author": "Oscar Wilde", "year": "1895", "weather": "室内暖光映着偏暗的外部，多个人靠近栏边交谈。明暗之间的相聚带着轻快，像一场彼此试探身份的游戏。", "material": "原作年代为1895年。花饰金属栏杆与木框玻璃门构成配图中的内外边界，延续铁艺和门窗木作共同塑造住宅立面的传统。", "self": "", "other": "", "image": "assets/d541bc4eafbed1d0a07a5665.jpg", "width": 1080, "height": 1350, "sourceRow": 160}, {"id": "S-41", "category": "社会素材", "title": "阳台光伏电站", "original": "Balcony Solar Power / Balkonkraftwerk", "author": "德国及欧洲", "year": "2020年代", "weather": "晴朗日光照着栏杆外侧的深色面板，原本的居住边缘多了一层新的用途。画面带着主动参与能源生活的积极意味。", "material": "事件或场景年代为2020年代。光伏板与金属框架让住宅边缘参与发电，可联系1954年实用硅太阳能电池问世后光伏技术的发展。", "self": "", "other": "", "image": "assets/b9b54f46c8e73cc129f9dc6d.jpg", "width": 960, "height": 540, "sourceRow": 161}, {"id": "A-54", "category": "经典艺术档案", "title": "《茶桌旁》", "original": "At the Tea-Table", "author": "Konstantin Korovin", "year": "1888", "weather": "花园的暖色日光围绕着茶桌、交谈人物与密集植物。相处被安放在一处柔和角落，带着午后般的亲近。", "material": "作品创作于1888年。椅子、桌布和杯具承担了画面的生活细节，阳台本身未留下足够构造信息。画面细节不足以确认具体历史线索。", "self": "", "other": "", "image": "assets/22e5a7b8afe192576c893143.jpg", "width": 800, "height": 668, "sourceRow": 162}, {"id": "F-22", "category": "形式灵感", "title": "花瓣形阳台塔｜Marina City", "original": "Marina City", "author": "Bertrand Goldberg｜Chicago", "year": "1964–1968", "weather": "日间明暗交错，汽车停在连续重复的弧形平台之间。形体与使用叠在一起，让建筑呈现城市机器般的秩序。", "material": "项目年代为1964—1968年。每层连续半圆阳台使住宅塔像玉米芯，重复单元通过弧线产生强烈雕塑感。", "self": "", "other": "", "image": "assets/ef387f80e1711291e594caee.jpg", "width": 960, "height": 640, "sourceRow": 163}, {"id": "A-55", "category": "经典艺术档案", "title": "《生活的魅力（音乐聚会）》", "original": "Les Charmes de la Vie (The Music Party)", "author": "Jean-Antoine Watteau", "year": "约1718", "weather": "明亮而有云的天空下，音乐、坐卧的人群与古典柱廊共同展开。聚会显得轻盈，人与人之间的相处也较为松弛。", "material": "作品创作于约1718年。石质柱体与平台为音乐聚会搭起背景，可联系18世纪欧洲园林延续古典柱廊的审美。", "self": "", "other": "", "image": "assets/04731fcea45e58128e88a2bc.jpg", "width": 960, "height": 695, "sourceRow": 164}, {"id": "F-23", "category": "形式灵感", "title": "粗野主义悬挑阳台｜Barbican Estate", "original": "Barbican Estate", "author": "Chamberlin, Powell and Bon｜London", "year": "1965–1976", "weather": "柔和日光下，粗糙水平带与红色门板相互映衬。厚重建筑仍显露日常尺度，让生活在坚实框架中保持可见。", "material": "项目年代为1965—1976年。粗糙混凝土栏板与玻璃门窗形成厚重阴影，呈现战后粗野主义对结构和材料表面的重视。混凝土在这里既承托空间，也成为建筑外观，不必另加传统石质装饰。", "self": "", "other": "", "image": "assets/5c7320acc0e5b9da9c803993.jpg", "width": 800, "height": 1192, "sourceRow": 165}, {"id": "S-56", "category": "社会素材", "title": "酒店阳台旅游照", "original": "Hotel Balcony Tourism Photography", "author": "旅游文化", "year": "当代", "weather": "多云或漫射日光照着红色街屋、车辆与连续外廊。丰富的街景层次引导目光向外，带着旅途中观察陌生生活的好奇。", "material": "当代生活场景。旅行者把酒店阳台视为拍摄海景、城市景观和早餐照片的重要背景，私人住宿空间被转化为社交媒体图像。", "self": "", "other": "", "image": "assets/566e80fb15d7cbb081a2ffca.jpg", "width": 960, "height": 640, "sourceRow": 166}, {"id": "X-3", "category": "戏仿", "title": "社交主页", "original": "Social Media Profile", "author": "社交媒体", "year": "现代", "weather": "相比于朋友圈，社交平台的主页更加对外，是陌生人了解你的方式之一，是对外展示自我的平台。", "material": "把个人身份长期陈列在公共视线中，像一块不会收回的阳台。", "self": "", "other": "", "image": "assets/052b25bae99e021ac175cf99.jpg", "width": 945, "height": 1507, "sourceRow": 167}, {"id": "A-56", "category": "经典艺术档案", "title": "《忠诚的女管家》", "original": "The Alarm, or the Gouvernante Fidèle", "author": "Jean François de Troy", "year": "1723", "weather": "画面前暗后亮，倚靠的人物与花园露台形成若隐若现的关系。天气无法确定，暧昧与窥视的意味却在光差中浮现。", "material": "作品创作于1723年。瓶形栏台与垂落织物构成庭园边界，延续古典建筑中重复栏柱的秩序。", "self": "", "other": "", "image": "assets/42f77465898cf5ec0f736f99.jpg", "width": 960, "height": 1152, "sourceRow": 168}, {"id": "F-24", "category": "形式灵感", "title": "巨型框景平台｜Parkrand", "original": "Parkrand", "author": "MVRDV｜Amsterdam", "year": "2006", "weather": "晴朗日光中，巨大门洞框住内部庭院。庞大体量围合出一处较安静的空间，带来被建筑庇护的感受。", "material": "项目年代为2006年。混凝土体量与玻璃围护框出巨大的共享平台，把住宅之间的空隙放大到城市尺度。", "self": "", "other": "", "image": "assets/276b705250a136868f396214.jpg", "width": 640, "height": 480, "sourceRow": 169}, {"id": "A-57", "category": "经典艺术档案", "title": "《威尼斯节日》", "original": "Festival Day, Venice", "author": "Eugen von Blaas", "year": "约1900", "weather": "盛装人物立在厚重帷幕与前景栏台之间，天气没有进入画面。空间像一处节庆展示台，强调被他人看见的时刻。", "material": "作品创作于约1900年。石质栏台、帷幕与地毯将建筑转为节庆舞台，呈现长期建筑构件与临时织物装饰的叠合。", "self": "", "other": "", "image": "assets/0fcb06d657e5b2d08b59c265.jpg", "width": 960, "height": 640, "sourceRow": 170}, {"id": "S-42", "category": "社会素材", "title": "阳台雨水收集", "original": "Balcony Rainwater Harvesting", "author": "生态住宅实践", "year": "当代", "weather": "有云的白日天空下，雨棚与导水构件叠在高楼背景前。画面让人想到留住流走的水，也带出对日常资源的细致关注。", "material": "当代生活场景。小型水桶、导管和储水容器把屋檐或阳台降水转化为植物灌溉用水，体现微型循环系统。", "self": "", "other": "", "image": "assets/c3fadfd30a5f3a1b5c95f475.jpg", "width": 960, "height": 1440, "sourceRow": 171}, {"id": "A-58", "category": "经典艺术档案", "title": "《曼陀林演奏者》", "original": "The Mandolinist", "author": "Eugen von Blaas", "year": "约1900", "weather": "日间树荫下，垂落绿叶围绕着听奏的三个人。音乐把小范围的相聚连在一起，形成不必向外张扬的欢愉。", "material": "作品创作于约1900年。砖石矮墙与栏杆围住演奏者，保留传统砌筑空间的厚度和尺度。", "self": "", "other": "", "image": "assets/4e1f031bda403faa0cd589b0.jpg", "width": 960, "height": 721, "sourceRow": 172}, {"id": "F-25", "category": "形式灵感", "title": "连桥式阳台｜Balfron Tower", "original": "Balfron Tower", "author": "Ernő Goldfinger｜London", "year": "1967", "weather": "深蓝晴空下，住宅网格与独立高塔并列。重复单元与垂直体量拉开尺度，让观看带着难以靠近的距离。", "material": "项目年代为1967年。住宅塔与服务塔通过廊桥连接，外部阳台和交通结构被直接表现为立面语言。它呈现战后住宅将交通与居住分开组织的探索，构造分工成为可见的建筑形象。", "self": "", "other": "", "image": "assets/4c7b31899ae4afa8c5854965.jpg", "width": 750, "height": 1334, "sourceRow": 173}, {"id": "A-59", "category": "经典艺术档案", "title": "《罗马狂欢节》", "original": "A Carnival in Rome", "author": "José Benlliure y Gil", "year": "19世纪末", "weather": "柔和日光中，密集人物、花饰与悬挂织物交织成热闹场面。阳台像被共同活动填满，让观看也带着参与的兴奋。", "material": "作品创作于19世纪末。砌体外墙与栏台披上节庆织物，使耐久建筑成为短暂活动的承托。", "self": "", "other": "", "image": "assets/4ce342c340bff0901d47cfe1.jpg", "width": 960, "height": 675, "sourceRow": 174}, {"id": "F-26", "category": "形式灵感", "title": "连续外廊｜Golden Lane Estate", "original": "Golden Lane Estate", "author": "Chamberlin, Powell and Bon｜London", "year": "1952–1962", "weather": "明亮日光照着白色小阳台和彩色底板。色彩在重复构件间跳动，使整齐立面保留日常的活泼。", "material": "项目年代为1952—1962年。混凝土平台、金属栏杆与彩色面板在立面上重复，工业材料被组合成细密的住宅尺度。它可放在战后重建和集体住房发展的背景中阅读，标准单元也保留日常生活的差异。", "self": "", "other": "", "image": "assets/5aacff6e7537a8a067da7860.jpg", "width": 1200, "height": 1200, "sourceRow": 175}, {"id": "A-60", "category": "经典艺术档案", "title": "《等待火车的爱尔兰移民》", "original": "Irish Emigrants Waiting for a Train", "author": "Erskine Nicol", "year": "1864", "weather": "檐下偏暗，门外明亮，坐等的人物与行李停在光线交界处。空间像一段尚未继续的旅程，带着迁徙中的悬置感。", "material": "作品创作于1864年。木门框、铺地与布包围住等待的人群。", "self": "", "other": "", "image": "assets/11cff214675f6ef128685f54.jpg", "width": 960, "height": 1267, "sourceRow": 176}, {"id": "A-61", "category": "经典艺术档案", "title": "《贝伦加丽亚担忧狮心王理查安危》", "original": "Berengaria's Alarm for the Safety of Her Husband Richard Coeur de Lion", "author": "Charles Allston Collins", "year": "1850", "weather": "画中的蓝天白云映衬历史服饰、拱廊与远景。景色虽然开阔，向外投去的目光却让人读到担忧与牵挂。", "material": "作品创作于1850年。石质拱柱与铺砖营造中世纪的场景，可联系19世纪艺术对历史建筑形式的回望。", "self": "", "other": "", "image": "assets/0cd6358ac7475053ce393841.jpg", "width": 960, "height": 740, "sourceRow": 177}, {"id": "F-27", "category": "形式灵感", "title": "层叠台地住宅｜Alexandra Road Estate", "original": "Alexandra Road Estate", "author": "Neave Brown｜London", "year": "1978", "weather": "明亮白日里，连续退台从两侧围住步行街。居住空间密集相邻，却仍通过开放边缘保持彼此的联系。", "material": "项目年代为1978年。混凝土露台与种植槽随住宅逐层退让，把屋顶变成下一层的户外空间。它延续战后低层高密度住房的探索，材料与剖面共同塑造了一座可居住的人工坡地。", "self": "", "other": "", "image": "assets/41dc3180ce3ec6136f650b6b.jpg", "width": 799, "height": 1200, "sourceRow": 178}, {"id": "S-16", "category": "社会素材", "title": "公共住宅阳台装饰比赛", "original": "Public-Housing Balcony Decoration Competitions", "author": "社区活动", "year": "当代", "weather": "斜射日光落在密集摆放的植物与花盆上。有限空间被细心填满，呈现经营自己小天地的满足。", "material": "当代生活场景。砖墙、金属栏杆、花盆和雨棚层层附加，呈现住宅边缘逐渐被住户改造的过程。", "self": "", "other": "", "image": "assets/ad43bc6123661f34b63642b9.jpg", "width": 1200, "height": 1697, "sourceRow": 179}, {"id": "X-7", "category": "戏仿", "title": "装饰书包", "original": "Decorated Backpack", "author": "青年文化", "year": "现代", "weather": "把喜爱的装饰品挂在书包外部进行展示。", "material": "把个人审美和身份信息挂在身体外部，边走边展示。", "self": "", "other": "", "image": "assets/ff3b1acceea6314368698798.jpg", "width": 1066, "height": 1415, "sourceRow": 180}, {"id": "X-1", "category": "戏仿", "title": "痛包", "original": "Ita Bag", "author": "二次元文化", "year": "现代", "weather": "挎包中间为透明展示框，人们将喜爱的物品放入对外展示。", "material": "把私人兴趣挂到身体外侧，让个人生活像阳台一样被路人看见。", "self": "", "other": "", "image": "assets/e09156e574300d8866ca43e9.jpg", "width": 1179, "height": 1275, "sourceRow": 181}, {"id": "F-28", "category": "形式灵感", "title": "街道在空中｜Robin Hood Gardens", "original": "Robin Hood Gardens", "author": "Alison and Peter Smithson｜London", "year": "1972", "weather": "阴天漫射光中，长廊向远处延伸，门前自行车留下使用的痕迹。空间虽属共同生活的一部分，此刻却显得寂静。", "material": "项目年代为1972年。混凝土楼板把外廊拓宽，金属门窗沿着通道排列，让进入家门的路径带上街道尺度。它属于战后“空中街道”的住宅实验，试图用现代建造回应邻里生活的需要。", "self": "", "other": "", "image": "assets/c6d8458a326fd5d6ce26cfc3.jpg", "width": 962, "height": 609, "sourceRow": 182}, {"id": "F-29", "category": "形式灵感", "title": "空中街道网格｜Park Hill", "original": "Park Hill", "author": "Jack Lynn + Ivor Smith｜Sheffield", "year": "1961", "weather": "晴朗日光把对面彩色立面照亮，廊下则保留深影。行走仿佛穿过明暗交替的网格，让规则空间有了身体的节奏。", "material": "项目年代为1961年。混凝土梁柱撑起连续外廊，门窗与栏板在网格里留下更新的可能。", "self": "", "other": "", "image": "assets/4b98cd5d44c1f4d1f8f8cf4f.jpg", "width": 610, "height": 610, "sourceRow": 183}, {"id": "F-30", "category": "形式灵感", "title": "构成主义阳台｜Narkomfin Building", "original": "Narkomfin Building", "author": "Moisei Ginzburg + Ignaty Milinis｜Moscow", "year": "1930", "weather": "白日蓝天下，白色弧形转角与水平窗带清晰展开。简洁线条配合明亮天光，形成现代生活的明快感。", "material": "项目年代为1930年。横向带窗与平整墙面把住宅组织为连续界面，可联系20世纪早期现代主义的集体生活实验。", "self": "", "other": "", "image": "assets/8b9acefcf2fc8fa18d561c1f.jpg", "width": 736, "height": 1100, "sourceRow": 184}, {"id": "F-31", "category": "形式灵感", "title": "超级街区阳台｜Karl-Marx-Hof", "original": "Karl-Marx-Hof", "author": "Karl Ehn｜Vienna", "year": "1930", "weather": "晴朗蓝天下，对称立面、巨拱与水平阳台形成整体秩序。住宅带上纪念性尺度，也显出公共生活的庄严。", "material": "项目年代为1930年。抹灰砌体、阳台板和重复门窗组成绵长立面，传统墙体做法进入大规模公共住宅。它可联系两次世界大战之间的社会住房建设，技术历史也体现在住宅如何被成片组织。", "self": "", "other": "", "image": "assets/952ab1a110caaa5057525179.jpg", "width": 1200, "height": 1200, "sourceRow": 185}, {"id": "F-32", "category": "形式灵感", "title": "蜂巢式改造阳台｜DeFlat Kleiburg", "original": "DeFlat Kleiburg", "author": "NL Architects + XVW architectuur｜Amsterdam", "year": "2016", "weather": "明亮日光中，私人用品填入密集平台。相同单元逐渐显露不同生活，让重复之中的差异变得鲜明。", "material": "项目年代为2016年。对大型板式住宅进行最小干预更新，连续阳台和交通系统被保留并重新赋予生活多样性。", "self": "", "other": "", "image": "assets/15ccd6e9c32466782c1b7203.jpg", "width": 827, "height": 1033, "sourceRow": 186}, {"id": "S-32", "category": "社会素材", "title": "圣诞阳台灯饰", "original": "Christmas Balcony Light Displays", "author": "全球住宅区", "year": "年度节庆", "weather": "夜色里，星形灯串与暖色橱窗相互映衬。光从建筑边缘向外展开，像把室内的温暖送到了街上。", "material": "这是一则年度节庆场景，具体拍摄年份未注明。灯串沿着栏杆勾勒住宅边界，可联系电气照明逐渐进入家庭节庆的过程。", "self": "", "other": "", "image": "assets/75b40fe12b528cea9f033bba.jpg", "width": 960, "height": 643, "sourceRow": 187}, {"id": "F-33", "category": "形式灵感", "title": "冬季花园扩建｜Grand Parc Bordeaux", "original": "Grand Parc Bordeaux Transformation", "author": "Lacaton & Vassal + Frédéric Druot + Christophe Hutin｜Bordeaux", "year": "2017", "weather": "强烈日光穿过透明外皮，在长平台上投下斜影。视野与光线共同向外延伸，让空间带着扩展之后的舒展。", "material": "项目年代为2017年。楼板、金属框与透明围护沿旧楼外侧展开，形成可使用的冬季花园。它把20世纪60年代住宅带入新的更新阶段，以外扩空间延续既有建筑，体现从拆建转向保留改造的思路。", "self": "", "other": "", "image": "assets/1aed991c8a37dcc90ecb9de6.jpg", "width": 1200, "height": 1200, "sourceRow": 188}, {"id": "S-33", "category": "社会素材", "title": "排灯节阳台灯火", "original": "Diwali Balcony Diyas and Lights", "author": "南亚及侨民社区", "year": "年度节庆", "weather": "从暮色到夜晚，密集暖灯与花饰包围着小小空间。外部逐渐暗下，近处却更显亲密，带着节日团聚的气氛。", "material": "这是一则年度节庆场景。灯串与挂饰穿过金属栏杆和盆栽，让传统节庆借助家用照明延伸到建筑外缘。", "self": "", "other": "", "image": "assets/bd298c9fd8c58b04dc4221e0.jpg", "width": 736, "height": 1104, "sourceRow": 189}, {"id": "F-34", "category": "形式灵感", "title": "外挂式扩建阳台｜Tour Bois-le-Prêtre", "original": "Tour Bois-le-Prêtre Transformation", "author": "Lacaton & Vassal + Frédéric Druot｜Paris", "year": "2011", "weather": "晴朗白日里，深阳台逐层向外伸出。重复边缘不断接近天空，使建筑显得正在向外展开。", "material": "项目年代为2011年。原塔楼外侧加建透明冬季花园和深阳台，以轻型外挂结构替代传统拆除重建。", "self": "", "other": "", "image": "assets/d7b2df9e3d2fced084f9be77.jpg", "width": 736, "height": 981, "sourceRow": 190}, {"id": "F-35", "category": "形式灵感", "title": "实验住宅露台｜Cité Manifeste", "original": "Cité Manifeste", "author": "多位建筑师｜Mulhouse", "year": "2005", "weather": "明亮日光照着叠加在玻璃立面上的彩色盒体。大小与色彩交错，让建筑像容纳着多样生活的集合。", "material"
