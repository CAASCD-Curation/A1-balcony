</style><style>footer .hint{background:rgba(210,210,210,.82);padding:0 1px;box-sizing:border-box}</style></head><body><header><span>内外之间 / Inside & Outside</span><nav aria-label="选择海报"><button id="prev" aria-label="上一件">←</button><select id="choose" aria-label="选择展品"></select><button id="next" aria-label="下一件">→</button></nav></header><aside class="thumbnail-carousel" aria-label="展品图片轮播"><button class="rail-control" id="rail-prev" aria-label="向内">内</button><nav class="thumbnail-list" id="thumbnails" aria-label="36件展品缩略图"></nav><span class="reel-code" id="reel-code"></span><span class="reel-title" id="reel-title"></span><button class="rail-control" id="rail-next" aria-label="向外">外</button></aside><main><div id="composition" class="single" style="--ratio:762/1082"></div></main><footer><span id="status" aria-live="polite"></span><span class="hint">拖动图片 · 鼠标视差 · 双击图片复位</span><div class="actions"><button id="pause">暂停</button><button id="reset">全部复位</button></div></footer><script>(()=>{let active=true;const raf=window.requestAnimationFrame.bind(window);window.requestAnimationFrame=fn=>raf(function tick(t){if(active)fn(t);else setTimeout(()=>raf(tick),150)});window.addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='panel-active')active=!!e.data.active});document.addEventListener('keydown',e=>{if(e.key==='Escape')parent.postMessage({type:'panel-escape'},'*')});window.addEventListener('load',()=>{active=false;parent.postMessage({type:'panel-ready'},'*')})})();</script><script>const ARTWORKS=[{"id": "A-14", "title": "《阳台房间》", "zone": "内", "width": 960, "height": 1206, "image": "assets/71f6e3716a05506ed04d5e5c.jpg", "pairs": [["薄帘与空椅让无人房间像在等待外部进入。", "木地板、玻璃门与帘幕形成连续的内外层次。"], ["身体虽然缺席，空间仍暗示可以坐下与停留。", "空椅把阳台门附近组织为生活中的可用位置。"], ["敞开的门让室内不再保持封闭。", "玻璃与薄帘分别调节光线、视线和遮蔽。"], ["观者从室内看向亮处，像正准备走近门口。", "明暗梯度把目光从房间深处引向外部。"], ["私人房间通过光线与外部世界保持联系。", "作品以无人空间呈现内外交换已经发生的痕迹。"]], "en": [["Sheer curtains and an empty chair seem to await the outside.", "Wooden flooring, glass doors and curtains form successive layers between inside and outside."], ["Though the body is absent, the room suggests sitting and staying.", "The empty chair makes the area near the balcony door a usable place in daily life."], ["An open door keeps the room from remaining enclosed.", "Glass and sheer curtains regulate light, sight and shelter in different ways."], ["We look from the interior towards the light, as if approaching the doorway.", "A gradient of light draws the gaze from the depths of the room towards the outside."], ["Light keeps the private room connected to the world beyond.", "The empty room reveals traces of an exchange between inside and outside already underway."]]}, {"id": "S-05", "title": "封阳台", "zone": "内", "width": 960, "height": 1280, "image": "assets/cbeffa3421d0f48c8f39fc7b.jpg", "pairs": [["蓝天下，突出的圆形窗体像一只朝向街道的眼睛。", "玻璃、彩色窗框与石质托台，共同构成伸出白墙的封闭挑窗。"], ["人可以靠近外面的光，同时留在围护之中。", "封闭的窗体将向外伸出的空间，纳入可以停留的内部。"], ["外面仍然看得见，身体却不必直接迎向风雨。", "玻璃让光线与视线通过，同时隔开身体与室外环境。"], ["向外望去的同时，自己也可能成为街道上的一道景象。", "窗面既提供向外观看的开口，也让内部存在被外部看见的可能。"], ["一处包裹私人生活的空间，也进入了路人共同看见的街景。", "封阳台对内部空间的围合，同时改变了建筑面向城市的外观。"]], "en": [["Under a blue sky, the rounded bay window is like an eye facing the street.", "Glass, coloured frames and a stone base form an enclosed bay projecting from the white wall."], ["One can move towards the light outside while remaining sheltered.", "The enclosure brings the projecting space into an interior where one can stay."], ["The outside remains visible, without directly facing the wind and rain.", "Glass admits light and sight while separating the body from the outdoor environment."], ["Looking out, one may also become part of the scene seen from the street.", "The window offers a view out and the possibility of being seen from outside."], ["A space sheltering private life also enters the streetscape shared by passers-by.", "Enclosing the balcony also changes the face the building presents to the city."]]}, {"id": "X-9", "title": "宿舍床帘", "zone": "内", "width": 1098, "height": 1470, "image": "assets/a4d03fd6c1e1e0e18372b74f.jpg", "pairs": [["床帘把共同宿舍切出一处可以收拢的小天地。", "柔性织物围住床位，形成可开合的边缘。"], ["拉帘让居住者调节休息与交流的状态。", "床位通过帘幕获得临时的私人范围。"], ["关上可以退回，打开又与室友相接。", "开合改变视觉通道，而声音仍可能穿过。"], ["上铺开帘后，可以从较高位置观察共同空间。", "帘幕赋予使用者一定的显露与遮蔽控制。"], ["共享居住需要持续协商接近与独处。", "床帘把阳台式的内外调节缩小到个人床位的尺度。"]], "en": [["A bed curtain gathers a small world within a shared dormitory.", "Soft fabric surrounds the bed with an edge that can open and close."], ["Drawing the curtain lets a resident shift between rest and conversation.", "Curtains give the bed a temporary private territory."], ["Closing it allows retreat; opening it reconnects one with roommates.", "Opening and closing alter visual access, while sound may still pass through."], ["An open upper bunk offers a raised view of the shared room.", "Curtains give the occupant some control over exposure and concealment."], ["Shared living requires continual negotiation between company and solitude.", "The bed curtain brings the balcony's adjustment of inside and outside to the scale of a bed."]]}, {"id": "S-06", "title": "阳台堆物 / 储藏", "zone": "内", "width": 1284, "height": 1700, "image": "assets/5eb56c984c2845ff1e5e70c9.jpg", "pairs": [["密集器物让狭长空间显出生活的重量。", "门窗与地面围出被储物占据的住宅边角。"], ["暂时不用的东西在这里获得容身之处。", "储藏将原有活动面积重新分配给家庭物品。"], ["阳台成为室内放不下、又不愿舍弃之物的缓冲区。", "堆放把生活剩余推向住宅外缘，却未真正移出家庭。"], ["杂物呈现生活痕迹，也可能遮住向外的视野。", "物品高度与密度改变了门窗的通透程度。"], ["被视作凌乱的立面背后是具体的居住需求。", "阳台储藏暴露了家庭空间分配与外观管理的张力。"]], "en": [["Crowded objects give a narrow space the weight of daily life.", "Doors, windows and flooring enclose a corner of the home occupied by storage."], ["Things not currently needed find somewhere to stay here.", "Storage reallocates space for activity to household possessions."], ["The balcony holds things that no longer fit indoors but cannot be discarded.", "Piles push the surplus of daily life towards the edge without removing it from the home."], ["Clutter records life but may also block the outward view.", "The height and density of objects change the openness of doors and windows."], ["Behind a facade judged untidy lie specific domestic needs.", "Balcony storage exposes tensions between domestic space and the management of appearances."]]}, {"id": "X-4", "title": "冰箱门", "zone": "内", "width": 1103, "height": 1480, "image": "assets/29a29b3ba2130313c78cf2cd.jpg", "pairs": [["照片与纪念品让冰箱门带上家庭记忆。", "磁贴和纸片把器物表面变成展示位置。"], ["家人在经过时反复看见熟悉的人与事。", "日常取用路径让记忆展示获得持续接触。"], ["被收藏的片段从私人拥有转为家内可见。", "门面与内部储藏形成不同层次的显露。"], ["来访者可能从表面物品认识这个家庭。", "展示的选择决定哪些记忆成为对外讲述的入口。"], ["家庭内部也存在相对于他人的公共界面。", "冰箱门作为阳台类比，把私密记忆带到共同生活的表面。"]], "en": [["Photographs and souvenirs give the fridge door a family memory.", "Magnets and scraps of paper turn an appliance surface into a display."], ["Passing family members repeatedly encounter familiar people and events.", "Everyday routines bring people into continual contact with these memories."], ["Collected fragments move from private possession to visibility within the home.", "The door's display and the storage behind it offer different degrees of exposure."], ["Visitors may learn about the household through the objects on its surface.", "The choice of display determines which memories introduce the family to others."], ["Even the home contains an interface that is public in relation to others.", "Like a balcony, the fridge door brings private memories to the surface of shared life."]]}, {"id": "S-03", "title": "阳台晾衣", "zone": "内", "width": 1284, "height": 1945, "image": "assets/43881d91e92d92eadf97a77e.jpg", "pairs": [["垂挂衣物把窄小阳台变成柔软的生活截面。", "金属支架与织物共同占据住宅外缘。"], ["晾晒让普通家务获得接近天光的位置。", "晾衣设施将室内洗涤流程延伸到半户外空间。"], ["身体的私密痕迹随着衣物进入外部。", "织物越过门窗边界，同时遮住一部分室内视线。"], ["路人看见衣物，却未必看见正在生活的人。", "悬挂的衣物替代身体，提示房间被谁使用。"], ["日常家务共同塑造了街道的生活气息。", "个体晾晒需要与立面管理和邻里使用协调。"]], "en": [["Hanging clothes turn a narrow balcony into a soft section through daily life.", "Metal supports and fabric occupy the edge of the dwelling together."], ["Drying laundry gives ordinary housework a place close to daylight.", "Drying facilities extend indoor washing into a semi-outdoor space."], ["Private traces of the body enter the outside with the clothes.", "Fabric crosses the doorway while screening part of the interior from view."], ["Passers-by see the clothes, but not necessarily the people living there.", "Hanging garments stand in for bodies, suggesting who uses the room."], ["Everyday housework collectively shapes the street's lived atmosphere.", "Individual laundry needs must coexist with facade management and neighbours' uses."]]}, {"id": "S-04", "title": "阳台植物园", "zone": "内", "width": 1173, "height": 779, "image": "assets/05772103416a8f43d4b92b1a.jpg", "pairs": [["花盆与蓝色窗框让建筑边缘显得鲜活。", "栏杆为盆栽提供依附，花盆限定植物的生长位置。"], ["照料植物使小阳台成为每日回访的地方。", "浇水与修剪把户外停留组织成持续的劳动。"], ["枝叶从家中向外生长，柔化了硬质边缘。", "植物在开放栏杆上增加一层不完全遮蔽的界面。"], ["住户透过枝叶看城市，路人从街上看花。", "盆栽的摆放同时改变向外视野与外部立面。"], ["个人的园艺兴趣成为街道共享的绿色景象。", "私家种植使住宅边缘参与城市环境的日常维护。"]], "en": [["Pots and blue window frames enliven the edge of the building.", "Railings support pots, while pots define where plants can grow."], ["Caring for plants makes the small balcony a place to revisit daily.", "Watering and pruning turn outdoor pauses into continuing work."], ["Leaves grow outwards from the home, softening its hard edges.", "Plants add a partly screening layer to the open railing."], ["Residents see the city through foliage; passers-by see flowers from the street.", "The placement of pots changes both the outward view and the facade."], ["Private gardening becomes a green scene shared by the street.", "Domestic planting involves the home's edge in the everyday care of the city."]]}, {"id": "S-47", "title": "阳台办公", "zone": "内", "width": 736, "height": 981, "image": "assets/70eb31d78b798bbed51cc6e4.jpg", "pairs": [["电脑与天光并置，让工作显得稍有舒展。", "临时桌椅将阳台组织为可以停留的工作位置。"], ["人没有离开工作，却暂时离开了封闭房间。", "便携设备使办公活动延伸到住宅的半户外部分。"], ["家庭边缘同时承接工作与休憩两种用途。", "屏幕连接远程事务，栏杆连接近处城市环境。"], ["视线在电脑内容与外部景色之间切换。", "近距离屏幕与远距离景观形成两种观看尺度。"], ["工作关系通过设备进入本属私人生活的空间。", "阳台办公显示家庭与劳动场所的边界正在重新安排。"]], "en": [["A computer beside daylight gives work a little room to breathe.", "Temporary furniture makes the balcony a place where work can take place."], ["One remains at work while briefly leaving the enclosed room.", "Portable devices extend office activity into the home's semi-outdoor space."], ["The home's edge accommodates both work and rest.", "The screen connects distant tasks; the railing connects the nearby city."], ["The gaze shifts between the computer and the view outside.", "A nearby screen and a distant landscape establish two scales of looking."], ["Devices bring working relationships into a space of private life.", "Balcony work reveals a rearrangement of the boundary between home and workplace."]]}, {"id": "S-51", "title": "热浪中的阳台睡眠", "zone": "内", "width": 736, "height": 981, "image": "assets/59b32dc45903ed8ba0964cd0.jpg", "pairs": [["床垫挤入平台，使边缘显出临时安顿的意味。", "卧具几乎占满狭窄阳台，改变原有活动布局。"], ["炎热时，人把睡眠移向更接近空气的位置。", "阳台临时承担卧室功能，回应家庭的气候处境。"], ["最私密的休息接近了开放的外部。", "围护范围未变，使用性质却从停留转为睡眠。"], ["睡眠者减少对外观察，也可能增加被看见的机会。", "躺卧姿势改变视线高度和遮蔽需求。"], ["个人避暑方式显出居住舒适条件的差异。", "阳台睡眠让气候压力落实为具体的家庭空间调整。"]], "en": [["A mattress squeezed onto the platform suggests a temporary refuge.", "Bedding fills the narrow balcony and changes its usual arrangement."], ["In the heat, sleep moves closer to the open air.", "The balcony temporarily becomes a bedroom in response to the household's climate."], ["The most private form of rest approaches the open outside.", "The enclosure remains unchanged, but lingering gives way to sleeping."], ["Sleep reduces outward attention while potentially increasing exposure.", "Lying down changes the height of the gaze and the need for screening."], ["Individual ways of escaping heat reveal differences in living comfort.", "Balcony sleeping translates climatic pressure into a concrete rearrangement of the home."]]}, {"id": "L-15", "title": "《阳台》（波德莱尔诗）", "zone": "内", "width": 1320, "height": 981, "image": "assets/704a2c081dc528c21649eae6.jpg", "pairs": [["模糊人影让阳台像保留着记忆的余温。", "原表配图将人物、树木与暗部叠合为回忆般层次。"], ["停留的经验可以在之后被反复回想。", "阳台为亲密记忆提供可以返回的空间支点。"], ["过去的内部感受与外部城市在记忆中重叠。", "夜色和开口使家内温度与远处世界同时可感。"], ["回望带来的景象不必等于当时的全部现场。", "记忆选择细节，重新组织亲密关系的观看。"], ["个人爱情经验通过诗歌进入他人的感受。", "阳台把私密时间转为可共享的情感空间。"]], "en": [["Blurred figures make the balcony seem to retain the warmth of memory.", "The source illustration layers people, trees and darkness like a recollection."], ["An experience of lingering can be revisited in memory.", "The balcony gives intimate memories a spatial point of return."], ["Past inner feelings and the city outside overlap in memory.", "Night and an opening make domestic warmth and the distant world felt together."], ["A remembered scene need not reproduce everything that once occurred.", "Memory selects details and rearranges the view of an intimate relationship."], ["Poetry carries a private experience of love into the feelings of others.", "The balcony turns private time into an emotional space that can be shared."]]}, {"id": "F-03", "title": "悬挑", "zone": "中间过渡", "width": 1284, "height": 1910, "image": "assets/453392c2a4ea28bb968802b4.jpg", "pairs": [["伸出主体的平台让人感到轻快与悬浮。", "水平板向外延伸，形成悬挑的空间关系。"], ["身体可以走到原有墙线之外。", "外挑平台扩大住宅面向空气的可用范围。"], ["脚下仍有支撑，周围却更接近开放环境。", "结构延伸把内外边界推离主体墙面。"], ["从下方看，平台使建筑显得向外生长。", "悬出部分同时组织向外远望与向上仰视。"], ["私人空间的扩展改变了街道上空的感受。", "阳台将结构能力转化为居住与城市之间的突出界面。"]], "en": [["A platform projecting from the building feels light and suspended.", "A horizontal slab extends outwards to form a cantilever."], ["The body can move beyond the original line of the wall.", "The projecting platform expands the dwelling's usable contact with the air."], ["Support remains underfoot while the surroundings become more open.", "The structural extension pushes the boundary beyond the main wall."], ["Seen from below, the platform makes the building seem to grow outwards.", "The projection organises both outward views and upward gazes."], ["Extending private space changes the atmosphere above the street.", "The balcony turns structural capacity into a projecting interface between dwelling and city."]]}, {"id": "F-04", "title": "凹入式阳台", "zone": "中间过渡", "width": 960, "height": 1280, "image": "assets/df08b4fecbb220b13b4f43a4.jpg", "pairs": [["深暗内部让观看逐渐向内收拢。", "凹入体量的开口形成具有厚度的框景。"], ["身体可以接近外部，同时保留侧面的庇护。", "退入式空间在建筑轮廓内提供半户外停留。"], ["外部光线进入，却被深度逐步减弱。", "侧壁和顶部共同增加遮蔽的层次。"], ["从内部看，远景被较深的开口框住。", "从外部看，阴影使使用者不易完整显露。"], ["居住者能够在可见与隐蔽之间保持余地。", "凹阳台使住宅开放具有可调节的空间深度。"]], "en": [["A deep, dark interior draws attention gradually inwards.", "An opening recessed into the building frames a view with depth."], ["The body approaches the outside while retaining shelter at its sides.", "The recessed space offers a semi-outdoor pause within the building's outline."], ["Outside light enters but gradually weakens with depth.", "Side walls and a roof add successive layers of shelter."], ["From inside, a deep opening frames the distant view.", "From outside, shadow prevents the occupant from being fully revealed."], ["Residents retain room to negotiate between visibility and concealment.", "The recessed balcony gives domestic openness an adjustable spatial depth."]]}, {"id": "F-10", "title": "透明玻璃阳台", "zone": "中间过渡", "width": 4000, "height": 6000, "image": "assets/496845c4042a5dbbbb98b85a.jpg", "pairs": [["透明栏板让开放感与暴露感同时增强。", "玻璃与金属边框构成轻薄的围护界面。"], ["身体可以停在边缘而不失去宽阔视野。", "透明构件承担防护，同时减少视觉阻隔。"], ["看起来连续的空间仍存在实体分界。", "玻璃让视线通过，却限制身体跨越。"], ["住户向外看，外部也更容易辨认其活动。", "通透表面增加双向可见的可能。"], ["住宅外观的轻盈与个人隐私需求需要协调。", "阳台说明视觉开放并不等于关系上的完全开放。"]], "en": [["Transparent panels heighten both openness and exposure.", "Glass and metal frames form a thin, light enclosure."], ["One can remain at the edge without losing a broad view.", "Transparent components provide protection while reducing visual obstruction."], ["Space that appears continuous still contains a physical boundary.", "Glass permits sight while preventing the body from crossing."], ["Residents look out, while their activities become easier to see from outside.", "Transparent surfaces increase the possibility of visibility in both directions."], ["A light-looking facade must be balanced with personal privacy.", "The balcony shows that visual openness does not mean complete social openness."]]}, {"id": "F-07", "title": "阳台阴影", "zone": "中间过渡", "width": 3803, "height": 5070, "image": "assets/561a9218693cf2848e7c6d97.jpg", "pairs": [["斜影让静止栏杆像留下时间的刻度。", "楼板与栏条把轮廓投射到墙地表面。"], ["停留者能从影子变化感知日光移动。", "阴影使阳台成为观察时间的日常位置。"], ["实体边界之外又出现一层无形边界。", "光线将栏杆的影响延伸到接收投影的表面。"], ["目光从构件转向其暂时留下的痕迹。", "影子的方向与长度改变空间的视觉节奏。"], ["私人空间同样参与每天共同经历的光照变化。", "阳台以局部投影连接建筑形态与外部时间。"]], "en": [["Slanting shadows turn stationary railings into marks of time.", "Slabs and bars cast their outlines onto walls and floors."], ["Changing shadows let those who linger sense the sun's movement.", "Shadow makes the balcony an everyday place for observing time."], ["An immaterial boundary appears beyond the physical one.", "Light extends the railing's influence onto the surface receiving its shadow."], ["Attention shifts from a component to the temporary trace it leaves.", "The direction and length of shadows alter the visual rhythm of space."], ["Private space participates in the daily changes of light shared by everyone.", "Local shadows connect the balcony's architecture with time outside."]]}, {"id": "F-33", "title": "冬季花园扩建｜Grand Parc Bordeaux", "zone": "中间过渡", "width": 1200, "height": 1200, "image": "assets/02842ac56622ee74837eb400.jpg", "pairs": [["透明外皮与长平台让旧住宅显得舒展。", "新增楼板、金属框与围护形成冬季花园。"], ["住户获得房间之外可以继续使用的空间。", "扩建将停留范围从原有外墙向外推开。"], ["旧内外分界转为新空间中的一层界面。", "透明围护与内部门窗形成多重过渡。"], ["向外观看需要经过更有深度的生活边缘。", "光线穿过新增空间，再进入原有房间。"], ["改善生活可以通过保留建筑而发生。", "阳台扩建把住宅更新与既有居住连续性联系起来。"]], "en": [["A transparent skin and long platforms give old housing room to breathe.", "New slabs, metal frames and enclosure form winter gardens."], ["Residents gain usable space beyond their existing rooms.", "The extension pushes the area for living beyond the original outer wall."], ["The old boundary becomes one interface within a new space.", "Transparent enclosure and inner doors form multiple transitions."], ["Looking out now passes through a deeper inhabited edge.", "Light crosses the added space before entering the original rooms."], ["Living conditions can improve while buildings are retained.", "Balcony extensions connect housing renewal with continuity of residence."]]}, {"id": "L-21", "title": "《觉醒》", "zone": "中间过渡", "width": 830, "height": 619, "image": "assets/9da6af3efa84d91d9577ebd8.jpg", "pairs": [["树旁交谈的配图让自我探问显得具体。", "门廊与阳廊为室内家庭生活留下开放边缘。"], ["离开房间的片刻允许人物感受自身需要。", "半户外停留提供暂时脱离家务秩序的位置。"], ["身体仍靠近家庭，注意力已指向其他可能。", "住宅边缘使退出与返回都保持可行。"], ["人物可以看向海风中的外部，也重新审视自己。", "观看位置的改变为理解既有生活提供距离。"], ["女性的私人感受与家庭角色期待发生联系。", "阳廊把自我觉察安排在尚未彻底离开的过渡地带。"]], "en": [["An illustration of conversation beside a tree gives self-questioning a setting.", "Porches and verandas give domestic life an open edge."], ["A moment outside the room lets a character feel her own needs.", "A semi-outdoor pause offers temporary distance from domestic routines."], ["The body stays near the home while attention turns to other possibilities.", "The dwelling's edge keeps both departure and return possible."], ["Looking towards the sea breeze also becomes a way of reconsidering oneself.", "A changed viewing position provides distance from an established life."], ["A woman's private feelings meet expectations of her domestic role.", "The veranda locates self-awareness in a transitional place not yet fully left behind."]]}, {"id": "A-05", "title": "《街道进入房屋》", "zone": "中间过渡", "width": 4605, "height": 4569, "image": "assets/ad514e2a3919904ee22015df.jpg", "pairs": [["碎裂街景仿佛涌进近处房屋。", "相互穿透的线条削弱了栏杆与街道的分界。"], ["观看者像被城市运动卷入，难以安静旁观。", "画面将临栏观看组织为感知外部冲击的过程。"], ["内外不再保持整齐分开，而在视觉上彼此渗透。", "重叠形体让建筑边界失去稳定轮廓。"], ["视线在施工、建筑与人物之间快速跳转。", "多方向线条取代单一固定的观看位置。"], ["城市变化进入了个人居住的感官经验。", "阳台在画中成为公共运动影响私人空间的界面。"]], "en": [["Fragmented street scenes seem to surge into the nearby house.", "Intersecting lines weaken the division between railing and street."], ["The viewer seems swept into urban movement, unable to remain a quiet observer.", "Looking from the railing becomes an encounter with the impact of the outside."], ["Inside and outside cease to be neatly divided and visually penetrate each other.", "Overlapping forms deprive the architectural boundary of a stable outline."], ["The gaze jumps rapidly between construction, buildings and people.", "Lines in multiple directions replace a single fixed viewpoint."], ["Urban change enters the sensory experience of domestic life.", "The painted balcony mediates the impact of public movement on private space."]]}, {"id": "S-53", "title": "阳台烧烤", "zone": "中间过渡", "width": 735, "height": 985, "image": "assets/18418df9721759398ed1efa7.jpg", "pairs": [["暮色中的暖灯让阳台带上烟火气。", "烤炉、台面与座位共同组织半户外烹饪场所。"], ["烹饪与交谈在靠近夜色的位置一起展开。", "小型设备把厨房活动延伸到居所边缘。"], ["人在私家平台做饭，气味却会进入周边空气。", "开放围护无法把烟雾限制在单户范围。"], ["灯下的活动可以从外部被看见。", "局部照明使烹饪场景成为夜间立面的亮点。"], ["家庭聚会的愉快与邻里感受可能同时发生。", "阳台烧烤把私人使用权与共同环境联系起来。"]], "en": [["Warm lights at dusk give the balcony the atmosphere of cooking and company.", "A grill, worktop and seats organise a semi-outdoor cooking space."], ["Cooking and conversation unfold together beside the night.", "Small appliances extend kitchen activities to the edge of the home."], ["Cooking happens on private property, but smells enter the surrounding air.", "An open enclosure cannot contain smoke within one household."], ["Activities under the lights can be seen from outside.", "Local lighting makes cooking a bright spot in the night-time facade."], ["The pleasure of a family gathering may coincide with effects on neighbours.", "Balcony barbecues connect private use with the shared environment."]]}, {"id": "X-6", "title": "工位", "zone": "中间过渡", "width": 1116, "height": 1488, "image": "assets/9daf9bbbfe07108ac16ed33a.jpg", "pairs": [["杯子与摆件让相似桌面显出个人习惯。", "桌面和收纳设施在集体场所中划出局部范围。"], ["工作者通过布置获得熟悉和归属感。", "日常用品把通用办公位置转为个人持续使用的场所。"], ["私人习惯进入共同工作环境。", "桌边与物品排列标记范围，却未形成完整隔绝。"], ["同事从摆放细节中认识彼此。", "持续可见的桌面让个人形象在日常接触中形成。"], ["个人领地需要与集体协作和空间规则协调。", "工位作为阳台类比，把自我延伸到共享环境中的可见位置。"]], "en": [["Cups and ornaments give similar desks signs of individual habits.", "Desks and storage define local territories within a collective setting."], ["Arranging a workstation creates familiarity and belonging.", "Everyday objects turn a generic office position into a continually inhabited place."], ["Private habits enter a shared working environment.", "Desk edges and arrangements mark a territory without fully separating it."], ["Colleagues learn about one another through details of arrangement.", "A constantly visible desktop shapes a personal image through daily encounters."], ["Personal territory must coexist with collaboration and shared rules.", "Like a balcony, the workstation extends the self into a visible place in a shared environment."]]}, {"id": "L-01", "title": "《罗密欧与朱丽叶》", "zone": "中间过渡", "width": 960, "height": 1434, "image": "assets/488eeaaae0d49e6a8a584b6f.jpg", "pairs": [["相隔高低的身体让靠近显得迫切。", "原表配图以攀爬姿态和窗口组织相会位置。"], ["交谈使两个人在无法并肩时仍能建立亲密。", "高低站位让语言承担缩短距离的作用。"], ["家庭边界限制接近，却没有阻止情感向外。", "窗口式开口在围护中保留相互回应的通道。"], ["彼此仰望与俯视，使相见带着不对称的紧张。", "不同高度把观看组织为需要回应的双向动作。"], ["私人爱情受到家庭关系与外部秩序的影响。", "后世阳台意象把这种受限的亲密凝结为广泛传播的场景。"]], "en": [["Bodies separated by height make the desire for closeness urgent.", "The source illustration uses a climbing figure and a window to stage the meeting."], ["Conversation creates intimacy when two people cannot stand together.", "Different heights give language the task of reducing distance."], ["The family's boundary restricts approach without stopping feeling from reaching out.", "An opening preserves a channel of response within the enclosure."], ["Looking up and down gives the meeting an unequal tension.", "Different heights turn looking into a two-way action that calls for a response."], ["Private love is shaped by family relations and the surrounding social order.", "The later balcony motif condenses this constrained intimacy into a widely shared scene."]]}, {"id": "S-09", "title": "邻居跨阳台聊天", "zone": "中间过渡", "width": 2732, "height": 2732, "image": "assets/17ad5517109f7a896008837b.jpg", "pairs": [["上下阳台之间的交谈让距离显得亲切。", "分层平台与通透栏板把相邻住户联系起来。"], ["不必进入对方家中，也能交换日常消息。", "朝外站立使阳台承担门外会面的功能。"], ["交谈越过空隙，私人领地仍保持分开。", "栏杆与高差同时维持分界和交流通道。"], ["邻人抬头或低头，寻找对方的回应。", "错开的高度让交流依赖身体朝向和视线调整。"], ["熟悉感可以在各自住宅边缘慢慢形成。", "邻里关系借助相邻开口建立，无须固定公共房间。"]], "en": [["Conversation between balconies makes distance feel friendly.", "Platforms at different levels and open railings connect neighbouring households."], ["Daily news can be exchanged without entering another home.", "Facing outwards lets the balcony serve as a meeting place outside the door."], ["Conversation crosses the gap while private territories remain separate.", "Railings and height differences sustain both boundaries and channels of exchange."], ["Neighbours look up or down to find each other's response.", "Staggered heights make conversation depend on bodily direction and an adjusted gaze."], ["Familiarity can grow slowly at the edges of separate homes.", "Neighbourly relations form through adjacent openings without a dedicated communal room."]]}, {"id": "A-01", "title": "《阳台》", "zone": "中间过渡", "width": 762, "height": 1082, "image": "assets/ab31f2295e6a43057724b233.jpg", "pairs": [["明亮衣裙与暗室相接，使并立人物显得疏离。", "绿色栏杆在前景画出一道清晰的住宅边界。"], ["人物共同站立，却没有形成明确交流。", "阳台提供共处位置，人物朝向仍保持差异。"], ["身体来到室外边缘，暗室仍在身后延续。", "门洞与栏杆构成由内向外的两重分界。"], ["观者能看见人物，却难以判断他们在看什么。", "不同视线方向打断了统一的观看中心。"], ["城市中的相邻并不自动成为亲密。", "住宅边缘把个体展示与彼此隔离放在同一场景。"]], "en": [["Bright dresses against the dark interior make the figures seem distant from one another.", "A green railing draws a clear boundary to the dwelling in the foreground."], ["The figures stand together without visibly engaging with one another.", "The balcony offers a shared position while allowing the figures to face different directions."], ["The bodies reach the outdoor edge while the dark room continues behind them.", "The doorway and railing form two successive boundaries from inside to outside."], ["We can see the figures, yet cannot tell exactly what they are looking at.", "Their divergent gazes disrupt a single centre of attention."], ["Proximity in the city does not automatically create intimacy.", "The edge of the dwelling brings individual display and mutual separation into the same scene."]]}, {"id": "A-08", "title": "《透视 II：马奈的阳台》", "zone": "中间过渡", "width": 1434, "height": 1899, "image": "assets/d39cddadd851ab7f12dc932f.jpg", "pairs": [["木棺取代人物，使熟悉场景变得静止而惊悚。", "绿栏与百叶门保留原有框架，内部主体却被置换。"], ["本应停留的身体以封闭容器的形态出现。", "阳台的展示位置承托了缺席而非日常动作。"], ["建筑向外开放，棺体却把内部完全封闭。", "两种相反的围合方式在同一画面中并置。"], ["观者认出旧构图，也遭遇无法回应的对象。", "人物目光的消失使观看失去互相回应的可能。"], ["熟悉图像的再造改变了住宅场景的公共记忆。", "阳台在引用与置换中成为讨论观看和缺席的结构。"]], "en": [["Coffins replace the figures, making a familiar scene still and unsettling.", "The green railing and shutters retain the frame while its occupants are replaced."], ["Bodies that should linger appear instead as closed containers.", "The balcony's display position supports absence rather than everyday movement."], ["The building opens outwards while the coffins seal their interiors.", "Two opposing forms of enclosure coexist within one picture."], ["We recognise an earlier composition but face objects unable to respond.", "The disappearance of human gazes removes the possibility of reciprocal looking."], ["Remaking a familiar image alters the public memory of a domestic scene.", "Through quotation and substitution, the balcony becomes a structure for examining looking and absence."]]}, {"id": "X-2", "title": "朋友圈", "zone": "中间过渡", "width": 1179, "height": 866, "image": "assets/08b73892468bb97fa6864b5c.jpg", "pairs": [["被选择的照片让日常生活变成可分享的片段。", "数字界面把图像与文字组织为连续发布。"], ["人通过记录让熟人了解自己愿意展示的生活。", "发布把私人经验转为可以回应的内容。"], ["分享面向他人，却不等于开放全部生活。", "可见范围与内容选择共同构成数字边界。"], ["观看者看到经过取舍的片段，而非完整现场。", "评论与回应使单向展示具有往返交流的可能。"], ["私人日常进入熟人关系中的共同话题。", "朋友圈作为数字阳台，连接个人生活与有限的社交公众。"]], "en": [["Selected photographs turn everyday life into shareable fragments.", "The digital interface arranges images and words into a sequence of posts."], ["People show acquaintances the life they choose to reveal.", "Posting turns private experience into content others can respond to."], ["Sharing with others does not mean exposing all of life.", "Audience settings and content choices together form a digital boundary."], ["Viewers see selected fragments rather than the entire situation.", "Comments and responses allow display to become an exchange."], ["Private routines become shared topics among acquaintances.", "As a digital balcony, Moments connects personal life to a limited social public."]]}, {"id": "X-1", "title": "痛包", "zone": "外", "width": 1179, "height": 1275, "image": "assets/6b8f05fa7fa268f69bdb6b86.jpg", "pairs": [["透明小窗让挎包里的喜爱清晰可见。", "包体与展示层把收藏安排在随身物品的外侧。"], ["携带者把个人兴趣带进日常行走。", "固定与摆放让收藏从储存转为持续展示。"], ["物品受包体保护，形象却向外开放。", "透明表面将可看见与可触碰分开。"], ["路人看到的是被选择过的兴趣片段。", "展示框限定内容，使主人保留选择显露的权利。"], ["相同兴趣可能成为陌生人辨认彼此的线索。", "痛包作为移动的阳台类比，把私人认同接到公共视线。"]], "en": [["A transparent window makes the bag's treasured contents visible.", "The bag and display layer place a collection on the outside of a carried object."], ["The wearer takes personal interests into everyday journeys.", "Fixing and arranging objects turns storage into continuous display."], ["The bag protects the objects while their images remain open to view.", "The transparent surface separates seeing from touching."], ["Passers-by see selected fragments of an interest.", "The frame limits the display and preserves the owner's choice of what to reveal."], ["Shared interests may help strangers recognise one another.", "Like a moving balcony, the ita bag connects private identity to public sight."]]}, {"id": "X-3", "title": "社交主页", "zone": "外", "width": 945, "height": 1507, "image": "assets/52d5640a9b4d0a47aac575e4.jpg", "pairs": [["主页让零散内容汇成可辨认的个人形象。", "头像、介绍与发布内容共同构成持续展示的界面。"], ["用户通过更新安排自己如何被他人认识。", "主页将自我介绍从一次会面延伸为可反复访问的内容。"], ["个人生活经选择后朝向更广泛的外部。", "公开内容与未发布部分之间保留信息边界。"], ["陌生人可以先看见形象，再决定是否接近。", "展示顺序和内容积累影响他人对身份的理解。"], ["私人表达可能转为关系、关注与社会资源。", "社交主页把阳台式的对外展示延伸为持续存在的数字位置。"]], "en": [["A profile gathers scattered content into a recognisable personal image.", "An avatar, biography and posts form a lasting display interface."], ["Updates let users arrange how others come to know them.", "The profile extends an introduction into content that can be visited repeatedly."], ["Selected parts of personal life face a wider outside world.", "An informational boundary remains between public content and unpublished life."], ["Strangers can encounter an image before deciding to approach.", "Display order and accumulated content shape how others understand an identity."], ["Private expression can become relationships, attention and social resources.", "The profile extends the balcony's outward display into a persistent digital place."]]}, {"id": "X-10", "title": "直播间", "zone": "外", "width": 1081, "height": 1080, "image": "assets/e4c40490a612f9352d759b46.jpg", "pairs": [["镜头里的房间让私人空间像一扇持续亮着的窗。", "摄像机取景把完整房间切成可传播的画面。"], ["主播在熟悉环境中与远处观众交流。", "拍摄、布置与发言使房间获得公开使用的功能。"], ["镜头内的部分向外开放，镜头外仍可保持隐藏。", "取景范围与直播状态构成可调节的数字边界。"], ["观众看见主播，主播通过反馈感知观众。", "屏幕与互动信息组织了不同于面对面的观看关系。"], ["私人表达能够聚集远距离的共同注意。", "直播间作为媒介阳台，把家庭内部接入实时公共交流。"]], "en": [["A room on camera resembles a window that stays illuminated.", "The camera crops a whole room into a transmissible image."], ["A host speaks with distant viewers from familiar surroundings.", "Filming, staging and speaking give the room a public function."], ["What is inside the frame opens outwards; what is outside can remain hidden.", "The frame and the live broadcast state form an adjustable digital boundary."], ["Viewers see the host; feedback lets the host sense the audience.", "Screens and interactive messages organise a form of looking unlike a face-to-face encounter."], ["Private expression can gather shared attention across distance.", "As a media balcony, the livestream room connects the home to real-time public exchange."]]}, {"id": "S-59", "title": "从阳台观看街头游行", "zone": "外", "width": 960, "height": 1429, "image": "assets/0d38ab28e1770d240d74d5bc.jpg", "pairs": [["高处俯瞰让游行的密集与流动同时显现。", "住宅平台在街道上方形成临时观众席。"], ["居民不必出门，也能感知公共活动的节奏。", "阳台把日常居住位置转为沿街观看位置。"], ["身体保持距离，注意力却加入外部事件。", "高差区分行进路线与观看平台。"], ["目光追随队伍移动，街上也能看见临栏观众。", "不同高度让同一游行呈现多重观看关系。"], ["住宅边缘把个人旁观接入城市公共时间。", "街道活动使沿线私人开口获得临时的共同用途。"]], "en": [["A view from above reveals both the density and movement of a parade.", "A residential platform becomes a temporary audience stand above the street."], ["Residents sense the rhythm of a public event without leaving home.", "The balcony turns an everyday dwelling position into a street-facing viewpoint."], ["The body keeps its distance while attention joins the event outside.", "Height separates the parade route from the viewing platform."], ["Eyes follow the procession, while people below can see the spectators.", "Different heights give a single parade multiple relationships of looking."], ["The dwelling's edge connects individual observation to the city's public time.", "Street activity gives private openings along the route a temporary shared purpose."]]}, {"id": "F-51", "title": "高空公共平台｜The Pinnacle@Duxton", "zone": "外", "width": 740, "height": 416, "image": "assets/eaca77e9d26f27253e108b51.jpg", "pairs": [["巨型连桥让共同生活显得能够升到高处。", "空中花园连接多栋住宅塔楼。"], ["居民可以在家庭单元之外共享高处停留。", "连续平台把步行、休憩与观景结合起来。"], ["原本分开的塔楼通过外部路径相接。", "桥面使跨越建筑间隔成为可使用的空间。"], ["目光既面向城市，也注意到共同平台上的人。", "高处连接把孤立窗口转为连续的观看路径。"], ["阳台式户外体验从单户扩大到共同体。", "公共平台重新安排高密度住宅中的共享空间分布。"]], "en": [["Large skybridges suggest that shared life can rise above the ground.", "Sky gardens connect several residential towers."], ["Residents share elevated places beyond their individual homes.", "Continuous platforms combine walking, resting and viewing."], ["An outdoor route connects previously separate towers.", "The bridge turns a gap between buildings into usable space."], ["Attention faces the city and also the people on the shared platform.", "High-level connections turn isolated windows into a continuous viewing route."], ["A balcony-like outdoor experience expands from a household to a community.", "Public platforms redistribute shared space within high-density housing."]]}, {"id": "S-01", "title": "意大利封城时期的阳台音乐会", "zone": "外", "width": 2568, "height": 1604, "image": "assets/e7b447d0888e8b279e5afb41.jpg", "pairs": [["两位演奏者把小阳台变成可听见的角落。", "栏杆、门窗与墙面共同框住临时演奏位置。"], ["隔离中的人借音乐感到彼此仍然在场。", "演奏把原有住宅边缘转为面向邻里的使用空间。"], ["身体留在各自家中，声音越过了住宅边界。", "开放空气使音乐可以跨越相邻建筑的间隔。"], ["邻人可以在自己的窗口回应远处的演奏。", "演奏者与听众分布在不同阳台，形成分散的观看关系。"], ["独处的家庭通过同一段声音获得共同时间。", "阳台让无法聚集的居民仍能组织临时公共活动。"]], "en": [["Two musicians turn a small balcony into a corner that can be heard.", "Railings, doors, windows and walls frame a temporary performance space."], ["Music lets people in isolation feel that others are still present.", "Performance turns a domestic edge into a space addressed to neighbours."], ["Bodies remain in separate homes while sound crosses their boundaries.", "Open air lets music travel across the gaps between buildings."], ["Neighbours can respond to distant music from their own windows.", "Performers and listeners on different balconies form a dispersed audience."], ["Separate households gain shared time through the same sound.", "Balconies allow residents unable to gather to organise temporary public activity."]]}, {"id": "S-61", "title": "《少年说》", "zone": "外", "width": 999, "height": 584, "image": "assets/c1b2f763d74fd6e0a4a3c52a.jpg", "pairs": [["高处喊话的人让阳台显得像一个表达舞台。", "平台把发言者从周围环境中突出出来。"], ["平时难以开口的话可以借喊话获得出口。", "节目把临边站位组织为面向他人的表达环节。"], ["个人情绪从内部经验走向外部回应。", "高差与开口给发言划出明确的方向和范围。"], ["发言者看向听众，也接受现场与镜头的注视。", "节目拍摄使一次喊话进入超出现场的观看范围。"], ["私人感受经由阳台成为可以被讨论的内容。", "建筑舞台与传播媒介共同放大个人表达的公共性。"]], "en": [["A person calling from above turns the balcony into a stage for expression.", "The platform sets the speaker apart from the surrounding environment."], ["Words that are difficult to say find an outlet through calling aloud.", "The programme turns standing at the edge into an act of addressing others."], ["Personal feelings move from inward experience towards an external response.", "Height and an opening give speech a clear direction and extent."], ["The speaker faces listeners while receiving the gaze of both audience and camera.", "Filming carries a single call beyond the people present at the scene."], ["Private feelings become matters for discussion through the balcony.", "The architectural stage and the media together amplify the public reach of personal expression."]]}, {"id": "S-14", "title": "阳台抗议横幅", "zone": "外", "width": 4320, "height": 3240, "image": "assets/f913dcc360f638f314f25d2b.jpg", "pairs": [["横幅让安静墙面出现急切的文字。", "印字织物依附砖石墙面与金属栏杆悬挂。"], ["住户不必走上街头，也能提出诉求。", "悬挂行为把生活平台临时用作信息展示位置。"], ["人在内部，态度先抵达外面的街道。", "文字穿过视觉边界，住宅仍保留实体围护。"], ["路人阅读横幅时，也重新注意到这户住宅。", "栏杆的朝向决定标语面向哪一片观看空间。"], ["私人处境可以通过住宅外缘进入公共讨论。", "阳台为分散的个人提供了可见的表达位置。"]], "en": [["A banner introduces urgent words to a quiet wall.", "Printed fabric hangs from masonry and metal railings."], ["Residents can voice demands without taking to the street.", "Hanging a banner temporarily turns a domestic platform into an information display."], ["The person remains inside while their position reaches the street first.", "Words cross a visual boundary while the dwelling keeps its physical enclosure."], ["Reading the banner draws attention back to the home behind it.", "The railing's orientation determines the audience the message faces."], ["A private situation enters public debate through the home's edge.", "The balcony gives dispersed individuals a visible position from which to speak."]]}, {"id": "S-28", "title": "彩虹旗阳台", "zone": "外", "width": 960, "height": 720, "image": "assets/c9a421bdbfb3dcff25dd6957.jpg", "pairs": [["彩虹色在重复窗格中显出鲜明差异。", "旗帜悬在砖墙与装饰栏杆之间。"], ["展示让个人或群体的归属感有了外部位置。", "住户通过可更换的织物表达身份认同。"], ["家仍保持私密，身份信息却被选择性公开。", "旗帜让边界成为主动表达而非完全封闭的表面。"], ["看到旗帜的人可能感到被回应或被接纳。", "公开符号使陌生人能够识别一种价值态度。"], ["个体展示参与塑造街区的可见多样性。", "阳台把身份表达与共同生活的城市空间连接起来。"]], "en": [["Rainbow colours stand out among repeated  if(e.button!==0||!ready)return;clearTimeout(reelTimer);reelDrag={id:e.pointerId,start:e.clientY,last:e.clientY,time:performance.now(),velocity:0,moved:false};
 reelTarget=reelPosition;
});
thumbnailList.addEventListener('pointermove',e=>{
 if(!reelDrag||e.pointerId!==reelDrag.id)return;const now=performance.now(),dy=e.clientY-reelDrag.last;
 if(Math.abs(e.clientY-reelDrag.start)>4&&!reelDrag.moved){reelDrag.moved=true;thumbnailList.setPointerCapture(e.pointerId);thumbnailList.classList.add('is-dragging')}
 if(reelDrag.moved){e.preventDefault();reelTarget=wrapIndex(reelTarget-dy/reelPitch());reelDrag.velocity=-dy/Math.max(8,now-reelDrag.time);startReel()}
 reelDrag.last=e.clientY;reelDrag.time=now;
});
function finishReelDrag(e){
 if(!reelDrag||e.pointerId!==reelDrag.id)return;const drag=reelDrag;reelDrag=null;thumbnailList.classList.remove('is-dragging');
 if(drag.moved){reelSuppressClick=true;setTimeout(()=>reelSuppressClick=false,80);const velocity=performance.now()-drag.time<100?drag.velocity:0;reelTarget+=Math.max(-1.4,Math.min(1.4,velocity*160/reelPitch()));settleReel()}
}
for(const event of ['pointerup','pointercancel','lostpointercapture'])thumbnailList.addEventListener(event,finishReelDrag);
thumbnailList.addEventListener('keydown',e=>{let index=wrapIndex(Math.round(reelTarget));if(e.key==='ArrowUp')index--;else if(e.key==='ArrowDown')index++;else if(e.key==='Home')index=0;else if(e.key==='End')index=ARTWORKS.length-1;else return;e.preventDefault();show(wrapIndex(index));thumbnailButtons[current].focus({preventScroll:true})});
new ResizeObserver(()=>{reelLabel=-1;drawReel()}).observe(thumbnailList);
for(const zone of ['内','中间过渡','外']){
 const group=document.createElement('optgroup');group.label=zone;
 ARTWORKS.forEach((a,i)=>{if(a.zone!==zone)return;const o=document.createElement('option');o.value=i;o.textContent=`${String(i+1).padStart(2,'0')} · ${a.id} ${a.title}`;group.append(o)});choose.append(group);
}
function show(index,keepReelTarget=false){
 if(!ready)return;current=wrapIndex(index);const a=ARTWORKS[current];
 if(!posters.some(p=>p.id===a.id))mount(a);
 for(const p of posters)p.stage.classList.toggle('selected',p.id===a.id);
 document.querySelector('#composition').style.setProperty('--ratio',a.width/a.height);
 choose.value=current;syncThumbnails(keepReelTarget);document.querySelector('#status').textContent=`${String(current+1).padStart(2,'0')} / 36 · ${a.zone} · ${a.id}`;
}
choose.onchange=()=>show(Number(choose.value));
document.querySelector('#rail-prev').onclick=()=>show(current-1);document.querySelector('#rail-next').onclick=()=>show(current+1);
document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);
document.addEventListener('keydown',e=>{if(e.target.closest('select,.photo,input,textarea'))return;if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}});
Promise.all([document.fonts.load('100px Chinese','晴朗阳台'),document.fonts.load('100px English','Ag'),document.fonts.load('100px ChineseMedium','阳台'),document.fonts.load('100px EnglishMedium','Ag')]).then(()=>{ready=true;show(0)});
</script></body></html>
