: "项目年代为2005年。不同住宅原型通过大尺度阳台、温室和工业材料探索低成本住房的空间扩展。", "self": "", "other": "", "image": "assets/4fece16b181da91326062776.jpg", "width": 427, "height": 640, "sourceRow": 191}, {"id": "S-34", "category": "社会素材", "title": "斋月阳台灯笼", "original": "Ramadan Balcony Lanterns", "author": "中东及穆斯林社区", "year": "年度节庆", "weather": "夜间，月牙装饰、灯笼与暖色灯带共同亮起。小范围的光留住庆祝，也让节日显得安静而亲近。", "material": "这是一则年度节庆场景。地毯、灯具与金属栏组成临时节庆布置，传统织物和住宅构件在此相遇。", "self": "", "other": "", "image": "assets/2547c2421ddc9f4d98aac99d.jpg", "width": 736, "height": 1097, "sourceRow": 192}, {"id": "F-36", "category": "形式灵感", "title": "金属外廊｜Nemausus 1", "original": "Nemausus 1", "author": "Jean Nouvel｜Nîmes", "year": "1987", "weather": "带有暮色或摄影偏色的光线中，金属端部平台显得像船舱。工业形态进入居住场景，带来熟悉用途之外的陌生感。", "material": "项目年代为1987年。金属网栏、钢构件与板材组成宽阔外廊，让住宅边缘带有工业平台的气质。它把标准工业构件引入住房设计，技术选择直接服务于更充裕的户外使用空间。", "self": "", "other": "", "image": "assets/529276730b45a5a39bf51fea.jpg", "width": 717, "height": 1024, "sourceRow": 193}, {"id": "S-35", "category": "社会素材", "title": "春节阳台灯笼与春联", "original": "Lunar New Year Balcony Decorations", "author": "东亚及华人社区", "year": "年度节庆", "weather": "夜色中的红灯笼照亮竖向格栅，暖红光停在建筑边缘。熟悉的节庆色彩让空间带上归属感。", "material": "这是一则年度节庆场景，具体拍摄年份未注明。灯笼与电光源附着在金属格栅上，使传统节庆形象与家庭电气化并置。", "self": "", "other": "", "image": "assets/4de80e69d78d752abb5a9428.jpg", "width": 1284, "height": 1245, "sourceRow": 194}, {"id": "F-37", "category": "形式灵感", "title": "穿孔阳台盒体｜Gifu Kitagata Apartments", "original": "Gifu Kitagata Apartment Building", "author": "SANAA｜Gifu", "year": "1998", "weather": "阴天般的漫射光下，细密网格被穿过立面的斜线打断。变化仍保持节制，使整体呈现克制的秩序。", "material": "项目年代为1998年。薄板、开口和阳台被组合成轻盈白色立面，单元差异通过空洞和半透明边界表达。", "self": "", "other": "", "image": "assets/9c5116e7c3b37cfad5e954b6.jpg", "width": 426, "height": 640, "sourceRow": 195}, {"id": "F-38", "category": "形式灵感", "title": "停车山体上的梯田｜Mountain Dwellings", "original": "Mountain Dwellings", "author": "BIG + JDS｜Copenhagen", "year": "2008", "weather": "晴朗蓝天下，种植露台逐层退让。住宅像顺着山坡展开，让居住与地形般的起伏连在一起。", "material": "项目年代为2008年。住宅像山坡一样覆盖停车楼，每户获得朝阳的大露台，建筑断面直接生成户外空间。", "self": "", "other": "", "image": "assets/8bb2a53c4ea985040080e7ca.jpg", "width": 732, "height": 1100, "sourceRow": 196}, {"id": "F-39", "category": "形式灵感", "title": "六边形集体露台｜The Interlace", "original": "The Interlace", "author": "OMA / Ole Scheeren｜Singapore", "year": "2013", "weather": "日间漫射光中，条状体块围绕绿地层叠展开。密集建筑仍留出向外伸展的空隙，让群体生活带着开阔感。", "material": "项目年代为2013年。长条住宅以六边形方式堆叠，屋顶、空中花园与露台形成多层共享景观。", "self": "", "other": "", "image": "assets/d345a9560ba6b1bddd28fd7b.jpg", "width": 700, "height": 876, "sourceRow": 197}, {"id": "F-40", "category": "形式灵感", "title": "绿化悬挑阳台｜One Central Park", "original": "One Central Park", "author": "Jean Nouvel + Patrick Blanc｜Sydney", "year": "2013", "weather": "晴朗日光下，植物从玻璃与楼板之间穿出。整齐建筑被生长的枝叶打散，像自然正进入城市内部。", "material": "项目年代为2013年。混凝土平台、玻璃栏板与种植系统共同构成住宅边缘，植物被纳入建筑立面。", "self": "", "other": "", "image": "assets/64104311a10e724a76a62b36.jpg", "width": 591, "height": 799, "sourceRow": 198}, {"id": "F-41", "category": "形式灵感", "title": "像素悬挑阳台｜56 Leonard Street", "original": "56 Leonard Street", "author": "Herzog & de Meuron｜New York", "year": "2017", "weather": "带着薄雾感的日光中，塔楼边缘逐层错动。轮廓在高处显得不完全落定，带来悬浮般的轻微不稳。", "material": "项目年代为2017年。楼板在高层不断错动，每户形成形状不同的外挑阳台，使塔楼呈现像素化轮廓。它沿用现场浇筑与楼层叠加的建造逻辑，把成熟的混凝土技术用于更不规则的高层住宅边界。", "self": "", "other": "", "image": "assets/ddadaaba07ee6c2591bf0ce8.jpg", "width": 799, "height": 1000, "sourceRow": 199}, {"id": "F-42", "category": "形式灵感", "title": "水平花园阳台｜Beirut Terraces", "original": "Beirut Terraces", "author": "Herzog & de Meuron｜Beirut", "year": "2017", "weather": "明亮而略带雾感的白日里，水平楼板与绿化层层叠加。边缘向外延伸，让高处居住显得舒展。", "material": "项目年代为2017年。混凝土楼板以不同深度伸出，玻璃幕墙退到阴影之中，种植槽沿边缘布置。它让现代悬挑楼板同时承担户外起居、遮阳与绿化，呈现成熟结构技术在当代住宅中的再组织。", "self": "", "other": "", "image": "assets/4e2448d2a471537fb88a2b80.jpg", "width": 822, "height": 1200, "sourceRow": 200}, {"id": "F-43", "category": "形式灵感", "title": "树屋式阳台｜25 Verde", "original": "25 Verde", "author": "Luciano Pia｜Turin", "year": "2012", "weather": "日间树荫中，枝状钢架与繁密植物彼此交错。建筑构件像进入枝叶之间，带来住进树林般的包围感。", "material": "项目年代为2012年。钢构件、木质感平台和种植容器共同形成树屋般的边缘，可联系金属结构从工业建造进入日常居住的历史。", "self": "", "other": "", "image": "assets/d07f82af52db430783185bff.jpg", "width": 750, "height": 1124, "sourceRow": 201}, {"id": "S-59", "category": "社会素材", "title": "从阳台观看街头游行", "original": "Watching Street Parades from Balconies", "author": "多地城市节庆", "year": "传统至今", "weather": "日间薄雾般的柔和光线下，视线从高处俯瞰密集游行人群。身体保持距离，观看却仍加入公共活动。", "material": "这一生活场景延续至今。阳台天然形成高处观众席，居民无需离开住宅便可参与游行、庆典和街头表演。", "self": "", "other": "", "image": "assets/4d802ca26d2cf89f24258236.jpg", "width": 960, "height": 1429, "sourceRow": 202}, {"id": "F-44", "category": "形式灵感", "title": "旧筒仓外挂阳台｜The Silo", "original": "The Silo", "author": "COBE｜Copenhagen", "year": "2017", "weather": "日间漫射光照着包裹旧体量的折面阳台。新旧形态在外缘相遇，让旧壳显出重新容纳生活的可能。", "material": "项目年代为2017年。旧粮仓改造后增加几何形外挂阳台，新构件与粗糙混凝土筒体形成强烈对比。它呈现旧结构保留与新构件附加的两层时间，把工业建筑的使用寿命向后延长。", "self": "", "other": "", "image": "assets/a5e3e7a63696be429cee7865.jpg", "width": 675, "height": 1200, "sourceRow": 203}, {"id": "F-45", "category": "形式灵感", "title": "台阶式街区｜79&Park", "original": "79&Park", "author": "BIG｜Stockholm", "year": "2018", "weather": "晴朗蓝天下，木色体块与露台逐层退下。柔和色调与缓慢下降的轮廓，让城市边缘显得温和而可亲。", "material": "项目年代为2018年。木质覆面、玻璃与种植槽随退台层层降低，给高密度住宅带来接近花园的尺度。", "self": "", "other": "", "image": "assets/33a8cc341cb1b1f200899a9f.jpg", "width": 1000, "height": 1493, "sourceRow": 204}, {"id": "F-46", "category": "形式灵感", "title": "倾斜中庭阳台｜VIA 57 West", "original": "VIA 57 West", "author": "BIG｜New York", "year": "2016", "weather": "多云的白日里，密集开口沿斜面体量向上延伸。视线顺着倾斜轮廓移动，感到一种持续攀升的动势。", "material": "项目年代为2016年。四周住宅围合中庭并向一角抬升，阳台随倾斜体量形成介于塔楼与街区之间的复杂立面。", "self": "", "other": "", "image": "assets/24814d265acccc627dc21b93.jpg", "width": 1200, "height": 800, "sourceRow": 205}, {"id": "S-22", "category": "社会素材", "title": "奔牛节阳台观赛", "original": "San Fermín Balcony Spectators", "author": "西班牙｜Pamplona", "year": "年度节庆", "weather": "日间漫射光中，观众聚在窗口和小阳台上。身体留在边界之内，目光却投入外面的活动，形成安全距离内的刺激。", "material": "这是一则年度节庆场景，具体拍摄年份未注明。金属栏杆与织物承托观赛人群，显示街屋构件在年度节庆中被反复使用。", "self": "", "other": "", "image": "assets/f6be4dc448a5b968a63352ba.jpg", "width": 960, "height": 1280, "sourceRow": 206}, {"id": "F-47", "category": "形式灵感", "title": "彩色盒子阳台｜Silodam", "original": "Silodam", "author": "MVRDV｜Amsterdam", "year": "2002", "weather": "晴间多云的天空下，彩色方格体量映入水面。不同色块并置在同一建筑中，像相邻住户各有自己的生活。", "material": "项目年代为2002年。彩色面板、玻璃和金属构件把住宅分成不同组块，呈现工业化围护材料的组合能力。", "self": "", "other": "", "image": "assets/0c9021227dc244887f333625.jpg", "width": 515, "height": 388, "sourceRow": 207}, {"id": "S-23", "category": "社会素材", "title": "圣周游行阳台观礼", "original": "Semana Santa Balcony Viewing", "author": "西班牙｜Seville 等", "year": "年度宗教节庆", "weather": "夜间街灯照着人群、鲜花与悬挂织物。共同聚集的景象既热闹又庄重，让参与带着肃穆的仪式感。", "material": "这是一则年度节庆场景，具体拍摄年份未注明。栏杆上的织物与照明把住宅边缘变成观礼空间，体现固定构件和临时节庆装置的叠加。", "self": "", "other": "", "image": "assets/e56ff01c51ae4650db0c834b.jpg", "width": 1000, "height": 1500, "sourceRow": 208}, {"id": "F-48", "category": "形式灵感", "title": "共享天空露台｜SkyVille@Dawson", "original": "SkyVille@Dawson", "author": "WOHA｜Singapore", "year": "2015", "weather": "日间漫射光中，高处公共平台跨过建筑之间的空隙。原本分开的空间因此相连，让人想到在空中相遇的可能。", "material": "项目年代为2015年。多个住宅单元围绕高空共享花园组织，公共露台替代传统封闭走廊成为邻里交流节点。", "self": "", "other": "", "image": "assets/4e47524eed1d891c87468f38.jpg", "width": 640, "height": 773, "sourceRow": 209}, {"id": "F-49", "category": "形式灵感", "title": "多层社区露台｜Kampung Admiralty", "original": "Kampung Admiralty", "author": "WOHA｜Singapore", "year": "2017", "weather": "晴朗蓝天下，塔楼立面与绿化层彼此相接。明确的建筑秩序中留有生长空间，带来共同生活的安心。", "material": "项目年代为2017年。混养老住宅、医疗与公共设施垂直叠合，层层退台形成开放绿化平台和共享空间。它呈现当代城市把公共设施垂直叠合的思路，技术组织服务于更密集的社区生活。", "self": "", "other": "", "image": "assets/db4a51904f7461d54a87a36c.jpg", "width": 960, "height": 1321, "sourceRow": 210}, {"id": "S-24", "category": "社会素材", "title": "威尼斯狂欢节阳台观众", "original": "Venice Carnival Balcony Spectators", "author": "意大利｜Venice", "year": "年度节庆", "weather": "柔和日光下，戴面具的人物占据弧形栏台。建筑边缘像临时舞台，让公开扮演成为场景的中心。", "material": "这是一则年度节庆场景，具体拍摄年份未注明。石质柱廊与栏台框住盛装观众，延续威尼斯节庆中建筑与服饰共同组成观看场景的方式。", "self": "", "other": "", "image": "assets/d3b5de9e3c1c547eef4e653b.jpg", "width": 1000, "height": 1500, "sourceRow": 211}, {"id": "F-50", "category": "形式灵感", "title": "空中梯田酒店｜PARKROYAL on Pickering", "original": "PARKROYAL on Pickering", "author": "WOHA｜Singapore", "year": "2013", "weather": "日光与树荫相间，曲线绿化层穿插在室内空间之间。建筑仿佛被花园一层层包围，显得柔和而宜于停留。", "material": "项目年代为2013年。曲面平台、种植槽与玻璃将花园扩展到酒店立面，让混凝土成形与景观种植共同塑造人工地形。", "self": "", "other": "", "image": "assets/a0c719164b2c4f197b90b202.jpg", "width": 736, "height": 920, "sourceRow": 212}, {"id": "S-21", "category": "社会素材", "title": "新奥尔良狂欢节抛珠", "original": "Mardi Gras Bead Throwing from Balconies", "author": "美国｜New Orleans", "year": "年度节庆", "weather": "阴天般柔和的日光下，临栏人物俯视密集街道人群。高处并未隔绝热闹，反而让观看带着参与节庆的兴奋。", "material": "这是一则年度节庆场景，具体拍摄年份未注明。金属栏杆与木百叶成为节庆的看台，可联系新奥尔良街屋中铁艺外廊的历史。", "self": "", "other": "", "image": "assets/5fdbb50caad6f6a0c5cab492.jpg", "width": 960, "height": 656, "sourceRow": 213}, {"id": "F-51", "category": "形式灵感", "title": "高空公共平台｜The Pinnacle@Duxton", "original": "The Pinnacle@Duxton", "author": "ARC Studio + RSP｜Singapore", "year": "2009", "weather": "晴间有云的白日里，巨型连桥架在高塔之间。公共空间随之离开地面，带来共同生活升到高处的开阔想象。", "material": "项目年代为2009年。多栋住宅通过高层空中花园连接，把通常属于单户的阳台概念放大为公共城市平台。", "self": "", "other": "", "image": "assets/afade4a993aed3111caf68d9.jpg", "width": 740, "height": 416, "sourceRow": 214}, {"id": "F-52", "category": "形式灵感", "title": "锯齿形生态露台｜BedZED", "original": "BedZED", "author": "ZEDfactory / Bill Dunster｜London", "year": "2002", "weather": "阴天漫射光下，方形阳台层层叠起，木色侧屏收住边缘。空间显得节制而安静，也保留着适度庇护。", "material": "项目年代为2002年。住宅以朝向、露台、温室和通风装置组织低能耗生活，阳台参与微气候调节。", "self": "", "other": "", "image": "assets/68e914d8296388f7b80bfbbb.jpg", "width": 736, "height": 1308, "sourceRow": 215}, {"id": "S-25", "category": "社会素材", "title": "那不勒斯夺冠阳台装饰", "original": "Naples Scudetto Balcony Decorations", "author": "意大利｜Naples", "year": "2023", "weather": "蓝色白日天空下，旗帜横跨窄街，密集色彩将建筑之间的空隙填满。庆祝仿佛从各家向外汇合，形成集体的狂喜。", "material": "事件或场景年代为2023年。砌体街屋与金属栏杆披上夺冠旗帜，长期存在的建筑承接了一次短暂的城市庆典。", "self": "", "other": "", "image": "assets/6de0567738a7130df0531534.jpg", "width": 736, "height": 1308, "sourceRow": 216}, {"id": "F-53", "category": "形式灵感", "title": "沿墙连续阳台｜Byker Wall", "original": "Byker Wall", "author": "Ralph Erskine｜Newcastle", "year": "1974–1982", "weather": "晴朗蓝天下，弯曲外廊串起绿色栏板与红色细部。连续界面像一条可以慢慢行走的街道，带着邻里尺度的亲切。", "material": "项目年代为1974—1982年。涂色金属栏杆与板材沿住宅长墙展开，使重复的建筑边缘带上街道般的细节。", "self": "", "other": "", "image": "assets/4dfa6c92cd252eecb709805c.jpg", "width": 236, "height": 314, "sourceRow": 217}, {"id": "F-54", "category": "形式灵感", "title": "台地式商业住宅｜Brunswick Centre", "original": "Brunswick Centre", "author": "Patrick Hodgkinson｜London", "year": "1972", "weather": "浅蓝晴空下，连续退台与大面积玻璃共同展开。建筑边缘显得开放，让集体生活拥有面向外部的余地。", "material": "项目年代为1972年。住宅从商业基座向上退台，层层阳台形成巨型城市阶梯和内部步行空间。它呈现20世纪复合功能建筑的探索，结构与剖面共同安排了城市活动的上下层次。", "self": "", "other": "", "image": "assets/74ce3739121cf3cdd112f09f.jpg", "width": 950, "height": 1425, "sourceRow": 218}, {"id": "F-55", "category": "形式灵感", "title": "增量住宅露台｜Quinta Monroy", "original": "Quinta Monroy Housing", "author": "ELEMENTAL / Alejandro Aravena｜Iquique", "year": "2004", "weather": "晴朗强光照着基本住宅单元与可扩建空缺。未被填满的位置不显终结，反而像给未来生活留下尚未完成的希望。", "material": "项目年代为2004年。“半栋好房子”允许住户自行扩建，露台和空缺体量预留未来生长空间。它将现代基础建造与住户后续扩建结合，历史不只属于交付的那一年，也逐步写进后来增加的构件中。", "self": "", "other": "", "image": "assets/c1ca85173be114531bd374c2.jpg", "width": 488, "height": 628, "sourceRow": 219}, {"id": "S-01", "category": "社会素材", "title": "意大利封城时期的阳台音乐会", "original": "Balcony Concerts during Lockdown", "author": "社会事件 / 意大利", "year": "2020", "weather": "日间漫射光照着小阳台上的两位演奏者。有限空间因为共同演奏而向外打开，让隔离之中仍能感到人与人的连接。", "material": "原表记录的事件或场景年代为2020年。金属栏杆、抹灰墙与现代门窗承托起临时音乐会。旧有住宅构件在新的事件中获得公共用途，也让人看见建筑寿命与生活设备更新并不同步。", "self": "", "other": "", "image": "assets/479e813bb4cc54c620fd3be8.jpg", "width": 1800, "height": 1124, "sourceRow": 220}, {"id": "X-10", "category": "戏仿", "title": "直播间", "original": "Livestream Room", "author": "网络文化", "year": "现代", "weather": "直播间是一种窗口，一种对外展示的阳台。", "material": "把原本私人的房间变成持续向外观看的实时窗口。", "self": "", "other": "", "image": "assets/ce2191f87675929805f7952c.jpg", "width": 1081, "height": 1080, "sourceRow": 221}, {"id": "S-61", "category": "社会素材", "title": "《少年说》", "original": "Teenager Said", "author": "综艺节目/中国", "year": "2020", "weather": "晴朗光线里，人站在阳台上对外演说。", "material": "综艺中阳台作为对外喊话的舞台，集中体现了阳台向外的作用。", "self": "", "other": "", "image": "assets/19ac2f994ff9a1632e5725bc.jpg", "width": 999, "height": 584, "sourceRow": 222}, {"id": "F-56", "category": "形式灵感", "title": "低层高密度平台｜Aranya Low Cost Housing", "original": "Aranya Low Cost Housing", "author": "Balkrishna Doshi｜Indore", "year": "1989–1993", "weather": "晴朗暖光落在低层街巷与连续生活入口之间。近人的尺度让相邻关系逐渐展开，带着邻里慢慢生长的感觉。", "material": "项目年代为1989—1993年。抹灰砌体、平台与门窗形成细密的邻里边界，传统建造材料参与低成本住宅的渐进生长。", "self": "", "other": "", "image": "assets/23cbbddd79e0f1715fd20ceb.jpg", "width": 661, "height": 464, "sourceRow": 223}, {"id": "S-02", "category": "社会素材", "title": "阳台鼓掌 / 致敬医护人员", "original": "Balcony Applause", "author": "社会事件", "year": "2020", "weather": "日光下，多个人在花饰栏杆与窗洞间举起标牌。各自的姿态汇成面向外部的表达，呈现共同发声的团结感。", "material": "原表记录的事件或场景年代为2020年。装饰金属栏杆与石饰墙面留下传统街屋的形象。", "self": "", "other": "", "image": "assets/4566b582e8ffb72424f61ebd.jpg", "width": 1284, "height": 840, "sourceRow": 224}, {"id": "F-57", "category": "形式灵感", "title": "可扩建住宅阳台｜Villa Verde", "original": "Villa Verde Housing", "author": "ELEMENTAL｜Constitución", "year": "2013", "weather": "晴间有云的天空下，成排坡屋顶与空缺半单元交替出现。整齐之中仍保留余地，让家显得能够随生活继续变化。", "material": "项目年代为2013年。基础单元预留可扩建的一半空间，门廊和阳台随着住户自建不断变化。", "self": "", "other": "", "image": "assets/e77bae76ad99b4d50c59a6e6.jpg", "width": 597, "height": 335, "sourceRow": 225}, {"id": "F-58", "category": "形式灵感", "title": "迷宫式红色露台｜La Muralla Roja", "original": "La Muralla Roja", "author": "Ricardo Bofill Taller de Arquitectura｜Calpe", "year": "1973", "weather": "晴朗强光与海面反光照着红蓝几何平台，长阴影划出层层转折。目光不断寻找路径，带来迷路般的好奇。", "material": "项目年代为1973年。楼梯、平台、露台和高墙构成红蓝色几何迷宫，阳台被融入整体空间序列。", "self": "", "other": "", "image": "assets/b4eadb55f81412e4c98337cc.jpg", "width": 690, "height": 444, "sourceRow": 226}, {"id": "F-59", "category": "形式灵感", "title": "纪念性凹阳台｜Les Espaces d’Abraxas", "original": "Les Espaces d’Abraxas", "author": "Ricardo Bofill Taller de Arquitectura｜Noisy-le-Grand", "year": "1982", "weather": "晴间有云的白日里，巨柱立面包围细密住宅开口。两种尺度彼此挤压，使日常居住带上戏剧性的压迫感。", "material": "项目年代为1982年。混凝土外观的巨型构件与玻璃共同组成古典般的立面，使重复住宅带上纪念性尺度。", "self": "", "other": "", "image": "assets/56b6a4579d6796a58628d826.jpg", "width": 1440, "height": 1152, "sourceRow": 227}, {"id": "F-60", "category": "形式灵感", "title": "圆瓣阳台｜Les Choux de Créteil", "original": "Les Choux de Créteil", "author": "Gérard Grandval｜Créteil", "year": "1974", "weather": "晴朗蓝天下，灰色花瓣状平台紧密重复。有机轮廓显得生动，厚实体量又让这种生动保留沉重感。", "material": "项目年代为1974年。花瓣状混凝土栏板围绕塔体重复展开，展示模具成形对住宅外观的塑造。", "self": "", "other": "", "image": "assets/190d192746a8b9bd476910c8.jpg", "width": 399, "height": 501, "sourceRow": 228}, {"id": "S-13", "category": "社会素材", "title": "白金汉宫阳台亮相", "original": "Royal Balcony Appearance", "author": "英国王室 / Buckingham Palace", "year": "2011", "weather": "日间漫射光中，多个人并排站立，红色帷幔覆盖栏台。整齐的排列使这一刻像公开展示的秩序。", "material": "事件或场景年代为2011年。石饰立面、玻璃门窗与仪式织物组成王室亮相的背景，耐久建筑与临时装饰叠在一起。", "self": "", "other": "", "image": "assets/fb105c9c3c9efa0f72d7e388.jpg", "width": 1800, "height": 1350, "sourceRow": 229}, {"id": "F-61", "category": "形式灵感", "title": "转角花园阳台｜Casa de las Flores", "original": "Casa de las Flores", "author": "Secundino Zuazo｜Madrid", "year": "1931", "weather": "多云的白日中，砖墙、连续栏台与花木共同构成街边界面。朴素构件承接着生长与使用，显出平常城市生活的温度。", "material": "项目年代为1931年。砖墙、金属栏杆与花箱共同组织连续阳台，让传统砌筑材料进入早期现代住宅的街区设计。", "self": "", "other": "", "image": "assets/5daa0043461c88ce435daca1.jpg", "width": 1800, "height": 1266, "sourceRow": 230}, {"id": "F-62", "category": "形式灵感", "title": "梯田式超级住宅｜Wohnpark Alt-Erlaa", "original": "Wohnpark Alt-Erlaa", "author": "Harry Glück｜Vienna", "year": "1973–1985", "weather" erial": "事件年代为1949年，新中国国家领导人们面向人群致辞，天安门作为\"阳台”属于极端向外的政治用途。", "self": "", "other": "", "image": "assets/43cc17583bff9e39a1717169.jpg", "width": 1179, "height": 673, "sourceRow": 246}];function emit(action,id){window.dispatchEvent(new CustomEvent("balcony-query",{detail:{action,id}}))}

  const searchable=entries.map((entry,index)=>normalize([String(index+1).padStart(3,'0'),entry.id,entry.category,entry.title,entry.original,entry.author,entry.year,entry.weather,entry.material,entry.self,entry.other,window.BALCONY_DETAILS?.[entry.id]?.weather,window.BALCONY_DETAILS?.[entry.id]?.material].join(' ')));

  query.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();resultList.querySelector('button')?.focus();}else if(e.key==='Enter'&&!e.isComposing){e.preventDefault();resultList.querySelector('button')?.click();}});

window.BALCONY_DETAILS={"S-05": {"weather": "晴朗蓝天下，封闭的圆形挑窗从白墙中突出。明亮的外部与围合的内部相邻，带来被包裹的安稳，也显出边界的存在。", "material": "当代生活场景。玻璃与彩色窗框落在石质托台上，呈现透明围护与传统砌筑并置的界面。"}, "X-9": {"weather": "如果宿舍是公共区域的话，那床帘内部就是私人区域，当帘子拉开，上铺就变成了阳台。", "material": "用开合控制“我”和“别人”的距离，把共享空间切出一个私人边界。"}, "S-06": {"weather": "室内漫射光照着被器物占用的狭长地面，外面天气难以判断。物件挤入有限空间，让日常显得拥挤而具体。", "material": "当代生活场景。木纹地面与玻璃门窗围住储物空间，但木纹未必来自实木。"}, "X-4": {"weather": "将照片与纪念品粘贴在冰箱门上，对外展示。", "material": "把家庭内部的记忆、习惯和杂物贴到最容易被看见的表面。"}, "X-11": {"weather": "展示柜用于存放家庭成员的私人物品对内部展示。", "material": "把私人收藏从“拥有”变成“展示”，让家内部生成一扇面向他人的阳台。"}, "S-03": {"weather": "柔和日光照着窄小阳台上垂挂的衣物。普通家务从室内延伸出来，让日常生活以不经意的方式被看见。", "material": "当代生活场景。金属支架和晾衣织物把阳台变成日常家务场所。"}, "S-57": {"weather": "强日光照进窗边，密集鞋子铺满地面。有限空间被家务占据，显得拥挤，也保留着真实生活未经整理的一面。", "material": "当代生活场景。鞋类沿栏杆或窗边排列，最普通的清洁行为形成重复、尺度明确的立面细节。"}, "S-37": {"weather": "晴天日光照着大幅浅色被单，展开的织物暂时挡住视线。家务因此显得柔软，像日常正在接受太阳的照料。", "material": "当代生活场景。织物搭在金属栏杆和晾衣绳上，传统日晒家务继续依附现代住宅构件。"}, "S-36": {"weather": "日间侧光照着成串垂挂的红黄食材，日常储备成为鲜明的景象。充实而具体的物件带来生活有所准备的踏实。", "material": "这一生活场景延续至今。木门窗与绳索承托晾晒食材，延续利用日光和空气脱水保存食物的办法。"}, "S-40": {"weather": "柔和日光把旧式雕饰外墙与外挂设备放在一起。新需求进入旧建筑，显出日常生活不断调整自身的状态。", "material": "当代生活场景。空调外机附着在旧墙和金属栏杆旁，把机械制冷带入原有住宅。现代空调技术在20世纪发展并逐步进入家庭，这台设备留下的是一次生活设施更新的线索。"}, "S-50": {"weather": "晴天强光照亮长外廊，透明雨棚与停放物形成日常层次。空间边角被利用起来，显出生活因地制宜的务实。", "material": "当代生活场景。在缺少公共车库的住宅中，自行车常被抬到阳台，形成交通工具与居住立面之间的意外叠加。"}, "S-38": {"weather": "晴朗白日里，鸟笼靠近镜头，住宅退到后方。近处生命带来陪伴，笼体又让这份亲近带着受限的意味。", "material": "这一生活场景延续至，。细金属笼条依靠栏杆和遮棚安放，呈现鸟笼制作与住宅附属空间的结合。"}, "S-04": {"weather": "明亮白日里，蓝色窗框、独立小阳台与花盆形成鲜活的立面。植物占据建筑边缘，像生活正一点点向外生长。", "material": "当代生活场景。涂漆金属栏杆与花盆共同围出小型花园，植物借用既有住宅构件生长。"}, "S-43": {"weather": "明亮日光中，打开的容器、厨余与盆栽并置。生活的剩余物与植物出现在同一处，让照料带上循环往复的意味。", "material": "当代生活场景。塑料容器与土壤让堆肥进入小尺度住宅空间，古老的有机物腐解办法借用了现代容器。"}, "S-45": {"weather": "晴间有云的天空下，层叠绿植架与城市天际线相对。近处的生长让居住边缘充满期待，像等待一场小小的丰收。", "material": "当代生活场景。立式水培架利用有限墙面和栏杆种菜，阳台被转化为高密度城市中的微型生产空间。"}, "S-44": {"weather": "日间树荫下，穿防护服的人在箱体旁操作。身体与器物保持谨慎关系，让生产显得专注而小心。", "material": "当代生活场景。木蜂箱、金属网和防护织物可见。"}, "S-08": {"weather": "黑白照片里，猫停在弧形阳台中央，天气没有被交代。小小身体占据内外之间的位置，让边界带上探索外部的好奇。", "material": "当代生活场景。花饰栏杆与石饰门框留下住宅铁艺的装饰传统，宠物则把坚硬边界变成日常停留处。"}, "S-07": {"weather": "蓝灰色低光中，远处立面上的人物显得很小，具体时段并不明确。独自停留的身影像从室内生活中短暂退出。", "material": "当代生活场景。涂漆金属栏杆与花盆共同围出小型花园，植物借用既有住宅构件生长。"}, "S-46": {"weather": "日间侧光沿狭长平台落下，整齐器材与绿植共同占据空间。清晰的安排让这里显得专注，带着自律生活的节奏。", "material": "事件或场景年代为2020年代。金属器材与橡胶垫把阳台临时改为健身场所，可见的是工业制品进入家庭休闲生活的场景。"}, "S-47": {"weather": "晴间有云的白日里，笔记本电脑放在户外餐桌上。工作仍在继续，开放天光却让这一刻有了短暂舒展的余地。", "material": "事件或场景年代为2020年代。笔记本电脑和临时桌椅让阳台成为居家办公的延伸，工作空间短暂获得户外光线与城市背景。阳台由休憩空间延伸为工作场所。"}, "X-6": {"weather": "工位为半公共领域，也起到对外展示作用", "material": "把人的私人习惯和身份带进集体空间，形成办公场所里的私人领地。"}, "S-48": {"weather": "日间漫射光照着靠近白色防护网的孩子。边界既提供保护，也成为向外观察的位置，带着小心探索的好奇。", "material": "当代生活场景。绳网与金属栏杆围出儿童活动区，显示软性防护被附加到原有硬质边界上。"}, "S-51": {"weather": "白日光线中，床垫几乎占满狭窄平台，天空并未入画。有限空间被临时改作休息处，带着先安顿下来的意味。", "material": "事件或场景年代为20世纪至今。在缺少空调的炎热夜晚，人们把床垫移到阳台睡觉，半户外空间成为气候适应的临时卧室。"}, "L-01": {"weather": "黑白画面没有交代天气，攀向高处的身体与窗口形成鲜明的上下关系。动作仿佛要缩短彼此距离，带着迫切靠近的渴望。", "material": "原作年代为约1595年。后世著名的“阳台场景”让阳台成为爱情意象的原型：两个人被上下空间分开，却通过语言建立亲密联系。"}, "L-02": {"weather": "浅暖色天空铺在山湖景色之后，帷幕把远景框成一处可以凝视的空间。外面的世界仿佛暂时安静下来。", "material": "原作年代为1919年。诗人从自己的阳台观察空气、春天与城市。阳台像一个固定观察点，将复杂世界暂时变成可以凝视的景象。"}, "L-03": {"weather": "天空没有入画，户外暗处的人物在战时场景中靠墙休息。相互靠近的身体让动荡暂时退后，留下可以依靠的片刻。", "material": "原作年代为1943年。张爱玲反复利用阳台连接居室与都市。人物既没有完全进入街道，也没有彻底退回室内，在有限距离中观看城市与自己的命运。"}, "S-52": {"weather": "柔和日光下，吊床伸展在狭长空间里。身体仿佛可以暂时离开日常节奏，悬在一段轻松的空隙中。", "material": "当代生活场景。编织吊床悬在金属栏杆旁，吊床利用栏杆和墙体形成柔软的悬挂结构，使狭小阳台获得明显的休闲和身体摆动体验。"}, "L-04": {"weather": "室内暖暗光中，亲吻成为近距离的特写，背景逐渐模糊。周围世界仿佛退开，只剩下一段隐秘的亲密。", "material": "原作年代为1944年。公寓阳台承载了振保与娇蕊关系最初的暧昧。这个本来普通的住宅空间，因为人物关系而成为欲望和秘密发生的场所。"}, "L-05": {"weather": "黑白拼图将人物与不同身体姿态并置，无法对应具体天气。彼此拼接的形象带出欲望，也让亲密显得像一种表演。", "material": "原作年代为1956年。热内把“阳台”变成一个关于角色、权力和表演的巨大隐喻。这里的空间不只是建筑，而是一座现实与幻象互相转换的舞台。"}, "L-06": {"weather": "小幅彩色封面里，两个人隔着栏杆交流，天气细节并不明确。有限画幅保留了相互倾听的姿态，让交谈带着共享记忆的温度。", "material": "这部短篇集以新奥尔良生活为背景，女性在阳台上乘凉、交谈并分享记忆。阳台由私人住宅的边缘转变成女性交流和讲述故事的共同空间。"}, "A-01": {"weather": "明亮的日光照着衣裙与绿色栏杆，身后的房间却沉在暗处。天空没有入画，这种强烈的内外对比，让并立的人物显出一种身处人群却仍然疏离的感觉。", "material": "作品创作于1868—1869年。涂绿的金属栏杆把明亮衣裙与暗室隔开，也把视线带向19世纪城市住宅中的铁艺。"}, "L-07": {"weather": "蓝色夜景意象笼罩木廊上的人物，远方景物沉入暗处。近处因此显得更为私密，像从外界收回的一段夜晚。", "material": "原作年代为1909年。夜色中的两个人站在阳台上，城市、塔楼和灯光位于远处，而室内传来热闹声响。阳台形成一个介于拥挤室内与安静夜晚之间的私密空间。"}, "A-02": {"weather": "前景女性从昏暗背景中显现，身后的人物则隐入阴影。画面没有交代天气，明暗之间的视线关系却带来被注视的不安。", "material": "作品创作于约1808—1812年。细金属栏杆托起人物的展示空间，留下传统铁匠制作住宅护栏的线索。"}, "S-54": {"weather": "晴间多云的天空下，沙滩、住宅与日光浴人群共同展开。休息的身体与开阔景色相映，带着度假般的松弛。", "material": "事件或场景年代为20世纪至今。居民利用朝向和高处隐私在阳台晒太阳，城市公寓被短暂转化为私人度假平台。"}, "A-03": {"weather": "薄云般柔和的日光笼罩着灰蓝色城市，母女的背影停在近处。远望因此有了陪伴，也有一种被照看的安稳。", "material": "作品创作于1872年。深色金属栏杆与浅色平台构成轻巧边界，可以联系19世纪城市住宅中金属护栏的应用。"}, "L-08": {"weather": "昏暗光线或树荫包围着高处人物与楼下的交谈者，天气难以判断。明暗之间的对话带着遮掩，让爱意显得隐秘。", "material": "原作年代为1897年。配图中的砌体墙、金属栏与木门窗搭起相会的场景，呈现石作、铁艺与木作共同组成街屋的传统。"}, "A-04": {"weather": "暖色日光下，倾斜的街道与密集人流从高处向下展开。天气并不明确，俯视的角度却让城市显得急促，带来轻微的眩晕。", "material": "作品创作于1891年。花饰栏杆贴着砌体墙面展开，让人想到19世纪建筑装饰中手工铁艺与工业铸件并存的局面。"}, "L-09": {"weather": "黑白画面中，帷幕分隔着上下层人物，具体天气不明。追求发生在尚未跨越的边界两侧，距离也成为情感的一部分。", "material": "原作年代为1775年。配图用石质外观的栏台与帷幕营造古典居所，延续以柱栏装饰建筑边缘的形式。"}, "A-05": {"weather": "暖色调把白日城市推向强烈的动势，碎裂的街景与施工场面交织在一起。这里的光色并非天气实录，而让人感到自己正被城市的运动卷入。", "material": "作品创作于1911年。栏杆与街道建筑被拆成相互穿透的线条，回应着20世纪初对现代城市速度的感受。"}, "L-10": {"weather": "舞台暗光照出攀爬者与高处女性，并不对应真实天气。接近的动作跨越高差，让亲密带着冒险的紧张。", "material": "原作年代为1787年。配图中的栏台与柱体带出传统石作的形象。"}, "A-06": {"weather": "明亮色块中，重复的身体与栏杆织成密集节奏，奔跑的兴奋几乎越出画面。具体天气无法判断，运动本身成为最鲜明的感受。", "material": "作品创作于1912年。奔跑的身影与栏杆化成连续节奏，空间更多服务于运动的表现。画面细节不足以确认具体历史线索。"}, "L-11": {"weather": "黑白画面里，上下两处人物隔着植物对望，天气无法确定。遮蔽让等待多了一层不安，像靠近也可能伴随危险。", "material": "原作年代为1853年。石质外观的栏台、墙体与藤蔓构成配图中的历史场景，让人联想到传统砌筑庭院。"}, "A-07": {"weather": "柔和的日间光线落在骨骼状栏板与碎片拼贴表面，奇异的形态因此显得可以亲近。陌生感与亲切感在同一处边界上并存。", "material": "项目年代为1904—1906年。面具般的铸铁栏板与陶瓷、玻璃拼贴交织在一起。这里可以读到加泰罗尼亚现代主义对材料的重新想象：铸造提供整体轮廓，碎片拼贴让建筑表面保留手作的变化。"}, "A-08": {"weather": "日光照亮前景，后方仍然幽暗，鲜明的绿色栏杆后却站着替代人物的木棺。熟悉的明暗关系被这一置换凝固成静止的惊悚。", "material": "作品创作于1950年。木质棺体取代人物，绿栏与百叶门仍延续马奈画中的住宅界面。"}, "L-12": {"weather": "室内黑白图中，人物伏在窗边，内外光差划出清晰界线。天气虽然不明，向外的姿态仍让人感到被封闭的渴望。", "material": "原作年代为1808年／1832年。配图以木窗和砌体墙围出内外相望的界面，留下传统木作嵌入墙体的线索。"}, "S-15": {"weather": "柔和日光下，一个人端盘停在深窗洞边。最普通的生活动作被留在建筑边缘，显出片刻独处的自在。", "material": "事件或场景年代为2010年。旧抹灰墙与细金属栏杆围住一顿饭，让传统住宅界面继续承接当代生活。"}, "A-09": {"weather": "暖色日光沿街道向远处延伸，俯瞰城市的人物只留下背影。开阔的纵深让观看显得自由，也保留着独自观察的距离。", "material": "作品创作于约1880年。装饰金属栏杆贴近厚实墙边，显出19世纪住宅将透空护栏与砌体结合的做法。"}, "L-13": {"weather": "明亮日光下，两人临栏看向密集屋顶。共同观看缩短了彼此距离，却仍保留着近距离试探的意味。", "material": "原作年代为1840年。阳台与小夜曲构成西班牙城市爱情想象的重要背景。"}, "A-10": {"weather": "柔和的日光穿过花木，包围着低头阅读的人。空间安静而收拢，像一段不被外界打扰的独处时光。", "material": "作品创作于1878—1879年。植物与织物遮住了建筑边缘。"}, "L-14": {"weather": "室内黑白画面把包厢人物与观众席并置，不涉及外部天气。观看别人时也暴露于他人目光，自我因此带上被展示的意味。", "material": "原作年代为1890年。装饰栏板与帷幕共同营造华丽感，伦敦上流住宅和剧院包厢不断出现，阳台式观看位置强化审美化生活与被观看的社会表演。"}, "A-11": {"weather": "圆月与朦胧蓝光构成夜景，浅色衣裙在其中轻轻显现。人物仿佛停在月色里，让这一刻保持缓慢而安静。", "material": "作品创作于1888年。浅色栏板与花盆勾勒出停留之处。"}, "L-15": {"weather": "灰暗版画中，人影、树木与建筑暗部彼此交融，天气难以辨认。模糊的层次像被时间留下的影像，仍存着记忆里的余温。", "material": "原作年代为1857年。诗人把阳台写成储存爱情记忆的场所，夜色、炉火和亲密回忆在这里与城市外部世界重叠。"}, "A-12": {"weather": "黑白画面没有交代天气，室内窗边与城市立面却彼此框取。观看停留在窗后，形成一种参与有限、距离清晰的旁观。", "material": "作品创作于1878年。画面细节不足以确认具体历史线索。"}, "L-16": {"weather": "黑白画面没有交代天气，独自站在栏边的人被花木围绕。静止的姿态中仍能读到期待，仿佛情感正重新苏醒。", "material": "原作年代为1848年。配图以弯曲金属栏杆托住植物，可联系装饰铁艺塑造住宅边界的传统。"}, "A-13": {"weather": "晴朗日光下，蓝海与浅色石面相互映衬，遮阳扇为人物留出片刻舒适。向远处投去的目光显得闲适而从容。", "material": "作品创作于1911年。石质外观的栏台与铺地留下传统砌筑空间的印象。"}, "A-14": {"weather": "强烈日光穿过敞开的门，照亮薄帘与空椅。无人占据的房间并不封闭，反而像正等待空气与外面的生活进入。", "material": "作品创作于1845年。木地板、木框玻璃门与薄帘把室内引向室外，呈现木作和玻璃共同组织住宅采光的方式。这条材料线索早于现代大面积玻璃幕墙，画中还保留着分格门窗的尺度。"}, "X-8": {"weather": "手机内部是完全的私人领域，而锁屏作为经常出现的半公共展示区域，也是一种阳台。", "material": "把最私人的图像带到公共环境中，成为随身可见的私人界面。"}, "L-17": {"weather": "人物在黑白画面中向栏外仰身，外部天气并不明确。身体靠近边缘的动作带着不愿离开的意味，让告别仍保留留恋。", "material": "原作年代为1920年代。金属栏杆与百叶窗组成配图中的住宅边缘，保留铁艺和可调遮阳构件并用的做法。"}, "A-15": {"weather": "柔和日光中，花饰、人物与绿植层层交叠。相互靠近的形象让空间显得松弛，带着有人陪伴的轻快。", "material": "作品创作于1881年。细金属栏杆与花篮相伴，透空构件让花园成为人物身后的连续背景。"}, "L-18": {"weather": "室外明亮，室内偏暗，人物掀起薄帘向外看。光线随着这一动作进入近处，也让人感到打开生活的愿望。", "material": "原作年代为1908年。配图里的木框玻璃门与薄帘层层展开，呈现木作门窗将采光、通风与遮蔽结合的方式。"}, "S-53": {"weather": "蓝灰色暮色中，暖灯照亮工作台与座位。近处的光把空间留给生活，让渐暗的夜晚仍有烟火气。", "material": "当代生活场景。小型烤炉把烹饪活动移到住宅边缘，气味、烟雾和邻里关系也因此跨越私人边界。"}, "A-16": {"weather": "星空意象铺成深蓝夜色，黄色灯光在其中形成温暖的停留处。冷暖相照，让夜间的露台显得可以靠近。", "material": "作品创作于1888年。铺石地面、遮棚与灯光把街边延伸成夜间阳台。"}, "L-19": {"weather": "明亮日光下，远山带着朦胧雾感，躺椅与照护者停在开阔山景之前。休养显得缓慢，时间仿佛围绕身体重新展开。", "material": "原作年代为1924年。配图把玻璃窗、休憩椅与台灯放在一起，留下采光空间与电气化生活相遇的线索。"}, "A-17": {"weather": "晴朗天空中浮着云，展开的旗帜透露出风的存在。人物在花园与水平海面之间坐立，休闲也随视野一起变得开阔。", "material": "作品创作于1867年。栏杆、旗杆和花坛围出海边露台，呈现19世纪休闲空间的布置。构件表面和接头未被清楚描绘，画面细节不足以确认具体历史线索。"}, "L-20": {"weather": "暮色云层映着暖色远景，檐下人物只留下剪影。近处渐暗的形象让繁华像已退去，留下迟缓的衰微感。", "material": "原作年代为1912年。配图中细金属支杆撑起织物遮棚，延续以轻巧支架创造阴凉的办法。"}, "A-18": {"weather": "树干、栏杆与坡地被组织成几何化的彩色风景，具体天气并不明确。视线在这些形体之间游移，凝视也因此带上不稳定的节奏。", "material": "作品创作于1907年。装饰栏杆给平台画出边界，但材质与做法并不清楚。画面细节不足以确认具体历史线索。"}, "A-19": {"weather": "日间树荫在花园里留下斑驳光影，聚在一起的人物构成整齐的集体肖像。亲近之中仍保留着姿态上的拘谨。", "material": "作品创作于1867年。树影与座椅占据画面。"}, "L-21": {"weather": "黑白画面没有显示天气，女性在树旁交谈。相处的姿态让人想到对自身处境的探问，仿佛在试探生活的边界。", "material": "原作年代为1899年。树木和桌椅占据配图，格兰德岛的门廊和阳廊让女性暂时脱离室内家庭秩序，成为思考自我和感受海风的中间空间。"}, "A-20": {"weather": "多云的白日里，宽阔天空覆盖河谷，人物在远景前显得细小。目光得以向远处舒展，带来暂时离开近身事务的轻松。", "material": "作品创作于1875年。平台退入远景，留下开阔地形的印象。"}, "S-55": {"weather": "小鸟栖在纤维状的窝中，模糊背景无法提供天气线索。近距离的观看让生命显得细小，也唤起照料与保护的心情。", "material": "当代生活场景。住户在栏杆放置食物或喂食器，吸引鸟类靠近住宅，也引发卫生与邻里管理讨论。"}, "L-22": {"weather": "装饰性书封用聚会意象构成优雅场面，实际天气无法判断。人物被安置在这一体面秩序之中，也显出受到约束的意味。", "material": "原作年代为1905年。露台与花园聚会是上流社会社交的重要舞台。"}, "A-21": {"weather": "柔和暖光落在浅色衣裙、花束与茶桌上，把相处的时间放慢。画面带着午后般的从容，让交流显得轻柔而自然。", "material": "作品创作于约1911年。桌布与杯具让露台成为生活场景。"}, "L-23": {"weather": "室内版画中，密集观众与层叠包厢组织着彼此的视线，天气不在画面范围内。身处其中，仿佛也置身阶层划分的目光之中。", "material": "原作年代为1920年。配图以装饰栏板围合剧院座席，呈现包厢作为观看和社交界面的形式。"}, "A-22": {"weather": "暮色般的低角度光线映着平静湖面，两个人分立栏台两侧。距离并不遥远，却有一种靠近而沉默的气氛。", "material": "作品创作于1899—1900年。浅色瓶形栏杆与木质感地面并置，可以联想到古典栏杆形式在近代住宅中的延续。"}, "L-24": {"weather": "暖光围绕花园、露台人群与木栏，具体时段尚不明确。热闹相聚让每个人既观看他人，也像在展示自己的角色。", "material": "原作年代为1913年。酒店、度假地与豪宅露台成为主人公不断转换社会身份的背景，半公共空间适合观察和表演。"}, "A-23": {"weather": "蓝绿色暮色笼罩空桌、暗下来的树木与远处水面。空间像刚刚结束一场聚会，留下人散之后尚未消退的寂静。", "material": "作品创作于约1902年。木质廊台、栏杆与屋檐围成阴凉的过渡空间，延续以木作搭建外廊的传统。"}, "F-01": {"weather": "柔和日光中，规则网格与家用设备层层叠加。统一框架没有遮住日常差异，反而让生活在秩序之中显现。", "material": "这是一则当代建筑图像。金属防护网、玻璃门窗与空调外机叠在重复开口之间，呈现标准化住宅与家庭设备更新的相遇。"}, "L-25": {"weather": "日间漫射光照着窗外，室内灯光仍然亮着，两个人隔窗分立。相近的位置没有消除隔阂，反而显出近在眼前的疏远。", "material": "原作年代为1857年。配图中的瓶形栏台、木百叶与玻璃窗层层相接，可以联系古典栏杆形式和传统门窗木作的延续。"}, "A-24": {"weather": "海边光线偏低，具体时段难以确定，卧躺的人物与远处船只隔空相对。画面因此像停在尚未结束的等待中。", "material": "作品创作于1898年。石质平台与垂落织物构成古典场景，让19世纪的绘画回望更早的建筑世界。"}, "A-25": {"weather": "热带白日的亮处与檐下阴影相接，劳作的人物、草地和开敞屋檐共同组成日常场景。共同做事的节奏显得从容而稳定。", "material": "作品创作于1891年。木柱、屋檐与编织垫共同组织日常空间，可从中读到木作和植物纤维编织的材料传统。"}, "F-02": {"weather": "晴朗蓝天下，重复折线表皮围绕中心凹洞展开。清晰秩序中出现陌生的空缺，使熟悉的建筑尺度变得难以立即把握。", "material": "这是一则当代建筑图像。阳台在不同楼层发生水平错位，使原本平整的建筑立面产生节奏与运动感。"}, "L-26": {"weather": "明亮晴天的意象里，白色空椅面对海景，绿植停在近处。无人占据的座位像日常留出的空隙，可以让生活暂时放慢。", "material": "原作年代为1922年。木廊柱、木栏与木椅构成配图中的生活边界，延续木构外廊承接室内起居的做法。"}, "A-26": {"weather": "晴间多云的海岸上，人物卧坐在草地间。开阔天光让身体逐渐放松，像把片刻闲暇交还给自然。", "material": "作品创作于1900年。配图主要呈现草地与人物，未见可辨认的阳台构件。画面细节不足以确认具体历史线索。"}, "L-27": {"weather": "晴朗的海滨白日里，一个人临栏而立，水面与城市远景向外展开。目光停在远方，近处的身体也随之安静下来。", "material": "原作年代为1927年。配图中的水城景象尚不能与原作建立明确对应，画面细节不足以确认具体历史线索。"}, "F-03": {"weather": "晴间有云的天空下，平台伸出立面，下方人物提供日常尺度。悬出的边缘显得轻快，像暂时脱离建筑主体。", "material": "这是一则当代建筑图像。一块水平板从建筑主体伸出，制造出非常直接的“悬浮”视觉关系。可联系现代钢结构和钢筋混凝土扩大悬挑可能性的历史。"}, "S-49": {"weather": "薄云下，两把躺椅面向白日海面。视野延伸得很远，近处空间却仍然收拢，让远行带着被包裹的安稳。", "material": "事件或场景年代为1990年代至今。大量客舱配置独立阳台，把海上远景商品化为私人消费体验，也形成重复密集的船体立面。"}, "A-27": {"weather": "柔和日光照着狭窄平台，长裙人物侧身望向远处。有限的空间收住了动作，也让等待显得克制。", "material": "作品创作于19世纪。细金属栏杆嵌在石质门框与铺地之间，让金属加工和传统石作在同一处相遇。"}, "L-28": {"weather": "柔和日光中，卧躺人物被百叶门与厚栏板围住。空间像从社交中退回的一处角落，允许人暂时不作回应。", "material": "原作年代为1925年。石质外观的栏板、木百叶与藤椅把几种传统材料并置在配图里，呈现石作、木作和编织共同营造休憩空间的方式。"}, "A-28": {"weather": "多云的白日里，暗色木廊与明亮街景形成对比。人物停在两者之间，像与城市保持着由身份划出的距离。", "material": "作品创作于1854年。木廊板、木檐与砌体墙面形成层次，把视线引向欧洲传统木作和砌筑并用的住宅。"}, "F-04": {"weather": "明亮入口向深暗内部过渡，连续拱券把通道一层层推远。目光随之向内收拢，形成逐渐退入内部的感觉。", "material": "这是一则当代建筑图像。与向外凸出的阳台相反，空间被挖入建筑体量内部，形成强烈的明暗框景。"}, "L-29": {"weather": "装饰性的蓝色夜光笼罩豪宅、乐队与聚会人群。热闹显得轻盈又不稳，像繁华之中难以落定的漂浮。", "material": "原作年代为1925年。配图用古典柱廊和栏台营造宏大的居所，延续近代建筑借用古典形式的做法。"}, "A-29": {"weather": "暖色日光中，两人近坐，浅色建筑与花木围出一处安静角落。彼此靠近的姿态带着试探，让亲密尚未完全说破。", "material": "作品创作于19世纪末。石质外观的栏台与座椅营造出古典庭园的背景，延续了以厚实构件围合露台的形式。"}, "F-05": {"weather": "晴天光影划出弧形平台的边缘，重复曲线连续展开。刚性的建筑因此显得柔和，带着缓慢流动的节奏。", "material": "这是一则当代建筑图像。混凝土楼板沿弧线展开，竖条金属栏杆跟随边缘转折，体现可塑性材料与模板成形的配合。"}, "A-30": {"weather": "晴朗海边，日光照亮浅色平台，蓝海在围坐聆听的人群身后展开。共同停留与专注倾听，让开放空间也显得凝聚。", "material": "作品创作于1885年。石质平台和柱体搭起古典世界的舞台，映出19世纪绘画对古代生活的想象。"}, "L-30": {"weather": "星夜意象把海天染成蓝色，两个人在栏边对话。夜色使相处显得温柔，却仍保留着彼此之间的距离。", "material": "原作年代为1934年。配图中的瓶形栏台带有古典露台的形象。"}, "F-06": {"weather": "拼图中的弯曲花纹与重复栏杆彼此呼应，无法对应单一天气。边界因装饰而变得可观看，防护构件也显出细腻趣味。", "material": "这是一则当代建筑图像。涂漆金属构件把栏杆编成重复花纹，可联系工业革命以后装饰铁件生产规模的扩大。"}, "A-31": {"weather": "蓝灰天空下，柔和日光落在白色弧形座台与近坐的人物之间。身体已经靠近，气氛却像仍停在欲言又止的瞬间。", "material": "作品创作于19世纪末。石质栏台与座椅将人物围在厚重的建筑边界内，带出传统石作的尺度感。"}, "L-31": {"weather": "晴朗海滨的意象被黄色门框框住，餐桌面向蓝海。明亮色彩让停留带着度假的轻快，像日常事务暂时退到了门后。", "material": "原作年代为1926年。咖啡馆露台、酒店窗台和节庆街道构成漂泊者的日常，半开放空间连接饮酒社交与城市观看。"}, "A-32": {"weather": "灰蓝色云天覆盖城市，近处的人物共同面对开阔视野。远望没有使人彼此分离，反而成为安静陪伴的一种方式。", "material": "作品创作于1872年。深色栏杆与土石地面构成眺望城市的前景。"}, "F-07": {"weather": "强烈侧光把清晰斜影投在深色墙面上。静止的栏杆因此像留下时间的刻度，让人意识到光线正在缓慢移动。", "material": "这是一则当代建筑图像。栏杆与楼板将自身轮廓投射到墙面和地面，形成不断随时间移动的线性构图。"}, "L-32": {"weather": "柔和日光照着居住外廊与晾衣的人，普通家务进入外部视野。私人生活因此变得可见，带着未经修饰的日常感。", "material": "原作年代为1929年。酒店与疗养地的阳台、露台提供短暂私人时刻，与战争环境形成强烈对照。"}, "A-33": {"weather": "强光照亮海面，横切画面的遮棚在近处留出阴凉。空间像一处短暂停靠，让身体从烈日中退开。", "material": "作品创作于1866年。织物遮棚由细支柱撑起，让露台获得轻巧的阴影。"}, "S-58": {"weather": "黄昏暖光中，输液架与城市远景相对。近处的身体处境与远方仍在继续的生活并置，带来康复中的等待。", "material": "当代生活场景。病房外的露台或阳台提供自然光、空气和短暂户外活动，被用于改善长期住院者的环境体验。"}, "L-33": {"weather": "平面插画把彩色窗框、花箱与各自独立的人物排在一起，天气并不确定。相邻生活既接近又分开，带着城市日常的漂浮感。", "material": "原作年代为1922年。金属栏杆、百叶窗与花箱在配图中围出小小的居住边缘，延续铁艺护栏与木作遮阳并用的传统。"}, "F-08": {"weather": "日间漫射光下，绿叶覆盖墙面，只留下窗洞。建筑像被植物收进其中，让人感到安静的包围。", "material": "这是一则当代建筑图像。植物越过金属栏杆与玻璃窗生长，显示日常栽种逐渐改变建筑边界的过程。"}, "A-34": {"weather": "海滨日光下，繁复色彩包围着休憩的人物，远景仍保持开阔。停留在近处观看远方，形成一种悠闲的旁观姿态。", "material": "作品创作于约1900年。铺砖、矮墙与织物围出露台生活，留下砌筑、烧制陶材与织造相互配合的线索。"}, "L-34": {"weather": "暖色日光中，人物倚在栏边，身后的百叶仍然合起。向外停留的姿态因此带着限制，像被熟悉的规矩包围。", "material": "原作年代为1906年。花饰金属栏杆与遮阳构件共同组织边界，体现家庭财产观念；人物在室内外转换中显露阶层和控制关系。"}, "A-35": {"weather": "外部明亮，檐下却保留着暗处，斑驳投影落在卧躺的人物周围。阴凉像一个可以躲进去的角落，让身体安心休息。", "material": "作品创作于19世纪末。木栏、软垫与装饰门框使露台显得细密而柔软，可联系木作与织物共同营造居住空间的传统。"}, "F-09": {"weather": "晴朗蓝天下，强光照着窄街上方展开的黑白织物。私人生活被晾到公共视野里，柔软的日常跨过建筑边界。", "material": "这是一则当代建筑图像。晾晒织物与空调外机同处金属栏杆之间，让自然干燥和机械制冷两种生活技术并置。"}, "A-36": {"weather": "日光穿过庭院树荫，落在喷泉与斑驳墙体上。明暗交错让空间显得幽静，仿佛连回声也被留在院中。", "material": "作品创作于1879年。抹灰砌体与石质水池呈现宫苑中墙、水和庭院的组合，材料更接近传统砌筑与石作的延续。"}, "L-35": {"weather": "檐下柔和的日光中，家庭人物各自停留。共处没有消除彼此的距离，空间同时容纳着陪伴与隔阂。", "material": "原作年代为1910年。木地板、木百叶与藤椅让配图中的空间显得轻缓，呈现木作与编织适应日常起居的传统。"}, "F-10": {"weather": "柔和日光穿过透明栏板，与连续曲面共同勾出建筑边缘。空间显得通透，也让身处其中的暴露感更加明显。", "material": "这是一则当代建筑图像。玻璃栏板与金属边框削弱了阳台的视觉重量，可以联系1959年公布的浮法玻璃工艺及后来玻璃围护的发展。"}, "X-5": {"weather": "后备箱原本算私人空间，但当其被打开，便成为了半私人半公共的空间，可以被人看到。", "material": "一打开就把原本隐藏的私人储藏暴露给公共空间。"}, "A-37": {"weather": "树荫筛下的日光围绕着坐着作画的人，喷水景观成为近旁的背景。停留在这里带着专注，时间也像随观察慢了下来。", "material": "作品创作于1907年。画面细节不足以确认具体历史线索。"}, "L-36": {"weather": "室内暖色光影包围豪华包厢，视线朝向表演，也彼此交会。观看带上展示自身的意味，欲望在其中显得公开。", "material": "原作年代为1880年。软包、帷幕与装饰栏板包裹着观看空间，"}, "A-38": {"weather": "暖色强光照亮浅墙，与屋顶人物身旁的深影形成对照。高处因此既暴露又自由，像暂时离开日常的一小段空隙。", "material": "作品创作于1878年。厚实女儿墙与抹灰墙面围住海边平台，呈现以砌筑和表面抹灰塑造空间的做法。"}, "F-11": {"weather": "日间漫射光中，白色楼板像等高线一样逐层叠加。细微起伏让重复不再静止，形成有节奏的流动感。", "material": "项目年代为2009年。每一层阳台楼板以不同幅度向外伸展，轮廓连续变化，使原本水平堆叠的高层住宅产生类似地形、波浪和等高线的视觉效果。"}, "L-37": {"weather": "室外逆光勾出举杯人物，庄园成为身后的背景。相聚像被留在光线里，带着旧日生活尚未散去的余韵。", "material": "原作年代为1945年。配图中的石质柱体留下古典建筑的形象。"}, "A-39": {"weather": "黑白线描无法确认天气，却清楚留下一个人在高处俯瞰繁密街道的姿态。目光进入城市，身体仍与它保持距离。", "material": "作品创作于1899年。金属栏杆把人物与城市立面叠在一起，可以联系19世纪末街屋中透空护栏的应用。"}, "F-12": {"weather": "柔和日光下，尖角平台朝草地伸出。向外探出的形态带来轻快，也让边缘保留一丝紧张。", "material": "项目年代为2005年。大量尖锐的三角形阳台从玻璃立面斜向伸出，方向不断变化。它不依赖普通矩形平台，而通过角度、尖端与斜线制造非常强的节奏。"}, "L-38": {"weather": "晴朗强光下，遮阳篷、雕饰门窗与平台上的交谈构成体面的场景。繁华仍在，气氛却带着缓慢迟暮的意味。", "material": "原作年代为1958年。石质外观的栏台与布篷把厚重建筑和轻巧遮阳并置，可以联系传统砌筑住宅不断附加生活设施的过程。"}, "A-40": {"weather": "云层下的黄绿色低光映着人物剪影与远处树木。画面带有黄昏般的迟缓，让独处显得安静而绵长。", "material": "作品创作于1902年。栏杆仅留下轮廓，街景成为观看的重点。"}, "S-09": {"weather": "日间漫射光中，上下阳台的人朝外交流。不同高度保留着各自空间，也让亲近可以在适当距离里发生。", "material": "当代生活场景。玻璃栏板嵌入金属扶手之间，让相邻住户在通透边界上相遇。"}, "X-2": {"weather": "人们将私人图片放入公共平台对外展示，是向外的。", "material": "把私人生活伸到熟人社会的公共界面上，形成数字阳台。"}, "A-41": {"weather": "平静湖面映着暮色般的低角度光线，两个人分开站立。彼此没有交谈的动作，却仍构成一种沉默的相伴。", "material": "作品创作于1919年。人物背对观者面向河景，阳台成为静止身体与辽阔景观之间的观察平台。"}, "F-13": {"weather": "晴朗深蓝天空衬着巨型开洞与细小窗格。尺度的强烈对照使建筑显得庞大，让人感到个体面对巨构时的距离。", "material": "项目年代为2005年。巨大的矩形空洞直接切开住宅体量，让建筑中央形成一个远距离可见的共同开放空间。可以把它理解成普通阳台被放大到城市尺度后的形式。"}, "L-39": {"weather": "海边斑驳日光照着围桌的三个人，明亮海面让场景显得轻松。漂亮的表面之下，相处仍带着彼此试探的距离。", "material": "原作年代为1955年。抹灰墙面与户外桌椅营造出意大利酒店海边露台。"}, "A-42": {"weather": "室外漫射光让黑白照片的明暗显得柔和，三个人近距离站在一起。相邻的姿态带来朋友之间无需刻意安排的自在。", "material": "作品创作于1910—1914年。细金属栏杆与门窗构成窄小的住宅边界，可以看见20世纪初生活空间对金属构件的沿用。"}, "L-40": {"weather": "暖色日光照亮剥落墙面与绿色百叶，一个人停在小阳台上。损伤没有被遮去，反而让停留显得安静而真实。", "material": "原作年代为1992年。金属曲栏、木百叶与抹灰砌体共同组成配图中的旧式住宅，留下铁艺、木作与砌筑长期并存的线索。"}, "F-14": {"weather": "多云的白日里，斜坡住宅映入水面。起伏的建筑与倒影延续了视线，带来在城市中缓慢漫游的感觉。", "material": "项目年代为2010年。金属栏杆、玻璃与坡面铺装把住宅边缘连成路径，让阳台获得街道般的连续性。"}, "A-43": {"weather": "浅色背景没有交代天气，装饰性服饰、红色灯具与水平廊栏成为视觉重点。人物处于展示之中，气氛带着面向外界的期待。", "material": "作品创作于1793—1797年。木廊、木栏与纸灯笼共同形成街边界面，可联系江户时期木构城市中的木作和纸艺传统。"}, "L-41": {"weather": "日间树影落在小阳台周围，独自停留的人物被斑驳光线包围。画面像保留着尚未发生的事情，带着夏日般的期待。", "material": "原作年代为2007年。配图里的花饰金属栏杆落在石质托台上，抹灰墙面则延续街屋的厚重感。"}, "F-15": {"weather": "日间薄云下，大体块从建筑中悬出，彩色小阳台点缀其间。不同尺度相互牵动，让失衡感也带着轻松趣味。", "material": "项目年代为1997年。突出的住宅盒体与金属、玻璃栏板相互叠加，让阳台成为扩大居住空间的办法。"}, "A-44": {"weather": "日间浅色天空向远处展开，望远镜把人物的视线继续向外延伸。观看由停留变成探索，带着清晰的好奇。", "material": "作品创作于1887—1896年。格栏旁的望远镜让阳台成为观看远方的装置，建筑木作与光学器具在这里相遇。"}, "S-39": {"weather": "日间漫射光中，大量圆盘天线附着在住宅外部。私人空间像伸出许多朝向远方的耳朵，带着接收外面世界的意味。", "material": "事件或场景年代为1990年代至今。碟形天线通过金属支架附着在住宅外缘，把阳台接入卫星传播网络。它可追溯到20世纪后半叶通信卫星的发展，记录的是接收设备进入家庭后的生活阶段。"}, "L-42": {"weather": "黑白画面没有交代天气，跨越栏板的动作成为视觉中心。身体试图离开既定边界，让画面充满冒险与逃离的意味。", "material": "原作年代为1844年。配图以雕饰栏板再现历史居所，但石质外观也可能来自布景或仿制。画面细节不足以确认具体历史线索。"}, "A-45": {"weather": "浅色背景中，三位女性并置，细密服饰线条让画面显得安静而有秩序。天气没有被交代，共同停留成为这一刻的重心。", "material": "作品创作于约1890—1903年。木廊、格栏与纸灯笼围出临水空间，保留日本传统木作住宅轻巧分隔的形象。"}, "F-16": {"weather": "晴间有云的天空下，混凝土盒体错落叠起，像一座由居住单元构成的山。家因此获得地形般的层次与探索感。", "material": "项目年代为1967年。预制混凝土盒体错落堆叠，下层屋顶成为上层露台。构件先制作、再由起重设备装配，把战后住宅工业化的设想变成可居住的立体街区，也让花园进入高密度住宅。"}, "L-43": {"weather": "舞台暗光把金属楼梯与室内场景并置，这种明暗不代表真实天气。出口近在旁边，却让想要离开的愿望更显压抑。", "material": "原作年代为1944年。配图中的金属梯与栏杆把住宅边缘变成上下通行的路径，可联系城市外置楼梯与逃生设施的历史。"}, "A-46": {"weather": "明亮日光把高处人物、城市与远景铁塔放在同一视野里。公开场合中的站姿因此显得清晰，带着面向他人的自信。", "material": "作品创作于1889年。装饰栏杆与金属椅背之后出现铁塔，把日常休憩与1889年巴黎博览会的工程景观连在一起。"}, "F-17": {"weather": "晴间有云的白日里，深凹网格与彩色侧壁交替出现。重复框架容纳细小差别，让集体之中的个人位置显得可辨。", "material": "项目年代为1952年。混凝土网格把深凹阳台和遮阳边界连成整体，彩色侧墙点出单元差异。它属于战后集体住宅的探索，钢筋混凝土从承重技术进一步成为组织共同生活的空间语言。"}, "A-47": {"weather": "暗云作为背景意象，衬出盛装人物与辽远海景，而非记录实际天气。空间显得庄严，也在人物与观看者之间拉开距离。", "material": "作品创作于约1810年。画面只显露椅背或栏台的局部，画面细节不足以确认具体历史线索。"}, "L-44": {"weather": "晴间有云的天空下，巨大的石质立面从仰视角度升起。建筑显得崇高，观看者也因此感到自身的渺小。", "material": "原作年代为1831年。配图中的石雕、拱券与柱廊指向中世纪石作建筑的传统，也呼应原作对历史城市的回望。"}, "A-48": {"weather": "两个人在阴影里交谈，墙边植物进一步收拢了空间。声音仿佛也随之放轻，留下近距离耳语般的亲密。", "material": "作品创作于约1900年。砖墙、石质压顶与植物构成朴素边界，呈现砌砖和石作各自承担墙身与顶部保护的方式。"}, "F-18": {"weather": "明亮日光中，树木从层叠阳台向外生长。建筑与枝叶相互遮映，像把居住安放在树冠之间。", "material": "项目年代为2014年。混凝土阳台承托树木和种植容器，使绿化成为建筑设计的一部分。它将现代承重结构与灌溉、植物维护结合，呈现21世纪住宅从摆放盆栽走向系统种植的尝试。"}, "L-45": {"weather": "黑白照片中，灰白天空覆盖着茂密园林，房屋藏在树木之后。安静像被层层遮住，也让人想到即将失去的生活。", "material": "原作年代为1904年。贵族站在屋内外之间谈论即将失去的土地和生活方式。"}, "S-10": {"weather": "低角度暖光照着临栏人物，城市在身后延伸。停留的姿态面向外部，让私人片刻带上愿意被看见的意味。", "material": "当代生活场景。金属栏杆与抹灰墙构成自拍的背景。"}, "A-49": {"weather": "晴朗的蓝色海天映衬浅色弧形石台，人物安静闲坐。开阔与停留相互平衡，形成没有催促的闲暇。", "material": "作品创作于1901年。石质座台与铺地承接古典生活的想象，也让传统石作成为历史气氛的一部分。"}, "L-46": {"weather": "黑白画面没有交代天气，上层围观者与下方人群形成垂直联系。不同位置的目光聚在一起，让公共事件带着紧张感。", "material": "原作年代为1862年。金属花栏贴着砌体立面展开，可联系19世纪街屋里装饰铁件与传统墙体并用的做法。"}, "F-19": {"weather": "晴朗浅蓝天空下，白色深阳台向四周伸展。建筑边缘显得轻盈而开放，带着向外展开的自由。", "material": "项目年代为2019年。白色平台与金属栏杆向四周伸展，把户外起居推到塔体之外。"}, "A-50": {"weather": "黄紫色天空与鲜艳色块分割着人物和栏杆，这些光色并非气象实录。独处因此不显沉寂，反而带着跳动的活力。", "material": "作品创作于约1920年。细栏杆与平台在人物周围留下简略轮廓。"}, "L-47": {"weather": "黄绿色低光与云层笼罩着靠近的两个人，远景模糊不清。外部世界仿佛暂时退开，留下秘密相会的气氛。", "material": "原作年代为1844—1846年。马赛、巴黎与地中海宅邸的阳台和露台频繁出现在插图传统中，常用于等待、监视和秘密会面。"}, "A-51": {"weather": "柔和日光照着远处河谷，屋檐与木栏把景色框在近旁。向外远望时仍能感到遮蔽，开阔中带着受庇护的安稳。", "material": "作品创作于约1905年。木柱、木栏与屋檐连成完整外廊，可联系北美住宅的木门廊传统。"}, "F-20": {"weather": "日间漫射光照着圆筒墙体与厚重弧形平台。围合感带来庇护，密集体量又形成压迫，两种感受同时存在。", "material": "项目年代为1968年。清水混凝土沿圆形边缘展开，金属栏杆随之转折。它呈现20世纪混凝土成形技术服务有机建筑的可能，模板塑造的曲面让现代住宅摆脱单一的直角网格。"}, "A-52": {"weather": "日间漫射光把室内古物与远处海湾连在一起。近处的陈设和远景共同放慢目光，带来收藏者独有的安静。", "material": "作品创作于19世纪。帘幕与古物把平台布置成回望历史的场景。"}, "L-48": {"weather": "低照度舞台灯光中，人物停在高处入口，交错楼梯围绕其间。光线并非天气线索，却把生活难以脱身的感觉显露出来。", "material": "原作年代为1891年。配图的舞台装置用木栏、檐瓦和抹灰外观搭起居所。"}, "F-21": {"weather": "强烈日光落在红青色墙体、楼梯与孔洞之间。明暗和色彩不断转换，空间像一座等待探索的迷宫。", "material": "项目年代为1975年。涂色墙面、楼梯与金属栏杆组成层层相通的平台，可联系20世纪集体住宅对立体邻里关系的探索。"}, "A-53": {"weather": "晴朗海边的日光照着白色雕饰栏台，一个人依靠其上望向远处。明亮并未消解等待，反而让那份期待更清晰。", "material": "作品创作于1913年。石质栏台与织物构成观景的前景，延续古典露台以实体边界组织视线的形式。"}, "L-49": {"weather": "室内暖光映着偏暗的外部，多个人靠近栏边交谈。明暗之间的相聚带着轻快，像一场彼此试探身份的游戏。", "material": "原作年代为1895年。花饰金属栏杆与木框玻璃门构成配图中的内外边界，延续铁艺和门窗木作共同塑造住宅立面的传统。"}, "S-41": {"weather": "晴朗日光照着栏杆外侧的深色面板，原本的居住边缘多了一层新的用途。画面带着主动参与能源生活的积极意味。", "material": "事件或场景年代为2020年代。光伏板与金属框架让住宅边缘参与发电，可联系1954年实用硅太阳能电池问世后光伏技术的发展。"}, "A-54": {"weather": "花园的暖色日光围绕着茶桌、交谈人物与密集植物。相处被安放在一处柔和角落，带着午后般的亲近。", "material": "作品创作于1888年。椅子、桌布和杯具承担了画面的生活细节，阳台本身未留下足够构造信息。画面细节不足以确认具体历史线索。"}, "F-22": {"weather": "日间明暗交错，汽车停在连续重复的弧形平台之间。形体与使用叠在一起，让建筑呈现城市机器般的秩序。", "material": "项目年代为1964—1968年。每层连续半圆阳台使住宅塔像玉米芯，重复单元通过弧线产生强烈雕塑感。"}, "A-55": {"weather": "明亮而有云的天空下，音乐、坐卧的人群与古典柱廊共同展开。聚会显得轻盈，人与人之间的相处也较为松弛。", "material": "作品创作于约1718年。石质柱体与平台为音乐聚会搭起背景，可联系18世纪欧洲园林延续古典柱廊的审美。"}, "F-23": {"weather": "柔和日光下，粗糙水平带与红色门板相互映衬。厚重建筑仍显露日常尺度，让生活在坚实框架中保持可见。", "material": "项目年代为1965—1976年。粗糙混凝土栏板与玻璃门窗形成厚重阴影，呈现战后粗野主义对结构和材料表面的重视。混凝土在这里既承托空间，也成为建筑外观，不必另加传统石质装饰。"}, "S-56": {"weather": "多云或漫射日光照着红色街屋、车辆与连续外廊。丰富的街景层次引导目光向外，带着旅途中观察陌生生活的好奇。", "material": "当代生活场景。旅行者把酒店阳台视为拍摄海景、城市景观和早餐照片的重要背景，私人住宿空间被转化为社交媒体图像。"}, "X-3": {"weather": "相比于朋友圈，社交平台的主页更加对外，是陌生人了解你的方式之一，是对外展示自我的平台。", "material": "把个人身份长期陈列在公共视线中，像一块不会收回的阳台。"}, "A-56": {"weather": "画面前暗后亮，倚靠的人物与花园露台形成若隐若现的关系。天气无法确定，暧昧与窥视的意味却在光差中浮现。", "material": "作品创作于1723年。瓶形栏台与垂落织物构成庭园边界，延续古典建筑中重复栏柱的秩序。"}, "F-24": {"weather": "晴朗日光中，巨大门洞框住内部庭院。庞大体量围合出一处较安静的空间，带来被建筑庇护的感受。", "material": "项目年代为2006年。混凝土体量与玻璃围护框出巨大的共享平台，把住宅之间的空隙放大到城市尺度。"}, "A-57": {"weather": "盛装人物立在厚重帷幕与前景栏台之间，天气没有进入画面。空间像一处节庆展示台，强调被他人看见的时刻。", "material": "作品创作于约1900年。石质栏台、帷幕与地毯将建筑转为节庆舞台，呈现长期建筑构件与临时织物装饰的叠合。"}, "S-42": {"weather": "有云的白日天空下，雨棚与导水构件叠在高楼背景前。画面让人想到留住流走的水，也带出对日常资源的细致关注。", "material": "当代生活场景。小型水桶、导管和储水容器把屋檐或阳台降水转化为植物灌溉用水，体现微型循环系统。"}, "A-58": {"weather": "日间树荫下，垂落绿叶围绕着听奏的三个人。音乐把小范围的相聚连在一起，形成不必向外张扬的欢愉。", "material": "作品创作于约1900年。砖石矮墙与栏杆围住演奏者，保留传统砌筑空间的厚度和尺度。"}, "F-25": {"weather": "深蓝晴空下，住宅网格与独立高塔并列。重复单元与垂直体量拉开尺度，让观看带着难以靠近的距离。", "material": "项目年代为1967年。住宅塔与服务塔通过廊桥连接，外部阳台和交通结构被直接表现为立面语言。它呈现战后住宅将交通与居住分开组织的探索，构造分工成为可见的建筑形象。"}, "A-59": {"weather": "柔和日光中，密集人物、花饰与悬挂织物交织成热闹场面。阳台像被共同活动填满，让观看也带着参与的兴奋。", "material": "作品创作于19世纪末。砌体外墙与栏台披上节庆织物，使耐久建筑成为短暂活动的承托。"}, "F-26": {"weather": "明亮日光照着白色小阳台和彩色底板。色彩在重复构件间跳动，使整齐立面保留日常的活泼。", "material": "项目年代为1952—1962年。混凝土平台、金属栏杆与彩色面板在立面上重复，工业材料被组合成细密的住宅尺度。它可放在战后重建和集体住房发展的背景中阅读，标准单元也保留日常生活的差异。"}, "A-60": {"weather": "檐下偏暗，门外明亮，坐等的人物与行李停在光线交界处。空间像一段尚未继续的旅程，带着迁徙中的悬置感。", "material": "作品创作于1864年。木门框、铺地与布包围住等待的人群。"}, "A-61": {"weather": "画中的蓝天白云映衬历史服饰、拱廊与远景。景色虽然开阔，向外投去的目光却让人读到担忧与牵挂。", "material": "作品创作于1850年。石质拱柱与铺砖营造中世纪的场景，可联系19世纪艺术对历史建筑形式的回望。"}, "F-27": {"weather": "明亮白日里，连续退台从两侧围住步行街。居住空间密集相邻，却仍通过开放边缘保持彼此的联系。", "material": "项目年代为1978年。混凝土露台与种植槽随住宅逐层退让，把屋顶变成下一层的户外空间。它延续战后低层高密度住房的探索，材料与剖面共同塑造了一座可居住的人工坡地。"}, "S-16": {"weather": "斜射日光落在密集摆放的植物与花盆上。有限空间被细心填满，呈现经营自己小天地的满足。", "material": "当代生活场景。砖墙、金属栏杆、花盆和雨棚层层附加，呈现住宅边缘逐渐被住户改造的过程。"}, "X-7": {"weather": "把喜爱的装饰品挂在书包外部进行展示。", "material": "把个人审美和身份信息挂在身体外部，边走边展示。"}, "X-1": {"weather": "挎包中间为透明展示框，人们将喜爱的物品放入对外展示。", "material": "把私人兴趣挂到身体外侧，让个人生活像阳台一样被路人看见。"}, "F-28": {"weather": "阴天漫射光中，长廊向远处延伸，门前自行车留下使用的痕迹。空间虽属共同生活的一部分，此刻却显得寂静。", "material": "项目年代为1972年。混凝土楼板把外廊拓宽，金属门窗沿着通道排列，让进入家门的路径带上街道尺度。它属于战后“空中街道”的住宅实验，试图用现代建造回应邻里生活的需要。"}, "F-29": {"weather": "晴朗日光把对面彩色立面照亮，廊下则保留深影。行走仿佛穿过明暗交替的网格，让规则空间有了身体的节奏。", "material": "项目年代为1961年。混凝土梁柱撑起连续外廊，门窗与栏板在网格里留下更新的可能。"}, "F-30": {"weather": "白日蓝天下，白色弧形转角与水平窗带清晰展开。简洁线条配合明亮天光，形成现代生活的明快感。", "material": "项目年代为1930年。横向带窗与平整墙面把住宅组织为连续界面，可联系20世纪早期现代主义的集体生活实验。"}, "F-31": {"weather": "晴朗蓝天下，对称立面、巨拱与水平阳台形成整体秩序。住宅带上纪念性尺度，也显出公共生活的庄严。", "material": "项目年代为1930年。抹灰砌体、阳台板和重复门窗组成绵长立面，传统墙体做法进入大规模公共住宅。它可联系两次世界大战之间的社会住房建设，技术历史也体现在住宅如何被成片组织。"}, "F-32": {"weather": "明亮日光中，私人用品填入密集平台。相同单元逐渐显露不同生活，让重复之中的差异变得鲜明。", "material": "项目年代为2016年。对大型板式住宅进行最小干预更新，连续阳台和交通系统被保留并重新赋予生活多样性。"}, "S-32": {"weather": "夜色里，星形灯串与暖色橱窗相互映衬。光从建筑边缘向外展开，像把室内的温暖送到了街上。", "material": "这是一则年度节庆场景，具体拍摄年份未注明。灯串沿着栏杆勾勒住宅边界，可联系电气照明逐渐进入家庭节庆的过程。"}, "F-33": {"weather": "强烈日光穿过透明外皮，在长平台上投下斜影。视野与光线共同向外延伸，让空间带着扩展之后的舒展。", "material": "项目年代为2017年。楼板、金属框与透明围护沿旧楼外侧展开，形成可使用的冬季花园。它把20世纪60年代住宅带入新的更新阶段，以外扩空间延续既有建筑，体现从拆建转向保留改造的思路。"}, "S-33": {"weather": "从暮色到夜晚，密集暖灯与花饰包围着小小空间。外部逐渐暗下，近处却更显亲密，带着节日团聚的气氛。", "material": "这是一则年度节庆场景。灯串与挂饰穿过金属栏杆和盆栽，让传统节庆借助家用照明延伸到建筑外缘。"}, "F-34": {"weather": "晴朗白日里，深阳台逐层向外伸出。重复边缘不断接近天空，使建筑显得正在向外展开。", "material": "项目年代为2011年。原塔楼外侧加建透明冬季花园和深阳台，以轻型外挂结构替代传统拆除重建。"}, "F-35": {"weather": "明亮日光照着叠加在玻璃立面上的彩色盒体。大小与色彩交错，让建筑像容纳着多样生活的集合。", "material": "项目年代为2005年。不同住宅原型通过大尺度阳台、温室和工业材料探索低成本住房的空间扩展。"}, "S-34": {"weather": "夜间，月牙装饰、灯笼与暖色灯带共同亮起。小范围的光留住庆祝，也让节日显得安静而亲近。", "material": "这是一则年度节庆场景。地毯、灯具与金属栏组成临时节庆布置，传统织物和住宅构件在此相遇。"}, "F-36": {"weather": "带有暮色或摄影偏色的光线中，金属端部平台显得像船舱。工业形态进入居住场景，带来熟悉用途之外的陌生感。", "material": "项目年代为1987年。金属网栏、钢构件与板材组成宽阔外廊，让住宅边缘带有工业平台的气质。它把标准工业构件引入住房设计，技术选择直接服务于更充裕的户外使用空间。"}, "S-35": {"weather": "夜色中的红灯笼照亮竖向格栅，暖红光停在建筑边缘。熟悉的节庆色彩让空间带上归属感。", "material": "这是一则年度节庆场景，具体拍摄年份未注明。灯笼与电光源附着在金属格栅上，使传统节庆形象与家庭电气化并置。"}, "F-37": {"weather": "阴天般的漫射光下，细密网格被穿过立面的斜线打断。变化仍保持节制，使整体呈现克制的秩序。", "material": "项目年代为1998年。薄板、开口和阳台被组合成轻盈白色立面，单元差异通过空洞和半透明边界表达。"}, "F-38": {"weather": "晴朗蓝天下，种植露台逐层退让。住宅像顺着山坡展开，让居住与地形般的起伏连在一起。", "material": "项目年代为2008年。住宅像山坡一样覆盖停车楼，每户获得朝阳的大露台，建筑断面直接生成户外空间。"}, "F-39": {"weather": "日间漫射光中，条状体块围绕绿地层叠展开。密集建筑仍留出向外伸展的空隙，让群体生活带着开阔感。", "material": "项目年代为2013年。长条住宅以六边形方式堆叠，屋顶、空中花园与露台形成多层共享景观。"}, "F-40": {"weather": "晴朗日光下，植物从玻璃与楼板之间穿出。整齐建筑被生长的枝叶打散，像自然正进入城市内部。", "material": "项目年代为2013年。混凝土平台、玻璃栏板与种植系统共同构成住宅边缘，植物被纳入建筑立面。"}, "F-41": {"weather": "带着薄雾感的日光中，塔楼边缘逐层错动。轮廓在高处显得不完全落定，带来悬浮般的轻微不稳。", "material": "项目年代为2017年。楼板在高层不断错动，每户形成形状不同的外挑阳台，使塔楼呈现像素化轮廓。它沿用现场浇筑与楼层叠加的建造逻辑，把成熟的混凝土技术用于更不规则的高层住宅边界。"}, "F-42": {"weather": "明亮而略带雾感的白日里，水平楼板与绿化层层叠加。边缘向外延伸，让高处居住显得舒展。", "material": "项目年代为2017年。混凝土楼板以不同深度伸出，玻璃幕墙退到阴影之中，种植槽沿边缘布置。它让现代悬挑楼板同时承担户外起居、遮阳与绿化，呈现成熟结构技术在当代住宅中的再组织。"}, "F-43": {"weather": "日间树荫中，枝状钢架与繁密植物彼此交错。建筑构件像进入枝叶之间，带来住进树林般的包围感。", "material": "项目年代为2012年。钢构件、木质感平台和种植容器共同形成树屋般的边缘，可联系金属结构从工业建造进入日常居住的历史。"}, "S-59": {"weather": "日间薄雾般的柔和光线下，视线从高处俯瞰密集游行人群。身体保持距离，观看却仍加入公共活动。", "material": "这一生活场景延续至今。阳台天然形成高处观众席，居民无需离开住宅便可参与游行、庆典和街头表演。"}, "F-44": {"weather": "日间漫射光照着包裹旧体量的折面阳台。新旧形态在外缘相遇，让旧壳显出重新容纳生活的可能。", "material": "项目年代为2017年。旧粮仓改造后增加几何形外挂阳台，新构件与粗糙混凝土筒体形成强烈对比。它呈现旧结构保留与新构件附加的两层时间，把工业建筑的使用寿命向后延长。"}, "F-45": {"weather": "晴朗蓝天下，木色体块与露台逐层退下。柔和色调与缓慢下降的轮廓，让城市边缘显得温和而可亲。", "material": "项目年代为2018年。木质覆面、玻璃与种植槽随退台层层降低，给高密度住宅带来接近花园的尺度。"}, "F-46": {"weather": "多云的白日里，密集开口沿斜面体量向上延伸。视线顺着倾斜轮廓移动，感到一种持续攀升的动势。", "material": "项目年代为2016年。四周住宅围合中庭并向一角抬升，阳台随倾斜体量形成介于塔楼与街区之间的复杂立面。"}, "S-22": {"weather": "日间漫射光中，观众聚在窗口和小阳台上。身体留在边界之内，目光却投入外面的活动，形成安全距离内的刺激。", "material": "这是一则年度节庆场景，具体拍摄年份未注明。金属栏杆与织物承托观赛人群，显示街屋构件在年度节庆中被反复使用。"}, "F-47": {"weather": "晴间多云的天空下，彩色方格体量映入水面。不同色块并置在同一建筑中，像相邻住户各有自己的生活。", "material": "项目年代为2002年。彩色面板、玻璃和金属构件把住宅分成不同组块，呈现工业化围护材料的组合能力。"}, "S-23": {"weather": "夜间街灯照着人群、鲜花与悬挂织物。共同聚集的景象既热闹又庄重，让参与带着肃穆的仪式感。", "material": "这是一则年度节庆场景，具体拍摄年份未注明。栏杆上的织物与照明把住宅边缘变成观礼空间，体现固定构件和临时节庆装置的叠加。"}, "F-48": {"weather": "日间漫射光中，高处公共平台跨过建筑之间的空隙。原本分开的空间因此相连，让人想到在空中相遇的可能。", "material": "项目年代为2015年。多个住宅单元围绕高空共享花园组织，公共露台替代传统封闭走廊成为邻里交流节点。"}, "F-49": {"weather": "晴朗蓝天下，塔楼立面与绿化层彼此相接。明确的建筑秩序中留有生长空间，带来共同生活的安心。", "material": "项目年代为2017年。混养老住宅、医疗与公共设施垂直叠合，层层退台形成开放绿化平台和共享空间。它呈现当代城市把公共设施垂直叠合的思路，技术组织服务于更密集的社区生活。"}, "S-24": {"weather": "柔和日光下，戴面具的人物占据弧形栏台。建筑边缘像临时舞台，让公开扮演成为场景的中心。", "material": "这是一则年度节庆场景，具体拍摄年份未注明。石质柱廊与栏台框住盛装观众，延续威尼斯节庆中建筑与服饰共同组成观看场景的方式。"}, "F-50": {"weather": "日光与树荫相间，曲线绿化层穿插在室内空间之间。建筑仿佛被花园一层层包围，显得柔和而宜于停留。", "material": "项目年代为2013年。曲面平台、种植槽与玻璃将花园扩展到酒店立面，让混凝土成形与景观种植共同塑造人工地形。"}, "S-21": {"weather": "阴天般柔和的日光下，临栏人物俯视密集街道人群。高处并未隔绝热闹，反而让观看带着参与节庆的兴奋。", "material": "这是一则年度节庆场景，具体拍摄年份未注明。金属栏杆与木百叶成为节庆的看台，可联系新奥尔良街屋中铁艺外廊的历史。"}, "F-51": {"weather": "晴间有云的白日里，巨型连桥架在高塔之间。公共空间随之离开地面，带来共同生活升到高处的开阔想象。", "material": "项目年代为2009年。多栋住宅通过高层空中花园连接，把通常属于单户的阳台概念放大为公共城市平台。"}, "F-52": {"weather": "阴天漫射光下，方形阳台层层叠起，木色侧屏收住边缘。空间显得节制而安静，也保留着适度庇护。", "material": "项目年代为2002年。住宅以朝向、露台、温室和通风装置组织低能耗生活，阳台参与微气候调节。"}, "S-25": {"weather": "蓝色白日天空下，旗帜横跨窄街，密集色彩将建筑之间的空隙填满。庆祝仿佛从各家向外汇合，形成集体的狂喜。", "material": "事件或场景年代为2023年。砌体街屋与金属栏杆披上夺冠旗帜，长期存在的建筑承接了一次短暂的城市庆典。"}, "F-53": {"weather": "晴朗蓝天下，弯曲外廊串起绿色栏板与红色细部。连续界面像一条可以慢慢行走的街道，带着邻里尺度的亲切。", "material": "项目年代为1974—1982年。涂色金属栏杆与板材沿住宅长墙展开，使重复的建筑边缘带上街道般的细节。"}, "F-54": {"weather": "浅蓝晴空下，连续退台与大面积玻璃共同展开。建筑边缘显得开放，让集体生活拥有面向外部的余地。", "material": "项目年代为1972年。住宅从商业基座向上退台，层层阳台形成巨型城市阶梯和内部步行空间。它呈现20世纪复合功能建筑的探索，结构与剖面共同安排了城市活动的上下层次。"}, "F-55": {"weather": "晴朗强光照着基本住宅单元与可扩建空缺。未被填满的位置不显终结，反而像给未来生活留下尚未完成的希望。", "material": "项目年代为2004年。“半栋好房子”允许住户自行扩建，露台和空缺体量预留未来生长空间。它将现代基础建造与住户后续扩建结合，历史不只属于交付的那一年，也逐步写进后来增加的构件中。"}, "S-01": {"weather": "日间漫射光照着小阳台上的两位演奏者。有限空间因为共同演奏而向外打开，让隔离之中仍能感到人与人的连接。", "material": "原表记录的事件或场景年代为2020年。金属栏杆、抹灰墙与现代门窗承托起临时音乐会。旧有住宅构件在新的事件中获得公共用途，也让人看见建筑寿命与生活设备更新并不同步。"}, "X-10": {"weather": "直播间是一种窗口，一种对外展示的阳台。", "material": "把原本私人的房间变成持续向外观看的实时窗口。"}, "S-61": {"weather": "晴朗光线里，人站在阳台上对外演说。", "material": "综艺中阳台作为对外喊话的舞台，集中体现了阳台向外的作用。"}, "F-56": {"weather": "晴朗暖光落在低层街巷与连续生活入口之间。近人的尺度让相邻关系逐渐展开，带着邻里慢慢生长的感觉。", "material": "项目年代为1989—1993年。抹灰砌体、平台与门窗形成细密的邻里边界，传统建造材料参与低成本住宅的渐进生长。"}, "S-02": {"weather": "日光下，多个人在花饰栏杆与窗洞间举起标牌。各自的姿态汇成面向外部的表达，呈现共同发声的团结感。", "material": "原表记录的事件或场景年代为2020年。装饰金属栏杆与石饰墙面留下传统街屋的形象。"}, "F-57": {"weather": "晴间有云的天空下，成排坡屋顶与空缺半单元交替出现。整齐之中仍保留余地，让家显得能够随生活继续变化。", "material": "项目年代为2013年。基础单元预留可扩建的一半空间，门廊和阳台随着住户自建不断变化。"}, "F-58": {"weather": "晴朗强光与海面反光照着红蓝几何平台，长阴影划出层层转折。目光不断寻找路径，带来迷路般的好奇。", "material": "项目年代为1973年。楼梯、平台、露台和高墙构成红蓝色几何迷宫，阳台被融入整体空间序列。"}, "F-59": {"weather": "晴间有云的白日里，巨柱立面包围细密住宅开口。两种尺度彼此挤压，使日常居住带上戏剧性的压迫感。", "material": "项目年代为1982年。混凝土外观的巨型构件与玻璃共同组成古典般的立面，使重复住宅带上纪念性尺度。"}, "F-60": {"weather": "晴朗蓝天下，灰色花瓣状平台紧密重复。有机轮廓显得生动，厚实体量又让这种生动保留沉重感。", "material": "项目年代为1974年。花瓣状混凝土栏板围绕塔体重复展开，展示模具成形对住宅外观的塑造。"}, "S-13": {"weather": "日间漫射光中，多个人并排站立，红色帷幔覆盖栏台。整齐的排列使这一刻像公开展示的秩序。", "material": "事件或场景年代为2011年。石饰立面、玻璃门窗与仪式织物组成王室亮相的背景，耐久建筑与临时装饰叠在一起。"}, "F-61": {"weather": "多云的白日中，砖墙、连续栏台与花木共同构成街边界面。朴素构件承接着生长与使用，显出平常城市生活的温度。", "material": "项目年代为1931年。砖墙、金属栏杆与花箱共同组织连续阳台，让传统砌筑材料进入早期现代住宅的街区设计。"}, "F-62": {"weather": "日间漫射光下，大尺度绿化阳台层层退台。密集居住的外缘被植物展开，带来高密度之中的花园感。", "material": "项目年代为1973—1985年。巨大的弧形住宅层层退台，每户拥有宽阔绿化阳台，形成高密度中的“带花园住宅”。"}, "F-63": {"weather": "灰蓝色薄雾笼罩白日城市，连桥与地面绿化共同串联塔楼。上下路径彼此呼应，让高处空间也显得能够相互连接。", "material": "原表项目年代为2009年。多栋塔楼通过高空连桥连接，公共平台和露台把建筑群组织成垂直步行网络。"}, "S-12": {"weather": "黑白历史照片没有交代天气，高处人物被深窗洞与厚重建筑衬托出来。空间拉开观看距离，让庄严显得难以接近。", "material": "事件或场景年代为1922年。石质柱体与栏台承托仪式织物，延续宗教建筑以石作塑造公共观看界面的传统。"}, "S-11": {"weather": "晴朗蓝天下，逆光中的红色宫殿立面与旗帜显得庄重。建筑向外呈现的形象带着仪式感，也强调着权威。", "material": "布宜诺斯艾利斯五月广场前的玫瑰宫阳台长期承担政治演说功能，Perón与Evita都曾从这里面对群众讲话。私人建筑的一个开口因此转化为国家权力的公共舞台。"}, "S-14": {"weather": "柔和的日间光线照着粗糙墙面，悬挂的横幅把文字送入外部视野。安静的建筑因此带上要求被听见的迫切。", "material": "事件或场景年代为2018年。印字织物挂上砖石墙与金属栏杆，住宅边缘临时成为传播信息的媒介。"}, "S-26": {"weather": "明亮日光中，旗帜沿连续栏杆展开。私人边界由此成为公开表达的位置，仿佛把各自的立场直接挂到了街上。", "material": "事件或场景年代为2010年代至今。金属栏杆、玻璃门窗与卷帘上添挂旗帜，显出住宅在日常维护中不断叠加构件的过程。"}, "S-27": {"weather": "明亮白日里，多面旗帜聚在装饰性窗前。鲜明形象面向外部，使个人或群体的认同成为公开可见的表达。", "material": "事件或场景年代为2022至今。居民把乌克兰国旗挂在阳台和窗边，以低门槛方式公开表达政治立场与跨国声援。"}, "S-28": {"weather": "柔和日光下，彩虹旗嵌在重复的住宅窗格之间。整齐立面因此出现鲜明差异，让归属与自我表达能够被看见。", "material": "当代生活场景。彩虹旗挂在砖墙与装饰金属栏杆之间，旧有街屋界面成为当代身份表达的空间。"}, "S-29": {"weather": "阴天的反射光映着玻璃，海报整齐排在窗内。日常开口因此成为表达态度的位置，让表态进入平常的居住空间。", "material": "当代生活场景。纸质海报贴近玻璃与金属框，现代门窗临时承担了面向街道的信息展示。"}, "S-30": {"weather": "日间漫射光照着小平台前的文字标语。住宅边缘不再沉默，私人生活与向外发声在这里相接。", "material": "事件或场景年代为2020年。标语依附金属网栏板，背后是砖墙与玻璃门窗，工业制品组成的住宅界面参与了公共表达。"}, "S-31": {"weather": "阴天般的柔和光线中，大横幅覆盖建筑转角。文字占据居住空间的外表，让住房焦虑与抵抗的意味变得醒目。", "material": "事件或场景年代为2010年代至今。横幅挂在砌体墙与金属栏之间。"}, "S-17": {"weather": "黑白历史照片中，上层密集人物与下方人群相对，实际天气并不明确。上下聚集的关系让画面带着秩序可能动摇的紧张。", "material": "事件或场景年代为1989年。石质栏台与柱体把演说者抬向人群，显示厚重建筑被用作政治展示的界面。"}, "S-18": {"weather": "黑白历史照片没有交代天气，人物肩并肩靠近麦克风。身体与声音聚向同一处，形成共同发声时的凝聚与紧张。", "material": "事件或场景年代为1989年。麦克风让高处的演说进入更大范围的公共空间，可联系20世纪扩声技术与群众集会的结合。"}, "S-19": {"weather": "黑白历史照片里，单一演说者从深暗背景中凸显，天气无法判断。强烈的视觉集中让权威带上压迫感。", "material": "事件或场景年代为20世纪20—40年代。石质栏台前出现麦克风与线缆，使传统建筑舞台接入现代扩声技术。旧有立面承托新的传播设备，呈现20世纪政治集会中建筑与声音技术的叠合。"}, "S-20": {"weather": "黑白历史照片中，多个人在栏台上共同面向外部，具体天气不明。朝向一致的姿态让政治动员呈现聚合的力量。", "material": "事件或场景年代为1917年。厚实栏台与装饰外墙构成演说背景，留下既有建筑被赋予政治用途的痕迹。"}, "S-60": {"weather": "黑白历史照片中，多个人面向外部致辞，天气晴朗，人物朝向一致。", "material": "事件年代为1949年，新中国国家领导人们面向人群致辞，天安门作为\"阳台”属于极端向外的政治用途。"}};

let openSearchDetail;
/* READER-01: independent reading view. Original index numbers and main-page state stay intact. */
{
  'use strict';
  const details=window.BALCONY_DETAILS;
  const section=document.createElement('section');section.id='quick-reader';section.hidden=true;section.setAttribute('aria-label','快速阅读档案');section.tabIndex=-1;
  section.innerHTML=`<div id="quick-list-view"><header class="quick-header"><button id="quick-return">← 返回检索</button><p class="quick-eyebrow">Inside &amp; Outside</p><h1>阳台档案图鉴 <span lang="en">The Balcony</span></h1><p class="quick-motto">一隅之见，一面之间。</p><p id="quick-intro"></p><nav id="quick-filters" aria-label="筛选档案分类"></nav><p id="quick-count" role="status" aria-live="polite"></p></header><div id="quick-grid"></div></div><article id="quick-detail" hidden><button id="quick-back" aria-label="返回瀑布流与汉堡菜单">← 返回</button><div class="quick-detail-layout"><figure><img id="quick-detail-image" alt=""><figcaption id="quick-detail-caption"></figcaption></figure><div id="quick-detail-copy"></div></div><button id="quick-locate" aria-label="前往主页中此档案的原位置">在主页中查看 ↗</button></article>`;
  document.body.append(section);
  const $=id=>section.querySelector('#'+id),grid=$('quick-grid'),list=$('quick-list-view'),detail=$('quick-detail');
  $('quick-intro').textContent=document.querySelector('.index-section p:last-child').textContent;
  let filter='',selected=0,scroll=0,lastCard=null,previousFocus=null,layoutFrame=0;
  const categories=['社会素材','文学意象','经典艺术档案','形式灵感','戏仿'];
  const create=(tag,text,cls)=>{const el=document.createElement(tag);if(text!=null)el.textContent=text;if(cls)el.className=cls;return el;};
  const number=i=>String(i+1).padStart(3,'0');
  const cards=entries.map((e,i)=>{
    const card=create('button',null,'quick-card');card.dataset.index=i;card.setAttribute('aria-label',`${number(i)} ${e.title}，查看完整档案`);
    const media=create('span',null,'quick-media'),img=create('img');img.src=e.image;img.alt=e.title;img.loading='lazy';img.decoding='async';img.width=e.width;img.height=e.height;
    const hover=create('span',null,'quick-hover');hover.append(create('span',`${e.category} · ${e.year}`),create('span',e.author),create('span','阅读档案 ↗','quick-action'));
    media.append(img,hover);const caption=create('span',null,'quick-card-caption');caption.append(create('span',e.title),create('small',number(i)));
    card.append(media,caption);card.addEventListener('click',()=>openDetail(i,card));grid.append(card);return card;
  });
  // Grid rows follow actual media ratio. CSS-grid dense packing keeps the rectangles compact.
  function layout(){cancelAnimationFrame(layoutFrame);layoutFrame=requestAnimationFrame(()=>{
    if(section.hidden||list.hidden)return;
    cards.forEach(card=>{if(card.hidden)return;const height=card.firstElementChild.getBoundingClientRect().height+card.lastElementChild.getBoundingClientRect().height+24;card.style.gridRowEnd=`span ${Math.ceil(height/8)}`;});
  });}
  new ResizeObserver(layout).observe(grid);document.fonts.ready.then(layout);
  categories.forEach(name=>{
    const button=create('button',name);button.setAttribute('aria-pressed','false');
    button.addEventListener('click',()=>{filter=filter===name?'':name;applyFilter();});$('quick-filters').append(button);
  });
  function applyFilter(){
    cards.forEach((card,i)=>card.hidden=!!filter&&entries[i].category!==filter);
    [...$('quick-filters').children].forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===filter)));
    $('quick-count').textContent=`${filter||'全部档案'} / ${cards.filter(c=>!c.hidden).length}`;layout();
  }
  let fromSearch=false, panelScroll=0;
  function open(){
    panelScroll=window.scrollY; previousFocus=document.activeElement;
    drawer.hidden=true;section.hidden=false;detail.hidden=true;list.hidden=false;
    section.scrollTop=scroll;section.focus();layout();
  }
  function close(){
    section.hidden=true;drawer.hidden=false;window.scrollTo(0,panelScroll);
    previousFocus?.focus({preventScroll:true});
  }
  openSearchDetail=(index,button)=>{open();fromSearch=true;openDetail(index,button)};
  function paragraph(parent,title,text){if(!text)return;const block=create('section',null,'quick-text-block');block.append(create('h3',title));const p=create('p',text.replace(/([，。])/g,'$1\n'));block.append(p);parent.append(block);}
  function openDetail(index,card){
    selected=index;lastCard=card;scroll=section.scrollTop;const e=entries[index];
    const img=$('quick-detail-image');img.src=e.image;img.alt=e.title;img.width=e.width;img.height=e.height;
    $('quick-detail-caption').textContent=`${number(index)} / ${e.id} · ${e.title}`;
    const copy=$('quick-detail-copy');copy.replaceChildren();copy.append(create('p',`${number(index)} / ${e.category}`,'quick-eyebrow'),create('h2',e.title),create('p',e.original,'quick-original'));
    const metadata=create('dl');[['分类编号',e.id],['分类标签',e.category],['词条',e.title],['英文 / 原名',e.original],['作者 / 来源',e.author],['年代',e.year]].forEach(([k,v])=>{metadata.append(create('dt',k),create('dd',v||'—'));});copy.append(metadata);
    const keywords=create('section',null,'quick-keywords');keywords.append(create('h3','检索关键词'));const tags=create('div');
    // Only existing metadata is used; no invented source keywords.
    [...new Set([e.id,e.category,e.title,e.original,e.author,e.year].filter(Boolean))].forEach(word=>tags.append(create('span',word)));keywords.append(tags);copy.append(keywords);
    const original=details[e.id]||e;
    paragraph(copy,'天气与情绪',original.weather);paragraph(copy,'材质与历史',original.material);
    list.hidden=true;detail.hidden=false;section.scrollTop=0;$('quick-back').focus({preventScroll:true});
  }
  function back(){if(fromSearch){fromSearch=false;close();return;}detail.hidden=true;list.hidden=false;section.scrollTop=scroll;layout();lastCard?.focus({preventScroll:true});}
  document.getElementById('quick-read-open').addEventListener('click',open);
  $('quick-return').addEventListener('click',()=>close());$('quick-back').addEventListener('click',back);$('quick-locate').addEventListener('click',()=>close(selected));
  section.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.body.classList.contains('index-open')){e.preventDefault();detail.hidden?close():back();}});
  $('quick-locate').remove();
  applyFilter();
}</script></html>
