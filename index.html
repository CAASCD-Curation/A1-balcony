<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内外之间 · 116件动态档案</title><style>@font-face{font-family:Chinese;src:url(assets/27e6ed2b6c7e046c6ed1de0f.woff)}@font-face{font-family:ChineseMedium;src:url(assets/d022d918740776c753454aae.woff)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;overscroll-behavior:none;touch-action:none}main{width:100%;height:100%;display:flex;align-items:center;justify-content:center}#composition{position:relative;flex:none}.poster{position:absolute;inset:0;display:none;background:#fff;overflow:hidden}.poster.selected{display:block}.poster svg{width:100%;height:100%;display:block;user-select:none}.photo{cursor:grab}.photo.dragging{cursor:grabbing}@font-face{font-family:English;src:url(assets/edf160d0d584deee8a3bb2c3.otf)}@font-face{font-family:EnglishMedium;src:url(assets/0ea4e99e737025b53f87d377.otf)}</style></head><body><main aria-label="双指收缩向内，张开向外；方向键也可切换"><div id="composition"></div></main><script>const ARTWORKS=[{"id": "INNER", "title": "检索 · 流影 · 并陈 · 归档", "zone": "中间过渡", "width": 1434, "height": 1899, "image": "", "pairs": [["木棺取代人物，使熟悉场景变得静止而惊悚。", "绿栏与百叶门保留原有框架，内部主体却被置换。"], ["本应停留的身体以封闭容器的形态出现。", "阳台的展示位置承托了缺席而非日常动作。"], ["建筑向外开放，棺体却把内部完全封闭。", "两种相反的围合方式在同一画面中并置。"], ["观者认出旧构图，也遭遇无法回应的对象。", "人物目光的消失使观看失去互相回应的可能。"], ["熟悉图像的再造改变了住宅场景的公共记忆。", "阳台在引用与置换中成为讨论观看和缺席的结构。"]], "en": [["Coffins replace the figures, making a familiar scene still and unsettling.", "The green railing and shutters retain the frame while its occupants are replaced."], ["Bodies that should linger appear instead as closed containers.", "The balcony's display position supports absence rather than everyday movement."], ["The building opens outwards while the coffins seal their interiors.", "Two opposing forms of enclosure coexist within one picture."], ["We recognise an earlier composition but face objects unable to respond.", "The disappearance of human gazes removes the possibility of reciprocal looking."], ["Remaking a familiar image alters the public memory of a domestic scene.", "Through quotation and substitution, the balcony becomes a structure for examining looking and absence."]], "layers": 1, "blank": true}, {"id": "A-08", "title": "《透视 II：马奈的阳台》", "zone": "中间过渡", "width": 1434, "height": 1899, "image": "assets/d39cddadd851ab7f12dc932f.jpg", "pairs": [["木棺取代人物，使熟悉场景变得静止而惊悚。", "绿栏与百叶门保留原有框架，内部主体却被置换。"], ["本应停留的身体以封闭容器的形态出现。", "阳台的展示位置承托了缺席而非日常动作。"], ["建筑向外开放，棺体却把内部完全封闭。", "两种相反的围合方式在同一画面中并置。"], ["观者认出旧构图，也遭遇无法回应的对象。", "人物目光的消失使观看失去互相回应的可能。"], ["熟悉图像的再造改变了住宅场景的公共记忆。", "阳台在引用与置换中成为讨论观看和缺席的结构。"]], "en": [["Coffins replace the figures, making a familiar scene still and unsettling.", "The green railing and shutters retain the frame while its occupants are replaced."], ["Bodies that should linger appear instead as closed containers.", "The balcony's display position supports absence rather than everyday movement."], ["The building opens outwards while the coffins seal their interiors.", "Two opposing forms of enclosure coexist within one picture."], ["We recognise an earlier composition but face objects unable to respond.", "The disappearance of human gazes removes the possibility of reciprocal looking."], ["Remaking a familiar image alters the public memory of a domestic scene.", "Through quotation and substitution, the balcony becomes a structure for examining looking and absence."]], "layers": 1}, {"id": "S-44", "title": "阳台养蜂", "width": 1200, "height": 1800, "image": "assets/bda73440fa61f4c1bf881efa.jpg", "pairs": [["防护服与蜂箱让阳台劳动显得谨慎专注。", "木箱、金属网和防护织物形成不同尺度的保护。"], ["照料蜂群要求身体放慢动作并保持距离。", "蜂箱将居住外缘转为与其他生命协作的场所。"], ["人的居所与蜂的活动范围在这里相接。", "箱体限定蜂巢位置，飞行却会越过住宅边界。"], ["操作时的目光需要注意细小生命的变化。", "防护用品调节接近程度，而不是取消相互影响。"], ["私人养蜂使邻里环境成为需要共同考虑的条件。", "阳台中的生产实践把居住与城市生态联系起来。"]], "en": [["Protective clothing and hives make balcony work attentive.", "Protective clothing and hives make balcony work attentive."], ["Caring for bees requires slow movements and distance.", "Caring for bees requires slow movements and distance."], ["Human homes meet the activity of bees here.", "Human homes meet the activity of bees here."], ["The beekeeper watches for tiny changes in living things.", "The beekeeper watches for tiny changes in living things."], ["Private beekeeping makes the neighbourhood a shared concern.", "Private beekeeping makes the neighbourhood a shared concern."]], "layers": 1}, {"id": "S-07", "title": "阳台抽烟的人", "width": 3363, "height": 5045, "image": "assets/c5c31da9fb6a0cade592cfe7.jpg", "pairs": [["远处的小小身影停在蓝灰色的建筑边缘。", "栏杆限定停留位置，立面把人物框成局部。"], ["抽烟像是从室内生活中暂时退出的片刻。", "吸烟行为把阳台用作短暂停靠的半户外场所。"], ["人离开房间，仍没有真正离开自己的家。", "烟气可以随空气越过私人平台的边缘。"], ["远看只能辨认身影，难以知道其内心状态。", "建筑距离让人物可见，却保留了表情和细节。"], ["独处行为也可能影响邻人的空气体验。", "阳台上的个人习惯通过烟气与共同环境相连。"]], "en": [["A small distant figure pauses at the edge of a blue-grey building.", "Railings define a place to stand, while the facade frames the figure as a fragment."], ["Smoking seems a momentary withdrawal from life indoors.", "Smoking turns the balcony into a semi-outdoor place for a brief pause."], ["The person leaves the room without truly leaving home.", "Smoke can drift with the air beyond the edge of the private platform."], ["From afar, one can identify a figure but scarcely know their state of mind.", "Architectural distance makes the person visible while withholding expression and detail."], ["An act of solitude may also affect the air experienced by neighbours.", "Smoke connects a personal habit on the balcony with the shared environment."]], "layers": 1}, {"id": "S-48", "title": "儿童阳台游戏区", "width": 622, "height": 350, "image": "assets/0f4709ccc959d77187c28b56.jpg", "pairs": [["孩子靠近防护网，让边缘显出探索的好奇。", "软性绳网补充了原有金属栏杆的围护。"], ["儿童可以在受照看的位置接近外部动静。", "游戏把阳台转为家庭照料和活动的延伸。"], ["保护与接触外界同时成为边界的任务。", "网格增加阻隔，也仍允许空气和视线通过。"], ["孩子透过网格观看，成人观察孩子的动作。", "防护界面同时组织向外探索与向内照看的目光。"], ["儿童需求让标准住宅构件接受新的检验。", "阳台改造体现共同居住中对不同身体尺度的考虑。"]], "en": [["A child near the safety net explores the edge with curiosity.", "A child near the safety net explores the edge with curiosity."], ["Children approach the outside while remaining in view.", "Children approach the outside while remaining in view."], ["The boundary must both protect and connect.", "The boundary must both protect and connect."], ["Children look through the mesh as adults watch them.", "Children look through the mesh as adults watch them."], ["Children's needs test standard housing elements anew.", "Children's needs test standard housing elements anew."]], "layers": 1}, {"id": "L-01", "title": "《罗密欧与朱丽叶》", "width": 960, "height": 1434, "image": "assets/1a0535ff692329768c8b13bd.jpg", "pairs": [["相隔高低的身体让靠近显得迫切。", "原表配图以攀爬姿态和窗口组织相会位置。"], ["交谈使两个人在无法并肩时仍能建立亲密。", "高低站位让语言承担缩短距离的作用。"], ["家庭边界限制接近，却没有阻止情感向外。", "窗口式开口在围护中保留相互回应的通道。"], ["彼此仰望与俯视，使相见带着不对称的紧张。", "不同高度把观看组织为需要回应的双向动作。"], ["私人爱情受到家庭关系与外部秩序的影响。", "后世阳台意象把这种受限的亲密凝结为广泛传播的场景。"]], "en": [["Bodies separated by height make the desire for closeness urgent.", "The source illustration uses a climbing figure and a window to stage the meeting."], ["Conversation creates intimacy when two people cannot stand together.", "Different heights give language the task of reducing distance."], ["The family's boundary restricts approach without stopping feeling from reaching out.", "An opening preserves a channel of response within the enclosure."], ["Looking up and down gives the meeting an unequal tension.", "Different heights turn looking into a two-way action that calls for a response."], ["Private love is shaped by family relations and the surrounding social order.", "The later balcony motif condenses this constrained intimacy into a widely shared scene."]], "layers": 1}, {"id": "L-03", "title": "《倾城之恋》", "width": 600, "height": 337, "image": "assets/0d217bd037acaafc637fa09d.jpg", "pairs": [["配图中相互靠近的身体暂时抵住动荡。", "靠墙停留使人物处于居所与外部环境的接合处。"], ["有限庇护让亲密在不安中获得片刻支撑。", "过渡空间提供暂时停留而非彻底隔绝的条件。"], ["人物尚未进入街道，也无法完全退出现实。", "住宅边缘使室内关系与都市变化保持接触。"], ["观看城市也可能成为重新理解自身处境的方式。", "固定站位把个人关系放到更大的环境之前。"], ["私人命运与城市动荡在同一空间相互影响。", "阳台意象使亲密生活与外部历史之间的联系可以被感知。"]], "en": [["Bodies drawing close briefly withstand upheaval.", "Bodies drawing close briefly withstand upheaval."], ["Limited shelter supports intimacy amid uncertainty.", "Limited shelter supports intimacy amid uncertainty."], ["The figures neither enter the street nor escape reality.", "The figures neither enter the street nor escape reality."], ["Looking at the city can change one's sense of circumstance.", "Looking at the city can change one's sense of circumstance."], ["Private lives and urban turmoil affect one another.", "Private lives and urban turmoil affect one another."]], "layers": 1}, {"id": "S-52", "title": "阳台吊床", "width": 736, "height": 1104, "image": "assets/3a48c2a2e7b167b6014c4abf.jpg", "pairs": [["悬起的吊床让狭小空间显得轻松。", "编织床面通过支点形成柔软的悬挂结构。"], ["身体可以摇晃，在日常节奏中暂时停下来。", "吊床用悬挂而非铺满地面的方式安排休闲。"], ["人被轻轻托住，仍能感到外部空气。", "柔性织物在硬质墙面与栏杆之间形成身体边界。"], ["躺下后，观看从平视变成更低、更倾斜的角度。", "悬挂高度改变了身体与栏杆之间的视线关系。"], ["私人休闲借用有限住宅边缘获得空间。", "阳台显示居住品质也来自对身体姿态的细致安排。"]], "en": [["A suspended hammock gives a small space a sense of ease.", "A woven bed forms a soft hanging structure between its supports."], ["The body can sway and briefly pause within the rhythms of daily life.", "The hammock arranges leisure by hanging rather than filling the floor."], ["One is gently supported while still feeling the outdoor air.", "Flexible fabric forms a bodily boundary between hard walls and railings."], ["Lying down shifts the gaze from eye level to a lower, more tilted angle.", "The suspension height changes the sightline between the body and the railing."], ["Private leisure gains space by borrowing the limited edge of the home.", "The balcony shows how quality of life can arise from careful arrangements of bodily posture."]], "layers": 1}, {"id": "L-04", "title": "《红玫瑰与白玫瑰》", "width": 2373, "height": 1350, "image": "assets/bb720d865d296bb9a36c5bb9.jpg", "pairs": [["配图中的近身姿态让周围世界逐渐退后。", "暖暗背景与近距离构图突出隐秘的身体关系。"], ["普通住宅边缘因人物相处而带上暧昧。", "阳台为接近和停留提供介于家内与外部的位置。"], ["欲望希望靠近，也需要避免过多显露。", "半开放空间同时提供相会机会与被发现的可能。"], ["人物关注彼此，外部目光仍构成潜在压力。", "遮掩与显露的程度影响亲密关系的空间气氛。"], ["私人欲望始终与家庭角色和社会期待相接。", "阳台让情感越界在日常住宅中获得可见的发生位置。"]], "en": [["Intimate gestures push the surrounding world into the background.", "Intimate gestures push the surrounding world into the background."], ["An ordinary residential edge becomes charged with desire.", "An ordinary residential edge becomes charged with desire."], ["Desire seeks closeness while avoiding exposure.", "Desire seeks closeness while avoiding exposure."], ["The figures attend to each other under a possible outside gaze.", "The figures attend to each other under a possible outside gaze."], ["Private desire meets family roles and social expectations.", "Private desire meets family roles and social expectations."]], "layers": 1}, {"id": "L-05", "title": "《阳台》", "width": 1920, "height": 1036, "image": "assets/4e6af2226a131aafb5a3a3bd.jpg", "pairs": [["拼接身体让亲密呈现出表演的意味。", "原表配图通过不同姿态并置强调角色的可变性。"], ["人物进入角色，也可能在扮演中体验权力。", "表演空间为身份转换提供被安排的场景。"], ["现实与幻象之间的界线变得不稳定。", "空间通过角色、装置与观看关系组织不同身份。"], ["被观看使扮演具有说服力，也暴露其人为性。", "观众与表演者共同维持场景的意义。"], ["私人欲望与公共权威在表演中互相映照。", "此处的阳台作为空间隐喻，连接身份展示与社会权力。"]], "en": [["Collaged bodies give intimacy a theatrical quality.", "Collaged bodies give intimacy a theatrical quality."], ["Playing a role can also become an experience of power.", "Playing a role can also become an experience of power."], ["The boundary between reality and illusion grows unstable.", "The boundary between reality and illusion grows unstable."], ["Being watched lends a performance credibility and exposes its artifice.", "Being watched lends a performance credibility and exposes its artifice."], ["Private desire and public authority mirror each other in performance.", "Private desire and public authority mirror each other in performance."]], "layers": 1}, {"id": "A-01", "title": "《阳台》", "width": 762, "height": 1082, "image": "assets/b1e2fab2d419955297df9e5a.jpg", "pairs": [["明亮衣裙与暗室相接，使并立人物显得疏离。", "绿色栏杆在前景画出一道清晰的住宅边界。"], ["人物共同站立，却没有形成明确交流。", "阳台提供共处位置，人物朝向仍保持差异。"], ["身体来到室外边缘，暗室仍在身后延续。", "门洞与栏杆构成由内向外的两重分界。"], ["观者能看见人物，却难以判断他们在看什么。", "不同视线方向打断了统一的观看中心。"], ["城市中的相邻并不自动成为亲密。", "住宅边缘把个体展示与彼此隔离放在同一场景。"]], "en": [["Bright dresses against the dark interior make the figures seem distant from one another.", "A green railing draws a clear boundary to the dwelling in the foreground."], ["The figures stand together without visibly engaging with one another.", "The balcony offers a shared position while allowing the figures to face different directions."], ["The bodies reach the outdoor edge while the dark room continues behind them.", "The doorway and railing form two successive boundaries from inside to outside."], ["We can see the figures, yet cannot tell exactly what they are looking at.", "Their divergent gazes disrupt a single centre of attention."], ["Proximity in the city does not automatically create intimacy.", "The edge of the dwelling brings individual display and mutual separation into the same scene."]], "layers": 1}, {"id": "L-07", "title": "《在阳台上》", "width": 960, "height": 1379, "image": "assets/6e8357e0e51bc3b577bb6630.jpg", "pairs": [["近处夜色让两人的相处显得私密。", "原表配图用木廊与暗远景建立内外层次。"], ["从热闹室内走到阳台，身体获得短暂安静。", "平台承接从聚集活动中退出的停留。"], ["身后有人声，前方是更开阔的夜晚。", "建筑开口把拥挤内部与安静外部连接起来。"], ["人物看向远处灯光，也更容易注意到近旁的人。", "远景退暗使近距离关系得到突出。"], ["私密并非完全隔绝，也可以发生在集体活动旁边。", "阳台提供了暂时调整人与人接近程度的空间。"]], "en": [["The nearby darkness makes companionship feel private.", "The nearby darkness makes companionship feel private."], ["Leaving the busy interior brings the body a moment of quiet.", "Leaving the busy interior brings the body a moment of quiet."], ["Voices remain behind while the night opens ahead.", "Voices remain behind while the night opens ahead."], ["Distant lights draw attention to the person close by.", "Distant lights draw attention to the person close by."], ["Privacy can exist alongside collective activity.", "Privacy can exist alongside collective activity."]], "layers": 1}, {"id": "A-02", "title": "《阳台上的玛哈》", "width": 2418, "height": 3722, "image": "assets/7e1d35b82c8d718eac652101.jpg", "pairs": [["前景女性在暗部衬托下带着被注视的不安。", "细栏杆把明亮人物与身后阴影分层组织。"], ["临栏停留呈现一种面向外部的身体姿态。", "平台使人物能够显露，同时保留身后退入的位置。"], ["可见与隐藏在很短的距离内相接。", "暗背景遮住部分身体，栏杆限定前方边缘。"], ["观者注视女性，也意识到身后的其他目光。", "人物前后关系形成不对称的观看位置。"], ["住宅开口中的露面具有社会展示的意味。", "画面提示私人边缘也可能成为受他人审视的位置。"]], "en": [["Women in the foreground seem uneasy under the gaze.", "Women in the foreground seem uneasy under the gaze."], ["Pausing at the railing turns the body towards the outside.", "Pausing at the railing turns the body towards the outside."], ["Visibility and concealment meet within a short distance.", "Visibility and concealment meet within a short distance."], ["We look at the women and sense other eyes behind them.", "We look at the women and sense other eyes behind them."], ["Appearing at a residential opening becomes a social display.", "Appearing at a residential opening becomes a social display."]], "layers": 1}, {"id": "S-54", "title": "阳台日光浴", "width": 960, "height": 640, "image": "assets/eac26126843cdcac2882d350.jpg", "pairs": [["日光中的身体让住宅边缘带上度假感。", "朝向与开放平台提供接近阳光的位置。"], ["居民在家中短暂享受户外休憩。", "日光浴使阳台成为以身体舒适为中心的使用空间。"], ["人希望接触太阳，也可能希望避开他人目光。", "栏杆高度与相邻建筑关系共同影响遮蔽程度。"], ["晒太阳时的身体放松，并不代表主动接受注视。", "向外开放的视野与向内保护的需求并存。"], ["私人度假体验在密集城市住宅中被重新安排。", "阳台使用说明开放程度需要与个人隐私相协调。"]], "en": [["A body in sunlight gives the edge of the home the feeling of a holiday.", "Orientation and an open platform provide a place close to the sun."], ["Residents briefly enjoy outdoor rest while remaining at home.", "Sunbathing makes the balcony a space organised around bodily comfort."], ["One may seek contact with the sun while wishing to avoid other people’s eyes.", "Railing height and neighbouring buildings together determine the degree of screening."], ["A relaxed body in the sun does not imply a willingness to be watched.", "An outward view coexists with a need for inward protection."], ["The experience of a private holiday is rearranged within dense urban housing.", "Balcony use shows that openness must be balanced with personal privacy."]], "layers": 1}, {"id": "A-03", "title": "《阳台上的女人与孩子》", "width": 2606, "height": 3200, "image": "assets/cc741295b946ad04c856751b.jpg", "pairs": [["母女背影让远望带上被照看的安稳。", "深色栏杆在人物与灰蓝城市之间形成分界。"], ["共同停留使观看成为陪伴的一部分。", "成人与孩子共享平台，却以不同身体尺度接近边缘。"], ["外部城市可见，身体仍停在受围护的位置。", "栏杆把开阔视野与有限活动空间结合起来。"], ["观者跟随背影看向远处，而非直接面对表情。", "背向构图使城市成为人物与观者共享的方向。"], ["照护关系在住宅外缘获得可见形象。", "家庭生活通过共同远望与城市环境发生联系。"]], "en": [["The mother and child seen from behind give the distant view a sense of care and security.", "Dark railings divide the figures from the grey-blue city."], ["Lingering together makes looking part of companionship.", "Adult and child share a platform but approach its edge at different bodily scales."], ["The city is visible while the bodies remain sheltered.", "Railings combine an open view with a limited space for movement."], ["We follow the figures towards the distance rather than facing their expressions.", "The rear view makes the city a direction shared by figures and viewer."], ["A relationship of care becomes visible at the edge of the dwelling.", "Family life meets the city through the act of looking out together."]], "layers": 1}, {"id": "L-08", "title": "《西哈诺·德·贝热拉克》", "width": 694, "height": 1000, "image": "assets/a93b68c0ca1470836683bcaf.jpg", "pairs": [["高低人物与暗处让对话显得隐秘。", "原表配图用墙、栏杆与门窗搭起分层相会场景。"], ["声音可以先于身体抵达被爱的人。", "上下距离使表达依赖听觉与想象。"], ["可听见的表达与可看清的身份未必重合。", "阴影和高差为声音与身体之间留下错位空间。"], ["听者理解声音，未必能完整确认发声者。", "遮蔽使观看不能单独决定人物关系。"], ["亲密表达也受到身份、外貌与自我呈现的影响。", "阳台场景把被听见与被看见之间的差异转为空间经验。"]], "en": [["Figures above and below make conversation secretive.", "Figures above and below make conversation secretive."], ["A voice can reach the beloved before the body does.", "A voice can reach the beloved before the body does."], ["An audible expression need not reveal a visible identity.", "An audible expression need not reveal a visible identity."], ["The listener may not fully identify the speaker.", "The listener may not fully identify the speaker."], ["Intimacy is shaped by identity, appearance and self-presentation.", "Intimacy is shaped by identity, appearance and self-presentation."]], "layers": 1}, {"id": "A-04", "title": "《拉法耶特街》", "width": 3752, "height": 4656, "image": "assets/4c4191c251a175fb3cf82dc6.jpg", "pairs": [["倾斜街道与密集人流带来俯视的眩晕。", "近处栏杆为向下展开的街景确定观察位置。"], ["临栏观看使身体暂停而城市继续运动。", "高处平台让行走的街道转为可凝视的景象。"], ["近处安定与远处急促在边缘相接。", "栏杆和高差隔开住宅停留与街道流动。"], ["目光沿倾斜方向进入繁密城市。", "俯视构图压缩街道人流，强化运动节奏。"], ["个体在住所边缘感受现代城市的速度。", "阳台把日常居住与公共街道组织成不同节奏。"]], "en": [["A tilted street and dense crowds make looking down dizzying.", "A tilted street and dense crowds make looking down dizzying."], ["The body pauses at the railing while the city moves on.", "The body pauses at the railing while the city moves on."], ["Nearby stillness meets distant haste at the edge.", "Nearby stillness meets distant haste at the edge."], ["The gaze follows the slope into the crowded city.", "The gaze follows the slope into the crowded city."], ["The home's edge offers a personal experience of urban speed.", "The home's edge offers a personal experience of urban speed."]], "layers": 1}, {"id": "A-05", "title": "《街道进入房屋》", "width": 4605, "height": 4569, "image": "assets/ed359b31318b9afa81947e70.jpg", "pairs": [["碎裂街景仿佛涌进近处房屋。", "相互穿透的线条削弱了栏杆与街道的分界。"], ["观看者像被城市运动卷入，难以安静旁观。", "画面将临栏观看组织为感知外部冲击的过程。"], ["内外不再保持整齐分开，而在视觉上彼此渗透。", "重叠形体让建筑边界失去稳定轮廓。"], ["视线在施工、建筑与人物之间快速跳转。", "多方向线条取代单一固定的观看位置。"], ["城市变化进入了个人居住的感官经验。", "阳台在画中成为公共运动影响私人空间的界面。"]], "en": [["Fragmented street scenes seem to surge into the nearby house.", "Intersecting lines weaken the division between railing and street."], ["The viewer seems swept into urban movement, unable to remain a quiet observer.", "Looking from the railing becomes an encounter with the impact of the outside."], ["Inside and outside cease to be neatly divided and visually penetrate each other.", "Overlapping forms deprive the architectural boundary of a stable outline."], ["The gaze jumps rapidly between construction, buildings and people.", "Lines in multiple directions replace a single fixed viewpoint."], ["Urban change enters the sensory experience of domestic life.", "The painted balcony mediates the impact of public movement on private space."]], "layers": 1}, {"id": "L-10", "title": "《唐璜》", "width": 1000, "height": 1497, "image": "assets/a62d6dab8c9f73fcc9dc8e66.jpg", "pairs": [["舞台上的攀爬让亲近带上冒险感。", "配图用栏台与柱体划出上下分开的站位。"], ["身体试图接近，情感也因此显得紧张。", "跨越高差使相会成为有过程的动作。"], ["边界提供相见位置，也可能阻碍实际进入。", "栏台把被看见的接近与进入内部的行为分开。"], ["高处人物与攀爬者形成彼此注视的关系。", "舞台调度通过高度差突出欲望的方向。"], ["私人追求在他人的观看中成为戏剧事件。", "阳台把亲密愿望、空间限制与公开表演联系起来。"]], "en": [["Climbing on stage lends intimacy a sense of risk.", "Climbing on stage lends intimacy a sense of risk."], ["The effort to approach makes emotion tense.", "The effort to approach makes emotion tense."], ["The boundary permits a meeting yet obstructs entry.", "The boundary permits a meeting yet obstructs entry."], ["The figure above and the climber watch each other.", "The figure above and the climber watch each other."], ["A private pursuit becomes drama before other people's eyes.", "A private pursuit becomes drama before other people's eyes."]], "layers": 1}, {"id": "A-06", "title": "《阳台上奔跑的女孩》", "width": 594, "height": 600, "image": "assets/23ee452b0b823231b34dd94b.jpg", "pairs": [["重复身体使奔跑显得兴奋而连续。", "栏杆与人物被组织成密集的节奏单位。"], ["身体的移动让阳台成为短距离运动场。", "连续形象把同一空间中的动作时间叠放起来。"], ["奔跑具有向外的动势，却仍发生在围护之内。", "重复栏杆为变化身体提供固定的限制线索。"], ["观者的眼睛跟随残影追赶动作。", "画面以重复代替单一瞬间，延长观看时间。"], ["住宅边缘也承载充满活力的身体经验。", "私人生活中的小动作被转化为关于现代运动的视觉表达。"]], "en": [["Repeated bodies make running feel exuberant and continuous.", "Repeated bodies make running feel exuberant and continuous."], ["Movement turns the balcony into a short running ground.", "Movement turns the balcony into a short running ground."], ["The body moves outwards while remaining enclosed.", "The body moves outwards while remaining enclosed."], ["Our eyes follow the afterimages in pursuit of movement.", "Our eyes follow the afterimages in pursuit of movement."], ["The residential edge holds lively bodily experiences.", "The residential edge holds lively bodily experiences."]], "layers": 1}, {"id": "L-11", "title": "《游吟诗人》", "width": 1200, "height": 1764, "image": "assets/b50acb2f5b3f466258812b88.jpg", "pairs": [["植物间的对望让等待带上不安。", "原表配图以墙体、栏台和藤蔓构成遮蔽层次。"], ["人物在尚未接近时先以目光确认彼此。", "阳台式站位让相会依赖隔空的回应。"], ["接近的愿望与可能的危险共享同一边缘。", "植物和高差使相见保持局部而非完全开放。"], ["看得见一部分，也意味着仍有未被确认的部分。", "遮挡使观看需要等待，并保留误解的可能。"], ["私人情感的展开受到周围关系的牵制。", "阳台意象把等待与风险放进同一空间结构。"]], "en": [["Glances through plants make waiting uneasy.", "Glances through plants make waiting uneasy."], ["Before approaching, the figures acknowledge one another by looking.", "Before approaching, the figures acknowledge one another by looking."], ["The wish to approach shares an edge with possible danger.", "The wish to approach shares an edge with possible danger."], ["Partial visibility leaves something unconfirmed.", "Partial visibility leaves something unconfirmed."], ["Personal feelings unfold within surrounding relationships.", "Personal feelings unfold within surrounding relationships."]], "layers": 1}, {"id": "L-12", "title": "《浮士德》", "width": 406, "height": 697, "image": "assets/b1f30e8996e0b92c02c767ab.jpg", "pairs": [["配图中伏窗的姿态显出向外的渴望。", "木窗与砌体墙形成清晰的内外分界。"], ["身体停在窗边，注意力伸向房间之外。", "开口为受限的居所提供感知外部的位置。"], ["外部可以被看见，却未必可以立即进入。", "窗框把视觉通道与身体通道分开。"], ["观者由人物姿态感受尚未实现的接近。", "光差使向外的方向比具体远景更突出。"], ["个人愿望通过空间限制获得可理解的形象。", "在策展阅读中，窗边可作为阳台式阈限经验的延伸。"]], "en": [["A figure leaning at the window suggests an outward longing.", "A figure leaning at the window suggests an outward longing."], ["The body stays by the window while attention reaches outside.", "The body stays by the window while attention reaches outside."], ["The outside is visible but not immediately accessible.", "The outside is visible but not immediately accessible."], ["The posture conveys an approach not yet fulfilled.", "The posture conveys an approach not yet fulfilled."], ["Spatial limits give personal wishes a visible form.", "Spatial limits give personal wishes a visible form."]], "layers": 1}, {"id": "S-15", "title": "阳台上的一顿饭", "width": 1944, "height": 2592, "image": "assets/2795ba4c8d612960d98e7aef.jpg", "pairs": [["端盘的身影让深窗洞显得有生活温度。", "旧抹灰墙与细栏杆围住一处临边用餐位置。"], ["一顿饭在这里获得短暂独处的自在。", "端盘而立把阳台变成无需正式布置的餐桌延伸。"], ["用餐离开室内，却仍依附于家庭生活。", "门窗附近的过渡空间容纳向外的日常动作。"], ["外部目光看见用餐片刻，却难以进入其生活。", "窗洞的深度让身体既显露又受到遮蔽。"], ["微小的私人动作让城市立面不再只是建筑表面。", "住宅边缘通过吃饭这样的日常行为获得社会可读性。"]], "en": [["A figure holding a plate gives a deep window opening the warmth of everyday life.", "Old plaster walls and slender railings enclose a dining position at the edge."], ["A meal here offers the ease of a brief moment alone.", "Standing with a plate turns the balcony into an informal extension of the dining table."], ["Eating moves outdoors while remaining part of domestic life.", "The transitional space beside doors and windows accommodates everyday gestures towards the outside."], ["An outside gaze catches a moment of eating without gaining access to that life.", "The depth of the window opening both reveals and shelters the body."], ["Small private gestures make the urban facade more than an architectural surface.", "Everyday acts such as eating make the edge of the dwelling socially legible."]], "layers": 1}, {"id": "A-09", "title": "《阳台上的男人》", "width": 1514, "height": 2017, "image": "assets/aed36606a0482a6945f988c7.jpg", "pairs": [["背影与街道纵深让观看显得自由而孤独。", "装饰栏杆与厚墙为人物确定高处站位。"], ["临栏停留允许人暂时只做城市的观察者。", "住宅外缘把行走中的街道转为静止身体的对象。"], ["身体仍属住宅，目光已经进入城市。", "透空护栏保留视野，高差保留距离。"], ["观者跟随背影远望，却看不到人物表情。", "背向构图使观看方向清晰而内心状态不明。"], ["私人住所为观察公共生活提供独立位置。", "阳台使个人能够参与城市感知而不进入街道人流。"]], "en": [["The rear view and deep street perspective make looking feel free yet solitary.", "Ornamental railings and thick walls establish an elevated position for the figure."], ["Pausing at the railing allows one to become, briefly, an observer of the city.", "The edge of the home turns the moving street into an object for a stationary body."], ["The body still belongs to the dwelling while the gaze has entered the city.", "Open railings preserve the view; height preserves distance."], ["We follow the figure into the distance but cannot see his expression.", "The rear view makes the direction of looking clear while leaving his inner state unknown."], ["A private dwelling offers an independent position for observing public life.", "The balcony allows an individual to experience the city without joining the street crowd."]], "layers": 1}, {"id": "L-13", "title": "《萨拉曼卡的学生》", "width": 736, "height": 920, "image": "assets/56b0ce0260ad2083efb667a3.jpg", "pairs": [["并肩看屋顶的配图让接近显得含蓄。", "栏台在人物与密集城市之间建立近处位置。"], ["共同观看使交往不必始终面对面。", "临栏站位为等待和相会提供日常场景。"], ["私人居所与城市声景在边缘相接。", "阳台为向内传递声音与向外投去目光保留开口。"], ["人物看向同一方向，也可能观察彼此的反应。", "共同景观缓和直接注视带来的压力。"], ["阳台与小夜曲构成可传播的城市爱情想象。", "私人追求借建筑开口进入公共文化的叙事形式。"]], "en": [["Looking at rooftops side by side makes closeness understated.", "Looking at rooftops side by side makes closeness understated."], ["A shared view allows companionship without facing each other.", "A shared view allows companionship without facing each other."], ["The private home meets the sounds of the city.", "The private home meets the sounds of the city."], ["Looking in one direction can include watching each other's reactions.", "Looking in one direction can include watching each other's reactions."], ["Balconies and serenades shape a shared image of urban romance.", "Balconies and serenades shape a shared image of urban romance."]], "layers": 1}, {"id": "A-10", "title": "《在阳台上》", "width": 9148, "height": 11911, "image": "assets/976cf42be575c19fb93a6fa4.jpg", "pairs": [["低头阅读的人被花木围出安静的独处。", "植物与织物弱化了建筑边缘的硬度。"], ["阳台提供接近天光又能专注阅读的位置。", "阅读把半户外平台转为不必向外交流的使用空间。"], ["身体接近外部，注意力却收回书页。", "遮蔽物在开放平台上增加了一层私密范围。"], ["画中人物没有回应观者，而保持自己的节奏。", "低头姿态使对外展示与主动观看分离。"], ["私人精神生活也能发生在城市可见的边缘。", "阳台的开放不必意味着持续参与公共交往。"]], "en": [["Flowers surround the reader with quiet solitude.", "Flowers surround the reader with quiet solitude."], ["The balcony brings daylight within reach of concentrated reading.", "The balcony brings daylight within reach of concentrated reading."], ["The body approaches the outside while attention returns to the page.", "The body approaches the outside while attention returns to the page."], ["The reader keeps a private rhythm without answering our gaze.", "The reader keeps a private rhythm without answering our gaze."], ["An inner life can unfold at the city's visible edge.", "An inner life can unfold at the city's visible edge."]], "layers": 2}, {"id": "L-14", "title": "《道林·格雷的画像》", "width": 736, "height": 1062, "image": "assets/1e43c29376979f3f8aaa2194.jpg", "pairs": [["包厢中的人物让观看也显得像自我展示。", "栏板和帷幕将座位组织为独立而可见的单元。"], ["坐在高处既能看表演，也能经营自己的形象。", "包厢使观赏活动与社交停留重合。"], ["观众有相对私密的范围，却没有完全离开他人视线。", "栏板隔开身体，开敞前方保留互相观看。"], ["看舞台的人也可能成为其他观众的观察对象。", "分层座席建立彼此可见而位置不同的关系。"], ["审美生活与社会身份在观看中相互联系。", "阳台式包厢让私人趣味转化为公开的社会表演。"]], "en": [["Figures in a theatre box turn watching into self-display.", "Figures in a theatre box turn watching into self-display."], ["Sitting above the stage offers a view and a public image.", "Sitting above the stage offers a view and a public image."], ["Relative privacy does not remove the figures from sight.", "Relative privacy does not remove the figures from sight."], ["Those watching the stage may themselves be watched.", "Those watching the stage may themselves be watched."], ["Aesthetic life and social identity meet in the act of looking.", "Aesthetic life and social identity meet in the act of looking."]], "layers": 2}, {"id": "A-11", "title": "《在阳台上》", "width": 1914, "height": 3200, "image": "assets/72cc1b5ecfaaaff2b52c4f66.jpg", "pairs": [["月光中的浅色衣裙让时间显得缓慢。", "栏板与花盆为夜间停留画出近处边界。"], ["人在夜色中停下，暂时不需要明确行动。", "平台承接了从室内延伸出来的静静停留。"], ["暗夜包围外部，近处身体仍轻轻显现。", "明暗差让阳台形成介于隐匿与显露之间的位置。"], ["观者先辨认衣裙，再感知周围夜色。", "有限亮部引导目光集中于人物的在场。"], ["城市边缘也容纳不向外发声的个人时刻。", "作品让住宅开放处呈现一种可被观看的安静。"]], "en": [["Pale clothes in moonlight make time seem slow.", "Pale clothes in moonlight make time seem slow."], ["A person pauses in the night without needing to act.", "A person pauses in the night without needing to act."], ["Darkness surrounds a body still faintly visible.", "Darkness surrounds a body still faintly visible."], ["We notice the dress before sensing the surrounding night.", "We notice the dress before sensing the surrounding night."], ["The city's edge accommodates silent personal moments.", "The city's edge accommodates silent personal moments."]], "layers": 2}, {"id": "L-16", "title": "《阳台上的玫瑰》", "width": 422, "height": 610, "image": "assets/f5c904bb95fee1193a3987aa.jpg", "pairs": [["花木间的独立身影让静止带上期待。", "配图中的弯曲栏杆为植物和人物划出位置。"], ["临栏停留像为尚未到来的相会留出时间。", "阳台承接独处，也保留朝向外部的可能。"], ["身体被家居边缘围住，情感却向外开放。", "花木遮蔽一部分视野，又提示生活持续生长。"], ["观者从姿态中读到期待，未必知道其对象。", "不明确的远方使等待具有开放的解释空间。"], ["私人情绪可以借熟悉的住宅场景被理解。", "阳台将内在期待与外部可见的身体姿态联系起来。"]], "en": [["A solitary figure among flowers gives stillness an air of expectation.", "A solitary figure among flowers gives stillness an air of expectation."], ["Pausing at the railing makes time for a meeting yet to come.", "Pausing at the railing makes time for a meeting yet to come."], ["The body is enclosed while feeling opens outwards.", "The body is enclosed while feeling opens outwards."], ["We read expectation without knowing its object.", "We read expectation without knowing its object."], ["A familiar home setting makes private emotion legible.", "A familiar home setting makes private emotion legible."]], "layers": 2}, {"id": "A-13", "title": "《在阳台上》", "width": 1931, "height": 4000, "image": "assets/541467be1f85ed50092efbe6.jpg", "pairs": [["蓝海与浅石面让远望显得从容。", "栏台、铺地与遮阳扇共同组织休憩场景。"], ["身体停在边缘，让目光自由抵达海面。", "平台把无遮蔽的远景转为可以安坐的体验。"], ["开放景色与厚实近景构成安全的距离。", "石质栏台围住身体，保留上方的观看通道。"], ["观者看人物，也沿其朝向想象远处景色。", "近处停留与远处海面建立不同的观看尺度。"], ["画面把闲暇表现为拥有时间和景观的状态。", "古典化露台让私人休息成为可展示的生活形象。"]], "en": [["Blue sea and pale stone give looking out a sense of ease.", "Blue sea and pale stone give looking out a sense of ease."], ["The body rests at the edge while the gaze reaches the sea.", "The body rests at the edge while the gaze reaches the sea."], ["An open view and solid foreground establish a safe distance.", "An open view and solid foreground establish a safe distance."], ["We look at the figure and imagine the view beyond.", "We look at the figure and imagine the view beyond."], ["Leisure appears as having both time and a landscape.", "Leisure appears as having both time and a landscape."]], "layers": 2}, {"id": "L-17", "title": "《告别》", "width": 370, "height": 500, "image": "assets/e983df72af6dd30ba80b3649.jpg", "pairs": [["向栏外仰身的配图使告别带上留恋。", "栏杆与百叶窗把身体放在居所外缘。"], ["身体靠近边界，像不愿立即结束接触。", "阳台为告别保留最后一段可以相望的距离。"], ["人可能离去，开口仍保持朝向外部。", "住宅边缘使分离不是瞬间完成的切断。"], ["目光延长相见，让离开之后仍有方向。", "向外姿态把未被画出的远处纳入情感关系。"], ["个人告别在公共可见的边缘留下痕迹。", "阳台使离别同时包含分开与继续联系的可能。"]], "en": [["Leaning beyond the railing gives farewell a sense of reluctance.", "Leaning beyond the railing gives farewell a sense of reluctance."], ["The body approaches the boundary as if prolonging contact.", "The body approaches the boundary as if prolonging contact."], ["Someone may leave while the opening still faces outwards.", "Someone may leave while the opening still faces outwards."], ["A lingering gaze gives departure a direction.", "A lingering gaze gives departure a direction."], ["Private farewells leave traces at a publicly visible edge.", "Private farewells leave traces at a publicly visible edge."]], "layers": 2}, {"id": "A-15", "title": "《两姐妹（在露台上）》", "width": 960, "height": 1180, "image": "assets/9780533f0fe9b27278f014f6.jpg", "pairs": [["相近人物与花饰让露台显得轻快。", "栏杆、花篮与绿植共同围出临时停留位置。"], ["陪伴使开放景色成为共享的日常背景。", "不同年龄的身体在同一平台上获得相邻位置。"], ["人物受到近处围护，花园仍向外延续。", "透空栏杆让人物与植物背景保持视觉连续。"], ["观者面对人物，同时注意到身后的生长层次。", "花饰连接身体与花园，弱化人物和环境的分离。"], ["家庭亲近以面向观者的形象被保存。", "露台把私人陪伴转化为可以分享的生活图景。"]], "en": [["Close figures and flowers make the terrace cheerful.", "Close figures and flowers make the terrace cheerful."], ["Companionship turns the open landscape into a shared everyday setting.", "Companionship turns the open landscape into a shared everyday setting."], ["The nearby enclosure protects while the garden continues outside.", "The nearby enclosure protects while the garden continues outside."], ["We face the figures and notice the layers growing behind them.", "We face the figures and notice the layers growing behind them."], ["Family closeness is preserved in an image facing us.", "Family closeness is preserved in an image facing us."]], "layers": 2}, {"id": "L-18", "title": "《看得见风景的房间》", "width": 486, "height": 646, "image": "assets/56dc2398443d0c3f7c5d27b2.jpg", "pairs": [["掀帘向外的动作让生活显出打开的愿望。", "配图中玻璃门与薄帘组成可调节的框景。"], ["接近窗口使人物能够重新感受外部光线。", "观景位置把房间的用途扩展到观察与期待。"], ["帘幕打开，室内与外部的联系随之改变。", "可开合构件使边界成为能够调节的状态。"], ["人主动选择看出去，而非只是被安排在室内。", "取景的位置影响所能接触的风景与经验。"], ["私人生活的改变与面对外部的意愿相连。", "房间和阳台式开口把个人选择转化为具体空间动作。"]], "en": [["Drawing back a curtain suggests a desire to open life outwards.", "Glass doors and sheer curtains in the illustration form an adjustable frame for the view."], ["Approaching the window lets the figure encounter outdoor light anew.", "A viewing position extends the room’s use to observation and anticipation."], ["Opening the curtain changes the connection between the interior and the outside.", "Components that open and close make the boundary an adjustable condition."], ["A person actively chooses to look out rather than merely being placed indoors.", "The viewing position shapes the landscapes and experiences one can encounter."], ["Changes in private life are linked to a willingness to face the outside.", "The room and its balcony-like opening turn personal choices into concrete spatial gestures."]], "layers": 2}, {"id": "L-19", "title": "《魔山》", "width": 1280, "height": 720, "image": "assets/410402ae7a7120dbafe8ac44.jpg", "pairs": [["躺椅与远山让休养显得缓慢。", "配图中的玻璃窗、椅子与照护设施组织停留空间。"], ["身体的需要使一天围绕休息重新展开。", "开敞位置为疗养提供与外部环境接触的机会。"], ["人暂时退出通常生活，却仍感知山景和光线。", "窗边与露台连接受照护的内部和广阔环境。"], ["目光可以远行，身体仍按自己的节奏停留。", "远景与近身器物形成两种不同的时间感。"], ["个人休养也受到机构生活与共同作息的组织。", "阳台式疗养空间把身体处境与更大世界并置起来。"]], "en": [["Deckchairs and distant mountains slow the rhythm of recovery.", "Deckchairs and distant mountains slow the rhythm of recovery."], ["Bodily needs reorganise the day around rest.", "Bodily needs reorganise the day around rest."], ["Ordinary life recedes while mountains and light remain present.", "Ordinary life recedes while mountains and light remain present."], ["The gaze travels while the body rests at its own pace.", "The gaze travels while the body rests at its own pace."], ["Personal recovery is organised by institutional routines.", "Personal recovery is organised by institutional routines."]], "layers": 2}, {"id": "A-17", "title": "《圣阿德雷斯的露台》", "width": 960, "height": 720, "image": "assets/09a06a75f414e813240cf92d.jpg", "pairs": [["海风、旗帜与花园让休闲显得开阔。", "栏杆和花坛把海边平台组织为可坐可站的空间。"], ["人物以不同姿态共享一段面海的时间。", "座椅与开放空地同时容纳休息和眺望。"], ["身体留在花园平台，目光越过边缘抵达海面。", "护栏将近处生活与远处航行景象分开。"], ["观者从人物之间看向展开的水平远景。", "旗杆与海平线共同建立高低和远近的观看秩序。"], ["私人闲暇与更广阔的海上世界并置。", "露台把家庭休闲安排在能够感知外部活动的位置。"]], "en": [["Sea breezes, flags and flowers open leisure to the horizon.", "Sea breezes, flags and flowers open leisure to the horizon."], ["Different postures share a stretch of time facing the sea.", "Different postures share a stretch of time facing the sea."], ["Bodies remain on the terrace while eyes cross towards the water.", "Bodies remain on the terrace while eyes cross towards the water."], ["We look between the figures towards the horizontal distance.", "We look between the figures towards the horizontal distance."], ["Private leisure sits alongside a wider maritime world.", "Private leisure sits alongside a wider maritime world."]], "layers": 2}, {"id": "L-20", "title": "《威尼斯之死》", "width": 1021, "height": 424, "image": "assets/8a50ffd60e610d94c7464122.jpg", "pairs": [["檐下剪影让远处繁华带上迟暮感。", "原表配图以遮棚和支杆区分近处暗部与暖色远景。"], ["停留似乎延长了凝视，也延长了等待。", "露台让人物在旅行环境中获得反复观看的位置。"], ["身体靠近外部，情绪却可能向自身收拢。", "遮棚提供庇护，未能消除远景带来的距离。"], ["观看可以变得执着，而对象仍保持不可完全接近。", "近处剪影与远处景观使视线关系不对称。"], ["私人感受与旅游城市的公共表面发生碰撞。", "露台成为个体情绪投向外部世界的中间位置。"]], "en": [["Silhouettes beneath a canopy lend the distant splendour a sense of decline.", "The source illustration uses a canopy and supports to separate a dark foreground from a warm distant view."], ["Lingering seems to prolong both the gaze and the wait.", "The terrace offers a position for repeated observation within a travel setting."], ["The body approaches the outside while feelings may turn inwards.", "The canopy provides shelter without erasing the distance evoked by the view."], ["Looking can become obsessive while its object remains beyond complete reach.", "Near silhouettes and distant scenery create an unequal relationship of looking."], ["Private feelings collide with the public surface of a tourist city.", "The terrace becomes an intermediate position from which individual emotions reach towards the world."]], "layers": 2}, {"id": "A-19", "title": "《家庭聚会》", "width": 960, "height": 630, "image": "assets/2a72b00d85e19061a04629b0.jpg", "pairs": [["树荫下的集体肖像兼有亲近与拘谨。", "座椅和花园位置把多人组织在同一画面。"], ["家人相聚，身体姿态却仍保留各自距离。", "室外停留为家庭集合提供了共同的空间。"], ["开放环境没有消除群体内部的关系边界。", "站位与座位把人物分成相邻而独立的位置。"], ["被观看的意识使日常聚会带上正式感。", "多人共同面向画面外部，形成展示性的排列。"], ["私人家庭以集体形象进入他人的观看。", "花园边缘把亲属关系转化为可见的社会图像。"]], "en": [["The group portrait beneath the trees feels both intimate and reserved.", "Chairs and the garden setting arrange several people within a single picture."], ["The family gathers, yet bodily postures preserve individual distances.", "An outdoor pause provides a shared space for the family to assemble."], ["An open setting does not erase boundaries within the group.", "Standing and seated positions divide the figures into adjacent but independent places."], ["An awareness of being seen lends an everyday gathering a formal air.", "The figures face beyond the picture together, forming an arrangement for display."], ["A private family enters the gaze of others as a collective image.", "The garden edge turns kinship into a visible social image."]], "layers": 2}, {"id": "L-21", "title": "《觉醒》", "width": 830, "height": 619, "image": "assets/89e14bf29b5d4073bb6baeb3.jpg", "pairs": [["树旁交谈的配图让自我探问显得具体。", "门廊与阳廊为室内家庭生活留下开放边缘。"], ["离开房间的片刻允许人物感受自身需要。", "半户外停留提供暂时脱离家务秩序的位置。"], ["身体仍靠近家庭，注意力已指向其他可能。", "住宅边缘使退出与返回都保持可行。"], ["人物可以看向海风中的外部，也重新审视自己。", "观看位置的改变为理解既有生活提供距离。"], ["女性的私人感受与家庭角色期待发生联系。", "阳廊把自我觉察安排在尚未彻底离开的过渡地带。"]], "en": [["An illustration of conversation beside a tree gives self-questioning a setting.", "Porches and verandas give domestic life an open edge."], ["A moment outside the room lets a character feel her own needs.", "A semi-outdoor pause offers temporary distance from domestic routines."], ["The body stays near the home while attention turns to other possibilities.", "The dwelling's edge keeps both departure and return possible."], ["Looking towards the sea breeze also becomes a way of reconsidering oneself.", "A changed viewing position provides distance from an established life."], ["A woman's private feelings meet expectations of her domestic role.", "The veranda locates self-awareness in a transitional place not yet fully left behind."]], "layers": 2}, {"id": "A-21", "title": "《露台上的下午茶》", "width": 2048, "height": 2016, "image": "assets/593eec243ab7d5ce604beae4.jpg", "pairs": [["茶具、花束与浅色衣裙让交流显得轻柔。", "桌布与杯具把露台布置为日常会面场所。"], ["饮茶让人愿意在半户外多停留一会儿。", "桌面围出交谈的近距离范围。"], ["家居用品来到外部，使露台延续室内起居。", "柔软织物在开放环境中建立熟悉的生活尺度。"], ["观者从细节中读到相处节奏，而非宏大事件。", "茶桌把人物目光与动作聚到共同中心。"], ["私人交往通过生活器物呈现其文化习惯。", "露台使家庭待客与外部环境发生温和连接。"]], "en": [["Tea things, flowers and pale dresses give the conversation a gentle atmosphere.", "A tablecloth and cups furnish the terrace as a place for everyday meetings."], ["Drinking tea encourages people to linger a little longer in the semi-outdoors.", "The tabletop defines the close range of conversation."], ["Domestic objects move outside, extending indoor living onto the terrace.", "Soft fabrics establish a familiar domestic scale in an open setting."], ["Details reveal the rhythm of companionship rather than a grand event.", "The tea table gathers the figures’ gazes and gestures around a shared centre."], ["Private sociability reveals its cultural habits through everyday objects.", "The terrace gently connects domestic hospitality with the outdoor environment."]], "layers": 2}, {"id": "L-23", "title": "《纯真年代》", "width": 699, "height": 438, "image": "assets/3f2d3467799eea65d09dcc4e.jpg", "pairs": [["层叠包厢让观看带上清晰的阶层距离。", "装饰栏板把观众席分成彼此可见的单元。"], ["欣赏表演也意味着出现在社交视线中。", "包厢兼具观赏、会面与身份展示的用途。"], ["相邻的人处于同一剧院，却不共享同一位置。", "栏板和分层座位将身体范围与社会区分叠合。"], ["观众可能从舞台转向其他包厢中的人。", "朝向与高差组织了看表演和看社会的双重目光。"], ["私人关系在公共社交规范中受到辨认与约束。", "阳台式包厢把阶层秩序转化为可见的空间排列。"]], "en": [["Layered theatre boxes make social distance visible.", "Layered theatre boxes make social distance visible."], ["Enjoying a performance also means appearing in society.", "Enjoying a performance also means appearing in society."], ["People share a theatre without sharing the same position.", "People share a theatre without sharing the same position."], ["Attention can turn from the stage towards other boxes.", "Attention can turn from the stage towards other boxes."], ["Private relationships are recognised and constrained by social conventions.", "Private relationships are recognised and constrained by social conventions."]], "layers": 2}, {"id": "A-22", "title": "《北欧夏夜》", "width": 960, "height": 636, "image": "assets/535bee6425cc6d6732647bb5.jpg", "pairs": [["相隔的两人让夏夜显得亲近而沉默。", "瓶形栏杆与平台地面围出共同远望的位置。"], ["两人共享景色，却没有以动作消除彼此距离。", "平台容纳并行停留，而不强迫面对面交谈。"], ["平静湖面开放在前，身体仍受栏台围护。", "近处实体边缘衬出远处景观的连续。"], ["观者关注人物间的空隙，也跟随他们看向远方。", "分立站位使距离本身成为观看对象。"], ["共处可以通过沉默而非语言形成。", "阳台让私人关系以身体间隔和共同朝向被理解。"]], "en": [["Two separated figures make the summer night intimate and silent.", "Two separated figures make the summer night intimate and silent."], ["A shared landscape does not erase the distance between them.", "A shared landscape does not erase the distance between them."], ["The lake opens ahead while the railing protects the bodies.", "The lake opens ahead while the railing protects the bodies."], ["We notice the gap between people and follow their distant gaze.", "We notice the gap between people and follow their distant gaze."], ["Togetherness can form through silence rather than speech.", "Togetherness can form through silence rather than speech."]], "layers": 2}, {"id": "L-24", "title": "《乡土风俗》", "width": 1000, "height": 649, "image": "assets/b93b281f7149c1941fd0c512.jpg", "pairs": [["热闹露台上的人物像在展示各自角色。", "酒店与豪宅的半开放空间为会面提供场景。"], ["进入不同场合也意味着调整自我呈现。", "露台使休闲停留与身份经营同时发生。"], ["场所开放给相遇，却仍带有进入条件。", "居所、酒店与花园的边界区分不同社交圈。"], ["人物观察他人，也从反应中判断自身位置。", "可见的服饰与姿态成为理解身份的线索。"], ["社会流动通过具体会面与展示被体验。", "露台把个人生活与不断变化的社会角色联系起来。"]], "en": [["Figures on a lively terrace seem to display their social roles.", "Figures on a lively terrace seem to display their social roles."], ["Entering a new setting means adjusting one's presentation.", "Entering a new setting means adjusting one's presentation."], ["A meeting place remains subject to conditions of entry.", "A meeting place remains subject to conditions of entry."], ["People observe others and judge their own position through responses.", "People observe others and judge their own position through responses."], ["Social mobility is experienced through meetings and displays.", "Social mobility is experienced through meetings and displays."]], "layers": 2}, {"id": "A-23", "title": "《在阳廊上》", "width": 960, "height": 802, "image": "assets/40b0ee7f8993a3ff32f3bbcb.jpg", "pairs": [["空桌与暗树让阳廊留下人散后的寂静。", "木廊、屋檐和栏杆构成完整的过渡空间。"], ["无人场景仍暗示此前或之后的日常使用。", "桌面和座位把停留的可能保存在画中。"], ["檐下的近处与暮色中的远处相互包围。", "木作围护在开放环境中保留一层遮蔽。"], ["观者像迟到的来访者，面对空出的座位。", "从近桌到远水的层次延长了静静观看的过程。"], ["共同活动结束后，空间仍保留相聚的痕迹。", "阳廊呈现私人生活与外部时间之间的缓慢联系。"]], "en": [["An empty table leaves the veranda quiet after company has gone.", "An empty table leaves the veranda quiet after company has gone."], ["An unoccupied scene still suggests everyday use.", "An unoccupied scene still suggests everyday use."], ["The sheltered foreground and distant dusk surround one another.", "The sheltered foreground and distant dusk surround one another."], ["We arrive like late visitors facing empty seats.", "We arrive like late visitors facing empty seats."], ["A place retains traces of gathering after the activity ends.", "A place retains traces of gathering after the activity ends."]], "layers": 2}, {"id": "L-25", "title": "《包法利夫人》", "width": 1200, "height": 600, "image": "assets/79048a0315de4a705609014c.jpg", "pairs": [["隔窗分立的配图让近距离仍显疏远。", "栏台、木百叶和玻璃共同形成分层界面。"], ["身体已经靠近，情感却未必因此接通。", "窗口允许相望，又让各自停留保持分开。"], ["外部的可能性与内部的日常在门窗处相接。", "可开合构件具体呈现接近与退回的选择。"], ["人物看向对方，也可能看见难以实现的生活想象。", "透明并不等于理解，视线可以通过而关系仍有阻隔。"], ["私人愿望与既有生活安排之间存在张力。", "阳台式边缘让情感距离与空间距离形成对照。"]], "en": [["Figures separated by a window remain distant despite proximity.", "Figures separated by a window remain distant despite proximity."], ["Bodies can approach without emotions connecting.", "Bodies can approach without emotions connecting."], ["Outside possibilities meet indoor routines at the window.", "Outside possibilities meet indoor routines at the window."], ["Looking at another person may reveal an unattainable life.", "Looking at another person may reveal an unattainable life."], ["Private wishes strain against established arrangements.", "Private wishes strain against established arrangements."]], "layers": 2}, {"id": "A-24", "title": "《阿里阿德涅》", "width": 960, "height": 570, "image": "assets/e799ef9c15277d65f6b724f3.jpg", "pairs": [["卧躺人物与远船让海边充满等待。", "石质平台与垂落织物搭起古典化场景。"], ["身体停下，牵挂却仍指向远处。", "平台提供等待发生的位置，而没有消除距离。"], ["人物所在的近处与船只所在的远处无法直接相接。", "海面把视觉联系与身体可达性分开。"], ["观者在静止人物和移动可能之间来回观看。", "远船使近处的安静获得明确的情感方向。"], ["个人等待借助广阔景观成为可理解的经验。", "露台把私人情感安排在面向离去与远方的位置。"]], "en": [["A reclining figure and a distant ship fill the shore with waiting.", "A reclining figure and a distant ship fill the shore with waiting."], ["The body rests while concern remains directed afar.", "The body rests while concern remains directed afar."], ["The nearby figure cannot directly reach the distant ship.", "The nearby figure cannot directly reach the distant ship."], ["Our gaze moves between stillness and possible movement.", "Our gaze moves between stillness and possible movement."], ["An expansive landscape makes personal waiting legible.", "An expansive landscape makes personal waiting legible."]], "layers": 2}, {"id": "A-25", "title": "《准备卡瓦的少女们》", "width": 960, "height": 1302, "image": "assets/cff4ed5c23f8c1c9143f4319.jpg", "pairs": [["檐下共同劳作显得从容而稳定。", "木柱、屋檐与编织垫组织开敞生活空间。"], ["准备饮品使停留带上共同做事的节奏。", "地面与檐下阴影为多人操作提供相邻位置。"], ["劳作处受到遮蔽，又与周围环境保持开放。", "屋檐划分阳光与阴凉，木柱不完全阻断视线。"], ["观者看见动作之间的联系，而非孤立的人物。", "共同任务把身体与器物组织为一个观看整体。"], ["日常劳动与相聚构成可以被记录的生活经验。", "开敞边缘展示家务、交往与环境之间的连续关系。"]], "en": [["Shared work beneath the eaves feels calm and steady.", "Shared work beneath the eaves feels calm and steady."], ["Preparing a drink gives lingering a collective rhythm.", "Preparing a drink gives lingering a collective rhythm."], ["The workplace is sheltered yet open to its surroundings.", "The workplace is sheltered yet open to its surroundings."], ["We see connected actions rather than isolated figures.", "We see connected actions rather than isolated figures."], ["Everyday labour and gathering become recorded experiences.", "Everyday labour and gathering become recorded experiences."]], "layers": 2}, {"id": "A-26", "title": "《闲暇时光》", "width": 512, "height": 384, "image": "assets/ce7d4a4bd097fa8e7e3d1429.jpg", "pairs": [["卧坐草地的人物让闲暇显得松弛。", "画面以草地和身体建立停留范围，未显露明确阳台构件。"], ["身体借户外地面暂时离开紧张的日常姿态。", "休憩通过坐卧形成，而不依赖固定家具。"], ["这里的内外关系来自活动转换而非实体栏杆。", "开放地面承接从居住生活向自然环境的延伸。"], ["观者注意身体的放松与周围景色的关系。", "低处坐卧使人物与地面形成贴近的视觉尺度。"], ["闲暇可以在不具备阳台形制的地方发生。", "作为策展类比，场景提示阳台功能也可由停留行为建立。"]], "en": [["Figures sitting and reclining on the grass give leisure a relaxed air.", "Grass and bodies define a place to linger; no distinct balcony components are visible."], ["The outdoor ground lets bodies briefly leave the tense postures of everyday life.", "Rest takes shape through sitting and lying down rather than fixed furniture."], ["Here, inside and outside relate through a change of activity rather than a physical railing.", "Open ground accommodates an extension from domestic life into nature."], ["The viewer notices how relaxed bodies relate to the surrounding landscape.", "Sitting and reclining low down bring the figures into visual proximity with the ground."], ["Leisure can occur in places without the architectural form of a balcony.", "As a curatorial analogy, the scene suggests that lingering itself can establish a balcony-like function."]], "layers": 2}, {"id": "L-27", "title": "《到灯塔去》", "width": 736, "height": 552, "image": "assets/bbba2544cccdc69ac60c028b.jpg", "pairs": [["临栏远望的配图让身体显得安静。", "栏杆与远处水面共同建立近远尺度。"], ["停留使注意力能够追随遥远的目标。", "阳台式位置为凝视与回想提供稳定支点。"], ["远处可见，并不意味着立即能够抵达。", "边缘把身体所处的现在与目光指向的远方分开。"], ["观看会受到记忆与期待的影响。", "配图只提供远望意象，不能据此确定原作的具体场景。"], ["私人感知可以与家庭时间和共同记忆交织。", "这一策展关联强调接近远方的经验，而不把配图当作原作实景。"]], "en": [["A figure looking beyond the railing seems quiet.", "A figure looking beyond the railing seems quiet."], ["Pausing allows attention to follow a distant goal.", "Pausing allows attention to follow a distant goal."], ["Visibility does not guarantee immediate arrival.", "Visibility does not guarantee immediate arrival."], ["Memory and expectation shape the act of looking.", "Memory and expectation shape the act of looking."], ["Private perception intertwines with family time and shared memory.", "Private perception intertwines with family time and shared memory."]], "layers": 2}, {"id": "A-27", "title": "《站在阳台上的希腊女孩》", "width": 960, "height": 1399, "image": "assets/3d09b54a2d185850accce8e5.jpg", "pairs": [["狭窄平台上的侧身人物显出克制的等待。", "细栏杆、门框与铺地共同限定站立位置。"], ["身体几乎不动，注意力却朝向远方。", "有限平台承接独处与眺望的日常姿态。"], ["窄小近处围住身体，开放远景延伸感知。", "门框与护栏划出可以停留却难以舒展的范围。"], ["观者从侧身方向推想人物正在关注什么。", "未被明确展示的远方让视线保留悬念。"], ["私人的等待通过身体姿态进入画面。", "住宅边缘让个体心绪与外部距离相互映照。"]], "en": [["A figure in profile on a narrow platform conveys restrained anticipation.", "Slender railings, a doorframe and paving together define where she stands."], ["The body barely moves while attention turns towards the distance.", "The limited platform accommodates everyday postures of solitude and looking out."], ["The narrow foreground contains the body while the open distance extends perception.", "The doorframe and railing define a place to stay with little room to stretch."], ["The viewer follows the direction of her body to imagine what holds her attention.", "The unseen distance leaves the object of her gaze unresolved."], ["Private waiting enters the picture through bodily posture.", "The edge of the dwelling brings individual feeling into relation with distance outside."]], "layers": 3}, {"id": "L-28", "title": "《达洛维夫人》", "width": 1151, "height": 551, "image": "assets/5ba0a6c4da43cc8c49e1143d.jpg", "pairs": [["百叶旁卧躺的配图像一段从社交中退回的时间。", "厚栏板、百叶与藤椅共同围出休憩位置。"], ["身体可以暂停回应，保留自己的感受。", "阳台式角落为社会交往之间提供缓冲。"], ["人仍接近城市，却暂时减少外部参与。", "可遮蔽的边缘使接触与退出能够被调节。"], ["向外观看与向内回想可以在同一停留中交替。", "低处姿态改变了身体面对外部目光的方式。"], ["个人内心并不等于其公开呈现的角色。", "住宅边缘为私人感受与城市社交之间保留过渡。"]], "en": [["Reclining beside shutters suggests a retreat from social life.", "Reclining beside shutters suggests a retreat from social life."], ["The body can stop responding and retain its own feelings.", "The body can stop responding and retain its own feelings."], ["The city remains close while participation diminishes.", "The city remains close while participation diminishes."], ["Looking out and remembering can alternate within a pause.", "Looking out and remembering can alternate within a pause."], ["The inner self is not identical to the public role.", "The inner self is not identical to the public role."]], "layers": 3}, {"id": "A-28", "title": "《丢勒站在自宅阳台》", "width": 960, "height": 777, "image": "assets/3578ba2a4ec890dd0db39936.jpg", "pairs": [["暗木廊与亮街景使人物显得与城市保持距离。", "木檐、廊板和砌体墙构成分层的住宅外缘。"], ["站在自宅边缘使观看仍带着居所的依托。", "平台提供既属于家庭又面向城市的位置。"], ["人物不在街道，也没有完全退入房间。", "檐下暗部把私人停留与明亮外景区分开来。"], ["观者同时看见人物身份与其观看城市的姿态。", "住宅框景使身体从街道背景中突出。"], ["居所成为人物社会形象的一部分。", "阳台把个人身份与城市生活安排在同一视觉关系中。"]], "en": [["Dark timber and a bright street keep the figure at a distance from the city.", "Dark timber and a bright street keep the figure at a distance from the city."], ["Looking from home retains the support of a dwelling.", "Looking from home retains the support of a dwelling."], ["The figure is neither in the street nor fully inside.", "The figure is neither in the street nor fully inside."], ["We see both identity and the posture of urban observation.", "We see both identity and the posture of urban observation."], ["The home becomes part of a person's social image.", "The home becomes part of a person's social image."]], "layers": 3}, {"id": "A-29", "title": "《求婚》", "width": 960, "height": 1032, "image": "assets/2d1621642ac69ec8169e3b36.jpg", "pairs": [["近坐的两人让安静角落带上试探。", "石质栏台、座椅与花木围出会面范围。"], ["身体靠近，使未说出的情感变得可感。", "座位安排缩短距离，为私密交谈提供条件。"], ["花园仍然开放，两人之间却形成相对收拢的空间。", "厚实边界与植物限制了相会场景的外部暴露。"], ["观者从姿态辨认亲近，却无法听见交谈。", "距离和朝向承担了叙事情感的表达。"], ["私人承诺以可观看的身体关系呈现。", "露台为亲密关系的形成提供介于公开与隐秘之间的位置。"]], "en": [["Two seated figures give a quiet corner a tentative intimacy.", "Two seated figures give a quiet corner a tentative intimacy."], ["Physical closeness makes unspoken feelings perceptible.", "Physical closeness makes unspoken feelings perceptible."], ["The garden remains open while the pair form a private enclosure.", "The garden remains open while the pair form a private enclosure."], ["Posture suggests intimacy but does not reveal the conversation.", "Posture suggests intimacy but does not reveal the conversation."], ["Private commitment takes shape as a visible bodily relationship.", "Private commitment takes shape as a visible bodily relationship."]], "layers": 3}, {"id": "A-30", "title": "《荷马诗朗读会》", "width": 960, "height": 481, "image": "assets/4c8c6591ab6c7cbcdc5629be.jpg", "pairs": [["海景前的聆听者让开放空间显得凝聚。", "石质平台和柱体组成围坐的古典化背景。"], ["朗读使人们在同一处共享注意力。", "声音把分散身体连接到共同的活动中心。"], ["外部景观保持开阔，聆听范围却向近处集中。", "柱廊和平台为没有完全封闭的聚会提供界定。"], ["观者通过听众姿态感知不可见的声音。", "不同身体朝向共同指向朗读的发生位置。"], ["知识与诗歌通过面对面的停留获得交流。", "露台成为文化活动与日常交往重叠的半公共空间。"]], "en": [["Listeners before the sea bring concentration to an open space.", "Listeners before the sea bring concentration to an open space."], ["Reading aloud gathers attention in one place.", "Reading aloud gathers attention in one place."], ["The landscape stays open while listening draws people together.", "The landscape stays open while listening draws people together."], ["The listeners' postures suggest an invisible sound.", "The listeners' postures suggest an invisible sound."], ["Poetry and knowledge circulate through a shared pause.", "Poetry and knowledge circulate through a shared pause."]], "layers": 3}, {"id": "L-30", "title": "《夜色温柔》", "width": 735, "height": 411, "image": "assets/19f3c5d8c09b9bb323bae958.jpg", "pairs": [["蓝色夜景中的交谈显得温柔而有距离。", "原表配图用栏台与海天构成近处会面位置。"], ["两人在停留中接近，也各自保留未说出的部分。", "露台为不急于结束的对话提供时间与空间。"], ["开放远景并没有取消私人关系中的界限。", "近处栏台同时给予依靠和身体范围。"], ["人物可以看向彼此，也可以借远景暂时移开目光。", "共同景观为交谈中的沉默提供容身之处。"], ["私人感情与度假生活的社会环境相互影响。", "露台把亲密、表面从容与潜在距离安置在同一场景。"]], "en": [["Conversation in a blue night feels tender yet distant.", "Conversation in a blue night feels tender yet distant."], ["Two people draw close while keeping something unspoken.", "Two people draw close while keeping something unspoken."], ["An open horizon does not dissolve personal boundaries.", "An open horizon does not dissolve personal boundaries."], ["The figures can meet each other's eyes or turn towards the distance.", "The figures can meet each other's eyes or turn towards the distance."], ["Private feelings meet the social setting of holiday life.", "Private feelings meet the social setting of holiday life."]], "layers": 3}, {"id": "A-31", "title": "《告白》", "width": 1784, "height": 814, "image": "assets/55f7ccba3eaa224aba2c2675.jpg", "pairs": [["近坐人物让弧形座台带上欲言又止的气氛。", "厚重栏台与座椅把身体围在柔和曲线内。"], ["坐近使交流成为细微姿态之间的试探。", "座台提供持续停留的条件，让关系可以慢慢展开。"], ["开放天空与局部围合共同保护近处相处。", "实体边缘划出私密交流所需的身体范围。"], ["观者读到距离，却无法直接确定人物的心意。", "静止姿态让细小的朝向变化具有叙事作用。"], ["私人情感通过共享座位获得空间表达。", "露台显示亲密既需要接近，也依赖适当的围合。"]], "en": [["Nearby figures give the curved seat an air of hesitation.", "Nearby figures give the curved seat an air of hesitation."], ["Sitting close makes subtle gestures a tentative exchange.", "Sitting close makes subtle gestures a tentative exchange."], ["Open sky and partial enclosure protect companionship.", "Open sky and partial enclosure protect companionship."], ["We can read distance without knowing the figures' feelings.", "We can read distance without knowing the figures' feelings."], ["A shared seat gives private emotion a spatial form.", "A shared seat gives private emotion a spatial form."]], "layers": 3}, {"id": "A-32", "title": "《从特罗卡德罗眺望巴黎》", "width": 960, "height": 530, "image": "assets/feb5e3ff9089e0df6936dcbb.jpg", "pairs": [["灰蓝城市前的人物让远望带着安静陪伴。", "栏杆与近处地面构成眺望巴黎的前景。"], ["共同看风景让相处不必依赖交谈。", "平台提供多人并列停留的观看位置。"], ["城市向外展开，身体仍留在近处边缘。", "高处地形把停留区域与远景空间分开。"], ["人物与观者共享面向城市的方向。", "近小远大的关系把目光引向开阔景观。"], ["私人陪伴可以发生在共同可见的城市景色前。", "观景平台将个人关系与公共城市形象连接起来。"]], "en": [["Figures before a blue-grey city suggest quiet companionship.", "Figures before a blue-grey city suggest quiet companionship."], ["Sharing a view allows company without conversation.", "Sharing a view allows company without conversation."], ["The city extends outwards while bodies remain at the edge.", "The city extends outwards while bodies remain at the edge."], ["The figures and the viewer face the city together.", "The figures and the viewer face the city together."], ["Private companionship unfolds before a shared urban view.", "Private companionship unfolds before a shared urban view."]], "layers": 3}, {"id": "L-32", "title": "《永别了，武器》", "width": 828, "height": 1006, "image": "assets/00998c323bc489e550bbfebe.jpg", "pairs": [["配图中的普通家务让外廊显得真实而平常。", "住宅外缘把室内活动带到可见的日光下。"], ["短暂休息让人物重新接近私人生活的感受。", "酒店或疗养地的半户外位置为停留提供条件。"], ["外部环境不能完全被隔绝，亲密仍寻求庇护。", "阳台使受保护的内部与不确定世界保持联系。"], ["目光可以从近身处境转向仍在继续的日常。", "平凡生活的可见性与战争语境形成感受上的距离。"], ["私人时刻因外部动荡而显得脆弱。", "露台让短暂的亲密与更广阔的现实处境并置。"]], "en": [["Ordinary housework makes the outer corridor feel real.", "Ordinary housework makes the outer corridor feel real."], ["A brief rest restores a sense of private life.", "A brief rest restores a sense of private life."], ["Intimacy seeks shelter without fully excluding the outside.", "Intimacy seeks shelter without fully excluding the outside."], ["Attention can turn towards everyday life still going on.", "Attention can turn towards everyday life still going on."], ["External upheaval makes private moments fragile.", "External upheaval makes private moments fragile."]], "layers": 3}, {"id": "A-33", "title": "《帕尔米耶里圆亭》", "width": 960, "height": 330, "image": "assets/6efa7b4446c23c77ebfbb42a.jpg", "pairs": [["棚下阴凉使海边烈日变得可以接近。", "细支柱托起织物遮棚，划出临时庇护范围。"], ["身体从强光中退开，仍可留在户外。", "遮阴将开放平台转为适合休息的场所。"], ["明亮海面与近处阴影在棚边相接。", "柔性覆盖调节环境，却不完全封闭四周。"], ["观者从暗处望向亮海，感到身体所在的位置。", "横向遮棚把画面分为庇护与暴露两部分。"], ["海边休闲依赖具体的遮阴条件。", "露台通过轻巧构件把自然环境转为可共享的停留空间。"]], "en": [["Shade beneath a canopy makes the bright shore approachable.", "Shade beneath a canopy makes the bright shore approachable."], ["The body retreats from strong light while remaining outdoors.", "The body retreats from strong light while remaining outdoors."], ["The bright sea meets nearby shade at the canopy's edge.", "The bright sea meets nearby shade at the canopy's edge."], ["Looking from shadow towards the sea makes bodily position felt.", "Looking from shadow towards the sea makes bodily position felt."], ["Seaside leisure depends on practical conditions of shade.", "Seaside leisure depends on practical conditions of shade."]], "layers": 3}, {"id": "L-33", "title": "《美丽与毁灭》", "width": 1080, "height": 1349, "image": "assets/ccc33c4644d9275099d2627a.jpg", "pairs": [["配图中相邻人物显得接近却各自独立。", "窗框、花箱与栏杆把立面分为不同生活单元。"], ["各自停留使日常在同一建筑中并行展开。", "阳台为家庭内部提供面向城市的小型出口。"], ["住户共享立面，却不必共享私人生活。", "重复开口把相邻关系组织为分隔中的并置。"], ["看得到别人的位置，未必理解别人的处境。", "窗口式框景使人物以局部形象进入外部视线。"], ["城市生活的邻近可以与情感距离并存。", "此处以配图讨论私人生活的显露，不据其补写原作情节。"]], "en": [["Neighbouring figures appear close yet separate.", "Neighbouring figures appear close yet separate."], ["Everyday lives unfold in parallel within one building.", "Everyday lives unfold in parallel within one building."], ["Residents share a facade without sharing private lives.", "Residents share a facade without sharing private lives."], ["Seeing another person's position does not reveal their circumstances.", "Seeing another person's position does not reveal their circumstances."], ["Urban proximity can coexist with emotional distance.", "Urban proximity can coexist with emotional distance."]], "layers": 3}, {"id": "A-34", "title": "《阿尔及尔露台上吸水烟的女人》", "width": 1600, "height": 2432, "image": "assets/db4b4ecdc77cfdd68dab9a38.jpg", "pairs": [["繁复色彩中的休憩显得悠闲而舒展。", "铺砖、矮墙与织物共同组成露台生活的近景。"], ["吸水烟与停留让时间暂时放慢。", "生活器物把开放平台安排为日常休息场所。"], ["人物被近处器物围住，远处海景仍保持开放。", "低墙提供局部围合，织物增加贴近身体的柔软层。"], ["观者观看休憩人物，也接触被绘画选择的生活场景。", "外部观看将私密停留组织成可欣赏的图像。"], ["休闲方式通过绘画进入更广泛的文化观看。", "解读时需要保留被描绘者生活与观看者想象之间的距离。"]], "en": [["Rich colours make rest feel leisurely and expansive.", "Rich colours make rest feel leisurely and expansive."], ["Smoking and lingering briefly slow time.", "Smoking and lingering briefly slow time."], ["Nearby objects enclose the figure while the sea remains open.", "Nearby objects enclose the figure while the sea remains open."], ["We encounter a scene of life selected by painting.", "We encounter a scene of life selected by painting."], ["Leisure enters a wider cultural gaze through painting.", "Leisure enters a wider cultural gaze through painting."]], "layers": 3}, {"id": "L-34", "title": "《有产业的人》", "width": 714, "height": 1024, "image": "assets/dcea665294e4ac2aab657a9e.jpg", "pairs": [["倚栏人物与闭合百叶让向外停留仍显受限。", "花饰栏杆与遮阳构件共同组织住宅边缘。"], ["身处舒适居所，也可能感到规矩的围绕。", "家庭空间的使用受到财产和角色关系影响。"], ["可以看向外面，并不意味着拥有完全的行动自由。", "门窗与住宅范围将占有、进入和退出具体化。"], ["人物被看见时，也可能被按家庭身份理解。", "观看中的评价让居所不只是物理庇护。"], ["私人关系与财产观念在同一空间中交叠。", "阳台让家庭控制与向外愿望之间的张力可被感知。"]], "en": [["A figure beside closed shutters remains constrained while looking out.", "A figure beside closed shutters remains constrained while looking out."], ["Comfortable surroundings can still enclose a person in rules.", "Comfortable surroundings can still enclose a person in rules."], ["An outward view does not guarantee freedom of action.", "An outward view does not guarantee freedom of action."], ["A visible person may be understood through a family role.", "A visible person may be understood through a family role."], ["Private relationships overlap with ideas of property.", "Private relationships overlap with ideas of property."]], "layers": 3}, {"id": "A-35", "title": "《午睡》", "width": 960, "height": 625, "image": "assets/e234e390ce80709b6a072f6b.jpg", "pairs": [["檐下暗处让卧躺身体显得安心。", "木栏、软垫与门框共同构成阴凉角落。"], ["午睡使身体暂时退出外部活动。", "软垫将半户外边缘转为可以躺卧的休憩位置。"], ["外部仍然明亮，身体退入局部遮蔽。", "屋檐和围护调节日光，织物承托近身接触。"], ["观者看见休息者，却不能获得其回应。", "明暗差强调了被观看身体与外部环境的不同状态。"], ["最私人的休息也可能成为绘画展示的对象。", "露台把庇护需求与外部可见性放在同一空间。"]], "en": [["A reclining body feels secure in the shade of the eaves.", "A reclining body feels secure in the shade of the eaves."], ["Sleep briefly withdraws the body from outside activity.", "Sleep briefly withdraws the body from outside activity."], ["The world stays bright while the body retreats into shelter.", "The world stays bright while the body retreats into shelter."], ["We see the sleeper without receiving a response.", "We see the sleeper without receiving a response."], ["Even intimate rest can become a subject for public viewing.", "Even intimate rest can become a subject for public viewing."]], "layers": 3}, {"id": "L-35", "title": "《霍华德庄园》", "width": 800, "height": 551, "image": "assets/f4dc2d34f4eca045718c872b.jpg", "pairs": [["檐下共处的配图同时保留陪伴与隔阂。", "木地板、百叶和藤椅组成可停留的生活边缘。"], ["家人在一处，也可能各自关注不同事情。", "外廊容纳并行起居，而不保证情感一致。"], ["共同居所的范围里仍存在人与人之间的边界。", "座位与开口安排了接近、回避和独处的可能。"], ["观者从人物间隔理解共处的复杂性。", "共享背景将身体联系起来，朝向却可以分开。"], ["家庭内部关系与更广泛的社会差异相接。", "阳台式过渡空间让生活中的连接与分隔同时显现。"]], "en": [["Companionship beneath the eaves retains a sense of separation.", "Companionship beneath the eaves retains a sense of separation."], ["Family members can share a place while attending to different things.", "Family members can share a place while attending to different things."], ["A common home still contains boundaries between people.", "A common home still contains boundaries between people."], ["The spaces between figures reveal the complexity of living together.", "The spaces between figures reveal the complexity of living together."], ["Family relationships connect to wider social differences.", "Family relationships connect to wider social differences."]], "layers": 3}, {"id": "A-37", "title": "《弗拉斯卡蒂托洛尼亚别墅喷泉》", "width": 960, "height": 1223, "image": "assets/34f498d3c8442beaf5e1a6c6.jpg", "pairs": [["树荫里的作画者让停留带上专注。", "喷泉景观与坐姿共同确定画中的观察位置。"], ["绘画把休息转为持续凝视环境的活动。", "座位使身体稳定，便于长时间观察近旁景物。"], ["人在园林之中，又通过画面选择与环境拉开距离。", "取景把连续场所分出可以描绘的局部。"], ["观者观看一位正在观看和作画的人。", "画中观察与画外观察形成两层视线关系。"], ["个人凝视可以把日常景物转为文化图像。", "停留平台的意义由身体、景观与再现行为共同建立。"]], "en": [["A painter beneath trees gives lingering a focused quality.", "A painter beneath trees gives lingering a focused quality."], ["Painting turns rest into sustained attention to the surroundings.", "Painting turns rest into sustained attention to the surroundings."], ["The painter inhabits the garden while framing it at a distance.", "The painter inhabits the garden while framing it at a distance."], ["We watch someone who is watching and painting.", "We watch someone who is watching and painting."], ["A personal gaze transforms everyday scenery into a cultural image.", "A personal gaze transforms everyday scenery into a cultural image."]], "layers": 3}, {"id": "L-36", "title": "《娜娜》", "width": 500, "height": 674, "image": "assets/c7249dd66f939fe3a377ca1e.jpg", "pairs": [["豪华包厢让欲望显得公开而华丽。", "软包、帷幕与装饰栏板包围观看位置。"], ["观赏表演同时成为参与社交的方式。", "包厢为停留、会面和展示提供相对独立的范围。"], ["身体被分隔安置，目光却在场内流动。", "开敞前方与包围侧面共同形成半私人界面。"], ["观看舞台时，人也可能成为别人的观看对象。", "不同包厢之间的可见性使身份不断被辨认。"], ["私人欲望在公共娱乐中获得社会形象。", "阳台式座席把审美观看、身份展示与社会交往叠合起来。"]], "en": [["A luxurious theatre box makes desire public and ornate.", "A luxurious theatre box makes desire public and ornate."], ["Watching a performance also becomes social participation.", "Watching a performance also becomes social participation."], ["Bodies sit apart while glances circulate.", "Bodies sit apart while glances circulate."], ["Those watching the stage may themselves become a spectacle.", "Those watching the stage may themselves become a spectacle."], ["Private desire acquires a social image through public entertainment.", "Private desire acquires a social image through public entertainment."]], "layers": 3}, {"id": "A-38", "title": "《卡普里》", "width": 960, "height": 663, "image": "assets/cd09ae83dd5360f8f7cb4fb5.jpg", "pairs": [["强光与深影让高处生活显得自由又暴露。", "厚实女儿墙和抹灰墙围住海边平台。"], ["身体在屋顶边缘获得离开室内的片刻。", "平台承担停留用途，将生活带到建筑顶部。"], ["近处实体墙面与开放天空形成对照。", "女儿墙保留身体范围，上方仍直接面对环境。"], ["观者从光影变化中辨认人物与建筑关系。", "亮墙强化了暗部身体，使停留位置清晰可见。"], ["居住生活向上延伸，改变了建筑顶部的意义。", "屋顶平台作为阳台类比，体现日常空间向外展开的可能。"]], "en": [["Strong light and deep shade make elevated life feel free yet exposed.", "Strong light and deep shade make elevated life feel free yet exposed."], ["The rooftop edge offers a brief departure from the interior.", "The rooftop edge offers a brief departure from the interior."], ["Solid nearby walls contrast with open sky.", "Solid nearby walls contrast with open sky."], ["Light and shadow reveal relations between people and buildings.", "Light and shadow reveal relations between people and buildings."], ["Life extending upwards changes the meaning of the roof.", "Life extending upwards changes the meaning of the roof."]], "layers": 3}, {"id": "L-37", "title": "《故园风雨后》", "width": 400, "height": 300, "image": "assets/b716247cf35a74557545efff.jpg", "pairs": [["逆光举杯的配图让相聚像留下了旧日余温。", "庄园背景与石柱把人物置于具有历史感的边缘。"], ["停留与举杯使关系在片刻中得到确认。", "露台式位置把室内聚会延伸到外部景观前。"], ["当下相处与对过去生活的回望交叠。", "建筑作为相对持久的背景承接变化的人物关系。"], ["观者在身体动作与庄园形象之间建立联系。", "逆光削弱细节，使相聚更接近记忆中的轮廓。"], ["私人回忆也包含社会环境与生活方式的变化。", "居所边缘为个体记忆与历史感提供共同的空间载体。"]], "en": [["Backlit raised glasses seem to retain the warmth of an earlier time.", "Backlit raised glasses seem to retain the warmth of an earlier time."], ["A shared pause and a toast briefly affirm a relationship.", "A shared pause and a toast briefly affirm a relationship."], ["Present companionship overlaps with looking back.", "Present companionship overlaps with looking back."], ["Bodily gestures connect with the image of an estate.", "Bodily gestures connect with the image of an estate."], ["Private memory contains changes in social life.", "Private memory contains changes in social life."]], "layers": 3}, {"id": "A-39", "title": "《马赛康纳比耶尔街阳台上的女人》", "width": 960, "height": 1202, "image": "assets/e5441963c29cf29a089620ea.jpg", "pairs": [["高处身影让繁密街道带上旁观的距离。", "细栏杆把人物与层叠城市界面分开。"], ["临栏停下使身体安静，街景仍显得繁忙。", "阳台提供将城市活动转为观看对象的位置。"], ["目光抵达街道，身体没有进入人群。", "栏杆和高差维持住宅与街面的分界。"], ["观者既看人物，也追随其俯视方向。", "前景身体提示远景是从某一具体位置看见的城市。"], ["私人居所参与了公共城市的感知。", "阳台把个人旁观与街道生活组织成相互关联的层次。"]], "en": [["An elevated figure views the crowded street from a distance.", "An elevated figure views the crowded street from a distance."], ["The body pauses while the street remains busy.", "The body pauses while the street remains busy."], ["The gaze reaches the street without entering the crowd.", "The gaze reaches the street without entering the crowd."], ["We see the figure and follow the downward gaze.", "We see the figure and follow the downward gaze."], ["A private dwelling participates in sensing the public city.", "A private dwelling participates in sensing the public city."]], "layers": 3}, {"id": "L-38", "title": "《豹》", "width": 735, "height": 527, "image": "assets/330b4775e7d330dae015092e.jpg", "pairs": [["体面平台上的交谈让繁华带上迟暮感。", "栏台、门窗和布篷形成厚重与轻巧相接的界面。"], ["人物继续交往，也感受熟悉生活的变化。", "露台承接社交，使角色在相遇中被确认。"], ["家宅边界保持稳定，外部时代却可能已经改变。", "可附加的生活设施显示居所不断回应新的需求。"], ["人物看外部，也被外部目光理解为某种身份。", "建筑背景使个人形象与阶层位置相互关联。"], ["私人家族生活与社会转变难以完全分开。", "露台把维持体面与感知变化放在同一停留场所。"]], "en": [["Conversation on a refined terrace gives splendour a sense of decline.", "Conversation on a refined terrace gives splendour a sense of decline."], ["People continue social life while sensing familiar changes.", "People continue social life while sensing familiar changes."], ["The home's boundary stays stable while the world changes.", "The home's boundary stays stable while the world changes."], ["People look outside and are read as social identities.", "People look outside and are read as social identities."], ["Family life cannot be fully separated from social change.", "Family life cannot be fully separated from social change."]], "layers": 3}, {"id": "A-40", "title": "《从阳台眺望马赛街道》", "width": 411, "height": 800, "image": "assets/81f05b83d5237d71643b6977.jpg", "pairs": [["剪影与低光让独处显得绵长。", "栏杆轮廓为远处街景提供近景边界。"], ["人物以停留回应逐渐变化的外部光线。", "阳台使静止身体获得面对城市的持续位置。"], ["近处身影退入暗部，外部景色仍可辨认。", "光线差形成比实体构件更明显的内外层次。"], ["观者难以读到表情，只能跟随观看方向。", "剪影削弱身份细节，突出身体与城市的关系。"], ["个人孤独被安置在仍然开放的城市边缘。", "阳台让不参与街道的停留同样成为城市生活的一部分。"]], "en": [["Silhouette and low light give solitude a lingering quality.", "Silhouette and low light give solitude a lingering quality."], ["The figure responds to changing light by staying still.", "The figure responds to changing light by staying still."], ["The body retreats into darkness while the view remains visible.", "The body retreats into darkness while the view remains visible."], ["Without a clear expression, we follow the direction of looking.", "Without a clear expression, we follow the direction of looking."], ["Personal solitude rests at an urban edge still open to the world.", "Personal solitude rests at an urban edge still open to the world."]], "layers": 3}, {"id": "S-09", "title": "邻居跨阳台聊天", "width": 2732, "height": 2732, "image": "assets/9dd6a27087161167e404b2cb.jpg", "pairs": [["上下阳台之间的交谈让距离显得亲切。", "分层平台与通透栏板把相邻住户联系起来。"], ["不必进入对方家中，也能交换日常消息。", "朝外站立使阳台承担门外会面的功能。"], ["交谈越过空隙，私人领地仍保持分开。", "栏杆与高差同时维持分界和交流通道。"], ["邻人抬头或低头，寻找对方的回应。", "错开的高度让交流依赖身体朝向和视线调整。"], ["熟悉感可以在各自住宅边缘慢慢形成。", "邻里关系借助相邻开口建立，无须固定公共房间。"]], "en": [["Conversation between balconies makes distance feel friendly.", "Platforms at different levels and open railings connect neighbouring households."], ["Daily news can be exchanged without entering another home.", "Facing outwards lets the balcony serve as a meeting place outside the door."], ["Conversation crosses the gap while private territories remain separate.", "Railings and height differences sustain both boundaries and channels of exchange."], ["Neighbours look up or down to find each other's response.", "Staggered heights make conversation depend on bodily direction and an adjusted gaze."], ["Familiarity can grow slowly at the edges of separate homes.", "Neighbourly relations form through adjacent openings without a dedicated communal room."]], "layers": 3}, {"id": "A-41", "title": "《阳台上眺望尼罗河的人物》", "width": 1199, "height": 794, "image": "assets/60def4a4fe1d9f2aa5ea4f15.jpg", "pairs": [["分立的人物让辽阔水景带上沉默相伴。", "栏台为背向观者的身体确定观察平台。"], ["共同远望使相处可以保持各自安静。", "平台允许并行停留，无须形成面对面交流。"], ["身体近在一处，注意力可以延伸到很远。", "围护限定立足点，景观扩大感知范围。"], ["观者从人物背后进入他们面向的远方。", "背向姿态使视线成为连接人物与环境的主要线索。"], ["私人共处通过共同风景获得联系。", "阳台把身体间的距离与面向世界的开放并置起来。"]], "en": [["Separate figures give the wide river a sense of silent company.", "Separate figures give the wide river a sense of silent company."], ["A shared distant view preserves individual quiet.", "A shared distant view preserves individual quiet."], ["Bodies stay close while attention extends far away.", "Bodies stay close while attention extends far away."], ["We look from behind the figures towards their horizon.", "We look from behind the figures towards their horizon."], ["A shared landscape connects private companionship.", "A shared landscape connects private companionship."]], "layers": 4}, {"id": "L-39", "title": "《天才雷普利》", "width": 1000, "height": 562, "image": "assets/29a8f68550c50c1eafcf8dc2.jpg", "pairs": [["明亮海景下的围坐仍带着相互试探。", "墙面与桌椅组织出海边酒店的近距离会面。"], ["看似轻松的停留也可能需要经营自我形象。", "露台让交谈与休闲共享同一场景。"], ["进入他人的生活圈不等于真正获得归属。", "桌边距离与会面机会构成细微的社会边界。"], ["人物观察他人的反应，也意识到自己受到判断。", "明亮表面与未被说出的关系形成观看落差。"], ["个人身份在交往和他人认知中被不断建构。", "露台将私人欲望与社交场合的自我呈现联系起来。"]], "en": [["A bright seaside gathering retains mutual uncertainty.", "A bright seaside gathering retains mutual uncertainty."], ["An apparently relaxed pause may require managing one's image.", "An apparently relaxed pause may require managing one's image."], ["Entering another person's circle does not ensure belonging.", "Entering another person's circle does not ensure belonging."], ["People watch reactions while knowing they are judged.", "People watch reactions while knowing they are judged."], ["Identity is continually formed through encounters and recognition.", "Identity is continually formed through encounters and recognition."]], "layers": 4}, {"id": "A-42", "title": "《乌得勒支阳台上的蒂娜与两位朋友》", "width": 474, "height": 630, "image": "assets/ed99507e220adf08c707b567.jpg", "pairs": [["三位朋友的近距离站立显得自在。", "细栏杆与门窗围出窄小的住宅外缘。"], ["有限空间让朋友们自然靠近。", "阳台为短暂停留和合影提供共同位置。"], ["身体来到外面，身后仍是熟悉的住宅。", "门窗与护栏使相聚保持半私人性质。"], ["摄影把相处片刻转为可以反复观看的记忆。", "人物排列让朋友关系以身体距离显现。"], ["日常友谊通过照片离开原有现场。", "阳台将私人交往与面向未来观者的保存行为连接起来。"]], "en": [["Three friends standing close together appear at ease.", "Slender railings, doors and windows enclose a narrow edge of the home."], ["Limited space naturally brings the friends closer.", "The balcony provides a shared place for a brief pause and a photograph."], ["Their bodies are outside, while the familiar dwelling remains behind them.", "Doors, windows and railings keep the gathering semi-private."], ["Photography turns a moment together into a memory that can be revisited.", "The arrangement of figures makes friendship visible through bodily distance."], ["A photograph carries everyday friendship beyond its original setting.", "The balcony connects private sociability with the act of preserving it for future viewers."]], "layers": 4}, {"id": "L-40", "title": "《英国病人》", "width": 736, "height": 414, "image": "assets/cf8f52615771cf27682a19c0.jpg", "pairs": [["剥落墙面旁的身影让停留显得安静真实。", "配图中的曲栏、百叶与抹灰墙保留旧居所的层次。"], ["身体可以在受损环境中找到短暂停靠。", "小阳台为生活在房间之外保留一个位置。"], ["损伤并未完全切断内部与外部的联系。", "可辨认的开口让旧建筑继续承接观看与使用。"], ["观者注意到墙面痕迹，也看见仍然存在的日常。", "人物与破损表面并置，使过去和现在同时进入视野。"], ["私人记忆与更大历史留下的痕迹相互交织。", "阳台式空间可以承载创伤之后重新接近生活的阅读。"]], "en": [["A figure by peeling walls makes a pause feel quiet and real.", "A figure by peeling walls makes a pause feel quiet and real."], ["The body finds a temporary resting place in damaged surroundings.", "The body finds a temporary resting place in damaged surroundings."], ["Damage does not entirely sever inside from outside.", "Damage does not entirely sever inside from outside."], ["We notice traces on walls and everyday life continuing.", "We notice traces on walls and everyday life continuing."], ["Private memory intertwines with the marks of wider history.", "Private memory intertwines with the marks of wider history."]], "layers": 4}, {"id": "A-43", "title": "《阳台上的花魁》", "width": 1112, "height": 1600, "image": "assets/4ddf440e2077d6ab3f87e8ed.jpg", "pairs": [["服饰、红灯与廊栏让人物显出展示意味。", "木廊、木栏和纸灯笼共同构成街边界面。"], ["临栏停留使身体处于面向外部的位置。", "廊台为人物提供可以被街道辨认的展示空间。"], ["建筑仍有围护，身体形象却主动来到边缘。", "水平廊栏划分内部停留与外部观看的位置。"], ["观者先看到服饰与姿态，再想象身后生活。", "装饰细节使身体成为画面集中的观看对象。"], ["个人形象与其社会角色在公开展示中交叠。", "阳台显示居住边缘也可能承担具有规约的社会观看。"]], "en": [["Clothing, red lamps and railings make the figure a display.", "Clothing, red lamps and railings make the figure a display."], ["Pausing at the railing turns the body outwards.", "Pausing at the railing turns the body outwards."], ["Architecture still encloses while the figure approaches the edge.", "Architecture still encloses while the figure approaches the edge."], ["Clothing and posture appear before the life behind them.", "Clothing and posture appear before the life behi
